<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProjectHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel-2:#f8f9fb; --line:#e4e7ec; --text:#101828; --muted:#667085;
  --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef2ff;
  --ok:#039855; --ok-soft:#ecfdf3; --warn:#dc6803; --warn-soft:#fffaeb; --bad:#d92d20; --bad-soft:#fef3f2;
  --info:#0086c9; --info-soft:#f0f9ff; --gray-soft:#f2f4f7;
  --personal:#0d9488; --personal-soft:#f0fdfa;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05); --shadow-lg:0 20px 40px -12px rgba(16,24,40,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c111d; --panel:#141a29; --panel-2:#182033; --line:#262f45; --text:#e8ebf2; --muted:#98a2b3;
    --accent:#8b8cf8; --accent-2:#a5a6fb; --accent-soft:#1f1d4a;
    --ok:#32d583; --ok-soft:#0a2a1c; --warn:#fdb022; --warn-soft:#2d2008; --bad:#f97066; --bad-soft:#2f1110;
    --info:#36bffa; --info-soft:#0b2333; --gray-soft:#1d2539; color-scheme:dark;
    --personal:#2dd4bf; --personal-soft:#0b2a27;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111d; --panel:#141a29; --panel-2:#182033; --line:#262f45; --text:#e8ebf2; --muted:#98a2b3;
  --accent:#8b8cf8; --accent-2:#a5a6fb; --accent-soft:#1f1d4a;
  --ok:#32d583; --ok-soft:#0a2a1c; --warn:#fdb022; --warn-soft:#2d2008; --bad:#f97066; --bad-soft:#2f1110;
  --info:#36bffa; --info-soft:#0b2333; --gray-soft:#1d2539; color-scheme:dark;
  --personal:#2dd4bf; --personal-soft:#0b2a27;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .sp{flex:1}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.6;cursor:progress}
.btn .i{width:16px;height:16px}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--gray-soft);color:var(--text)}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow-lg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff}
.brand .logo .i{width:18px;height:18px}
.login-card form{display:grid;gap:14px;margin-top:20px}
.auth-tabs{margin-top:22px}
.auth-title{font-size:20px;margin:22px 0 4px}
.auth-sub{margin:0;color:var(--muted)}
.auth-steps{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:22px}
.auth-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
.auth-row a,.linkbtn{color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:13px}
.auth-row a:hover,.linkbtn:hover{text-decoration:underline}
.otp{text-align:center;font-size:26px!important;letter-spacing:10px;font-weight:700;font-variant-numeric:tabular-nums}
.success-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);margin:22px 0 4px}
.success-ic .i{width:28px;height:28px}
.wsteps{display:grid;gap:12px;margin:4px 0 18px}
.wstep{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.wstep .num{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.wstep b{display:block}
.wstep span{font-size:12.5px;color:var(--muted)}
.note{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 12px;font-size:12.5px}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;background:var(--gray-soft);border-radius:10px;padding:3px}
.mode-switch button{border:0;background:transparent;padding:7px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.mode-switch button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
nav{display:grid;gap:2px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted);text-align:left}
nav button:hover{background:var(--gray-soft);color:var(--text)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .count{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.topbar h2{margin:0;font-size:18px}
.topbar .menu{display:none}
#view{padding:24px 28px 48px;display:grid;gap:20px;align-content:start}
.err-bar{background:var(--bad-soft);color:var(--bad);font-size:13px;padding:8px 28px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err-bar .btn{padding:4px 10px;font-size:12px}
#syncTime{cursor:pointer}
.diag{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:13px}
.diag dt{color:var(--muted)}.diag dd{margin:0;font-weight:600;word-break:break-all}
@media (max-width:820px){.err-bar{padding:8px 16px}}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:6px 28px;border-bottom:1px solid var(--line)}

/* ---------- Common ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14.5px}
.card-b{padding:14px 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;min-width:0}
.toolbar input{flex:1;min-width:180px;max-width:320px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--gray-soft);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge .i{width:12px;height:12px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.avatars{display:flex}.avatars .avatar{border:2px solid var(--panel);margin-left:-8px}.avatars .avatar:first-child{margin-left:0}
.bar{height:6px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok > i{background:var(--ok)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel-2)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr[data-act]{cursor:pointer}
table.t tr[data-act]:hover td{background:var(--panel-2)}
table.t tr:last-child td{border-bottom:0}
.table-wrap{overflow-x:auto}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi,.grid2>*,#view>*{min-width:0}
.kpi .sub,.kpi .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi{padding:16px 18px}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.alert .val{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.li{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--panel-2)}
.li .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--gray-soft);color:var(--muted);flex:none}
.li .ic .i{width:16px;height:16px}
.li .main{min-width:0;flex:1}
.li .main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .main span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:12px;align-items:center;padding:9px 18px;cursor:pointer}
.prog-row:hover{background:var(--panel-2)}
.prog-row b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:12.5px}
.act{display:flex;gap:10px;padding:9px 18px;font-size:13px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}

/* ---------- Projects ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{padding:16px 18px;cursor:pointer;display:grid;gap:12px;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.pcard h4{margin:0;font-size:15px;line-height:1.35}
.pcard .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pcard .row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:12.5px}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:300px}
.kcol.over{border-color:var(--accent);background:var(--accent-soft)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600}
.kcol-b{display:grid;gap:10px;padding:0 10px 12px;align-content:start;flex:1}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;gap:8px;cursor:pointer;box-shadow:var(--shadow)}
.kcard[draggable="true"]{cursor:grab}
.kcard.dragging{opacity:.5}
.kcard b{font-weight:600;line-height:1.35}
.kcard .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.prio{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.prio::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}

/* ---------- Timeline ---------- */
.gantt{overflow-x:auto}
.g-inner{min-width:100%}
.g-row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--line);min-height:46px}
.g-row:last-child{border-bottom:0}
.g-label{padding:8px 14px;border-right:1px solid var(--line);position:sticky;left:0;background:var(--panel);z-index:2;cursor:pointer}
.g-label b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative}
.g-head .g-track{display:flex}
.g-month{flex:1;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:8px 6px;white-space:nowrap}
.g-grid{position:absolute;inset:0;display:flex;pointer-events:none}
.g-grid i{flex:1;border-left:1px dashed var(--line)}
.g-bar{position:absolute;top:13px;height:20px;border-radius:6px;background:var(--accent);opacity:.9;cursor:pointer;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap}
.g-bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.22)}
.g-ms{position:absolute;top:16px;width:13px;height:13px;transform:translateX(-50%) rotate(45deg);border:2px solid var(--panel);background:var(--warn);z-index:1}
.g-ms.done{background:var(--ok)} .g-ms.late{background:var(--bad)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:2px}

/* ---------- Modal & form ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);display:grid;place-items:start center;padding:6vh 16px;overflow-y:auto;z-index:50;animation:fade .15s}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.modal.wide{max-width:900px}
.mhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px;flex:1}
.mbody{padding:20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal:not(.wide) .form{grid-template-columns:1fr}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field > span{font-size:12.5px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 11px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.field :disabled{background:var(--panel-2);color:var(--muted)}
.field small{font-size:11.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 9px;cursor:pointer;font-size:12.5px}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.form-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:4px}
.dhead{display:grid;gap:10px}
.dhead h2{margin:0;font-size:20px;line-height:1.3}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.meta div span{display:block;font-size:11.5px;color:var(--muted)}
.meta div b{font-size:13.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 0;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabpane{padding-top:14px;display:grid;gap:12px}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.sdot.busy{background:var(--warn);animation:pulse 1s infinite}.sdot.off{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.team-grid{display:grid;gap:6px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.team-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.team-row.on{background:var(--accent-soft)}
.team-row .tname{flex:1;min-width:0}.team-row .tname b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-row .tname small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-row select{width:auto;max-width:170px;padding:6px 8px}
.myrole{font-size:11px}
.mode-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.mode-pill .i{width:14px;height:14px}
body[data-mode="personal"] .mode-pill{background:var(--personal-soft);color:var(--personal)}
body[data-mode="team"] .topbar{box-shadow:inset 0 -3px 0 var(--accent)}
body[data-mode="personal"] .topbar{box-shadow:inset 0 -3px 0 var(--personal)}
.mode-switch button[data-mode="team"].on{color:var(--accent)}
.mode-switch button[data-mode="personal"].on{color:var(--personal)}
.badge.personal{background:var(--personal-soft);color:var(--personal)}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.mode-card input{position:absolute;opacity:0;pointer-events:none}
.mode-card b{display:block;font-size:14px}
.mode-card small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px}
.mode-card .mc-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--gray-soft);color:var(--muted);flex:none}
.mode-card:hover{border-color:var(--muted)}
.mode-card.team:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mode-card.team:has(input:checked) .mc-ic{background:var(--accent);color:#fff}
.mode-card.personal:has(input:checked){border-color:var(--personal);background:var(--personal-soft)}
.mode-card.personal:has(input:checked) .mc-ic{background:var(--personal);color:#fff}
.mode-card:has(input:checked)::after{content:"✓";position:absolute;top:8px;right:12px;font-weight:700;font-size:13px}
.mode-card.team:has(input:checked)::after{color:var(--accent)}.mode-card.personal:has(input:checked)::after{color:var(--personal)}
.mode-card:has(input:disabled){cursor:not-allowed;opacity:.65}
.mode-card:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.form[data-mode="personal"] .team-only{display:none}
.form[data-mode="team"] [type=submit]{background:var(--accent);border-color:var(--accent)}
.form[data-mode="personal"] [type=submit]{background:var(--personal);border-color:var(--personal)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-solid:disabled{opacity:.45;cursor:not-allowed}
.confirm-msg{line-height:1.6}.confirm-msg ul{margin:8px 0 0;padding-left:20px}.confirm-msg li{margin:4px 0}
.toast{display:flex;align-items:center;gap:12px}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:7px;padding:3px 10px;font-weight:700;cursor:pointer;font-size:12.5px}
@media (max-width:640px){.mode-cards{grid-template-columns:1fr}.mode-pill span{display:none}}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:99}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow-lg);animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;animation:load 1s linear infinite;z-index:100}
@keyframes load{from{background-position:-50% 0}to{background-position:150% 0}}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  body.menu-open .sidebar{transform:none}
  body.menu-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .topbar{padding:12px 16px}.topbar .menu{display:inline-flex}
  #view{padding:16px 16px 40px}
  .demo-bar{padding:6px 16px}
  .meta{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr}
  .g-row{grid-template-columns:140px 1fr}
  .kanban{grid-template-columns:repeat(4,260px)}
}
@media (max-width:480px){#syncTime{display:none}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .val{font-size:21px}.toolbar input{max-width:none}}
</style>

<body>

<!-- ================= LOGIN ================= -->
<section id="login" hidden>
  <div class="login-card">
    <div class="brand"><span class="logo" id="loginLogo"></span><span>ProjectHub</span></div>
    <div id="authBody"></div>
  </div>
</section>

<!-- ================= APP ================= -->
<div id="app" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="logo" id="sideLogo"></span><span>ProjectHub</span></div>
    <div class="mode-switch" id="modeSwitch">
      <button data-act="mode" data-mode="team">Mode Tim</button>
      <button data-act="mode" data-mode="personal">Personal</button>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span id="meAvatar"></span>
      <div class="who"><b id="meName"></b><span class="muted small" id="meRole"></span></div>
      <button class="icon-btn" data-act="change-pw" title="Ganti password" id="pwBtn"></button>
      <button class="icon-btn" data-act="logout" title="Keluar" id="outBtn"></button>
    </div>
  </aside>
  <main>
    <div class="err-bar" id="errBar" hidden></div>
    <div class="demo-bar" id="demoBar" hidden>Mode demo — perubahan hanya tersimpan sementara di browser. Isi <b>API_URL</b> untuk terhubung ke Google Sheets.</div>
    <header class="topbar">
      <button class="icon-btn menu" data-act="toggle-menu" id="menuBtn" aria-label="Menu"></button>
      <h2 id="viewTitle"></h2>
      <span class="mode-pill" id="modePill"></span>
      <span class="sp"></span>
      <span class="muted small" id="syncTime" data-act="diag" title="Status koneksi"></span>
      <button class="btn ghost" data-act="refresh" id="refreshBtn" title="Muat ulang data"></button>
    </header>
    <section id="view"></section>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>
<div class="loading" id="loading" hidden></div>

<script>
/* =====================================================================
   KONFIGURASI — tempel URL Web App Apps Script Anda di sini.
   Kosongkan untuk mencoba mode demo (data contoh, tidak tersimpan).
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzbnYu9UcDjVNi3UxoseKWCCvMCjYH51VvRiQCQH7LUIRNawDdGDiO1nuV7_iB7d-DW/exec';

/* ======================= KONSTANTA ======================= */
const APP_VERSION = '2026.10.29-6'; // harus sama dengan VERSION di Code.gs
const DEMO = !API_URL;
const PROJECT_STATUS = ['Perencanaan', 'Berjalan', 'Ditunda', 'Selesai', 'Dibatalkan'];
const WORK_STATUS = ['Belum Mulai', 'Dikerjakan', 'Review', 'Selesai'];
const CATEGORIES = ['Konsultansi', 'Pengajaran', 'Penelitian', 'Pengabdian', 'Administrasi', 'Lainnya'];
const PRIORITIES = ['Rendah', 'Sedang', 'Tinggi', 'Mendesak'];
const ROLES = ['Director', 'Team Lead', 'Technical Officer']; // role DI DALAM proyek
const ROLE_CLASS = { 'Director': 'accent', 'Team Lead': 'info', 'Technical Officer': '' };
const ACCOUNT_TYPES = ['Anggota', 'Admin'];                    // jenis akun (tingkat workspace)
const CURRENCIES = ['IDR', 'USD', 'EUR', 'AUD', 'SGD'];
const AV_COLORS = ['#4f46e5', '#0891b2', '#059669', '#d97706', '#db2777', '#7c3aed', '#2563eb', '#dc2626'];

const ICONS = {
  logo: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/>',
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  folder: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  kanban: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7M12 7v4M16 7v9"/>',
  timeline: '<path d="M3 3v18h18"/><path d="M7 8h8M9 12h9M7 16h6"/>',
  check: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  wallet: '<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><circle cx="16" cy="14" r="1"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'
};
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const VIEWS = {
  dashboard: { label: 'Dashboard', icon: 'dashboard', render: viewDashboard },
  projects: { label: 'Proyek', icon: 'folder', render: viewProjects },
  kanban: { label: 'Kanban', icon: 'kanban', render: viewKanban, after: bindKanban },
  timeline: { label: 'Timeline', icon: 'timeline', render: viewTimeline },
  mine: { label: 'Tugas Saya', icon: 'check', render: viewMine },
  team: { label: 'Tim & Akses', icon: 'users', render: viewTeam, admin: true }
};

/* ======================= STATE & STORAGE ======================= */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
let TOKEN = store.get('ph_token');
const state = {
  me: null, users: [], projects: [], milestones: [], deliverables: [], tasks: [], activity: [],
  mode: store.get('ph_mode') || 'team',
  view: store.get('ph_view') || 'dashboard',
  filters: { q: '', status: '', category: '', kanbanProject: '', kanbanPerson: '' },
  detail: null, detailTab: 'milestones'
};

/* ======================= HELPERS ======================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const toDate = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const daysTo = s => { if (!s) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((toDate(s) - t) / 864e5); };
const fmtDate = s => s ? toDate(s).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtMoney = (v, cur) => (v === '' || v == null || isNaN(+v)) ? '—'
  : new Intl.NumberFormat('id-ID', { style: 'currency', currency: cur || 'IDR', maximumFractionDigits: 0 }).format(+v);
const fmtCompact = (v, cur = 'IDR') => (cur === 'IDR' ? 'Rp ' : cur + ' ') + new Intl.NumberFormat('id-ID', { notation: 'compact', maximumFractionDigits: 1 }).format(v);
const split = s => Array.isArray(s) ? s : String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const isClosed = s => s === 'Selesai' || s === 'Dibatalkan';
const proj = id => state.projects.find(p => p.id === id);
const user = id => state.users.find(u => u.id === id);
const userName = id => (user(id) || {}).name || '—';
const shortName = id => userName(id).split(/\s+/).find(w => !/\.$/.test(w)) || userName(id);
const isAdminRole = r => r === 'Admin' || r === 'Director'; // 'Director' = nilai lama di sheet Users
const isAdmin = () => !!state.me && isAdminRole(state.me.role);
const accountType = u => isAdminRole(u && u.role) ? 'Admin' : 'Anggota';
const pendingUsers = () => isAdmin() ? state.users.filter(u => u.active === 'pending') : [];
const teamOf = p => (p && Array.isArray(p.team)) ? p.team : [];
const roleOf = (p, uid) => (teamOf(p).find(m => m.userId === uid) || {}).role || null;
const roleBadge = r => r ? `<span class="badge ${ROLE_CLASS[r] || ''} myrole">${esc(r)}</span>` : '';
function projectLeads(p) {
  const t = teamOf(p), l = t.filter(m => m.role === 'Team Lead');
  return (l.length ? l : t.filter(m => m.role === 'Director')).map(m => m.userId);
}
const P = () => state.projects.filter(p => p.mode === state.mode);
const pidSet = () => new Set(P().map(p => p.id));
const inMode = arr => { const s = pidSet(); return arr.filter(x => s.has(x.projectId)); };
const canManage = p => !!(p && p.canManage);
const canEditTask = t => canManage(proj(t.projectId)) || t.assigneeId === state.me.id;
const canEditDeliv = d => canManage(proj(d.projectId)) || d.picId === state.me.id;

function avatar(id, size = 28) {
  const u = user(id); const name = u ? u.name : '?';
  const ini = name.split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const idx = [...String(id || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_COLORS.length;
  return `<span class="avatar" title="${esc(name)}" style="background:${AV_COLORS[idx]};width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px">${esc(ini)}</span>`;
}
function statusBadge(s) {
  const cls = { 'Berjalan': 'info', 'Dikerjakan': 'info', 'Review': 'accent', 'Selesai': 'ok', 'Ditunda': 'warn', 'Dibatalkan': 'bad' }[s] || '';
  return `<span class="badge ${cls}"><span class="dot"></span>${esc(s || '—')}</span>`;
}
function dueBadge(date, status) {
  if (!date) return '<span class="muted small">Tanpa tenggat</span>';
  const d = daysTo(date);
  if (isClosed(status)) return `<span class="muted small">${fmtDate(date)}</span>`;
  if (d < 0) return `<span class="badge bad" title="${fmtDate(date)}">Terlambat ${-d} hr</span>`;
  if (d === 0) return `<span class="badge warn" title="${fmtDate(date)}">Hari ini</span>`;
  if (d <= 7) return `<span class="badge warn" title="${fmtDate(date)}">${d} hari lagi</span>`;
  return `<span class="muted small">${fmtDate(date)}</span>`;
}
function prioBadge(p) {
  const c = { 'Rendah': 'var(--muted)', 'Sedang': 'var(--info)', 'Tinggi': 'var(--warn)', 'Mendesak': 'var(--bad)' }[p] || 'var(--muted)';
  return `<span class="prio" style="color:${c}">${esc(p || 'Sedang')}</span>`;
}
function progress(pid) {
  const ms = state.milestones.filter(m => m.projectId === pid);
  if (ms.length) {
    const w = ms.reduce((a, m) => a + (+m.weight || 0), 0);
    const done = ms.filter(m => m.status === 'Selesai');
    return w > 0 ? Math.round(done.reduce((a, m) => a + (+m.weight || 0), 0) / w * 100) : Math.round(done.length / ms.length * 100);
  }
  const ts = state.tasks.filter(t => t.projectId === pid);
  return ts.length ? Math.round(ts.filter(t => t.status === 'Selesai').length / ts.length * 100) : 0;
}
function progressBar(v) { return `<div class="bar ${v >= 100 ? 'ok' : ''}"><i style="width:${Math.min(100, v)}%"></i></div>`; }
function people(p) {
  if (!p) return [];
  if (p.mode === 'personal') return [state.me];
  const ids = teamOf(p).map(m => m.userId);
  return state.users.filter(u => ids.includes(u.id) && u.active === 'yes')
    .sort((a, b) => ROLES.indexOf(roleOf(p, a.id)) - ROLES.indexOf(roleOf(p, b.id)));
}
function upsert(coll, rec) {
  const arr = state[coll]; const i = arr.findIndex(x => x.id === rec.id);
  if (i >= 0) arr[i] = Object.assign({}, arr[i], rec); else arr.push(rec);
}
function dueItems(projects) {
  const ids = new Set(projects.map(p => p.id)); const out = [];
  state.milestones.forEach(m => { if (ids.has(m.projectId) && !isClosed(m.status)) out.push({ kind: 'Milestone', icon: 'flag', title: m.name, due: m.dueDate, status: m.status, pid: m.projectId, owner: (l => l.includes(state.me.id) ? state.me.id : l[0])(projectLeads(proj(m.projectId))), act: 'edit-milestone', id: m.id }); });
  state.deliverables.forEach(d => { if (ids.has(d.projectId) && !isClosed(d.status)) out.push({ kind: 'Deliverable', icon: 'box', title: d.name, due: d.dueDate, status: d.status, pid: d.projectId, owner: d.picId, act: 'edit-deliverable', id: d.id }); });
  state.tasks.forEach(t => { if (ids.has(t.projectId) && !isClosed(t.status)) out.push({ kind: 'Tugas', icon: 'check', title: t.title, due: t.dueDate, status: t.status, pid: t.projectId, owner: t.assigneeId, act: 'edit-task', id: t.id, priority: t.priority }); });
  return out.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
}
function toast(msg, type = '', action) {
  const el = document.createElement('div'); el.className = 'toast ' + type;
  el.append(Object.assign(document.createElement('span'), { textContent: msg }));
  if (action) {
    const b = Object.assign(document.createElement('button'), { textContent: action.label, type: 'button' });
    b.onclick = () => { el.remove(); action.fn(); }; el.append(b);
  }
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), action ? 7000 : type === 'bad' ? 5000 : 2600);
}

/* ======================= API ======================= */
let pending = 0;
function busy(on) { pending += on ? 1 : -1; $('#loading').hidden = pending <= 0; }
const WRITE_ACTIONS = /^(save|delete)|^(changePassword|resetPassword)$/;
async function api(action, payload = {}, opt = {}) {
  if (!opt.silent) busy(true);
  try {
    if (DEMO) { await new Promise(r => setTimeout(r, 120)); return demoApi(action, JSON.parse(JSON.stringify(payload))); }
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: TOKEN, payload }) });
    } catch (e) { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi atau API_URL.'); }
    const text = await res.text();
    let j;
    try { j = JSON.parse(text); }
    catch (e) {
      throw new Error(/accounts\.google|ServiceLogin|<html/i.test(text)
        ? 'Server meminta login Google. Pastikan deployment Web App diatur "Who has access: Anyone", lalu deploy ulang.'
        : 'Respons server tidak valid. Periksa API_URL dan deployment Apps Script.');
    }
    checkVersion(j.version);
    if (!j.ok) { if (j.code === 'AUTH' && TOKEN) signOut(true); const er = new Error(j.error || 'Terjadi kesalahan.'); er.code = j.code; throw er; }
    if (WRITE_ACTIONS.test(action)) afterWrite(j.rev);
    return j.data;
  } finally { if (!opt.silent) busy(false); }
}
/* ======================= SINKRONISASI ======================= *
 * Server menyimpan "nomor versi" data yang naik setiap ada perubahan.
 * Semua tab & perangkat mengecek nomor itu tiap SYNC_SECONDS detik (ping ringan),
 * dan memuat ulang data hanya jika nomornya berubah. Tab lain di browser yang sama
 * diberi tahu seketika lewat BroadcastChannel.
 * =========================================================== */
const SYNC_SECONDS = 15;
let knownRev = null, lastLoad = 0, syncing = false, syncPending = false;
const bc = (() => { try { return new BroadcastChannel('projecthub-sync'); } catch (e) { return null; } })();
if (bc) bc.onmessage = e => { if (e.data && e.data.type === 'changed' && e.data.rev !== knownRev) autoSync(true); };

async function load(opt = {}) {
  const d = await api('bootstrap', {}, opt);
  Object.assign(state, d);
  knownRev = d.rev ?? knownRev; lastLoad = Date.now();
  saveCache();
  syncLabel();
}
let versionWarned = false;
function checkVersion(v) {
  if (versionWarned || DEMO || v === APP_VERSION) return;
  versionWarned = true;
  showError(v
    ? `Versi server (${v}) berbeda dengan aplikasi (${APP_VERSION}). Di Apps Script: Deploy ▸ Manage deployments ▸ ✏️ Edit ▸ Version: New version ▸ Deploy, lalu pastikan index.html juga versi terbaru.`
    : `Server Apps Script masih menjalankan kode lama. Tempel Code.gs terbaru, lalu Deploy ▸ Manage deployments ▸ ✏️ Edit ▸ Version: New version ▸ Deploy.`, true);
}
function showError(msg, sticky) {
  const bar = $('#errBar'); if (!bar) return;
  if (!msg) { if (!bar.dataset.sticky) bar.hidden = true; return; }
  if (bar.dataset.sticky && !sticky) return;
  if (sticky) bar.dataset.sticky = '1';
  bar.innerHTML = `${ic('alert')}<span style="flex:1;min-width:200px">${esc(msg)}</span><button class="btn" data-act="refresh">Coba lagi</button><button class="btn" data-act="diag">Status koneksi</button>`;
  bar.hidden = false;
}
async function openDiag() {
  const ov = openModal('Status koneksi', '<p class="muted">Memeriksa server…</p>');
  const body = $('.mbody', ov);
  const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  let html = `<dl class="diag">${row('Perangkat ini', esc(navigator.userAgent.match(/\(([^)]+)\)/)?.[1] || 'browser'))}
    ${row('Server (API_URL)', DEMO ? '<span style="color:var(--warn)">kosong → mode demo, data TIDAK tersimpan ke server</span>' : esc(API_URL.replace(/^(.{40}).*(.{12})$/, '$1…$2')))}
    ${row('Versi aplikasi', APP_VERSION)}`;
  try {
    const d = await api('diag');
    const c = d.counts;
    html += `${row('Versi server', d.version === APP_VERSION ? d.version + ' ✅' : `<span style="color:var(--bad)">${esc(d.version || 'lama')} ❌</span>`)}
      ${row('Login sebagai', `${esc(d.me.email)} · ${esc(d.me.role)}`)}
      ${row('ID pengguna', esc(d.me.id))}
      ${row('Database', d.database.name ? `${esc(d.database.name)}<br><span class="muted small">…${esc(String(d.database.id).slice(-10))}</span>` : '…' + esc(d.database.id))}
      ${c.projectsTotal != null ? row('Total proyek di database', c.projectsTotal) : ''}
      ${row('Proyek yang bisa Anda lihat', `${c.projectsVisible} (Tim: ${c.team}, Personal: ${c.personal})`)}

      <p class="muted small" style="margin:14px 0 0">Bandingkan <b>Database</b> dan <b>Login sebagai</b> di setiap perangkat. Keduanya harus sama persis. Jika "Tampil di perangkat ini" lebih kecil dari "Proyek yang bisa Anda lihat", ketuk Muat ulang.</p>`;

function afterWrite(rev) {
  // Jika nomor versi hanya naik 1, perubahan itu milik kita sendiri → tak perlu memuat ulang.
  if (rev != null && knownRev != null && Number(rev) === Number(knownRev) + 1) knownRev = rev;
  lastLoad = Date.now(); saveCache(); syncLabel();
  if (bc) try { bc.postMessage({ type: 'changed', rev }); } catch (e) {}
}
function busyEditing() {
  return modals.some(m => $('form', m)) || !!$('.kcard.dragging') || !!(document.activeElement && document.activeElement.matches('input[type=search]'));
}
async function autoSync(force) {
  if (!TOKEN || $('#app').hidden || syncing) return;
  if (busyEditing()) { syncPending = true; return; }
  syncing = true; syncLabel('sync');
  try { await load({ silent: true }); syncPending = false; showError(null); render(); refreshDetail(); }
  catch (e) { syncLabel('offline'); if (e.code !== 'AUTH') showError('Gagal memuat data dari server: ' + e.message); }
  finally { syncing = false; }
}
async function checkRev() {
  if (!TOKEN || DEMO || $('#app').hidden || document.hidden || syncing) return;
  try {
    const r = await api('ping', {}, { silent: true });
    if (r.rev !== knownRev) await autoSync(true); else { syncLabel(); showError(null); }
  } catch (e) { syncLabel('offline'); if (e.code !== 'AUTH') showError('Tidak dapat menghubungi server: ' + e.message); }
}
function syncLabel(st) {
  const t = $('#syncTime'); if (!t) return;
  const time = lastLoad ? new Date(lastLoad).toTimeString().slice(0, 5) : '';
  t.innerHTML = st === 'sync' ? '<span class="sdot busy"></span>Menyinkronkan…'
    : st === 'offline' ? '<span class="sdot off"></span>Offline · data ' + time
    : '<span class="sdot"></span>Tersinkron ' + time;
}
function onModalClosed() { if (syncPending && !busyEditing()) autoSync(true); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRev(); });
window.addEventListener('focus', () => checkRev());
window.addEventListener('online', () => checkRev());
window.addEventListener('pageshow', e => { if (e.persisted) checkRev(); });
setInterval(checkRev, SYNC_SECONDS * 1000);

/* Cache lokal: aplikasi langsung tampil saat dibuka, lalu diperbarui di latar belakang. */
const CACHE_KEYS = ['me', 'users', 'projects', 'milestones', 'deliverables', 'tasks', 'activity'];

}

$('#authBody').addEventListener('click', async e => {
  const t = e.target.closest('[data-auth],[data-auth-resend]'); if (!t) return;
  e.preventDefault();
  const emailInput = $('#authBody [name=email]'); if (emailInput && emailInput.value) auth.email = emailInput.value.trim();
  if (t.dataset.auth) return setAuth(t.dataset.auth);
  t.disabled = true;
  try {
    if (t.dataset.authResend === 'register') await api('registerStart', { name: auth.name, email: auth.email, password: auth.password });
    else await api('forgotStart', { email: auth.email });
    toast('Kode baru telah dikirim');
  } catch (err) { toast(err.message, 'bad'); }
  finally { t.disabled = false; }
});

$('#authBody').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, btn = f.querySelector('[type=submit]');
  if (!kind) return;
  if (!f.checkValidity()) { f.reportValidity(); return; }
  const val = n => (f.elements[n] ? f.elements[n].value.trim() : '');
  btn.disabled = true;
  try {
    if (kind === 'login') {
      auth.email = val('email');
      const r = await api('login', { email: auth.email, password: f.elements.password.value });
      await enterApp(r);
    } else if (kind === 'register') {
      if (f.elements.password.value !== f.elements.confirm.value) throw new Error('Konfirmasi password tidak sama.');
      Object.assign(auth, { name: val('name'), email: val('email'), password: f.elements.password.value });
      const r = await api('registerStart', { name: auth.name, email: auth.email, password: auth.password });
      auth.minutes = r.minutes || 10; setAuth('registerCode'); toast('Kode verifikasi dikirim ke email Anda');
    } else if (kind === 'registerCode') {
      const r = await api('registerVerify', { email: auth.email, code: val('code') });
      auth.password = '';
      if (r.pending) setAuth('pending');
      else { auth.hasUsers = true; await enterApp(r); }
    } else if (kind === 'forgot') {
      auth.email = val('email');
      const r = await api('forgotStart', { email: auth.email });
      auth.minutes = r.minutes || 10; setAuth('forgotCode'); toast('Jika email terdaftar, kode telah dikirim');
    } else if (kind === 'forgotCode') {
      if (f.elements.newPassword.value !== f.elements.confirm.value) throw new Error('Konfirmasi password tidak sama.');
      const r = await api('forgotVerify', { email: auth.email, code: val('code'), newPassword: f.elements.newPassword.value });
      await enterApp(r); toast('Password berhasil diperbarui');
    }
  } catch (err) {
    if (err.code === 'PENDING') return setAuth('pending');
    if (err.code === 'OTP_EXPIRED') { const c = f.elements.code; if (c) c.value = ''; }
    toast(err.message, 'bad');
  } finally { btn.disabled = false; }
});

function bindKanban() {
  let dragId = null;
  document.querySelectorAll('.kcard[draggable="true"]').forEach(c => {
    c.addEventListener('dragstart', e => { dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  document.querySelectorAll('.kcol').forEach(col => {
    col.addEventListener('dragover', e => { if (dragId) { e.preventDefault(); col.classList.add('over'); } });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); if (dragId) moveTask(dragId, col.dataset.status); dragId = null; });
  });
}
async function moveTask(id, status, opt = {}) {
  const t = state.tasks.find(x => x.id === id); if (!t || t.status === status) return;
  const prev = t.status; t.status = status; render();
  try {
    upsert('tasks', await api('saveTask', { id, status }));
    if (!opt.undo) toast(`“${t.title}” → ${status}`, '', { label: 'Urungkan', fn: () => moveTask(id, prev, { undo: true }) });
  }
  catch (e) { t.status = prev; render(); toast(e.message, 'bad'); }
}

/* ---------- Timeline ---------- */
function viewTimeline() {
  const ps = P().filter(p => p.startDate && p.endDate).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const missing = P().length - ps.length;
  if (!ps.length) return `<div class="card empty">Belum ada proyek dengan tanggal mulai &amp; selesai.</div>`;
  let min = new Date(Math.min(...ps.map(p => +toDate(p.startDate)), Date.now()));
  let max = new Date(Math.max(...ps.map(p => +toDate(p.endDate)), Date.now()));
  min = new Date(min.getFullYear(), min.getMonth(), 1); max = new Date(max.getFullYear(), max.getMonth() + 1, 1);
  const span = max - min, pos = d => Math.max(0, Math.min(100, (toDate(d) - min) / span * 100));
  const months = []; for (let d = new Date(min); d < max; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(new Date(d));
  const todayPos = (new Date() - min) / span * 100;
  const color = s => ({ 'Berjalan': 'var(--accent)', 'Perencanaan': 'var(--info)', 'Ditunda': 'var(--warn)', 'Selesai': 'var(--ok)', 'Dibatalkan': 'var(--muted)' }[s] || 'var(--accent)');
  const grid = `<div class="g-grid">${months.map(() => '<i></i>').join('')}</div>`;
  return `
  <div class="legend"><span><i style="background:var(--accent)"></i>Berjalan</span><span><i style="background:var(--info)"></i>Perencanaan</span><span><i style="background:var(--warn)"></i>Ditunda</span><span><i style="background:var(--ok)"></i>Selesai</span><span><i style="background:var(--warn);transform:rotate(45deg)"></i>Milestone</span><span><i style="background:var(--bad);width:2px"></i>Hari ini</span>${missing ? `<span class="sp"></span><span>${missing} proyek tanpa tanggal tidak ditampilkan</span>` : ''}</div>
  <div class="card gantt"><div class="g-inner" style="min-width:${230 + months.length * 78}px">
    <div class="g-row g-head"><div class="g-label muted small" style="cursor:default">Proyek</div><div class="g-track">${months.map(m => `<div class="g-month">${m.toLocaleDateString('id-ID', { month: 'short', year: '2-digit' })}</div>`).join('')}</div></div>
    ${ps.map(p => {
      const l = pos(p.startDate), w = Math.max(1.2, pos(p.endDate) - l), v = progress(p.id);
      const ms = state.milestones.filter(m => m.projectId === p.id && m.dueDate);
      return `<div class="g-row"><div class="g-label" data-act="open-project" data-id="${p.id}"><b>${esc(p.name)}</b><span class="muted small">${p.myRole ? esc(p.myRole) + ' · ' : ''}${v}%</span></div>
        <div class="g-track">${grid}
          <div class="g-bar" data-act="open-project" data-id="${p.id}" style="left:${l}%;width:${w}%;background:${color(p.status)}" title="${esc(p.name)}: ${fmtDate(p.startDate)} – ${fmtDate(p.endDate)}"><span class="fill" style="width:${v}%"></span><span style="position:relative">${v}%</span></div>
          ${ms.map(m => { const late = !isClosed(m.status) && daysTo(m.dueDate) < 0; return `<span class="g-ms ${m.status === 'Selesai' ? 'done' : late ? 'late' : ''}" style="left:${pos(m.dueDate)}%" title="${esc(m.name)} · ${fmtDate(m.dueDate)} · ${esc(m.status)}"></span>`; }).join('')}
          ${todayPos >= 0 && todayPos <= 100 ? `<span class="g-today" style="left:${todayPos}%"></span>` : ''}
        </div></div>`;
    }).join('')}
  </div></div>`;
}

/* ---------- My tasks ---------- */

/* ======================= MODAL & FORM ======================= */
const modals = [];
function openModal(title, html, opt = {}) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  if (opt.id) ov.dataset.id = opt.id;
  ov.innerHTML = `<div class="modal ${opt.wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="mhead"><h3>${esc(title)}</h3><button class="icon-btn" data-act="close-modal" aria-label="Tutup">${ic('x')}</button></div><div class="mbody">${html}</div></div>`;
  // Form & dialog tidak tertutup saat klik di luar kotak (mencegah isian hilang karena salah klik).
  ov.addEventListener('mousedown', e => { if (e.target === ov && !opt.sticky) requestClose(ov); });
  document.body.appendChild(ov); modals.push(ov); document.body.style.overflow = 'hidden';
  return ov;
}
function removeModal(ov) {
  const i = modals.indexOf(ov); if (i < 0) return;
  modals.splice(i, 1);
  if (ov.dataset.id === 'detail') state.detail = null;
  if (ov._resolve) { const r = ov._resolve; ov._resolve = null; r(false); }
  ov.remove(); if (!modals.length) document.body.style.overflow = '';
  onModalClosed();
}
function closeModal() { removeModal(modals[modals.length - 1]); }
function closeAll() { while (modals.length) closeModal(); }
/** Tutup modal; jika berisi form yang sudah diubah, minta konfirmasi dulu. */
async function requestClose(ov = modals[modals.length - 1]) {
  if (!ov || !modals.includes(ov)) return;
  if (ov._isDirty && ov._isDirty()) {
    const ok = await confirmDialog({ title: 'Buang perubahan?', message: 'Isian yang belum disimpan akan hilang.', confirmLabel: 'Buang perubahan', cancelLabel: 'Lanjut mengisi', danger: true });
    if (!ok) return;
  }
  removeModal(ov);
}
/** Dialog konfirmasi seragam. requireText: pengguna harus mengetik teks ini (untuk tindakan berbahaya). */
function confirmDialog({ title, message, confirmLabel = 'Ya, lanjutkan', cancelLabel = 'Batal', danger = false, requireText = '' }) {
  return new Promise(resolve => {
    const ov = openModal(title, `<div class="confirm-msg">${message}</div>
      ${requireText ? `<label class="field" style="margin-top:14px"><span>Ketik <b>${esc(requireText)}</b> untuk konfirmasi</span><input data-confirm-text autocomplete="off" autocapitalize="characters"></label>` : ''}
      <div class="form-actions" style="margin-top:18px"><span class="sp"></span><button type="button" class="btn ghost" data-cancel>${esc(cancelLabel)}</button>
      <button type="button" class="btn ${danger ? 'danger-solid' : 'primary'}" data-ok ${requireText ? 'disabled' : ''}>${esc(confirmLabel)}</button></div>`, { sticky: true });
    ov._resolve = resolve;
    const ok = $('[data-ok]', ov);
    if (requireText) $('[data-confirm-text]', ov).addEventListener('input', e => { ok.disabled = e.target.value.trim().toUpperCase() !== requireText.toUpperCase(); });
    ok.onclick = () => { ov._resolve = null; removeModal(ov); resolve(true); };
    $('[data-cancel]', ov).onclick = () => removeModal(ov);
    setTimeout(() => (requireText ? $('[data-confirm-text]', ov) : $('[data-cancel]', ov)).focus(), 30);
  });
}
const cancelled = () => Object.assign(new Error(''), { silent: true });

function fieldHtml(f, v) {
  v = v ?? f.default ?? '';
  const attrs = `name="${f.name}" ${f.disabled ? 'disabled' : ''} ${f.required ? 'required' : ''}`;
  let input;
  if (f.type === 'select') {
    input = `<select ${attrs}>${f.allowEmpty ? `<option value="">${esc(f.emptyLabel || '—')}</option>` : ''}${f.options.map(o => {
      const val = typeof o === 'object' ? o.value : o, lab = typeof o === 'object' ? o.label : o;
      return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea ${attrs} rows="3">${esc(v)}</textarea>`;
  } else if (f.type === 'modechoice') {
    const card = (val, icon, t, d) => `<label class="mode-card ${val}"><input type="radio" name="${f.name}" value="${val}" ${v === val ? 'checked' : ''} ${f.disabled ? 'disabled' : ''}><span class="mc-ic">${ic(icon)}</span><span><b>${t}</b><small>${d}</small></span></label>`;
    return `<div class="field full"><span>${esc(f.label)}</span><div class="mode-cards">
      ${card('team', 'users', 'Proyek Tim', 'Terlihat & dikerjakan oleh anggota yang Anda pilih, masing-masing dengan role-nya.')}
      ${card('personal', 'key', 'Proyek Personal', 'Hanya Anda yang dapat melihat. Cocok untuk mengajar, riset pribadi, dan catatan sendiri.')}
      </div>${f.hint ? `<small class="muted small">${f.hint}</small>` : ''}</div>`;
  } else if (f.type === 'team') {
    const cur = Array.isArray(v) ? v : [];
    return `<div class="field full ${f.teamOnly ? 'team-only' : ''}"><span>${esc(f.label)}</span><div class="team-grid">${f.users.map(u => {
      const r = (cur.find(m => m.userId === u.id) || {}).role || '';
      return `<label class="team-row ${r ? 'on' : ''}">${avatar(u.id, 28)}<span class="tname"><b>${esc(u.name)}${u.id === state.me.id ? ' (Anda)' : ''}</b><small>${esc(u.email)}</small></span>
        <select data-team-user="${u.id}" ${f.disabled ? 'disabled' : ''}><option value="">— Bukan anggota</option>${ROLES.map(x => `<option ${x === r ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`;
    }).join('')}</div>${f.hint ? `<small class="muted small">${esc(f.hint)}</small>` : ''}</div>`;
  } else if (f.type === 'multi') {
    const sel = split(v);
    return `<div class="field full"><span>${esc(f.label)}</span><div class="checks">${f.options.map(o => `<label class="check"><input type="checkbox" name="${f.name}" value="${esc(o.value)}" ${sel.includes(o.value) ? 'checked' : ''} ${f.disabled ? 'disabled' : ''}>${esc(o.label)}</label>`).join('') || '<span class="muted small">Belum ada anggota.</span>'}</div>${f.hint ? `<small class="muted small">${esc(f.hint)}</small>` : ''}</div>`;
  } else {
    input = `<input type="${f.type || 'text'}" ${attrs} value="${esc(v)}" ${f.type === 'number' ? 'step="any" min="0"' : ''} placeholder="${esc(f.placeholder || '')}" ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''}>`;
  }
  return `<label class="field ${f.full ? 'full' : ''} ${f.teamOnly ? 'team-only' : ''}"><span>${esc(f.label)}${f.required ? ' *' : ''}</span>${input}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`;
}
function openForm({ title, fields, values = {}, onSubmit, onDelete, wide, intro, submitLabel = 'Simpan', noCancel, deleteConfirm }) {
  const html = `${intro ? `<div class="note" style="margin-bottom:14px">${intro}</div>` : ''}<form class="form" novalidate>${fields.map(f => fieldHtml(f, values[f.name])).join('')}
    <div class="form-actions">${onDelete ? `<button type="button" class="btn ghost danger" data-del>Hapus</button>` : ''}<span class="sp"></span>${noCancel ? '' : '<button type="button" class="btn ghost" data-act="close-modal">Batal</button>'}<button class="btn primary" type="submit">${submitLabel}</button></div></form>`;
  const ov = openModal(title, html, { wide, sticky: true });
  const form = $('form', ov);
  if (noCancel) $('.mhead .icon-btn', ov).remove();
  const snapshot = () => JSON.stringify([...form.elements].map(el => el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value));
  const initial = snapshot();
  ov._isDirty = () => snapshot() !== initial;
  const done = () => { ov._isDirty = null; removeModal(ov); };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const data = {};
    fields.forEach(f => {
      if (f.disabled) return;
      if (f.type === 'multi') data[f.name] = [...form.querySelectorAll(`[name="${f.name}"]:checked`)].map(x => x.value);
      else if (f.type === 'modechoice') data[f.name] = (form.querySelector(`input[name="${f.name}"]:checked`) || {}).value;
      else if (f.type === 'team') data[f.name] = [...form.querySelectorAll('[data-team-user]')].filter(x => x.value).map(x => ({ userId: x.dataset.teamUser, role: x.value }));
      else data[f.name] = form.elements[f.name].value.trim();
    });
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try { await onSubmit(data); done(); }
    catch (err) { if (!err.silent) toast(err.message, 'bad'); }
    finally { btn.disabled = false; }
  });
  if (onDelete) form.querySelector('[data-del]').onclick = async () => {
    const ok = await confirmDialog(Object.assign({ title: 'Hapus data ini?', message: 'Tindakan ini tidak dapat dibatalkan.', confirmLabel: 'Hapus', danger: true }, deleteConfirm || {}));
    if (!ok) return;

    catch (err) { toast(err.message, 'bad'); }

}

  );

function changePasswordForm(forced) {

function demoDecorate(p, me) {
  const c = Object.assign({}, p);
  const team = c.mode === 'personal' ? [{ userId: c.ownerId, role: 'Director' }] : (c.team || []);
  c.myRole = (team.find(m => m.userId === me.id) || {}).role || null;
  c.canAdmin = c.myRole === 'Director';
  c.canManage = c.canAdmin || c.myRole === 'Team Lead';
  c.canSeeValue = c.canManage;
  if (!c.canSeeValue) c.contractValue = '';
  return c;
}
function demoApi(action, p) {
  if (!demo) demo = demoSeed();
  const me = demo.users[0];
  if (action === 'login') return { token: 'demo', user: me };
  if (action === 'appInfo') return { hasUsers: true, allowedDomains: [] };
  if (action === 'registerStart' || action === 'forgotStart') return { sent: true, minutes: 10 };
  if (action === 'registerVerify') { if (!/^\d{6}$/.test(p.code || '')) throw new Error('Kode verifikasi salah.'); return { pending: true }; }
  if (action === 'forgotVerify') return { token: 'demo', user: me };
  if (action === 'bootstrap') return JSON.parse(JSON.stringify(Object.assign({ me, rev: 0 }, demo, { projects: demo.projects.map(x => demoDecorate(x, me)) })));
  if (action === 'ping') return { rev: 0 };
  if (action === 'diag') return { version: APP_VERSION, rev: 0, me: { id: me.id, email: me.email, role: me.role }, database: { name: 'Demo', id: 'demo' }, counts: { projectsTotal: demo.projects.length, projectsVisible: demo.projects.length, team: demo.projects.filter(p => p.mode === 'team').length, personal: demo.projects.filter(p => p.mode === 'personal').length, tasksAssignedToMe: demo.tasks.filter(t => t.assigneeId === me.id).length, users: demo.users.length } };
  if (['logout', 'changePassword', 'resetPassword'].includes(action)) return true;
  const m = action.match(/^(save|delete)(Project|Milestone|Deliverable|Task|User)$/);
  if (!m) throw new Error('Aksi tidak dikenal');
  const key = { Project: 'projects', Milestone: 'milestones', Deliverable: 'deliverables', Task: 'tasks', User: 'users' }[m[2]];
  const coll = demo[key];
  if (m[1] === 'delete') {
    demo[key] = coll.filter(x => x.id !== p.id);
    if (key === 'projects') ['milestones', 'deliverables', 'tasks'].forEach(k => demo[k] = demo[k].filter(x => x.projectId !== p.id));
    return true;
  }
  Object.keys(p).forEach(k => p[k] === undefined && delete p[k]);
  let rec = p.id && coll.find(x => x.id === p.id);
  if (rec) Object.assign(rec, p);
  else {
    rec = Object.assign({}, p, { id: m[2].slice(0, 3).toUpperCase() + '-' + Math.random().toString(36).slice(2, 8) });
    if (key === 'projects') rec.ownerId = me.id;
    if (key === 'users') Object.assign(rec, { active: 'yes', mustChange: 'yes' });
    coll.push(rec);
  }
  if (key === 'projects' && rec.mode === 'team') {
    rec.team = rec.team || [];
    if (!rec.team.some(t => t.role === 'Director')) rec.team.unshift({ userId: me.id, role: 'Director' });
  }
  if (key === 'projects') { const out = demoDecorate(rec, me); logDemo(); return JSON.parse(JSON.stringify(out)); }
  logDemo();
  return JSON.parse(JSON.stringify(rec));
  function logDemo() {
  const label = { Project: 'Proyek', Milestone: 'Milestone', Deliverable: 'Deliverable', Task: 'Tugas' }[m[2]];
  if (label) demo.activity.unshift({ timestamp: ymd(new Date()) + ' ' + new Date().toTimeString().slice(0, 5), userId: me.id, action: p.id ? 'mengubah' : 'membuat', entity: label, projectId: rec.projectId || rec.id, detail: (rec.name || rec.title) + (rec.status ? ' [' + rec.status + ']' : '') });
  }
}
