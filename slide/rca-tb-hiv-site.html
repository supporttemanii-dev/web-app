<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemilihan lokasi RCA TB-HIV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#E6EBEA;--panel:#fff;--ink:#15262D;--mut:#5B6B70;--line:#D6DDDB;--soft:#F1F4F3;
 --low:#B42340;--lowbg:#F8E4E8;--high:#177E74;--highbg:#DDF1EE;--cmp:#2F5DA8;--cmpbg:#E3EAF7;--res:#8A6A00;--amber:#B87800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B20;--panel:#172930;--ink:#E3ECEA;--mut:#96A8AC;--line:#2B4048;--soft:#1D3239;--low:#F0708A;--lowbg:#4A1A26;--high:#4FC2B3;--highbg:#12403B;--cmp:#7FA6F0;--cmpbg:#1E2F4F;--res:#E0B84A;--amber:#E0B84A}}
:root[data-theme="dark"]{--bg:#0F1B20;--panel:#172930;--ink:#E3ECEA;--mut:#96A8AC;--line:#2B4048;--soft:#1D3239;--low:#F0708A;--lowbg:#4A1A26;--high:#4FC2B3;--highbg:#12403B;--cmp:#7FA6F0;--cmpbg:#1E2F4F;--res:#E0B84A;--amber:#E0B84A}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:"Public Sans","Segoe UI",system-ui,Roboto,Arial,sans-serif;font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cmp);outline-offset:2px}
#stage{position:absolute;width:1440px;height:1080px;transform-origin:0 0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;padding:16px 22px 20px}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;row-gap:10px}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.top .src{margin:2px 0 0;font-size:11.5px;color:var(--mut)}
#steps{display:flex;gap:4px;justify-self:center;background:var(--panel);padding:4px;border-radius:10px}
#steps button{border:0;background:transparent;padding:8px 16px;border-radius:7px;font-weight:600;color:var(--mut);display:flex;gap:8px;align-items:center}
#steps button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:11px}
#steps button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
#gearBtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:600}
#prov{grid-column:1/-1;display:flex;gap:0;border-bottom:2px solid var(--ink)}
#prov button{border:0;background:transparent;padding:8px 16px 9px;font-weight:600;color:var(--mut)}
#prov button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -4px 0 var(--ink)}
#gear{position:absolute;right:22px;top:66px;z-index:5;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
#gear .gt{margin:0 0 8px;font-weight:800}
#gear label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px}
.seg{display:flex;background:var(--soft);border-radius:7px;padding:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:6px 4px;font-size:12px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.link{border:0;background:none;color:var(--cmp);padding:12px 0 0;font-size:12px;text-decoration:underline}
#main{min-height:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border-radius:12px;padding:16px 18px;min-height:0}
.card header h2{margin:0;font-size:15px;font-weight:800}
.card header p{margin:2px 0 10px;color:var(--mut);font-size:12px}
small{display:block;color:var(--mut);font-size:10.5px;font-weight:400}
.warn{color:var(--amber);font-weight:600;font-size:12px;margin:8px 0 0}
.mut{color:var(--mut)}
.bar{display:block;height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:3px 0 2px}
.bar i{display:block;height:100%;background:var(--mut)}
.bar.low i{background:var(--low)}.bar.high i{background:var(--high)}.bar.cmp i{background:var(--cmp)}.bar.res i{background:var(--res)}.bar.prov i{background:var(--ink);opacity:.45}
/* cascade strip */
.casc{display:grid;grid-template-columns:250px 1.4fr 1fr 1.25fr;gap:10px}
.ck{background:var(--panel);border-radius:12px;padding:10px 14px}
.ckn{margin:0 0 6px;font-weight:700;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10.8px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:600}
.chip em{font-style:normal;opacity:.7;font-weight:400}
.chip.off{border-style:dashed}
/* step1 */
.s1{flex:1;min-height:0;display:grid;grid-template-columns:560px minmax(0,1fr);gap:14px}
.list{display:flex;flex-direction:column}
.rhead,.rrow{display:grid;grid-template-columns:28px minmax(0,1fr) 92px 52px 52px 52px 52px;gap:6px;align-items:center}
.rhead{font-size:11px;color:var(--mut);font-weight:600;padding:0 8px 6px;border-bottom:1px solid var(--line)}
.rhead span:nth-child(n+4){text-align:right}
.rbody{overflow:auto;flex:1}
.rrow{width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);border-radius:0}
.rrow:hover{background:var(--soft)}
.rrow.act{background:var(--cmpbg);box-shadow:inset 4px 0 0 var(--cmp)}
.rrow.low{box-shadow:inset 4px 0 0 var(--low)}.rrow.high{box-shadow:inset 4px 0 0 var(--high)}.rrow.res{box-shadow:inset 4px 0 0 var(--res)}
.rrow.ne{color:var(--mut)}
.rk{font-size:11px;color:var(--mut);text-align:center}
.rn{font-weight:600;font-size:12.5px}
.rn em{font-style:normal;font-size:10px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:8px;background:var(--soft)}
.rrow.low .rn em{background:var(--lowbg);color:var(--low)}.rrow.high .rn em{background:var(--highbg);color:var(--high)}.rrow.res .rn em{color:var(--res)}
.rs{display:grid;grid-template-columns:1fr 24px;gap:5px;align-items:center}.rs b{font-size:12px;text-align:right}
.rv{text-align:right;font-size:12px}
.cmpc{display:flex;flex-direction:column;overflow:auto}
.cmpc header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acts{display:flex;gap:6px}
.acts button{border:0;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;color:#fff}
.acts button[data-set="low"]{background:var(--low)}.acts button[data-set="high"]{background:var(--high)}
.acts .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.ct{width:100%;border-collapse:collapse;margin-top:8px}
.ct th,.ct td{padding:6px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.ct th{font-size:14px;font-weight:800;border-bottom:2px solid var(--ink)}
.ct th span{display:block;font-size:10.5px;font-weight:700}
.ct th.low span{color:var(--low)}.ct th.high span{color:var(--high)}.ct th.cmp span{color:var(--cmp)}.ct th.prov span{color:var(--mut)}
.ct th.prov{color:var(--mut);font-weight:600}
.ct td:first-child{width:220px;font-size:12px}
.ct td b{font-size:15px}
.ct tr.grp td{background:var(--soft);font-weight:700;font-size:11.5px;padding:5px 10px}
.ct tr.na td{color:var(--mut);font-size:11px;padding:3px 10px;border-bottom:1px dashed var(--line)}
.ct tr.sum td{border-top:2px solid var(--ink)}
.ct td.cmp{background:var(--cmpbg)}
.just{margin-top:12px;padding-top:10px}
.just h3{margin:0 0 4px;font-size:13.5px}
.jl{margin:0;padding-left:18px;font-size:12.3px}
.jl li{margin:3px 0}
/* step2 */
.s2top p{margin:0 0 4px;font-size:12.5px}
.s2top .sent{margin:6px 0 0}
.s2{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.fcol{overflow:auto;border-top:6px solid}
.fcol.low{border-color:var(--low)}.fcol.high{border-color:var(--high)}
.tag{margin:0;font-size:11px;font-weight:700}.tag.low{color:var(--low)}.tag.high{color:var(--high)}
.fcol header h2{font-size:22px}
.fc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.fl{margin:0;font-size:11px;color:var(--mut);font-weight:700}
.fn{margin:2px 0 0;font-size:16px;font-weight:800}
.fo{margin:0 0 8px;font-size:11.5px;color:var(--mut)}
.fk{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fk span{display:block;font-size:11.5px;color:var(--mut)}.fk b{font-size:18px}
.why{margin:8px 0 0;font-size:12px}
details{margin-top:8px}
summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--cmp)}
.ah,.alt{display:grid;grid-template-columns:minmax(0,1fr) 80px 50px 50px;gap:6px;font-size:11.5px}
.ah{color:var(--mut);padding:6px 8px 2px}
.alt{width:100%;border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:6px}
.alt:hover{background:var(--soft)}
.ah span:nth-child(n+2),.alt span:nth-child(n+2){text-align:right}
/* step3 */
.s3{flex:1;display:flex;flex-direction:column;overflow:auto}
.st{width:100%;border-collapse:collapse}
.st th,.st td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line);font-size:12.5px}
.st thead th{color:var(--mut);font-weight:600;font-size:12px}
.st tbody th{width:150px;font-size:13.5px}
.st td.low{box-shadow:inset 4px 0 0 var(--low)}.st td.high{box-shadow:inset 4px 0 0 var(--high)}
.st td b{font-size:13.5px}
.st td.fs{font-size:12px;line-height:1.35}
.st td.fs small{margin-bottom:6px}
.sn{color:var(--amber);font-size:10.5px}.wn{color:var(--amber)}
.foot{font-size:11.5px;color:var(--mut);margin:12px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.st td b.sn,.st td b.wn{font-size:10.5px;font-weight:700}

/* options */
.oc{flex:1;display:flex;flex-direction:column;overflow:hidden}
.orow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.add{border:0;background:var(--ink);color:var(--panel);border-radius:8px;padding:9px 16px;font-weight:700}
.otw{flex:1;overflow:auto;margin-top:6px}
.ot{width:100%;border-collapse:collapse;table-layout:fixed}
.ot th,.ot td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:12.3px}
.ot th.crit{width:300px;color:var(--mut);font-weight:600;vertical-align:bottom}
.ot thead th{border-bottom:2px solid var(--ink);background:var(--panel);position:sticky;top:0;z-index:1}
.ot thead th.best{background:var(--highbg)}
.oh{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;color:var(--mut)}
.x{border:0;background:transparent;font-size:18px;line-height:1;color:var(--mut);padding:0 4px}
.onm{margin:4px 0 0;font-size:15px;font-weight:800}
.onm.low,.ol.low{border-left:4px solid var(--low);padding-left:7px}.onm.high,.ol.high{border-left:4px solid var(--high);padding-left:7px}
.ol{display:block;margin-top:6px;font-size:10.5px;color:var(--mut);font-weight:700}
.ol select{display:block;width:100%;margin-top:2px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600}
.osc{margin-top:8px;font-size:11.5px;font-weight:400;color:var(--mut)}
.osc b{font-size:22px;color:var(--ink)}
.osc em{font-style:normal;background:var(--high);color:#fff;border-radius:8px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-left:4px}
.use{margin-top:6px;border:1px solid var(--ink);background:transparent;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600}
.used{margin:6px 0 0;font-size:11.5px;font-weight:700;color:var(--high)}
.ot tr.grp td{background:var(--soft);font-weight:700;font-size:11.5px;padding:5px 10px}
.ot td i{font-style:normal;font-weight:800;margin-right:6px}
.ot td.ok i{color:var(--high)}.ot td.no i{color:var(--low)}.ot td.no{color:var(--mut)}

.seg.mode{display:inline-flex;margin:8px 0 4px}
.seg.mode button{padding:7px 16px;font-size:12.5px;white-space:nowrap}
.mmap{display:block;width:100%;height:112px;margin-top:8px;background:var(--soft);border-radius:6px}
.mmap .mg{fill:var(--panel);stroke:var(--line);stroke-width:.6}
.mmap .ml{fill:var(--low);stroke:var(--panel);stroke-width:.6}
.mmap .mh{fill:var(--high);stroke:var(--panel);stroke-width:.6}
.chip.ctx{border-color:var(--ink);color:var(--ink);font-weight:600}
.ct tr.ctx td b{color:var(--mut)}
.gn{margin:8px 0 0;font-size:11px;color:var(--mut)}
/* composition */
.comp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:22px;padding:14px 18px}
.comp h2{margin:0 0 6px;font-size:15px}
.tg{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.hint{margin:6px 0 0;color:var(--mut);font-size:11.3px}
.ct2{margin:0 0 6px;font-size:11.5px;color:var(--mut);font-weight:700}
.bars5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bars5 div{background:var(--soft);border-radius:8px;padding:6px 6px 5px;text-align:center}
.bars5 b{display:block;font-size:20px;line-height:1.1}
.bars5 span{font-size:10px;color:var(--mut);line-height:1.15;display:block}
.ccs{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.cc{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.cc.ok{background:var(--highbg);color:var(--high)}.cc.no{background:var(--lowbg);color:var(--low)}.cc.na{background:var(--soft);color:var(--mut);font-weight:600}
.sentl{margin:0;font-size:12px;background:var(--panel);border-radius:10px;padding:8px 14px;border-left:5px solid var(--amber)}
.fnr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.cb{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--soft);white-space:nowrap}
.cls-A{background:#1F3A6B;color:#fff}.cls-B{background:#4E6FA8;color:#fff}.cls-C{background:#A9BCDC;color:#15262D}.cls-D{background:var(--line);color:var(--ink)}.cls-u{background:transparent;border:1px dashed var(--mut);color:var(--mut)}
.fk{grid-template-columns:1fr 1fr 1.1fr}
.ed{font-size:11.5px;color:var(--mut)}
.ed select{display:block;margin:2px 0;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700}
.ed small{display:block;font-size:10.3px}
.fc.bal{border-color:var(--cmp);box-shadow:inset 4px 0 0 var(--cmp)}
.ah,.alt{grid-template-columns:minmax(0,1fr) 52px 50px 44px 44px}
.rhead,.rrow{grid-template-columns:26px minmax(0,1fr) 84px 44px 44px 44px 44px 44px}
.ct th,.ct td{padding:4px 10px}
.ct td b{font-size:14px}
.ct small{font-size:10px}
.ct .bar{margin:2px 0 1px}

/* Adjusted R2 highlight */
.r2card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;border-radius:12px;padding:10px 14px;background:#FFE066;color:#15262D;box-shadow:inset 0 0 0 2px #C99A00;gap:1px}
.r2card:hover{box-shadow:inset 0 0 0 3px #15262D}
.r2l{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.r2v{font-size:30px;font-weight:800;line-height:1}
.r2s{font-size:10.8px;line-height:1.3}
.r2m{font-size:10.5px;margin-top:2px;line-height:1.3}
#r2panel{position:absolute;left:22px;top:250px;z-index:6;width:640px;max-height:800px;overflow:auto;background:var(--panel);border-radius:12px;padding:16px 18px;box-shadow:0 16px 40px rgba(0,0,0,.25);border:2px solid #C99A00}
.rph{display:flex;justify-content:space-between;align-items:center}.rph h3{margin:0;font-size:16px}
.rpi,.rpn{font-size:11.8px;color:var(--mut);margin:6px 0 8px}
.rm{margin-top:10px}.rmt{margin:0;font-weight:800;font-size:13px}.rmy{margin:2px 0 6px;font-size:12px}
mark{background:#FFE066;color:#15262D;padding:1px 5px;border-radius:4px;font-weight:800}
.rt{width:100%;border-collapse:collapse}.rt th,.rt td{font-size:11.8px;padding:3px 8px;border-bottom:1px solid var(--line);text-align:right}.rt th:first-child,.rt td:first-child{text-align:left}.rt th{color:var(--mut);font-weight:600}
.rt tr.sig td{font-weight:700}
.s3h{display:flex;justify-content:space-between;align-items:center;gap:16px}
.r2pill{display:flex;align-items:baseline;gap:10px;border:0;border-radius:10px;padding:6px 14px;background:#FFE066;color:#15262D;box-shadow:inset 0 0 0 2px #C99A00}
.r2pill span{font-size:11px;font-weight:800;text-transform:uppercase}.r2pill b{font-size:22px}.r2pill em{font-style:normal;font-size:11.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #r2panel{border-color:#FFE066}}
.fk{grid-template-columns:1fr 1fr 1fr 1.1fr}
.ah,.alt{grid-template-columns:minmax(0,1fr) 46px 46px 40px 40px 40px}
#r2wrap{display:contents}

.cb.art{background:var(--highbg);color:var(--high)}.cb.nart{background:#F6EBCB;color:#7A5A00}
.sh{margin-top:8px;padding:6px 8px;border-radius:8px;background:var(--soft)}
.sh p{margin:0 0 4px;font-size:11px;color:var(--mut)}
.sh.none{font-size:11.5px;color:#7A5A00;background:#F6EBCB}
.shg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.shg span{display:block}.shg em{display:block;font-style:normal;font-size:10px;color:var(--mut)}.shg b{font-size:13px}.shg small{font-size:9.5px}
</style></head><body>
<div id="stage">
 <header class="top">
  <div><h1>Pemilihan lokasi kajian lapangan RCA TB-HIV</h1><p class="src">SITB 2025 · TB.03 kohort 2025 · SIHA 2025 kab/kota & fasyankes · SITB Jan–Jun 2026 (uji kestabilan)</p></div>
  <nav id="steps" aria-label="Langkah"></nav>
  <button id="gearBtn" aria-controls="gear">Pengaturan</button>
  <nav id="prov" aria-label="Provinsi"></nav>
 </header>
 <div id="gear" hidden></div>
 <div id="r2wrap"></div>

/* ===== facility evaluation ===== */

    const ok=L.filter(f=>f.pos>=S.minFas&&f.sc!=null);

    const fb=[...L].sort((a,b)=>b.pos-a.pos);

    st.forEach((v,k)=>{const [a,b,c]=k.split("|").map(Number);C.forEach(cd=>{const cl=rsClass(cd.f).c;const na=Math.min(3,a+(cl==="A")),nb=Math.min(12,b+(cl==="B")),nc=Math.min(12,c+(cl==="C"));const key=na+"|"+nb+"|"+nc;const fit=v.fit+cd.fit;const o=nx.get(key);if(!o||o.fit<fit)nx.set(key,{fit,pick:[...v.pick,cd]})})});st=nx});

    sp.forEach((v,k)=>{const [b,r,n,q]=k.split("|").map(Number);C.forEach(cd=>{const ch=pkmChar(cd.f);const key=Math.min(12,b+(ch.vol==="Besar"))+"|"+Math.min(12,r+(ch.ri==="Ya"))+"|"+Math.min(12,n+(ch.ri==="Tidak"))+"|"+Math.min(12,q+(ch.pdp?1:0));const fit=v.fit+cd.fit;const o=nx.get(key);if(!o||o.fit<fit)nx.set(key,{fit,pick:[...v.pick,cd]})})});sp=nx});

/* ---- geography ---- */
const ADJ=GEO.adj;
const isAdj=(a,b)=>!!(ADJ[a]&&ADJ[a].n.includes(b));
const isSea=(a,b)=>!!((ADJ[a]&&ADJ[a].sea&&ADJ[a].sea.includes(b))||(ADJ[b]&&ADJ[b].sea&&ADJ[b].sea.includes(a)));
const BBOX={};
function provBox(p){if(BBOX[p])return BBOX[p];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  Object.entries(GEO.geo).forEach(([k,rs])=>{if(!k.startsWith(p+"|")||k==="DKI|KEPULAUAN SERIBU")return;rs.forEach(r=>r.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}))});
  return BBOX[p]={x0,x1,y0,y1,c:Math.cos((y0+y1)/2*Math.PI/180)}}
function miniMap(p,lowId,highId,W,H){
  const b=provBox(p),sx=(b.x1-b.x0)*b.c,sy=b.y1-b.y0,sc=Math.min((W-8)/sx,(H-8)/sy),ox=(W-sx*sc)/2,oy=(H-sy*sc)/2;
  let g="";const draw=(k,cls)=>{(GEO.geo[k]||[]).forEach(r=>{const d=r.map(([x,y],i)=>(i?"L":"M")+(ox+(x-b.x0)*b.c*sc).toFixed(1)+" "+(oy+(b.y1-y)*sc).toFixed(1)).join("")+"Z";g+=`<path d="${d}" class="${cls}"/>`})};
  Object.keys(GEO.geo).filter(k=>k.startsWith(p+"|")&&k!=="DKI|KEPULAUAN SERIBU"&&k!==lowId&&k!==highId).forEach(k=>draw(k,"mg"));
  if(lowId)draw(lowId,"ml");if(highId)draw(highId,"mh");
  return `<svg class="mmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peta lokasi pasangan">${g}</svg>`}
function nearOptions(E){
  const out=[];
  E.pool.forEach(a=>E.pool.forEach(b=>{if(a===b||a.score>=b.score)return;
    const land=isAdj(a.k.id,b.k.id),sea=!land&&isSea(a.k.id,b.k.id);if(!land&&!sea)return;
    const m=optMetrics(E,a.k.id,b.k.id);out.push({low:a.k.id,high:b.k.id,land,m,contrast:b.score-a.score})}));
  out.sort((x,y)=>(y.land-x.land)||(y.m.score-x.m.score)||(y.contrast-x.contrast));
  const pick=[],cnt={};
  for(const o of out){if(pick.length>=3)break;if((cnt[o.low]||0)>=2||(cnt[o.high]||0)>=2)continue;pick.push(o);cnt[o.low]=(cnt[o.low]||0)+1;cnt[o.high]=(cnt[o.high]||0)+1}
  for(const o of out){if(pick.length>=3)break;if(!pick.includes(o))pick.push(o)}
  return pick;
}

/* ---- step: compare options ---- */
function optMetrics(E,lowId,highId){
  const f=id=>E.ks.find(z=>z.k.id===id);const L=f(lowId),H=f(highId);
  if(!L||!H)return null;
  const facN=(x,role)=>{const F=fasFor(x.k.id,role);return [F.P.ch,F.R.ch].reduce((a,c)=>a+(c?Math.min(10,c.pos):0),0)};
  const fl=facN(L,"low"),fh=facN(H,"high");
  const ratio=Math.max(L.k.pos,H.k.pos)/Math.max(1,Math.min(L.k.pos,H.k.pos));
  const C=[
   {g:"Syarat",n:"Kedua kab/kota memenuhi syarat penyebut ≥"+S.minDen,ok:L.el&&H.el,v:L.el&&H.el?"Ya":[L.el?"":L.k.name,H.el?"":H.k.name].filter(Boolean).join(", ")+" tidak"},
   {g:"Kontras kinerja",n:"Rendah di kuintil terendah skor kaskade",ok:L.el&&(E.quint?L.q<=.2:L.rank===1),v:L.el?`peringkat ${L.rank}/${E.n}`:"–"},
   {g:"Kontras kinerja",n:"Tinggi di kuintil tertinggi skor kaskade",ok:H.el&&(E.quint?H.q>=.8:H.rank===E.n),v:H.el?`peringkat ${H.rank}/${E.n}`:"–"},
   {g:"Kontras kinerja",n:"Selisih skor kaskade ≥ 50 poin",ok:L.el&&H.el&&(H.score-L.score)>=.5,v:L.el&&H.el?`${Math.round((H.score-L.score)*100)} poin`:"–"},
   {g:"Kontras kinerja",n:"Selisih 3.2 ART pada TB-HIV ≥ 15 poin",ok:(H.k.i32-L.k.i32)>=.15,v:`${fp(L.k.i32)} → ${fp(H.k.i32)}`},
   {g:"Kontras kinerja",n:"Selisih 2.1 inisiasi TPT ≥ 15 poin",ok:(H.k.i21-L.k.i21)>=.15,v:`${fp(L.k.i21)} → ${fp(H.k.i21)}`},
   {g:"Kontras kinerja",n:"Selisih 3.4 keberhasilan pengobatan ≥ 10 poin",ok:L.k.i34!=null&&H.k.i34!=null&&(H.k.i34-L.k.i34)>=.10,v:`${fp(L.k.i34)} → ${fp(H.k.i34)}`},
   {g:"Kesebandingan",n:"Beban TB-HIV sebanding (≤ 3×)",ok:ratio<=3,v:`${fi(L.k.pos)} vs ${fi(H.k.pos)} (${ratio.toFixed(1).replace(".",",")}×)`},
   {g:"Kesebandingan",n:"Jenis wilayah sama",ok:L.k.kota===H.k.kota,v:`${L.k.kota?"kota":"kabupaten"} vs ${H.k.kota?"kota":"kabupaten"}`},
   {g:"Kesebandingan",n:"Wilayah bersebelahan (berbagi batas darat)",ok:isAdj(L.k.id,H.k.id),v:isAdj(L.k.id,H.k.id)?"bersebelahan":isSea(L.k.id,H.k.id)?"berdekatan lewat laut":"tidak bersebelahan"},
   {g:"Kestabilan",n:"Posisi tetap pada ARV Jan–Jun 2026",ok:!!(L.r26&&H.r26&&L.r26/L.n26<=.5&&H.r26/H.n26>.5),v:L.r26&&H.r26?`${L.r26}/${L.n26} dan ${H.r26}/${H.n26}`:"data belum cukup"},
   {g:"Mutu data",n:"Status HIV diketahui ≥ 90% di kedua kab/kota",ok:L.k.i31>=.9&&H.k.i31>=.9,v:`${fp(L.k.i31)} dan ${fp(H.k.i31)}`},
   {g:"Kelayakan lapangan",n:"Catatan TB-HIV di 4 fasyankes terpilih ≥ 30 dari target 40",ok:fl+fh>=30,v:`${fl+fh}/40`},
  ];
  const score=C.filter(c=>c.ok).length;
  const learn=Math.max(0,L.k.pos-L.k.art)+Math.max(0,L.k.sD-L.k.tpt);

}

  else{const c=pkmChar(ch);edit=`<label class="ed">Rawat inap <select data-ri="${ch.i}">${[["?","Belum diisi"],["Ya","Ya"],["Tidak","Tidak"]].map(([v,t])=>`<option value="${v}" ${c.ri===v?"selected":""}>${t}</option>`).join("")}</select><small>${kab.kota?"wilayah perkotaan":"wilayah kabupaten"} · beban TB ${c.vol.toLowerCase()} (median Puskesmas provinsi ${PKMMED[kab.p]} kasus)</small></label>`}
  const why=slot.bal?`Dipilih untuk menyeimbangkan komposisi ${jen==="RS"?"kelas RS":"karakteristik Puskesmas"} lintas 12 kab/kota (pilihan berbasis kaskade: ${esc(slot.was.name)}).`:short?`Tidak ada ${lbl.toLowerCase()} dengan ≥${S.minFas} kasus TB-HIV; dipilih volume terbesar. Telaah seluruh catatan dan lengkapi dari fasyankes lain.`:`${role==="low"?"Capaian kaskade terendah":"Capaian kaskade tertinggi"} di antara ${nOk} ${lbl.toLowerCase()} dengan ≥${S.minFas} kasus TB-HIV (dari ${nAll}).`;
  return `<div class="fc ${slot.bal?"bal":""}"><p class="fl">${lbl}${manual?" · dipilih manual":""}</p>
   <div class="fnr"><p class="fn">${esc(ch.name)}</p>${charBadges(ch)}</div><p class="fo">${ON[ch.o]||ch.o} · ${fi(ch.tb)} kasus TB · ${ch.pos} kasus TB-HIV</p>
   <div class="fk"><div><span>3.1 Status HIV diketahui</span><b>${fp(ch.i31)}</b>${bar(ch.i31,role)}<small>${ch.kn}/${ch.tb}</small></div>
   <div><span>3.2 ART pada TB-HIV</span><b>${fp(ch.i32)}</b>${bar(ch.i32,role)}<small>${ch.art}/${ch.pos}</small></div>
   <div><span>3.4 Keberhasilan pengobatan</span><b>${fp(ch.i34)}</b>${bar(ch.i34,role)}<small>${ch.coh?ch.succ+"/"+ch.coh+(ch.coh<5?" · n kecil, tidak dinilai":""):"tidak ada kohort"}</small></div>${edit}</div>
   ${sihaRow(ch,role)}
   <p class="${short&&!slot.bal?"warn":"why"}">${why}</p>
   ${alt?`<details><summary>Alternatif (${alts.length})</summary><div class="ah"><span>Nama</span><span>${jen==="RS"?"Kelas":"Beban"}</span><span>TB-HIV</span><span>3.1</span><span>3.2</span><span>3.4</span></div>${alt}</details>`:""}</div>`;
}
function compCard(){
  const C=composition();const r=C.rs,p=C.pk;
  const chip=(ok,t)=>`<span class="cc ${ok?"ok":"no"}">${ok?"✓":"✕"} ${t}</span>`;
  return `<section class="card comp"><div class="cl"><h2>Komposisi fasyankes di ${C.n} kab/kota terpilih</h2>
   <label class="tg"><input type="checkbox" id="bal" ${S.balance?"checked":""}> Seimbangkan karakteristik fasyankes antar-kab/kota (kab/kota tetap)</label>
   <p class="hint">RS khusus non-TB (ibu & anak, jiwa, mata, jantung, kanker, dll.) tidak diikutkan; RS paru dan penyakit infeksi tetap. Aturan dasar: 1 Puskesmas + 1 RS per kab/kota dengan ≥${S.minFas} kasus TB-HIV; kab/kota rendah memakai capaian gabungan fasyankes (SITB 3.1/3.2/3.4 + SIHA 2.1/2.2) terendah, kab/kota tinggi yang tertinggi. Bila diseimbangkan, pilihan digeser seminimal mungkin agar komposisi tercapai.</p></div>
   <div class="cr"><p class="ct2">Rumah sakit · kelas</p><div class="bars5">${["A","B","C","D","?"].map(k=>`<div><b>${r[k]}</b><span>${k==="?"?"belum diketahui":"Kelas "+k}</span></div>`).join("")}</div>
    <div class="ccs">${chip(r.A>=TGT.A[0]&&r.A<=TGT.A[1],`A ${TGT.A[0]}–${TGT.A[1]}`)}${chip(r.B>=TGT.B,`B ≥${TGT.B}`)}${chip(r.C>=TGT.C,`C ≥${TGT.C}`)}</div></div>
   <div class="cr"><p class="ct2">Puskesmas · karakteristik</p><div class="bars5">${[["Besar","beban TB besar"],["Kecil","beban TB kecil"],["pdp","layanan ART (SIHA)"],["npdp","bukan layanan ART"],["Ya","rawat inap (diisi)"]].map(([k,t])=>`<div><b>${p[k]}</b><span>${t}</span></div>`).join("")}</div>
    <div class="ccs">${chip(p.Besar>=TGT.big,`besar ≥${TGT.big}`)}${chip(p.Kecil>=TGT.small,`kecil ≥${TGT.small}`)}${chip(p.pdp>=TGT.pdp,`layanan ART ≥${TGT.pdp}`)}${chip(p.npdp>=TGT.npdp,`non-ART ≥${TGT.npdp}`)}${PORT.riKnown?chip(p.Ya>=TGT.ri&&p.Tidak>=TGT.non,`rawat inap & non ≥${TGT.ri}`):`<span class="cc na">rawat inap: isi untuk dinilai</span>`}</div></div></section>`;
}
function step2(){
  const E=evalProv(S.prov),sen=sentinel(E);
  const col=(x,role)=>{if(!x)return `<section class="card"><p class="warn">Belum ada kab/kota ${role==="low"?"kinerja rendah":"kinerja tinggi"}.</p></section>`;
    const F=finalFas(x.k.id,role);
    return `<section class="card fcol ${role}"><header><p class="tag ${role}">${role==="low"?"Kinerja rendah":"Kinerja tinggi"}</p><h2>${esc(x.k.name)}</h2><p>ART pada TB-HIV ${fp(x.k.i32)} · TPT ${fp(x.k.i21)} · ${(FBYK[x.k.id]||[]).length} Puskesmas/RS di SITB</p></header>
     ${facCard(F.P,x.k.id,"PKM",role,x.k)}${facCard(F.R,x.k.id,"RS",role,x.k)}</section>`};
  $("#main").innerHTML=`${compCard()}
   <p class="sentl"><b>Sentinel verifikasi data ${PNAME[S.prov]}:</b> ${sen?`${esc(sen.f.name)} (${esc(sen.kab.name)}) — kesenjangan 3.1 dan 3.2 terbesar di antara 4 fasyankes terpilih; penetapan akhir menunggu pemadanan SITB–SIHA (WP3).`:"belum ada kandidat."}</p>
   <div class="s2">${col(E.low,"low")}${col(E.high,"high")}</div>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const parts=b.dataset.f.split("|");const i=+parts.pop(),jen=parts.pop(),kid=parts.join("|");S.fover[kid]=S.fover[kid]||{};S.fover[kid][jen]=i;render()});
  document.querySelectorAll("[data-cls]").forEach(el=>el.onchange=()=>{S.clsEdit[el.dataset.cls]=el.value;render()});
  document.querySelectorAll("[data-ri]").forEach(el=>el.onchange=()=>{if(el.value==="?")delete S.riEdit[el.dataset.ri];else S.riEdit[el.dataset.ri]=el.value;render()});
  $("#bal").onchange=e=>{S.balance=e.target.checked;render()};
}

/* ---- step 3 (ringkasan) ---- */
function step3(){
  let rows="";
  PROV.forEach(([p,n])=>{const E=evalProv(p),sen=sentinel(E);
    const cell=(x,role)=>{if(!x)return `<td colspan="2" class="mut">–</td>`;const F=finalFas(x.k.id,role);
      const fl=[F.P,F.R].map(s=>s.ch?`${esc(s.ch.name)}${sen&&sen.f.i===s.ch.i?' <b class="sn">sentinel</b>':""}<small>${s.ch.j==="RS"?CLSN[rsClass(s.ch).c]:"Beban TB "+pkmChar(s.ch).vol.toLowerCase()+(s.ch.pdp?" · layanan ART":" · bukan layanan ART")+(pkmChar(s.ch).ri==="?"?"":pkmChar(s.ch).ri==="Ya"?" · rawat inap":" · non rawat inap")} · ${s.ch.pos} TB-HIV · 3.2 ${fp(s.ch.i32)} · 3.4 ${fp(s.ch.i34)}${s.ch.sh?` · TPT ${fp(pc(s.ch.sh.tpt,s.ch.sh.sD))}`:""}${s.short?' · <b class="wn">kasus kurang</b>':""}</small>`:"–").join("");
      return `<td class="${role}"><b>${esc(x.k.name)}</b><small>Skor ${Math.round(x.score*100)} · ART ${fp(x.k.i32)} · TPT ${fp(x.k.i21)} · sukses pengobatan ${fp(x.k.i34)}</small></td><td class="fs">${fl}</td>`};
    rows+=`<tr><th>${n}<small>${E.n}/${E.ks.length} memenuhi syarat${E.quint?"":" · bukan kuintil"}${E.manual?" · ada pilihan manual":""}</small></th>${cell(E.low,"low")}${cell(E.high,"high")}</tr>`});
  const C=composition();
  const M=MODEL;
  $("#main").innerHTML=`<section class="card s3"><header><div class="s3h"><h2>Rancangan adendum lokasi</h2>${M&&M.m1?`<button class="r2pill" id="r2btn"><span>Adjusted R²</span><b>${fr(M.m1.adj)}</b><em>ART 3.2 · n=${M.m1.n}</em><em>TPT 2.1: ${fr(M.m2?.adj)}</em><em>Sukses 3.4: ${fr(M.m4?.adj)}</em><em>Prediksi 2026: ${fr(M.m3?.adj)}</em></button>`:""}</div><p>12 kab/kota dan 24 fasyankes. Komposisi RS: A ${C.rs.A} · B ${C.rs.B} · C ${C.rs.C} · D ${C.rs.D} · belum diketahui ${C.rs["?"]}. Puskesmas: beban TB besar ${C.pk.Besar} · kecil ${C.pk.Kecil} · layanan ART ${C.pk.pdp} · bukan layanan ART ${C.pk.npdp}. Adendum ditandatangani penanggung jawab program dan analisis kuantitatif setelah titik kendali mutu WP3 (protokol Bag. 8A).</p></header>
   <table class="st"><thead><tr><th>Provinsi</th><th>Kinerja rendah</th><th>Fasyankes</th><th>Kinerja tinggi</th><th>Fasyankes</th></tr></thead><tbody>${rows}</tbody></table>
   <p class="foot">Skor kaskade = rata-rata tertimbang persentil dalam provinsi: 3.2 ART pada TB-HIV 25%, 2.1 TPT ART baru 20%, 3.4 keberhasilan pengobatan TB-HIV 15% (TB SO, kohort Jan–Agu 2025 yang sudah ≥12 bulan), 1.3 investigasi TB 10%, 1.5 inisiasi pengobatan TB 10%, 2.2 TPT ART saat ini 10%, 3.1 status HIV 5%, 1.1 skrining 5%. Indikator 1.2, 1.4 dan keberhasilan TB RO (kohort belum final) ditampilkan sebagai konteks; kohort 2026 belum dipakai karena belum final; indikator dengan penyebut &lt;${MIN_D} diberi nilai netral. Kelas RS dari data RS Online Kemenkes (2019) dan dapat dikoreksi di langkah Fasyankes; verifikasi dengan data SIRS terbaru.</p></section>`;
}

function render(){PORT=computePortfolio();MODEL=modelStats();header();({1:step1,2:stepOpt,3:step2,4:step3})[S.step]();
  const pn=$("#r2wrap");pn.innerHTML=r2Panel();const b=$("#r2btn");if(b)b.onclick=e=>{e.stopPropagation();S.r2open=!S.r2open;render()};const bx=$("#r2x");if(bx)bx.onclick=()=>{S.r2open=false;render()};save()}
$("#gearBtn").onclick=()=>{S.gear=!S.gear;header()};
document.addEventListener("click",e=>{if(S.gear&&!e.target.closest("#gear,#gearBtn")){S.gear=false;header()}});
function fit(){const st=$("#stage"),vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight,s=Math.min(vw/1440,vh/1080);st.style.transform=`scale(${s})`;st.style.left=Math.max(0,(vw-1440*s)/2)+"px";st.style.top=Math.max(0,(vh-1080*s)/2)+"px"}
addEventListener("resize",fit);render();fit();
</script></body></html>
