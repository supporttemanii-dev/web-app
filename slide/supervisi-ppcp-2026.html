:root{

:root[data-theme="dark"]{--bg:#0E171C;--panel:#16232A;--sunk:#111C22;--ink:#E2EAEC;--mut:#9AABB1;--faint:#6F8288;--line:#28383F;--pri:#4DB5BE;--pribg:#13363B;--on-pri:#0E171C;--pb:#5CC489;--pbbg:#173826;--su:#F0955A;--subg:#432717;--cf:#93A0F0;--cfbg:#232A52;--gap:#F17C8E;--gapbg:#4A1C25;--warn:#E3B94E;--warnbg:#3D3015;--dot:#55666C;--c1:#2899B8;--c2:#DB7428;--grid:#22323A;--shadow:none;color-scheme:dark}

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
a{color:var(--pri)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}

.brand h1{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand p{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin-left:auto;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px}
.steps button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:7px;white-space:nowrap}
.steps button svg{width:16px;height:16px}

/* lokus rail */

.slot .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rail .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

.view-h p{color:var(--mut);max-width:76ch;margin-top:4px}
.view-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.card h3{font-size:15px;font-weight:700;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}

.meter.gap i{background:var(--gap)}
/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--mut);border:1px solid var(--line);white-space:nowrap;line-height:1.5}

.tag.no{background:var(--gapbg);color:var(--gap);border-color:transparent}
.tag.wa{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.cf{background:var(--cfbg);color:var(--cf);border-color:transparent}
.tag.su{background:var(--subg);color:var(--su);border-color:transparent}

.dotk{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pgl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}

.cell.na{color:var(--faint);font-weight:500}.cell.na::before{display:none}
.frac{display:block;font-size:11.5px;color:var(--mut);font-weight:500}

.tbl-wrap{overflow-x:auto;margin-inline:-18px;padding-inline:18px}

td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}

.nm{font-weight:600}
.mut{color:var(--mut)}
.small{font-size:12px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.date{font-weight:700;font-size:13px}

.tl-note{font-size:12.5px;color:var(--mut);font-style:italic}

function qChart(l){
 const pts=[...l.s25.slice(0,4),...l.s26.slice(0,3)],lab=["TW1","TW2","TW3","TW4","TW1","TW2","TW3"];
 const nw=(window.innerWidth||1200)<700,W=nw?380:640,H=nw?240:230,pl=40,pr=nw?18:96,pt=16,pb=40;
 const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(H-pt-pb)*(1-v);
 const s=[{k:"5",n:"TB/HIV-5",c:"var(--c1)",f:r5},{k:"6",n:"TB/HIV-6",c:"var(--c2)",f:r6}];
 let g="";[0,.25,.5,.75,1].forEach(v=>g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`);
 lab.forEach((t,i)=>g+=`<text x="${x(i)}" y="${H-pb+16}" text-anchor="middle">${t}</text>`);
 g+=`<text x="${(x(0)+x(3))/2}" y="${H-6}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">2025</text><text x="${(x(4)+x(6))/2}" y="${H-6}" text-anchor="middle" style="font-weight:700;fill:var(--ink)">2026</text><line class="ax" x1="${(x(3)+x(4))/2}" x2="${(x(3)+x(4))/2}" y1="${pt}" y2="${H-pb+4}" stroke-dasharray="3 3"/>`;
 s.forEach(se=>{const v=pts.map(se.f);let d="",dd="";v.forEach((q,i)=>{if(q==null)return;const p=`${x(i)},${y(q)}`;if(i<=5)d+=(d?" L":"M")+p;if(i>=5)dd+=(dd?" L":"M")+p});
  g+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round"/><path d="${dd}" fill="none" stroke="${se.c}" stroke-width="2" stroke-dasharray="4 4"/>`;
  v.forEach((q,i)=>{if(q!=null)g+=`<circle cx="${x(i)}" cy="${y(q)}" r="4" fill="${i===6?"var(--panel)":se.c}" stroke="${i===6?se.c:"var(--panel)"}" stroke-width="2"/>`});
  const last=v[6]??v[5];if(!nw&&last!=null)g+=`<text x="${x(6)+10}" y="${y(last)+(se.k==="5"?-2:12)}" style="fill:var(--ink);font-weight:700">${se.n} ${fp(last)}</text>`});
 pts.forEach((p,i)=>g+=`<rect data-q="${i}" x="${x(i)-(W-pl-pr)/12}" y="${pt}" width="${(W-pl-pr)/6}" height="${H-pt-pb}" fill="transparent"/>`);
 CHARTS.push({id:"qc"+l.i,pts,lab,s});
 return `<div class="chart" id="qc${l.i}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="TB/HIV-5 dan TB/HIV-6 per triwulan ${esc(l.label)}">${g}</svg><div class="tt" hidden></div></div>
 <div class="legend"><span><i class="dotk" style="background:var(--c1)"></i>TB/HIV-5: status HIV terdokumentasi</span><span><i class="dotk" style="background:var(--c2)"></i>TB/HIV-6: TB-HIV mendapat ARV</span><span>Garis putus-putus dan titik kosong: TW3 2026 belum lengkap (SITB per 1 Sep 2026)</span></div>`;
}
function bindCharts(){CHARTS.forEach(c=>{const el=document.getElementById(c.id);if(!el)return;const tt=el.querySelector(".tt"),svg=el.querySelector("svg");

 if(!key)body=`<div class="empty-note">Belum ada ${lv==="fasR"?"rumah sakit":"klinik"} swasta terpilih untuk ${esc(l.label)}. <button class="btn sm" data-view="2">Pilih di tab Fasyankes</button></div>`;
 else body=`<div class="card tl"><div class="tl-head"><div><h3>${esc(I.title)}</h3><p class="mode">(${esc(I.mode)})</p>${x?`<p class="small mut" style="margin-top:4px">${esc(x.f.name)} · ${CATN[x.f.c]} · kode ${esc(x.f.ppcp.kode)}${x.f.fp?' · <span class="tag pri">Aktivasi PPCP 2024–2026</span>':""}</p>`:""}${lv==="prov"?`<p class="small mut" style="margin-top:4px">Satu isian per provinsi, dipakai bersama oleh lokus di ${esc(l.p)}.</p>`:""}</div>
  <div class="tl-tools noprint"><div class="small mut" id="tlprog">${d}/${n} terjawab</div><button class="btn sm" data-copytsv="1">Salin untuk Excel</button>${GAS?'<button class="btn sm" data-print="1">Cetak</button>':""}${S.clr===key?'<button class="btn sm warn" data-clear="2">Ya, kosongkan</button><button class="btn sm" data-clear="0">Batal</button>':'<button class="btn sm" data-clear="1">Kosongkan</button>'}</div></div>
  <div class="sendbox noprint"><div id="sendst">${sendStatusHtml()}</div><div class="tl-tools">${GAS||WEBAPP?'<button class="btn sm" data-pull="1">Muat versi terkirim</button>':""}<button class="btn sm pri" data-send="1">Kirim ke Google Sheet</button></div></div>
  ${renderInst(lv,l)}
  <div class="sendbox noprint"><span class="st">Selesai mengisi? Kirim agar tersimpan di Google Sheet tim.</span><button class="btn sm pri" data-send="1">Kirim ke Google Sheet</button></div></div>`;
 return `<div class="view-h"><div><h2>Daftar tilik: ${esc(l.full)}</h2><p>Kotak kuning berisi data desk review sebagai bahan konfirmasi, bukan jawaban. Isian tersimpan otomatis di perangkat ini; tekan Kirim untuk menyimpannya ke Google Sheet.</p></div><div class="acts noprint"><button class="btn" data-lvback="1">Pilih instrumen lain</button></div></div>${tabs}${body}`;
}
/* ================= events ================= */
document.addEventListener("click",e=>{
 const t=e.target.closest("button,[data-lok],[data-open]");if(!t)return;
 const ds=t.dataset;
 if(ds.view!=null&&!ds.lok){if(+ds.view===3)S.lv=null;S.view=+ds.view;S.showAll=false;SEND={busy:false,msg:"",kind:""};render();window.scrollTo(0,0);return}
 if(ds.lok){S.lok=ds.lok;S.open=null;S.showAll=false;S.clr=null;SEND={busy:false,msg:"",kind:""};if(ds.go)S.view=1;render();if(ds.go)window.scrollTo(0,0);return}
 if(ds.jump){const el=document.getElementById(ds.jump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
 if(ds.open!=null){const i=+ds.open;S.open=S.open===i?null:i;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(ds.own){S.ff.own=ds.own;S.showAll=false;render();return}
 if(ds.cat){S.ff.cat=ds.cat;S.showAll=false;render();return}
 if(ds.flag){S.ff.flag=S.ff.flag===ds.flag?"":ds.flag;S.showAll=false;render();return}
 if(ds.showall){S.showAll=true;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(ds.pick!=null){const f=F[+ds.pick],l=cur(),m=S.fas[l.id]||{};m[f.c==="RS"?"R":"K"]={kode:f.ppcp.kode,cat:ds.pcat||null};S.fas[l.id]=m;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(ds.unpick){const m=S.fas[S.lok]||{};delete m[ds.unpick];S.fas[S.lok]=m;render();return}
 if(ds.lv){S.lv=ds.lv;S.clr=null;SEND={busy:false,msg:"",kind:""};render();window.scrollTo(0,0);return}
 if(ds.lvback){S.lv=null;S.clr=null;render();window.scrollTo(0,0);return}
 if(ds.ping){ping();return}
 if(ds.print){window.print();return}
 if(ds.clear){const key=instKey(S.lv,cur());if(ds.clear==="1")S.clr=key;else if(ds.clear==="2"){delete S.tl[key];S.clr=null}else S.clr=null;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(ds.send){sendNow();return}
 if(ds.pull){loadLatest();return}
 if(ds.copytsv){const txt=tsv(S.lv,cur()),lab=t.textContent,done=m=>{t.textContent=m;setTimeout(()=>t.textContent=lab,2400)};
  try{navigator.clipboard.writeText(txt).then(()=>done("Tersalin, tempel di Excel"),()=>fallbackCopy(txt,done))}catch(err){fallbackCopy(txt,done)}return}
});
function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();done(ok?"Tersalin, tempel di Excel":"Salin tidak tersedia di tampilan ini")}
function tlSet(el){
 const l=cur(),key=instKey(S.lv,l);if(!key)return;
 const m=S.tl[key]||(S.tl[key]=Object.assign({},defaults(S.lv,l)));const tk=el.dataset.tk;
 if(el.type==="radio"){m[tk]=+el.dataset.oi;el.closest(".opts").querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o.contains(el)))}
 else if(el.type==="checkbox"){const a=Array.isArray(m[tk])?m[tk]:[];const oi=+el.dataset.oi,i=a.indexOf(oi);if(el.checked&&i<0)a.push(oi);if(!el.checked&&i>=0)a.splice(i,1);m[tk]=a;el.closest(".opt").classList.toggle("on",el.checked)}
 else m[tk]=el.value;
 const qc=el.closest(".qc");if(qc&&el.type==="radio")qc.classList.add("done");
 save();
 const [d,n]=instProg(S.lv,l),p=$("#tlprog");if(p)p.textContent=`${d}/${n} terjawab`;
 const tb=document.querySelector(`.lvtab[data-lv="${S.lv}"] .bar i`);if(tb)tb.style.width=(n?d/n*100:0)+"%";
 const [a2,b2]=lokusProg(l),sb=document.querySelector(`.slot[aria-pressed="true"] .bar i`);if(sb)sb.style.width=(b2?a2/b2*100:0)+"%";
}
let qT;
document.addEventListener("input",e=>{const t=e.target,ds=t.dataset;
 if(ds.tk){if(t.type!=="radio"&&t.type!=="checkbox")tlSet(t);return}
 if(ds.fq){S.ff.q=t.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=t.selectionStart;render();const el=$("#fq");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}},250);return}
});
document.addEventListener("change",e=>{const t=e.target,ds=t.dataset;
 if(ds.tk&&(t.type==="radio"||t.type==="checkbox")){tlSet(t);return}
 if(ds.sort){S.ff.sort=t.value;render();return}
});
window.addEventListener("pagehide",()=>{try{const o={};PERSIST.forEach(x=>o[x]=S[x]);localStorage.setItem(LSK,JSON.stringify(o))}catch(e){}});
let rT,lastW=window.innerWidth;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{const w=window.innerWidth;if(S.view===1&&(w<700)!==(lastW<700)){const y=window.scrollY;render();window.scrollTo(0,y)}lastW=w},300)});
$("#themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");S.theme=c==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",S.theme);save()});
render();

</script>
