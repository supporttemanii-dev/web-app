<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervisi PPCP HIV 2026 · Dashboard desk review & pemilihan lokus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#EDF0EF;--panel:#FFFFFF;--sunk:#F5F7F6;--ink:#14222B;--mut:#5A6870;--faint:#8A979D;--line:#D8DFDD;
 --pri:#0B5D66;--pri2:#0E7480;--pribg:#DDEEEF;
 --pb:#2C7A4B;--pbbg:#E0F0E6;--su:#B5541A;--subg:#FAE8DC;--cf:#3A4899;--cfbg:#E4E7F5;
 --gap:#B1263C;--gapbg:#F8E2E6;--warn:#8F6400;--warnbg:#F6ECCD;--dot:#9AA6AB;
 --shadow:0 1px 2px rgba(20,34,43,.06),0 4px 16px rgba(20,34,43,.05);--r:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E171C;--panel:#16232A;--sunk:#111C22;--ink:#E2EAEC;--mut:#9AABB1;--faint:#6F8288;--line:#28383F;--pri:#4DB5BE;--pri2:#6FCAD2;--pribg:#13363B;--pb:#5CC489;--pbbg:#173826;--su:#F0955A;--subg:#432717;--cf:#93A0F0;--cfbg:#232A52;--gap:#F17C8E;--gapbg:#4A1C25;--warn:#E3B94E;--warnbg:#3D3015;--dot:#55666C;--shadow:none}}
:root[data-theme="dark"]{--bg:#0E171C;--panel:#16232A;--sunk:#111C22;--ink:#E2EAEC;--mut:#9AABB1;--faint:#6F8288;--line:#28383F;--pri:#4DB5BE;--pri2:#6FCAD2;--pribg:#13363B;--pb:#5CC489;--pbbg:#173826;--su:#F0955A;--subg:#432717;--cf:#93A0F0;--cfbg:#232A52;--gap:#F17C8E;--gapbg:#4A1C25;--warn:#E3B94E;--warnbg:#3D3015;--dot:#55666C;--shadow:none}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0}
a{color:var(--pri)}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--pri);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand p{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin-left:auto;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px}
.steps button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:7px;white-space:nowrap}
.steps button .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--line);color:var(--ink)}
.steps button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.steps button[aria-current="page"] .n{background:var(--pri);color:#fff}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
/* lokus rail */
.rail{background:var(--panel);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:thin}
.slot{flex:none;min-width:150px;max-width:190px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
.slot .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .bar{height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.slot .bar i{display:block;height:100%;background:var(--pri)}
.slot.cf{border-left:3px solid var(--cf)}
.slot.ad{border-left:3px solid var(--su)}
.slot.empty{border-style:dashed;background:transparent;color:var(--mut)}
.slot[aria-pressed="true"]{background:var(--pribg);border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.rail .lbl{flex:none;align-self:center;font-size:12px;color:var(--mut);padding-right:4px;max-width:90px;line-height:1.3}
/* layout */
main{padding:22px 0 60px}
.view-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.view-h h2{font-size:22px;font-weight:800;letter-spacing:-.015em}
.view-h p{color:var(--mut);max-width:72ch;margin-top:4px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-37{grid-template-columns:minmax(0,4fr) minmax(0,8fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;font-weight:700;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-h .sub{margin-bottom:0}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--mut);margin-left:4px}
.kpi .l{font-size:13px;color:var(--mut)}
.meter{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--pri);border-radius:4px}
.meter.gap i{background:var(--gap)}
.meter .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--mut);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.tag.ok{background:var(--pbbg);color:var(--pb);border-color:transparent}
.tag.no{background:var(--gapbg);color:var(--gap);border-color:transparent}
.tag.wa{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.cf{background:var(--cfbg);color:var(--cf);border-color:transparent}
.tag.su{background:var(--subg);color:var(--su);border-color:transparent}
.tag.pri{background:var(--pribg);color:var(--pri);border-color:transparent}
.dotk{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--mut);text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
tr.is-cf td:first-child{box-shadow:inset 3px 0 0 var(--cf)}
tr.is-ad td:first-child{box-shadow:inset 3px 0 0 var(--su)}
.nm{font-weight:600}
.mut{color:var(--mut)}
.small{font-size:12px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0E171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0E171C}}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[aria-pressed="true"]{background:var(--pribg);border-color:var(--pri);color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--pribg);color:var(--pri)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut)}
.field input[type=text],.field input[type=search],select,textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical;min-height:38px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 180px}
/* trend chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:11px;font-family:inherit}
.chart .ax{stroke:var(--line)}
/* schedule */
.sched{display:flex;flex-direction:column;gap:0}
.sched-row{display:grid;grid-template-columns:86px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.sched-row:last-child{border-bottom:0}
.date{font-weight:700;font-size:13px}
.date small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
/* scatter */
.scatter{position:relative}
.scatter svg{width:100%;height:auto;display:block;touch-action:manipulation}
.scatter text{font-family:inherit}
.pt{cursor:pointer}
.pt:hover circle,.pt.on circle{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* slots in selection */
.pick{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sunk);display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pick .who{font-size:16px;font-weight:800;letter-spacing:-.01em}
.pick .why{font-size:12.5px;color:var(--mut)}
.pick.pb{border-top:3px solid var(--pb)}
.pick.su{border-top:3px solid var(--su)}
.pick.mx{border-top:3px solid var(--pri)}
.scorebar{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:12px}
.scorebar .meter{height:6px}
.scorebar .pbm i{background:var(--pb)}
.scorebar .sum i{background:var(--su)}
/* weights */
details.wts{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.wts summary{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.wts summary::-webkit-details-marker{display:none}
details.wts[open] summary{border-bottom:1px solid var(--line)}
.wbody{padding:14px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.wrow{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.wrow input[type=range]{width:100%;accent-color:var(--pri)}
.wrow output{text-align:right;font-weight:700}
/* facility cards */
.fcol{display:flex;flex-direction:column;gap:8px}
.fcol h4{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.fcard{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.fcard.sel{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri);background:var(--pribg)}
.fcard .t{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.fcard .m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.fcard .m b{color:var(--ink);font-weight:700}
.empty-note{border:1px dashed var(--line);border-radius:9px;padding:14px;color:var(--mut);font-size:12.5px;text-align:center}
/* validation */
.vitem{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
.vitem .q{font-weight:700;font-size:14px}
.vitem .d{font-size:13px;color:var(--mut);grid-column:1/-1}
.vitem .note{grid-column:1/-1}
.vitem.s-ok{border-left:4px solid var(--pb)}
.vitem.s-diff{border-left:4px solid var(--gap)}
.vitem .refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--gapbg);border-color:var(--gap);color:var(--gap)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.prog .meter{width:160px}
.rtl input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font-size:13px}
.rtl input:hover,.rtl input:focus{border-color:var(--line);background:var(--panel)}
.rtl td{padding:4px 6px}
.rtl td:first-child{padding-left:10px;white-space:nowrap;font-weight:600}
/* misc */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fact{background:var(--sunk);border-radius:8px;padding:10px 12px}
.fact .v{font-size:20px;font-weight:800;letter-spacing:-.01em}
.fact .l{font-size:12px;color:var(--mut)}
.gov{display:flex;flex-direction:column}
.gov-row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.gov-row:last-child{border-bottom:0}
.gov-row .k{color:var(--mut)}
.yrs{display:flex;gap:4px}
.yrs span{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--faint);border:1px solid var(--line)}
.yrs span.on{background:var(--pbbg);color:var(--pb);border-color:transparent}
.casc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.casc .c{background:var(--sunk);border-radius:8px;padding:10px 12px;position:relative}
.casc .c .v{font-size:20px;font-weight:800}
.casc .c .l{font-size:12px;color:var(--mut)}
.callout{border-radius:9px;padding:12px 14px;font-size:13px;background:var(--sunk);border:1px solid var(--line)}
.callout.wa{background:var(--warnbg);border-color:transparent;color:var(--ink)}
.callout b{font-weight:700}
.note-src{font-size:11.5px;color:var(--faint);margin-top:10px}
.hint{font-size:12px;color:var(--mut)}
.hide{display:none!important}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%);z-index:5}
.tt b{display:block;font-size:12.5px}
.bnav{display:none}
.only-m{display:none}
.tag.ghost{background:transparent;border-style:dashed;color:var(--faint)}
.pgl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pgl .it{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mut)}
.sbars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.sbar-h .mut{white-space:nowrap}
.sbar-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}
.sbar-b{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);gap:2px}
.sbar-b i{display:block;min-width:4px}
.sbar-l{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:6px}
.sbar-l span{display:inline-flex;align-items:center;gap:5px}
.sbar-l b{color:var(--ink)}
details.kd summary{cursor:pointer;color:var(--pri);font-size:12px;font-weight:600}
details.kd p{font-size:12.5px;color:var(--mut);margin-top:4px;max-width:60ch}
.subhead{font-size:13px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
/* daftar tilik */
.lvtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.lvtab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:150px}
.lvtab .t{font-size:13px;font-weight:700}
.lvtab .s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.lvtab .bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.lvtab .bar i{display:block;height:100%;background:var(--pri)}
.lvtab[aria-pressed="true"]{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri);background:var(--pribg)}
.tl{display:flex;flex-direction:column;gap:12px}
.tl-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.tl-head h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.tl-head .mode{font-size:12.5px;color:var(--mut);font-style:italic}
.tl-sec{font-size:13.5px;font-weight:800;color:var(--pri);margin-top:10px;padding-top:12px;border-top:2px solid var(--pri);letter-spacing:.01em}
.tl-lbl{font-size:13.5px;font-weight:700;margin-top:4px}
.tl-note{font-size:12.5px;color:var(--mut);font-style:italic}
.flds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);min-width:0}
.fld input,.fld textarea,.qc textarea,.tl textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);width:100%;min-width:0}
.opts{display:flex;flex-direction:column;gap:4px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-size:13.5px;line-height:1.45;min-width:0}
.opts.row .opt{flex:0 1 auto}
.opt input[type=radio],.opt input[type=checkbox]{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--pri)}
.opt>span{min-width:0;overflow-wrap:anywhere}
.opt.on{border-color:var(--pri);background:var(--pribg)}
input.bl{display:inline-block;width:110px;max-width:100%;border:0;border-bottom:1.5px solid var(--faint);background:transparent;padding:1px 4px;margin:1px 2px;font-size:13px;color:var(--ink);border-radius:0;vertical-align:baseline}
input.bl:focus{outline:none;border-bottom-color:var(--pri);background:var(--pribg)}
.qg{font-size:13.5px;font-weight:800;margin-top:8px;padding:8px 12px;background:var(--sunk);border-radius:8px;border-left:3px solid var(--pri)}
.qc{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:12px 18px}
.qc.done{border-left:3px solid var(--pb)}
.qc-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qno{flex:none;min-width:34px;height:26px;padding:0 7px;border-radius:7px;background:var(--pribg);color:var(--pri);font-weight:800;font-size:12.5px;display:grid;place-items:center}
.qt{font-weight:600;font-size:14px}

  case "grid":{const g=gi++;const isStatic=(c,ci)=>c&&!BLANK.test(c)&&!/^contoh/i.test(c)&&(ci===0||(ci===1&&b.head[0]==="No."));
   return `${hintBox(H["grid:"+g])}<div class="tbl-wrap cards"><table class="gtbl rsp"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>{const key=`g${bi}_${ri}_${ci}`;

 }

function tsv(lv,k){
 const ti=LV.find(l=>l.id===lv).ti,I=TL[ti],a=getAns(lv,k);const out=[["Instrumen","Lokus","Bagian","No","Pertanyaan/isian","Jawaban","Bukti/dokumen","Temuan/catatan"]];let sec="",lbl="";
 const fill=(t,key)=>{let n=0;return String(t).replace(/_{3,}|\.{5,}/g,()=>{const v=a[key+"_"+(n++)];return v?"["+v+"]":"___"})};
 const loc=k.k+", "+k.p+(lvFac(lv,k)?" · "+lvFac(lv,k).f.nm:"");
 I.b.forEach((b,bi)=>{
  if(b.t==="sec")sec=b.text;if(b.t==="lbl")lbl=b.text;
  if(b.t==="field")out.push([I.title,loc,sec,"",b.label,a["f"+bi]||"","",""]);
  if(b.t==="staff")out.push([I.title,loc,sec,"",b.label,Array.from({length:b.n},(_,i)=>a["st"+bi+"_"+i]).filter(Boolean).join("; "),"",""]);
  if(b.t==="opts"){const v=a["o"+bi];const sel=(Array.isArray(v)?v:isSet(v)?[v]:[]).map(i=>fill(b.items[i],"o"+bi+"_"+i));out.push([I.title,loc,sec,"",lbl,sel.join("; "),"",""])}
  if(b.t==="area")out.push([I.title,loc,sec,"",lbl,a["a"+bi]||"","",""]);
  if(b.t==="text")out.push([I.title,loc,sec,"",fill(b.text,"t"+bi),isSet(a["t"+bi+"_yn"])?["ya","tidak"][a["t"+bi+"_yn"]]:"","",""]);
  if(b.t==="prompts")b.items.forEach((p,i)=>out.push([I.title,loc,sec,"",p,a["p"+bi+"_"+i]||"","",""]));
  if(b.t==="q"){let g="";b.rows.forEach(r=>{if(r.g){g=r.g;return}const key="q_"+r.no,v=a[key];out.push([I.title,loc,g||sec,r.no,r.q,isSet(v)?fill(r.o[v],key+"_"+v):"",a[key+"_ev"]||"",a[key+"_tm"]||""])})}
  if(b.t==="grid")b.rows.forEach((r,ri)=>{const vals=r.map((c,ci)=>{const key=`g${bi}_${ri}_${ci}`;return BLANK.test(c)?fill(c,key):(a[key]||"")});if(vals.slice(1).some(Boolean)||r[0])out.push([I.title,loc,sec||lbl,"",r.filter(Boolean)[0]||lbl,b.head.slice(1).map((h,i)=>h+": "+(vals[i+1]||(r[i+1]&&!BLANK.test(r[i+1])&&!/^contoh/i.test(r[i+1])?r[i+1]:"-"))).join(" | "),"",""])});
 });
 return out.map(r=>r.map(c=>String(c).replace(/[\t\n]+/g," ")).join("\t")).join("\n");
}

     <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-oneprov="1" ${S.oneProv?"checked":""}> Maksimal satu lokus tambahan per provinsi</label>
    </div></div>
   <div id="focus">${focusCard()}</div>
  </div>
 </div>
 <details class="wts" style="margin-top:14px"><summary>Bobot komponen skor <span class="hint">Geser untuk menyesuaikan; bobot dinormalisasi per kelompok</span></summary>
  <div class="wbody"><div><div style="font-weight:700;color:var(--pb);margin-bottom:6px">Praktik baik</div>${COMP.pb.map(wrow).join("")}</div><div><div style="font-weight:700;color:var(--su);margin-bottom:6px">Potensi scale-up</div>${COMP.su.map(wrow).join("")}</div>
  <div style="grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><p class="hint" style="max-width:80ch">Skor tiap komponen adalah peringkat persentil di antara 165 kab/kota; komponen biner (SK, PKS/komunitas, rencana, dana) dinilai 0 atau 1. Data yang tidak cukup (mis. layanan PDP &lt; 2) diberi nilai tengah 50.</p><button class="btn sm" data-reset="w">Bobot bawaan</button></div></div></details>
 <div class="card" style="margin-top:14px"><div class="card-h"><div><h3>Peringkat kab/kota</h3><p class="sub">${S.showAll||S.q||S.prov?total:Math.min(25,total)} dari ${total} ditampilkan</p></div></div>
  <div class="toolbar noprint"><input class="inp grow" type="search" placeholder="Cari kab/kota atau provinsi" value="${esc(S.q)}" data-q="1" aria-label="Cari"><select data-prov="1" aria-label="Provinsi"><option value="">Semua provinsi</option>${provs.map(p=>`<option ${S.prov===p?"selected":""}>${esc(p)}</option>`).join("")}</select>
  <div class="seg" role="group" aria-label="Urutkan">${[["mx","Gabungan"],["pb","Praktik baik"],["su","Potensi"],["od","ODHIV"]].map(([v,l])=>`<button data-sort="${v}" aria-pressed="${S.sortBy===v}">${l}</button>`).join("")}</div></div>
  <div class="tbl-wrap cards"><table class="rsp"><thead><tr><th class="hide-sm">#</th><th>Kab/kota</th><th class="n">ODHIV</th><th class="n hide-m">Lay. tes</th><th class="n hide-m">PDP lapor</th><th class="n hide-m">Calon PDP</th><th class="hide-m">SK Tim</th><th class="n">PB</th><th class="n">SU</th><th class="hide-sm"></th></tr></thead><tbody>
  ${rows.map((k,i)=>{const e=eligible(k),ps=pickedIds[k.id];return `<tr class="${k.conf?"is-cf":ps?"is-ad":""}" data-pt="${esc(k.id)}" style="cursor:pointer${e.ok||k.conf||ps?"":";opacity:.6"}"><td class="mut hide-sm">${i+1}</td><td><span class="nm">${esc(k.k)}</span> ${k.conf?'<span class="tag cf">Terkonfirmasi</span>':ps?`<span class="tag ${ps.cls==="mx"?"pri":ps.cls==="pb"?"ok":"su"}">${ps.name}</span>`:""}${k.kak&&!k.conf?' <span class="tag wa">KAK v7</span>':""}<div class="small mut">${esc(k.p)}${!e.ok&&!k.conf?" · "+esc(e.why):""}</div></td><td class="n" data-l="ODHIV ditemukan">${fi(k.od)}</td><td class="n hide-m">${k.nT} <span class="mut small">(${fp(pc(k.nTL,k.nT))})</span></td><td class="n hide-m">${k.nP?k.nPL+"/"+k.nP:"–"}</td><td class="n hide-m">${k.pot||"–"}</td><td class="hide-m">${RAW.sk(k)===1?'<span class="tag ok">Ada</span>':RAW.sk(k)>0?'<span class="tag wa">Proses</span>':'<span class="tag">–</span>'}</td><td class="n" data-l="Praktik baik" style="color:var(--pb);font-weight:700">${sc(k.PB)}</td><td class="n" data-l="Potensi scale-up" style="color:var(--su);font-weight:700">${sc(k.SU)}</td><td class="n noprint hide-sm"><span class="mut">›</span></td></tr>`}).join("")}
  </tbody></table></div>
  ${!S.showAll&&!S.q&&!S.prov&&total>25?`<div style="text-align:center;margin-top:10px"><button class="btn" data-showall="1">Tampilkan semua ${total}</button></div>`:""}</div>`;
}
function bindScatter(){
 const svg=$("#scat"),tt=$("#tt"),wrap=$("#scatWrap");if(!svg)return;
 svg.addEventListener("mousemove",e=>{const g=e.target.closest("[data-pt]");if(!g){tt.classList.add("hide");return}const k=KID[g.dataset.pt];const r=wrap.getBoundingClientRect();tt.innerHTML=`<b>${esc(k.k)}</b>${esc(k.p)} · PB ${sc(k.PB)} · SU ${sc(k.SU)} · ${fi(k.od)} ODHIV`;tt.style.left=(e.clientX-r.left)+"px";tt.style.top=(e.clientY-r.top)+"px";tt.classList.remove("hide")});
 svg.addEventListener("mouseleave",()=>tt.classList.add("hide"));
}
/* ===== 4. Fasyankes ===== */
const FCAT=[
 {id:"a",n:"PDP rutin lapor SIHA",d:"Menggali praktik baik dan faktor pendukung keberlanjutan layanan",f:f=>f.pdp&&f.pl,s:(a,b)=>b.arv-a.arv,tag:"ok"},
 {id:"b",n:"PDP belum/belum konsisten lapor",d:"Menggali kendala dan kebutuhan pendampingan",f:f=>f.pdp&&(!f.pl||(f.tes&&f.fr<6)),s:(a,b)=>(a.pl-b.pl)||b.od-a.od||b.dt-a.dt,tag:"no"},
 {id:"c",n:"Tes HIV berpotensi jadi PDP",d:"Layanan tes non-PDP yang sudah menemukan ODHIV",f:f=>f.tes&&!f.pdp&&f.od>0,s:(a,b)=>b.od-a.od,tag:"su"},
 {id:"d",n:"Tes HIV rutin lapor SIHA",d:"Layanan tes non-PDP yang melapor 6/6 bulan",f:f=>f.tes&&!f.pdp&&f.fr===6,s:(a,b)=>b.dt-a.dt,tag:"pri"}];
function fasCard(f,cat,sel){
 const isSel=sel[f.j]&&sel[f.j].f===f.i;
 return `<div class="fcard${isSel?" sel":""}"><div class="t"><span>${esc(f.nm)}</span><span class="tag">${f.j==="R"?"RS":"Klinik"}</span></div>${f.fp?`<div class="pgl"><span class="tag pri">Aktivasi 2024–26</span><span class="small mut">PKS</span>${pill(f.fp.pks)}</div>`:""}
 <div class="m"><span>Dites <b>${fi(f.dt)}</b></span><span>ODHIV <b>${fi(f.od)}</b></span><span>Mulai ART <b>${fi(f.art)}</b></span>${f.pdp?`<span>On ARV <b>${fi(f.arv)}</b></span>`:""}${f.tes?`<span>Lapor <b>${f.fr}/6</b> bln</span>`:""}</div>
 <button class="btn sm noprint" style="align-self:flex-start" data-fas="${f.i}" data-fcat="${cat.id}" ${isSel?'aria-pressed="true"':""}>${isSel?"Terpilih sebagai "+(f.j==="R"?"RS":"klinik"):"Pilih sebagai "+(f.j==="R"?"RS":"klinik")}</button></div>`;
}
function autoFas(k){
 const sel={};
 const firstOf=(j)=>{for(const c of [FCAT[0],FCAT[2],FCAT[1],FCAT[3]]){const f=k.fs.filter(x=>x.j===j&&c.f(x)).sort((a,b)=>(b.fp?1:0)-(a.fp?1:0)||c.s(a,b))[0];if(f)return {f:f.i,cat:c.id,auto:true}}const f=k.fs.filter(x=>x.j===j).sort((a,b)=>b.dt-a.dt)[0];return f?{f:f.i,cat:null,auto:true}:null};
 sel.R=firstOf("R");sel.K=firstOf("K");return sel;
}
function getFas(k){const a=autoFas(k),m=S.fas[k.id]||{};return {R:m.R||a.R,K:m.K||a.K}}
function vFas(){
 const k=curK();if(!k)return "";
 const sel=getFas(k);
 const box=(j,l)=>{const s=sel[j];if(!s)return `<div class="pick"><span class="small" style="font-weight:700">${l}</span><div class="who">Tidak tersedia</div><div class="why">Tidak ada ${l.toLowerCase()} swasta terdaftar di data SIHA; cari alternatif saat koordinasi dengan Dinkes.</div></div>`;
  const f=F[s.f],c=FCAT.find(x=>x.id===s.cat);
  return `<div class="pick mx"><div class="h"><span class="small" style="font-weight:700">${l}</span>${s.auto?'<span class="tag">Usulan otomatis</span>':'<span class="tag pri">Dipilih</span>'}</div><div class="who">${esc(f.nm)}</div><div class="why">${c?"Dasar pemilihan: "+c.n:"Tidak masuk kriteria KAK; dipilih berdasarkan volume tes"} · ${fi(f.dt)} dites · ${fi(f.od)} ODHIV${f.pdp?" · "+fi(f.arv)+" on ARV":""}</div></div>`};
 return `<div class="view-h"><div><h2>Fasyankes kunjungan: ${esc(k.k)}</h2><p>Sesuai KAK, kunjungan ke 1 rumah sakit dan 1 klinik swasta yang dipilih berdasarkan kondisi implementasi PPCP. Usulan otomatis mengutamakan PDP rutin lapor, lalu calon PDP, lalu PDP yang belum lapor; di dalam tiap kategori, fasyankes yang diaktivasi melalui PPCP 2024–2026 didahulukan.</p></div>${S.fas[k.id]?`<button class="btn noprint" data-reset="fas">Kembalikan usulan otomatis</button>`:""}</div>
 <div class="grid g2">${box("R","Rumah sakit")}${box("K","Klinik")}</div>
 <div class="grid g4 fasgrid" style="margin-top:14px;align-items:start">${FCAT.map(c=>{const fs=k.fs.filter(c.f).sort(c.s);return `<div class="fcol"><h4><span class="tag ${c.tag}">${fs.length}</span>${c.n}</h4><p class="hint">${c.d}</p>${fs.length?fs.slice(0,6).map(f=>fasCard(f,c,sel)).join("")+(fs.length>6?`<p class="hint">+${fs.length-6} lainnya di tabel desk review</p>`:""):`<div class="empty-note">Tidak ada fasyankes pada kategori ini</div>`}</div>`}).join("")}</div>`;
}
/* ===== 5. Daftar tilik ===== */
function vTilik(){
 const k=curK();if(!k)return "";
 if(!LV.some(l=>l.id===S.lv))S.lv="kab";
 const lv=S.lv,I=TL[LV.find(l=>l.id===lv).ti],x=lvFac(lv,k);
 const sub=l=>l.id==="prov"?esc(k.p):l.id==="kab"||l.id==="has"?esc(k.k):(lvFac(l.id,k)?esc(lvFac(l.id,k).f.nm):"Belum dipilih");
 const tabs=`<div class="lvtabs" role="tablist" aria-label="Level instrumen">${LV.map(l=>{const [d,n]=instProg(l.id,k);return `<button class="lvtab" role="tab" data-lv="${l.id}" aria-pressed="${S.lv===l.id}"><span class="t">${l.n}</span><span class="s">${sub(l)}</span><span class="bar"><i style="width:${n?d/n*100:0}%"></i></span></button>`}).join("")}</div>`;
 const [d,n]=instProg(lv,k);
 let body;
 if((lv==="fasR"||lv==="fasK")&&!x)body=`<div class="empty-note">Belum ada ${lv==="fasR"?"rumah sakit":"klinik"} swasta terpilih untuk ${esc(k.k)}. Pilih di tahap <button class="btn sm" data-step="3">Pilih fasyankes</button></div>`;
 else body=`<div class="card tl"><div class="tl-head"><div><h3>${esc(I.title)}</h3><p class="mode">(${esc(I.mode)})</p>${x?`<p class="small mut" style="margin-top:4px">${esc(x.f.nm)} · ${x.f.j==="R"?"Rumah sakit":"Klinik"} · kode ${esc(x.f.kode)}${x.f.fp?' · <span class="tag pri">Aktivasi PPCP 2024–2026</span>':""}</p>`:""}${lv==="prov"?`<p class="small mut" style="margin-top:4px">Satu isian per provinsi, dipakai bersama oleh semua lokus di ${esc(k.p)}.</p>`:""}</div>
  <div class="tl-tools noprint"><div class="prog" id="tlprog"><div class="meter"><i style="width:${n?d/n*100:0}%"></i></div><span>${d}/${n} terjawab</span></div><button class="btn sm" data-copytsv="1">Salin untuk Excel</button><button class="btn sm" data-print="1">Cetak</button><button class="btn sm" data-clear="1">Kosongkan</button></div></div>
  ${renderInst(lv,k)}</div>`;
 return `<div class="view-h"><div><h2>Daftar tilik: ${esc(k.k)}</h2><p>Instrumen supervisi V5 sesuai dokumen, dipisah per level. Kotak kuning berisi data desk review sebagai bahan konfirmasi, bukan jawaban. Isian tersimpan otomatis di perangkat ini.</p></div></div>${tabs}${body}`;
}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("button,[data-pt],[data-lok]");if(!t)return;
 const ds=t.dataset;
 if(ds.step!=null&&!ds.lok){S.step=+ds.step;render();window.scrollTo(0,0);return}
 if(ds.lok){S.lok=ds.lok;if(ds.go)S.step=1;render();if(ds.go)window.scrollTo(0,0);return}
 if(ds.pt){S.focus=ds.pt;$("#focus").innerHTML=focusCard();document.querySelectorAll(".pt.on").forEach(n=>n.classList.remove("on"));const g=document.querySelector(`.pt[data-pt="${CSS.escape(ds.pt)}"]`);if(g)g.classList.add("on");if(window.innerWidth<1100&&t.tagName!=="g")$("#focus").scrollIntoView({behavior:"smooth",block:"nearest"});return}
 if(ds.assign){Object.keys(S.over).forEach(s=>{if(S.over[s]===ds.k)delete S.over[s]});S.over[ds.assign]=ds.k;render();return}
 if(ds.unassign){delete S.over[ds.unassign];render();return}
 if(ds.reset==="sel"){S.over={};S.minOd=10;S.pbMin=60;S.provMode="all";S.oneProv=true;render();return}
 if(ds.reset==="w"){S.w={...DEFW};render();return}
 if(ds.reset==="fas"){delete S.fas[S.lok];render();return}
 if(ds.pm){S.provMode=ds.pm;render();return}
 if(ds.sort){S.sortBy=ds.sort;render();return}
 if(ds.showall){S.showAll=true;render();return}
 if(ds.facf){S.facF=ds.facf;render();return}
 if(ds.pgf){S.pgF=ds.pgf;S.more.pg=false;render();return}
 if(ds.more){S.more[ds.more]=true;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(ds.lv){S.lv=ds.lv;render();return}
 if(ds.fas!=null&&ds.fcat){const f=F[+ds.fas];const m=S.fas[S.lok]||{};m[f.j]={f:f.i,cat:ds.fcat};S.fas[S.lok]=m;render();return}
 if(ds.print){window.print();return}
 if(ds.clear){const key=instKey(S.lv,curK());if(key&&confirm("Kosongkan semua isian pada instrumen ini?")){delete S.tl[key];render()}return}
 if(ds.copytsv){const txt=tsv(S.lv,curK());const lbl=t.textContent;const done=m=>{t.textContent=m;setTimeout(()=>t.textContent=lbl,2200)};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>done("Tersalin, tempel di Excel"),()=>done("Gagal menyalin"));else done("Clipboard tidak tersedia");return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-pt]:not(button)")){e.preventDefault();e.target.click()}});
function tlSet(el){
 const k=curK(),key=instKey(S.lv,k);if(!key)return;
 const m=S.tl[key]||(S.tl[key]=Object.assign({},defaults(S.lv,k)));const tk=el.dataset.tk;
 if(el.type==="radio"){m[tk]=+el.dataset.oi;el.closest(".opts").querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o.contains(el)))}
 else if(el.type==="checkbox"){const a=Array.isArray(m[tk])?m[tk]:[];const oi=+el.dataset.oi;const i=a.indexOf(oi);if(el.checked&&i<0)a.push(oi);if(!el.checked&&i>=0)a.splice(i,1);m[tk]=a;el.closest(".opt").classList.toggle("on",el.checked)}
 else m[tk]=el.value;
 const qc=el.closest(".qc");if(qc&&el.type==="radio")qc.classList.add("done");
 clearTimeout(window._st);window._st=setTimeout(save,300);
 const [d,n]=instProg(S.lv,k);const p=$("#tlprog");if(p)p.innerHTML=`<div class="meter"><i style="width:${n?d/n*100:0}%"></i></div><span>${d}/${n} terjawab</span>`;
 const tb=document.querySelector(`.lvtab[data-lv="${S.lv}"] .bar i`);if(tb)tb.style.width=(n?d/n*100:0)+"%";
}
document.addEventListener("input",e=>{
 const t=e.target,ds=t.dataset;
 if(ds.tk){if(t.type!=="radio"&&t.type!=="checkbox")tlSet(t);return}
 if(ds.w){S.w[ds.w]=+t.value;t.nextElementSibling.textContent=t.value;clearTimeout(window._wt);window._wt=setTimeout(()=>{const o=document.querySelector("details.wts").open;render();document.querySelector("details.wts").open=o;const el=$("#w_"+ds.w);if(el)el.focus()},250);return}
 if(ds.pbmin){S.pbMin=+t.value;clearTimeout(window._pt);window._pt=setTimeout(()=>{render();const el=document.querySelector("[data-pbmin]");if(el)el.focus()},200);return}
 if(ds.minod){S.minOd=+t.value;clearTimeout(window._mt);window._mt=setTimeout(()=>{render();const el=document.querySelector("[data-minod]");if(el)el.focus()},200);return}
 if(ds.q!=null&&t.type==="search"){S.q=t.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{const pos=t.selectionStart;render();const el=document.querySelector("[data-q]");if(el){el.focus();el.setSelectionRange(pos,pos)}},250);return}
});
document.addEventListener("change",e=>{
 const t=e.target,ds=t.dataset;
 if(ds.tk&&(t.type==="radio"||t.type==="checkbox")){tlSet(t);return}
 if(ds.prov){S.prov=t.value;render();return}
 if(ds.oneprov){S.oneProv=t.checked;render();return}
});
window.addEventListener("beforeunload",save);
$("#themeBtn").addEventListener("click",()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");S.theme=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",S.theme);save()});
render();
</script>
