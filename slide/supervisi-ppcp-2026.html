<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervisi PPCP HIV 2026 · Dashboard desk review & pemilihan lokus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#EDF0EF;--panel:#FFFFFF;--sunk:#F5F7F6;--ink:#14222B;--mut:#5A6870;--faint:#8A979D;--line:#D8DFDD;
 --pri:#0B5D66;--pri2:#0E7480;--pribg:#DDEEEF;
 --pb:#2C7A4B;--pbbg:#E0F0E6;--su:#B5541A;--subg:#FAE8DC;--cf:#3A4899;--cfbg:#E4E7F5;
 --gap:#B1263C;--gapbg:#F8E2E6;--warn:#8F6400;--warnbg:#F6ECCD;--dot:#9AA6AB;
 --shadow:0 1px 2px rgba(20,34,43,.06),0 4px 16px rgba(20,34,43,.05);--r:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E171C;--panel:#16232A;--sunk:#111C22;--ink:#E2EAEC;--mut:#9AABB1;--faint:#6F8288;--line:#28383F;--pri:#4DB5BE;--pri2:#6FCAD2;--pribg:#13363B;--pb:#5CC489;--pbbg:#173826;--su:#F0955A;--subg:#432717;--cf:#93A0F0;--cfbg:#232A52;--gap:#F17C8E;--gapbg:#4A1C25;--warn:#E3B94E;--warnbg:#3D3015;--dot:#55666C;--shadow:none}}
:root[data-theme="dark"]{--bg:#0E171C;--panel:#16232A;--sunk:#111C22;--ink:#E2EAEC;--mut:#9AABB1;--faint:#6F8288;--line:#28383F;--pri:#4DB5BE;--pri2:#6FCAD2;--pribg:#13363B;--pb:#5CC489;--pbbg:#173826;--su:#F0955A;--subg:#432717;--cf:#93A0F0;--cfbg:#232A52;--gap:#F17C8E;--gapbg:#4A1C25;--warn:#E3B94E;--warnbg:#3D3015;--dot:#55666C;--shadow:none}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0}
a{color:var(--pri)}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--pri);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand p{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;margin-left:auto;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px}
.steps button{border:0;background:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:7px;white-space:nowrap}
.steps button .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--line);color:var(--ink)}
.steps button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.steps button[aria-current="page"] .n{background:var(--pri);color:#fff}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
/* lokus rail */
.rail{background:var(--panel);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:thin}
.slot{flex:none;min-width:150px;max-width:190px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;position:relative}
.slot .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .s{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .bar{height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.slot .bar i{display:block;height:100%;background:var(--pri)}
.slot.cf{border-left:3px solid var(--cf)}
.slot.ad{border-left:3px solid var(--su)}
.slot.empty{border-style:dashed;background:transparent;color:var(--mut)}
.slot[aria-pressed="true"]{background:var(--pribg);border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.rail .lbl{flex:none;align-self:center;font-size:12px;color:var(--mut);padding-right:4px;max-width:90px;line-height:1.3}
/* layout */
main{padding:22px 0 60px}
.view-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.view-h h2{font-size:22px;font-weight:800;letter-spacing:-.015em}
.view-h p{color:var(--mut);max-width:72ch;margin-top:4px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-37{grid-template-columns:minmax(0,4fr) minmax(0,8fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;font-weight:700;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-h .sub{margin-bottom:0}
/* kpi */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--mut);margin-left:4px}
.kpi .l{font-size:13px;color:var(--mut)}
.meter{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--pri);border-radius:4px}
.meter.gap i{background:var(--gap)}
.meter .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--mut);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.tag.ok{background:var(--pbbg);color:var(--pb);border-color:transparent}
.tag.no{background:var(--gapbg);color:var(--gap);border-color:transparent}
.tag.wa{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.cf{background:var(--cfbg);color:var(--cf);border-color:transparent}
.tag.su{background:var(--subg);color:var(--su);border-color:transparent}
.tag.pri{background:var(--pribg);color:var(--pri);border-color:transparent}
.dotk{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--mut);text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
tr.is-cf td:first-child{box-shadow:inset 3px 0 0 var(--cf)}
tr.is-ad td:first-child{box-shadow:inset 3px 0 0 var(--su)}
.nm{font-weight:600}
.mut{color:var(--mut)}
.small{font-size:12px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0E171C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0E171C}}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[aria-pressed="true"]{background:var(--pribg);border-color:var(--pri);color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--pribg);color:var(--pri)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut)}
.field input[type=text],.field input[type=search],select,textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical;min-height:38px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 180px}
/* trend chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:11px;font-family:inherit}
.chart .ax{stroke:var(--line)}
/* schedule */
.sched{display:flex;flex-direction:column;gap:0}
.sched-row{display:grid;grid-template-columns:86px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.sched-row:last-child{border-bottom:0}
.date{font-weight:700;font-size:13px}
.date small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
/* scatter */
.scatter{position:relative}
.scatter svg{width:100%;height:auto;display:block;touch-action:manipulation}
.scatter text{font-family:inherit}
.pt{cursor:pointer}
.pt:hover circle,.pt.on circle{stroke:var(--ink);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* slots in selection */
.pick{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sunk);display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pick .who{font-size:16px;font-weight:800;letter-spacing:-.01em}
.pick .why{font-size:12.5px;color:var(--mut)}
.pick.pb{border-top:3px solid var(--pb)}
.pick.su{border-top:3px solid var(--su)}
.pick.mx{border-top:3px solid var(--pri)}
.scorebar{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:12px}
.scorebar .meter{height:6px}
.scorebar .pbm i{background:var(--pb)}
.scorebar .sum i{background:var(--su)}
/* weights */
details.wts{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.wts summary{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.wts summary::-webkit-details-marker{display:none}
details.wts[open] summary{border-bottom:1px solid var(--line)}
.wbody{padding:14px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.wrow{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.wrow input[type=range]{width:100%;accent-color:var(--pri)}
.wrow output{text-align:right;font-weight:700}
/* facility cards */
.fcol{display:flex;flex-direction:column;gap:8px}
.fcol h4{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.fcard{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.fcard.sel{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri);background:var(--pribg)}
.fcard .t{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.fcard .m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.fcard .m b{color:var(--ink);font-weight:700}
.empty-note{border:1px dashed var(--line);border-radius:9px;padding:14px;color:var(--mut);font-size:12.5px;text-align:center}
/* validation */
.vitem{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
.vitem .q{font-weight:700;font-size:14px}
.vitem .d{font-size:13px;color:var(--mut);grid-column:1/-1}
.vitem .note{grid-column:1/-1}
.vitem.s-ok{border-left:4px solid var(--pb)}
.vitem.s-diff{border-left:4px solid var(--gap)}
.vitem .refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--gapbg);border-color:var(--gap);color:var(--gap)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.prog .meter{width:160px}
.rtl input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font-size:13px}
.rtl input:hover,.rtl input:focus{border-color:var(--line);background:var(--panel)}
.rtl td{padding:4px 6px}
.rtl td:first-child{padding-left:10px;white-space:nowrap;font-weight:600}
/* misc */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fact{background:var(--sunk);border-radius:8px;padding:10px 12px}
.fact .v{font-size:20px;font-weight:800;letter-spacing:-.01em}
.fact .l{font-size:12px;color:var(--mut)}
.gov{display:flex;flex-direction:column}
.gov-row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.gov-row:last-child{border-bottom:0}
.gov-row .k{color:var(--mut)}
.yrs{display:flex;gap:4px}
.yrs span{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--faint);border:1px solid var(--line)}
.yrs span.on{background:var(--pbbg);color:var(--pb);border-color:transparent}
.casc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.casc .c{background:var(--sunk);border-radius:8px;padding:10px 12px;position:relative}
.casc .c .v{font-size:20px;font-weight:800}
.casc .c .l{font-size:12px;color:var(--mut)}
.callout{border-radius:9px;padding:12px 14px;font-size:13px;background:var(--sunk);border:1px solid var(--line)}
.callout.wa{background:var(--warnbg);border-color:transparent;color:var(--ink)}
.callout b{font-weight:700}
.note-src{font-size:11.5px;color:var(--faint);margin-top:10px}
.hint{font-size:12px;color:var(--mut)}
.hide{display:none!important}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-120%);z-index:5}
.tt b{display:block;font-size:12.5px}
.bnav{display:none}
.only-m{display:none}
@media (max-width:1100px){
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g-73,.g-37{grid-template-columns:minmax(0,1fr)}
 .g3{grid-template-columns:minmax(0,1fr)}
 .brand p{display:none}
}
@media (max-width:860px){
 .steps{display:none}
 .wrap{padding:0 14px}
 .top .wrap{min-height:56px}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
 .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mut);padding:4px 0}
 .bnav button svg{width:20px;height:20px}
 .bnav button[aria-current="page"]{color:var(--pri)}
 main{padding-bottom:110px}
 .g2{grid-template-columns:minmax(0,1fr)}
 .wbody{grid-template-columns:minmax(0,1fr)}
 .view-h h2{font-size:19px}
 .casc{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hide-m{display:none}
 .fasgrid{grid-template-columns:minmax(0,1fr)!important}
 .only-m{display:initial}
 .gov-row{grid-template-columns:110px 1fr}
 .slot{min-width:132px}
 .rail .lbl{display:none}
}
@media (max-width:520px){
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .kpi .v{font-size:23px}
 .card{padding:14px}
 .tbl-wrap{margin:0 -14px;padding:0 14px}
 .vitem{grid-template-columns:minmax(0,1fr)}
 .sched-row{grid-template-columns:72px 1fr}
 .sched-row>:last-child{grid-column:2}
 .brand h1{font-size:15px}
}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .4s ease}}
@media print{
 .top,.rail,.bnav,.noprint{display:none!important}
 body{background:#fff;font-size:12px}
 .card{box-shadow:none;break-inside:avoid}
 main{padding:0}
}
</style>
</head>
<body>
<header class="top">
 <div class="wrap">
  <div class="brand">
   <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-2-3.2-5-6.6-5-10.2A5 5 0 0 1 12 6a5 5 0 0 1 5 4.8c0 3.6-3 7-5 10.2Z"/><path d="M9.5 15.5 14.5 6"/></svg></div>
   <div style="min-width:0"><h1>Supervisi PPCP HIV 2026</h1><p>Desk review, pemilihan lokus, dan validasi lapangan · Data SIHA swasta s.d. Juni 2026</p></div>
  </div>
  <nav class="steps" id="steps" aria-label="Tahapan"></nav>
  <button class="iconbtn" id="themeBtn" aria-label="Ganti tema terang/gelap" title="Ganti tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
 </div>
</header>
<div class="rail" id="rail"></div>
<main><div class="wrap" id="main"></div></main>

  k.SU=COMP.su.reduce((a,c)=>{let v=PCT[c.id][k.i];if(v==null){v=.5;k.miss.push(c.n)}return a+(+S.w[c.id]||0)*v},0)/ws;

function eligible(k){

 if(k.od<S.minOd)return {ok:false,why:`ODHIV ditemukan ${k.od} < ${S.minOd}`};
 if(S.provMode==="same"&&!CONF_PROV.includes(k.p))return {ok:false,why:"Di luar provinsi kunjungan"};

 SLOTS.forEach(s=>{if(S.over[s.id]&&KID[S.over[s.id]])tmp[s.id]={k:KID[S.over[s.id]],manual:true}});

 const box=(j,l)=>{const s=sel[j];if(!s)return `<div class="pick"><span class="small" style="font-weight:700">${l}</span><div class="who">Tidak tersedia</div><div class="why">Tidak ada ${l.toLowerCase()} swasta terdaftar di data SIHA; cari alternatif saat koordinasi dengan Dinkes.</div></div>`;
  const f=F[s.f],c=FCAT.find(x=>x.id===s.cat);
  return `<div class="pick mx"><div class="h"><span class="small" style="font-weight:700">${l}</span>${s.auto?'<span class="tag">Usulan otomatis</span>':'<span class="tag pri">Dipilih</span>'}</div><div class="who">${esc(f.nm)}</div><div class="why">${c?"Dasar pemilihan: "+c.n:"Tidak masuk kriteria KAK; dipilih berdasarkan volume tes"} · ${fi(f.dt)} dites · ${fi(f.od)} ODHIV${f.pdp?" · "+fi(f.arv)+" on ARV":""}</div></div>`};
 return `<div class="view-h"><div><h2>Fasyankes kunjungan: ${esc(k.k)}</h2><p>Sesuai KAK, kunjungan ke 1 rumah sakit dan 1 klinik swasta yang dipilih berdasarkan kondisi implementasi PPCP. Usulan otomatis mengutamakan PDP rutin lapor, lalu calon PDP, lalu PDP yang belum lapor.</p></div>${S.fas[k.id]?`<button class="btn noprint" data-reset="fas">Kembalikan usulan otomatis</button>`:""}</div>
 <div class="grid g2">${box("R","Rumah sakit")}${box("K","Klinik")}</div>
 <div class="grid g4 fasgrid" style="margin-top:14px;align-items:start">${FCAT.map(c=>{const fs=k.fs.filter(c.f).sort(c.s);return `<div class="fcol"><h4><span class="tag ${c.tag}">${fs.length}</span>${c.n}</h4><p class="hint">${c.d}</p>${fs.length?fs.slice(0,6).map(f=>fasCard(f,c,sel)).join("")+(fs.length>6?`<p class="hint">+${fs.length-6} lainnya di tabel desk review</p>`:""):`<div class="empty-note">Tidak ada fasyankes pada kategori ini</div>`}</div>`}).join("")}</div>`;
}
/* ===== 5. Validation ===== */
function vVal(){
 const k=curK();if(!k)return "";
 const it=vItems(k),v=S.val[k.id]||{},root=S.root[k.id]||[],rtl=S.rtl[k.id]||{};
 const [d,n]=valProgress(k);const sel=getFas(k);
 const flagged=it.filter(x=>x.flag);let rootShown=false;
 const hint={"Tata kelola":it.find(x=>x.id==="sk").flag?"SK Tim PPCP belum tercatat":"","PKS/Kerja sama":it.find(x=>x.id==="pks").flag?"PKS belum tercatat":"","Sistem informasi HIV AIDS":(k.nT-k.nTL)+(k.nP-k.nPL)>0?`${(k.nT-k.nTL)+(k.nP-k.nPL)} layanan belum melapor`:"","Aktivasi dan pengembangan layanan":k.pot?`${k.pot} calon layanan PDP`:"","Rujukan/jejaring layanan":it.find(x=>x.id==="ln").flag?"ODHIV belum seluruhnya mulai ART":""};
 return `<div class="view-h"><div><h2>Validasi lapangan: ${esc(k.k)}</h2><p>Temuan desk review yang perlu dikonfirmasi saat FGD dengan Dinkes kab/kota dan kunjungan fasyankes. Setiap temuan dirujuk ke nomor pertanyaan di daftar tilik v5. Isian tersimpan di perangkat ini.</p></div>
  <div class="noprint" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="prog"><div class="meter"><i style="width:${d/n*100}%"></i></div>${d}/${n} divalidasi</div><button class="btn" data-print="1">Cetak</button></div></div>
 <div class="callout" style="margin-bottom:14px"><b>${flagged.length} temuan perlu pendalaman.</b> Fasyankes kunjungan: ${sel.R?esc(F[sel.R.f].nm):"RS belum ada"} dan ${sel.K?esc(F[sel.K.f].nm):"klinik belum ada"}. Kategori sasaran: <b>${esc(S.cat[k.id]||"belum ditetapkan")}</b> (usulan desk review: ${k.sug}).</div>
 <div class="grid" style="gap:10px">${it.map(x=>{const showRoot=x.root&&!rootShown;if(showRoot)rootShown=true;const s=(v[x.id]||{}).s||"",nt=(v[x.id]||{}).n||"";
  return `<div class="vitem ${s==="ok"?"s-ok":s==="diff"?"s-diff":""}"><div><div class="q">${x.flag?'<span class="dotk" style="background:var(--gap);margin-right:6px;vertical-align:middle"></span>':""}${esc(x.q)}</div><div class="refs">${x.refs.map(r=>`<span class="tag">${esc(r)}</span>`).join("")}</div></div>
  <div class="seg noprint" role="group" aria-label="Status validasi">${[["ok","Sesuai"],["diff","Berbeda"],["","Belum dicek"]].map(([val,l])=>`<button data-vs="${x.id}" data-v="${val}" aria-pressed="${s===val}">${l}</button>`).join("")}</div>
  <div class="d">${esc(x.d)}</div>
  ${showRoot?`<div class="chips" role="group" aria-label="Akar masalah pelaporan"><span class="small mut" style="align-self:center;margin-right:2px">Akar masalah pelaporan (pendalaman E):</span>${ROOT.map(r=>`<button class="chip" data-root="${esc(r)}" aria-pressed="${root.includes(r)}">${esc(r)}</button>`).join("")}</div>`:""}
  <textarea class="note" rows="1" data-vn="${x.id}" placeholder="Temuan lapangan, bukti/dokumen yang diperiksa">${esc(nt)}</textarea></div>`}).join("")}</div>
 <div class="card" style="margin-top:14px"><h3>Rencana tindak lanjut</h3><p class="sub">Tahapan PPCP sesuai daftar tilik. Petunjuk abu-abu berasal dari temuan desk review.</p>
  <div class="tbl-wrap"><table class="rtl"><thead><tr><th>Tahapan</th><th>Masalah/gap</th><th>Rencana tindak lanjut</th><th>Penanggung jawab</th><th>Waktu</th></tr></thead><tbody>
  ${RTL_ROWS.map((r,i)=>{const row=rtl[i]||["","","",""];return `<tr><td>${esc(r)}</td>${[0,1,2,3].map(c=>`<td style="min-width:${c<2?200:120}px"><input data-rtl="${i}" data-c="${c}" value="${esc(row[c])}" placeholder="${c===0&&hint[r]?esc(hint[r]):""}" aria-label="${esc(r)} kolom ${c+1}"></td>`).join("")}</tr>`}).join("")}
  </tbody></table></div></div>
 <div class="card noprint" style="margin-top:14px"><div class="card-h"><div><h3>Ringkasan untuk laporan</h3><p class="sub">Salin ke notulen atau laporan supervisi</p></div><button class="btn" data-copy="1">Salin teks</button></div><pre id="sumtxt" style="white-space:pre-wrap;font:inherit;font-size:12.5px;margin:0;color:var(--mut)">${esc(summaryText(k))}</pre></div>`;
}
function summaryText(k){
 const it=vItems(k),v=S.val[k.id]||{},root=S.root[k.id]||[],rtl=S.rtl[k.id]||{},sel=getFas(k);
 const st={ok:"Sesuai",diff:"Berbeda","":"Belum dicek"};
 let t=`Supervisi PPCP HIV 2026: ${k.k}, ${k.p}\nKategori sasaran: ${S.cat[k.id]||"-"} (usulan desk review: ${k.sug})\nFasyankes kunjungan: ${sel.R?F[sel.R.f].nm:"-"}; ${sel.K?F[sel.K.f].nm:"-"}\n\nTemuan desk review dan validasi:\n`;
 it.forEach((x,i)=>{const o=v[x.id]||{};t+=`${i+1}. ${x.q} [${st[o.s||""]}]${o.n?"\n   Catatan: "+o.n:""}\n`});
 if(root.length)t+=`\nAkar masalah pelaporan: ${root.join("; ")}\n`;
 const rr=RTL_ROWS.map((r,i)=>[r,rtl[i]]).filter(x=>x[1]&&x[1].some(Boolean));
 if(rr.length){t+="\nRencana tindak lanjut:\n";rr.forEach(([r,x])=>t+=`- ${r}: ${x[0]||"-"} → ${x[1]||"-"} (PJ: ${x[2]||"-"}, waktu: ${x[3]||"-"})\n`)}
 return t;
}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("button,[data-pt],[data-lok]");if(!t)return;
 const ds=t.dataset;
 if(ds.step!=null&&!ds.lok){S.step=+ds.step;render();window.scrollTo(0,0);return}
 if(ds.lok){S.lok=ds.lok;if(ds.go)S.step=1;render();if(ds.go)window.scrollTo(0,0);return}
 if(ds.pt){S.focus=ds.pt;$("#focus").innerHTML=focusCard();document.querySelectorAll(".pt.on").forEach(n=>n.classList.remove("on"));const g=document.querySelector(`.pt[data-pt="${CSS.escape(ds.pt)}"]`);if(g)g.classList.add("on");if(window.innerWidth<1100&&t.tagName!=="g")$("#focus").scrollIntoView({behavior:"smooth",block:"nearest"});return}
 if(ds.assign){Object.keys(S.over).forEach(s=>{if(S.over[s]===ds.k)delete S.over[s]});S.over[ds.assign]=ds.k;render();return}
 if(ds.unassign){delete S.over[ds.unassign];render();return}
 if(ds.reset==="sel"){S.over={};S.minOd=10;S.pbMin=60;S.provMode="all";S.oneProv=true;render();return}
 if(ds.reset==="w"){S.w={...DEFW};render();return}
 if(ds.reset==="fas"){delete S.fas[S.lok];render();return}
 if(ds.pm){S.provMode=ds.pm;render();return}
 if(ds.sort){S.sortBy=ds.sort;render();return}
 if(ds.showall){S.showAll=true;render();return}
 if(ds.facf){S.facF=ds.facf;render();return}
 if(ds.fas!=null&&ds.cat){const f=F[+ds.fas];const m=S.fas[S.lok]||{};m[f.j]={f:f.i,cat:ds.cat};S.fas[S.lok]=m;render();return}
 if(ds.vs){const m=S.val[S.lok]||{};m[ds.vs]={...(m[ds.vs]||{}),s:ds.v};S.val[S.lok]=m;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(ds.root){const a=S.root[S.lok]||[];const i=a.indexOf(ds.root);i<0?a.push(ds.root):a.splice(i,1);S.root[S.lok]=a;t.setAttribute("aria-pressed",i<0);save();refreshSum();return}
 if(ds.print){window.print();return}
 if(ds.copy){const txt=summaryText(curK());(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{t.textContent="Tersalin"},()=>{const r=document.createRange();r.selectNodeContents($("#sumtxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent="Teks dipilih, tekan salin"});setTimeout(()=>t.textContent="Salin teks",2200);return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-pt]:not(button)")){e.preventDefault();e.target.click()}});
function refreshSum(){const p=$("#sumtxt");if(p)p.textContent=summaryText(curK())}
document.addEventListener("input",e=>{
 const t=e.target,ds=t.dataset;
 if(ds.w){S.w[ds.w]=+t.value;t.nextElementSibling.textContent=t.value;clearTimeout(window._wt);window._wt=setTimeout(()=>{const o=document.querySelector("details.wts").open;render();document.querySelector("details.wts").open=o;const el=$("#w_"+ds.w);if(el)el.focus()},250);return}
 if(ds.pbmin){S.pbMin=+t.value;clearTimeout(window._pt);window._pt=setTimeout(()=>{render();const el=document.querySelector("[data-pbmin]");if(el)el.focus()},200);return}
 if(ds.minod){S.minOd=+t.value;clearTimeout(window._mt);window._mt=setTimeout(()=>{render();const el=document.querySelector("[data-minod]");if(el)el.focus()},200);return}
 if(ds.q!=null&&t.type==="search"){S.q=t.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{const pos=t.selectionStart;render();const el=document.querySelector("[data-q]");if(el){el.focus();el.setSelectionRange(pos,pos)}},250);return}
 if(ds.vn){const m=S.val[S.lok]||{};m[ds.vn]={...(m[ds.vn]||{}),n:t.value};S.val[S.lok]=m;save();refreshSum();return}
 if(ds.rtl!=null){const m=S.rtl[S.lok]||{};const r=m[ds.rtl]||["","","",""];r[+ds.c]=t.value;m[ds.rtl]=r;S.rtl[S.lok]=m;save();refreshSum();return}
});
document.addEventListener("change",e=>{
 const t=e.target,ds=t.dataset;
 if(ds.prov){S.prov=t.value;render();return}
 if(ds.oneprov){S.oneProv=t.checked;render();return}
 if(ds.cat&&t.tagName==="SELECT"){S.cat[ds.cat]=t.value;save();return}
});
$("#themeBtn").addEventListener("click",()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");S.theme=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",S.theme);save()});
render();
</script>
</body>
</html>
