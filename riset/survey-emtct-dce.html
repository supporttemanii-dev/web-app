<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Survei Penguatan Layanan Tripel Eliminasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16242A; --muted:#566A70; --line:#D3DDDF; --bg:#F3F6F6; --paper:#FFFFFF;
  --teal:#0F5361; --teal-2:#E2EEF0; --teal-3:#B9D6DB;
  --rose:#A8365F; --rose-2:#F7E7ED;
  --ok:#2E7653; --err:#B3261E; --err-2:#FBEAE8;
  --radius-s:8px; --radius-m:14px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16.5px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 20px 9px;display:flex;align-items:baseline;gap:12px}
.bar-sec{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-step{font-size:13.5px;color:var(--muted);white-space:nowrap}
.prog{height:4px;background:var(--teal-2)}
.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .35s ease}
.bar.hide{display:none}

main{max-width:720px;margin:0 auto;padding:24px 20px 120px}
h1{font-size:clamp(28px,6.2vw,40px);line-height:1.12;letter-spacing:-.02em;margin:8px 0 14px;font-weight:800}
h2{font-size:24px;line-height:1.25;letter-spacing:-.01em;margin:4px 0 6px;font-weight:800}
.lead{font-size:18px;color:var(--muted);margin:0 0 22px;max-width:60ch}
.page-intro{color:var(--muted);margin:0 0 22px;max-width:62ch}

/* welcome */
.welcome{padding-top:28px}
.org{font-weight:600;color:var(--teal);font-size:15px;margin-bottom:22px}
.facts{display:grid;gap:14px;margin:26px 0 30px;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.facts svg{width:40px;height:40px;padding:9px;border-radius:50%;background:var(--teal-2);color:var(--teal)}
.facts b{display:block}
.facts span{color:var(--muted);font-size:15px}

/* question */
.q{padding:20px 0 22px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q-label{font-weight:700;font-size:17.5px;line-height:1.4;margin:0 0 4px;display:block}
.q-hint{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.q-code{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px;white-space:nowrap}
.req{color:var(--rose);margin-left:2px}
.q.invalid .q-label{color:var(--err)}
.err{display:none;color:var(--err);background:var(--err-2);border-radius:var(--radius-s);padding:8px 12px;font-size:14.5px;margin-top:10px}
.q.invalid .err{display:block}
.info{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px 20px;margin:4px 0 8px}
.info p{margin:0 0 10px}.info p:last-child{margin:0}

/* options */
.opts{display:grid;gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:12px 14px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-s);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal-3)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{flex:none;width:20px;height:20px;border:2px solid #8FA3A8;border-radius:50%;display:grid;place-items:center;transition:border-color .15s}
.opt.cb .mk{border-radius:5px}
.opt .mk::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal);transform:scale(0);transition:transform .15s}
.opt.cb .mk::after{border-radius:2px}
.opt.on{border-color:var(--teal);background:var(--teal-2)}
.opt.on .mk{border-color:var(--teal)}
.opt.on .mk::after{transform:scale(1)}
.opt:has(input:focus-visible){outline:3px solid var(--rose);outline-offset:2px}
.other{margin-top:8px}
.txt,.sel,.area,.num{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-s);background:var(--paper)}
.area{min-height:120px;resize:vertical}
.txt:focus,.sel:focus,.area:focus,.num:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-2)}
.num{max-width:220px}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.inline-cb{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--muted);cursor:pointer}
.inline-cb input{width:20px;height:20px;accent-color:var(--teal)}

/* grid (likert) */
.scale-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;margin:0 0 6px}
.scale-key b{color:var(--ink);font-weight:700}
.row{padding:14px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row-t{margin:0 0 9px;font-weight:500}
.row.invalid .row-t{color:var(--err)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1 0 48px;min-height:46px;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--radius-s);font-weight:700;cursor:pointer;padding:6px 8px;transition:all .15s}
.chip.wide{flex:2 0 120px;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--teal-3)}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip-sel{font-size:13.5px;color:var(--teal);margin-top:6px;min-height:1.2em}

/* slider */
.sl{display:grid;grid-template-columns:1fr 56px;gap:14px;align-items:center}
.sl input[type=range]{width:100%;accent-color:var(--teal);height:32px}
.sl output{font-weight:800;font-size:20px;text-align:right;color:var(--muted)}
.sl.touched output{color:var(--teal)}
.sl-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:-2px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--paper);margin:6px 0 4px}
table.reg{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
.reg th,.reg td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.reg th{background:var(--teal-2);font-weight:700;color:var(--teal)}
.reg td.r{color:var(--rose);font-weight:800}
.reg tr:last-child td{border-bottom:0}
.reg th:last-child,.reg td:last-child{min-width:190px}
.reg th:nth-child(6),.reg td:nth-child(6){min-width:96px}

/* DCE */
.dce-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.dce-q{font-weight:700;font-size:17.5px;margin:6px 0 16px}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.pk-h{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-weight:800;font-size:17px;padding:12px 8px;border:2px solid var(--line);border-bottom:0;border-radius:var(--radius-m) var(--radius-m) 0 0;background:var(--paper);transition:all .18s}
.pk-l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.pk-c+.pk-c+.pk-c{border-top:1px solid var(--line)}
.pk-c{cursor:pointer;padding:10px 12px 11px;background:var(--paper);border-left:2px solid var(--line);border-right:2px solid var(--line);font-size:15px;line-height:1.35;transition:all .18s}
.pk-f{height:12px;border:2px solid var(--line);border-top:0;border-radius:0 0 var(--radius-m) var(--radius-m);background:var(--paper);transition:all .18s}
.pk[data-sel=A] .c-A,.pk[data-sel=B] .c-B{border-color:var(--rose);background:var(--rose-2)}
.pk[data-sel=A] .pk-h.c-A,.pk[data-sel=B] .pk-h.c-B{background:var(--rose);color:#fff}
.pk-c.diff{font-weight:600}
.pk[data-sel=A] .pk-c.c-A,.pk[data-sel=B] .pk-c.c-B{border-top-color:#E9C9D5}
.pk-c .wk{display:inline-block;font-weight:800}
.dce-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.dce-btn{min-height:54px;border-radius:var(--radius-s);border:2px solid var(--rose);background:var(--paper);color:var(--rose);font-weight:800;font-size:16px;cursor:pointer}
.dce-btn[aria-pressed=true]{background:var(--rose);color:#fff}
.dce-none{grid-column:1/-1;border-color:var(--line);color:var(--ink);font-weight:700}
.dce-none small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.dce-none[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.dce-none[aria-pressed=true] small{color:#DCE5E7}
.legend-t{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;margin:6px 0 10px}
.legend-t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.legend-t td:first-child{font-weight:700;width:34%;color:var(--teal)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:9;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0))}
.nav-in{max-width:720px;margin:0 auto;display:flex;gap:12px}
.btn{min-height:52px;padding:0 22px;border-radius:var(--radius-s);border:0;font-weight:800;font-size:16px;cursor:pointer}
.btn-p{flex:1;background:var(--teal);color:#fff}
.btn-p:hover{background:#0B4652}
.btn-s{background:var(--teal-2);color:var(--teal)}
.btn[disabled]{opacity:.55;cursor:wait}
.nav.hide{display:none}
.saved{max-width:720px;margin:6px auto 0;font-size:12.5px;color:var(--muted);text-align:center;min-height:1em}

/* end screens */
.end{padding-top:40px}
.end .mark{width:64px;height:64px;border-radius:50%;background:var(--teal-2);display:grid;place-items:center;color:var(--teal);margin-bottom:18px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:20px;margin-top:22px}
.box h3{margin:0 0 6px;font-size:18px}
.note{font-size:13.5px;color:var(--muted)}
.banner{background:var(--rose-2);color:var(--rose);border-radius:var(--radius-s);padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:18px}
.claim-code{font-size:26px;font-weight:800;letter-spacing:.12em;color:var(--teal);margin:12px 0 4px}
.code-in{font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.hak{margin:6px 0 10px;padding:10px 12px;border-radius:var(--radius-s);background:var(--teal-2);color:var(--teal);font-weight:600;font-size:15px}
.hak-p{background:#E4F2EA;color:var(--ok)}
.hak-u{background:var(--rose-2);color:var(--rose)}
.hak-t{background:var(--err-2);color:var(--err)}
.status-link{margin-top:22px;font-size:15px}
.faq p{font-size:14.5px;margin:0 0 10px}
.faq p:last-child{margin:0}
.code-hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.code-warn{font-size:13px;color:var(--err);margin:4px 0 0;min-height:0}
.code-warn:empty{display:none}
.reg.win{min-width:0}
.reg.win td.wcode{font-weight:800;letter-spacing:.06em;white-space:nowrap}
.reg.win tr.mine td{background:var(--rose-2)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
</style>
</head>

const SEC = {S0:"Persetujuan dan kelayakan",S1:"Tentang Anda dan fasilitas",S2:"Memilih paket dukungan",S3:"Pemanfaatan data",S4:"Sistem dan lingkungan kerja",S5:"Kesiapan dan penilaian paket"};
const SEC_ORDER = ["S0","S1","S2","S3","S4","S5"];

/* =========================================================
   STATE, PENYIMPANAN, UTILITAS
   ========================================================= */
const KEY = "qiemtct_state_" + CONFIG.VERSION, DONE = "qiemtct_done_" + CONFIG.VERSION, QUEUE = "qiemtct_queue";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "r" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let S = null;
function fresh(){ return {id:uid(), started:new Date().toISOString(), page:-1, A:{}, T:{}, block:null, order:null, optOrder:{}, enter:null, demo:!CONFIG.ENDPOINT}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); $("#saved").textContent = "Jawaban tersimpan otomatis di perangkat ini"; }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function announce(t){ $("#live").textContent = t; }

/* halaman aktif = PAGES + tugas DCE dinamis */
function flow(){
  const out = [];
  PAGES.forEach(p => {
    out.push(p);
    if (p.id === "P2p" && S.order) S.order.forEach((t, i) => out.push({id:"DCE"+(i+1), sec:"S2", title:"Pilihan "+(i+1)+" dari "+S.order.length, kind:"dce", n:i+1, task:t}));
  });
  return out;
}
function visible(p){
  if (p.kind) return true;
  return p.items.some(it => !it.show || it.show(S.A));
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const app = $("#app");
  if (S.page < 0) return renderWelcome();
  const pages = flow(), p = pages[S.page];
  $("#bar").classList.remove("hide"); $("#nav").classList.remove("hide");
  const si = SEC_ORDER.indexOf(p.sec);
  $("#barSec").textContent = SEC[p.sec];
  $("#barStep").textContent = "Bagian " + (si + 1) + " dari " + SEC_ORDER.length;
  $("#prog").style.width = Math.round((S.page) / (pages.length) * 100) + "%";
  $("#btnBack").style.visibility = S.page > 0 ? "visible" : "hidden";
  $("#btnNext").textContent = S.page === pages.length - 1 ? "Kirim jawaban" : "Lanjut";
  let h = (S.demo ? `<div class="banner">Mode uji: data tidak dikirim ke server. Pada akhir survei, jawaban diunduh sebagai file.</div>` : "");

function item(it, key){

  } else if (it.type === "textarea") {

function bind(root){
  root.querySelectorAll("input[data-q]").forEach(inp => {
    const id = inp.dataset.q;
    inp.addEventListener(inp.type === "radio" || inp.type === "checkbox" ? "change" : "input", () => {
      if (inp.type === "radio") { S.A[id] = inp.value; root.querySelectorAll(`input[name="${CSS.escape(id)}"]`).forEach(x => x.closest(".opt").classList.toggle("on", x.checked)); }
      else if (inp.type === "checkbox") {
        let cur = new Set(S.A[id] || []);
        if (inp.checked) { if (inp.hasAttribute("data-excl")) cur = new Set([inp.value]); else { root.querySelectorAll(`input[name="${CSS.escape(id)}"][data-excl]`).forEach(x => cur.delete(x.value)); cur.add(inp.value); } }
        else cur.delete(inp.value);
        S.A[id] = [...cur];
        root.querySelectorAll(`input[name="${CSS.escape(id)}"]`).forEach(x => { x.checked = cur.has(x.value); x.closest(".opt").classList.toggle("on", x.checked); });
      } else S.A[id] = inp.value.trim();
      const o = root.querySelector(`[data-other="${CSS.escape(id)}"]`);
      if (o) { const it = findItem(id), ov = it.options.find(x => x.other).v, on = [].concat(S.A[id] || []).includes(ov); o.hidden = !on; if (on && inp.value === ov) o.focus(); }
      clearErr(inp); save();
    });
  });
  root.querySelectorAll("[data-other]").forEach(o => o.addEventListener("input", () => { S.A[o.dataset.other + "_lain"] = o.value.trim(); save(); }));
  root.querySelectorAll("select[data-q], textarea[data-q]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => { S.A[el.dataset.q] = el.value.trim(); clearErr(el); save(); }));
  root.querySelectorAll("[data-dk]").forEach(cb => cb.addEventListener("change", () => { const n = root.querySelector(`input[data-q="${CSS.escape(cb.dataset.dk)}"]`); n.disabled = cb.checked; if (cb.checked) { n.value = ""; S.A[cb.dataset.dk] = "DK"; } else delete S.A[cb.dataset.dk]; clearErr(cb); save(); }));
  root.querySelectorAll("[data-chip]").forEach(ch => ch.addEventListener("click", () => {
    const rid = ch.dataset.chip; S.A[rid] = ch.dataset.v;
    ch.parentElement.querySelectorAll(".chip").forEach(x => { const on = x === ch; x.setAttribute("aria-pressed", on); x.setAttribute("aria-checked", on); });
    const cs = root.querySelector(`[data-cs="${CSS.escape(rid)}"]`); if (cs) cs.textContent = ch.getAttribute("aria-label");
    ch.closest(".row").classList.remove("invalid"); clearErr(ch); save();
  }));
  root.querySelectorAll("[data-sl]").forEach(sl => { const f = () => { S.A[sl.dataset.sl] = +sl.value; sl.nextElementSibling.textContent = sl.value; sl.parentElement.classList.add("touched"); sl.closest(".row").classList.remove("invalid"); clearErr(sl); save(); }; sl.addEventListener("input", f); sl.addEventListener("change", f); });
  root.querySelectorAll("[data-pick]").forEach(el => el.addEventListener("click", () => {
    const q = el.closest(".q"), qid = q.dataset.item, v = el.dataset.pick;
    S.A[qid] = v; q.querySelector(".pk").dataset.sel = v === "C" ? "" : v;
    q.querySelectorAll(".dce-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.pick === v));
    clearErr(el); save(); announce(v === "C" ? "Tetap seperti sekarang dipilih" : "Paket " + v + " dipilih");
  }));
}
function clearErr(el){ const q = el.closest(".q"); if (q && !q.querySelector(".row.invalid")) q.classList.remove("invalid"); }
function findItem(id){ for (const p of PAGES) for (const it of (p.items || [])) if (it.id === id) return it; return null; }

/* =========================================================
   VALIDASI DAN ALUR
   ========================================================= */
function validate(){
  const p = flow()[S.page]; let first = null;
  const fail = (q, msg) => { q.classList.add("invalid"); q.querySelector(".err").textContent = msg; if (!first) first = q; };
  document.querySelectorAll("#app .q").forEach(q => {
    q.classList.remove("invalid");
    const id = q.dataset.item;
    if (p.kind === "dce" || p.kind === "dcePractice") { if (!S.A[id]) fail(q, "Pilih salah satu: Paket A, Paket B, atau Tetap seperti sekarang."); return; }
    const it = findItem(id); if (!it) return;
    const v = S.A[it.id], req = it.req !== false;
    if (it.type === "grid" || it.type === "slider") {
      const miss = it.rows.filter(([rid]) => S.A[rid] == null || S.A[rid] === "");
      miss.forEach(([rid]) => q.querySelector(`[data-row="${CSS.escape(rid)}"]`)?.classList.add("invalid"));
      if (miss.length) fail(q, it.type === "slider" ? `Geser penilaian untuk ${miss.length} tugas yang belum dijawab.` : (it.single ? "Pilih salah satu jawaban." : `Masih ada ${miss.length} pernyataan yang belum dijawab.`));
      return;
    }
    const empty = v == null || v === "" || (Array.isArray(v) && !v.length);
    if (empty) { if (req) fail(q, "Pertanyaan ini wajib dijawab."); return; }
    if (it.type === "number" && v !== "DK") {
      const n = Number(v);
      if (!Number.isFinite(n) || n < it.min || n > it.max) return fail(q, `Masukkan angka antara ${it.min} dan ${it.max}.`);
      if (it.check) { const m = it.check(v, S.A); if (m) return fail(q, m); }
    }
    if (it.exactly && v.length !== it.exactly) return fail(q, `Pilih tepat ${it.exactly} jawaban.`);
    const oth = (it.options || []).find(o => o.other);
    if (oth && [].concat(v).includes(oth.v) && !S.A[it.id + "_lain"]) fail(q, "Sebutkan jawaban \"Lainnya\".");
  });
  if (first) { first.scrollIntoView({behavior:"smooth", block:"center"}); announce("Ada jawaban yang perlu dilengkapi."); return false; }
  return true;
}
function exitReason(){
  const A = S.A;
  if (A["M0.1"] === "0") return "decline";
  if (S.page >= 1 && flow()[S.page].id === "P0b") {
    if (A["M0.5"] === "1") return "duplicate";
    if (A["M0.2"] === "0" || A["M0.3"] === "0" || (+A["M0.4"] < 18)) return "ineligible";
  }
  return null;
}
async function next(){
  const pages = flow(), p = pages[S.page];
  if (!validate()) return;
  logTime(p);
  const ex = exitReason(); if (ex) return endScreen(ex);
  if (p.id === "P2a" && !S.block) await allocate();
  if (S.page === flow().length - 1) return submit();
  let n = S.page + 1; const fl = flow();
  while (n < fl.length && !visible(fl[n])) n++;
  S.page = n; save(); render();
}
function back(){
  let n = S.page - 1; const fl = flow();
  while (n > 0 && !visible(fl[n])) n--;
  S.page = Math.max(0, n); save(); render();
}
function logTime(p){ if (!S.enter) return; const s = Math.round((Date.now() - S.enter) / 1000); S.T[p.sec] = (S.T[p.sec] || 0) + s; S.T[p.id] = (S.T[p.id] || 0) + s; }

/* alokasi blok DCE: diminta ke server agar seimbang; cadangan acak */
async function allocate(){
  const btn = $("#btnNext"); btn.disabled = true;
  let blk = null, src = "random";
  if (CONFIG.ENDPOINT) {
    try { const r = await fetch(CONFIG.ENDPOINT + "?action=block&token=" + encodeURIComponent(CONFIG.TOKEN), {cache:"no-store"}); const j = await r.json(); if (["A","B","C"].includes(j.block)) { blk = j.block; src = "server"; } } catch(e) {}
  }
  if (!blk) blk = "ABC"[Math.floor(Math.random() * 3)];
  const bi = "ABC".indexOf(blk);
  const order = shuffle([0,1,2,3,4,5,6,7,8]); order.push(2); // tugas ke-10 = ulangan tugas desain ke-3
  S.block = String(bi); S.blockName = blk; S.blockSrc = src; S.order = order;
  btn.disabled = false; save();
}

function payload(){
  const A = S.A, o = {resp_id:S.id, version:CONFIG.VERSION, started:S.started, finished:new Date().toISOString()};
  o.duration_sec = Math.round((Date.parse(o.finished) - Date.parse(S.started)) / 1000);
  o.ua = navigator.userAgent.slice(0, 180); o.screen = screen.width + "x" + screen.height;
  o.dce_block = S.blockName; o.dce_block_src = S.blockSrc; o.dce_order = (S.order || []).map(x => x + 1).join(" ");
  Object.entries(A).forEach(([k, v]) => { o[k] = Array.isArray(v) ? v.join(";") : v; });
  /* tugas DCE: simpan juga tugas desain yang ditampilkan */
  (S.order || []).forEach((t, i) => { o["DCE_task" + (i + 1)] = t + 1; });
  o.dce_practice_ok = A.PRACT === "A" ? 1 : 0;

  o.vig_score = (A["M3.V1"] === "3") + ([].concat((A["M3.V2"]||[])).sort().join() === "B,D,H") + ([].concat((A["M3.V3"]||[])).sort().join() === "B,E") + (A["M3.V4"] === "2");
  Object.entries(S.T).forEach(([k, v]) => { o["t_" + k] = v; });

/* ---------- kode klaim (dibuat di perangkat, dikirim terpisah dari data jawaban) ---------- */
const CLAIM = "qiemtct_claim_" + CONFIG.VERSION;
function newCode(){
  const al = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ", r = new Uint8Array(8); crypto.getRandomValues(r);
  const c = [...r].map(x => al[x % al.length]).join(""); return c.slice(0, 4) + "-" + c.slice(4);
}
function claimState(){ try { return JSON.parse(localStorage.getItem(CLAIM)); } catch (e) { return null; } }
function setClaim(o){ localStorage.setItem(CLAIM, JSON.stringify(Object.assign(claimState() || {}, o))); }

async function post(obj){
  const body = JSON.stringify(Object.assign({token:CONFIG.TOKEN}, obj));
  try {
    const r = await fetch(CONFIG.ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
    return await r.json();
  } catch (e) {
    try { await fetch(CONFIG.ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body}); return {ok:true, unconfirmed:true}; }
    catch (e2) { return {ok:false, error:"network"}; }
  }
}
/* kode klaim dikirim di luar objek data, sehingga tidak tersimpan di sheet Jawaban.
   Server membalas jenis hak: PULSA (pulsa pasti), UNDIAN, atau TIDAK (tidak memenuhi syarat waktu). */
async function send(item){ return post({action:"submit", data:item.data, claim:item.claim}); }
function queue(){ try { return JSON.parse(localStorage.getItem(QUEUE) || "[]"); } catch (e) { return []; } }
async function flush(){
  if (!CONFIG.ENDPOINT) return; const q = queue(); if (!q.length) return;
  const left = [];
  for (const it of q) { const j = await send(it); if (j.ok) setClaim({sent:true, hak:j.hak || null}); else left.push(it); }
  localStorage.setItem(QUEUE, JSON.stringify(left));
  if (!left.length && S && S.page < 0) renderWelcome();
}
async function submit(){
  const btn = $("#btnNext"); btn.disabled = true; btn.textContent = "Mengirim…";
  const data = payload(), code = (claimState() || {}).code || newCode();
  setClaim({code, sent:false, claimed:false, hak:null});
  if (!CONFIG.ENDPOINT) { download(data); setClaim({sent:true, hak:"PULSA"}); return finish(true, "demo"); }
  const j = await send({data, claim:code});
  if (j.ok) { setClaim({sent:true, hak:j.hak || null}); return finish(true, j.unconfirmed ? "unconfirmed" : "ok"); }
  const q = queue(); q.push({data, claim:code}); localStorage.setItem(QUEUE, JSON.stringify(q));
  finish(false);
}
function download(d){
  const csvHead = Object.keys(d), csv = csvHead.join(",") + "\n" + csvHead.map(k => `"${String(d[k] ?? "").replace(/"/g, '""')}"`).join(",");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = "respons_" + d.resp_id.slice(0, 8) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- format kode klaim otomatis: huruf besar, buang karakter tidak sah, sisipkan "-" setelah 4 karakter ---------- */
const CODE_OK = /[2-9A-HJ-NP-Z]/;
function fmtCode(el){
  const val = el.value, caret = el.selectionStart ?? val.length;
  const up = val.toUpperCase().replace(/-/g, "");
  const raw = [...up].filter(ch => CODE_OK.test(ch)).join("").slice(0, 8);
  const before = [...val.slice(0, caret).toUpperCase().replace(/-/g, "")].filter(ch => CODE_OK.test(ch)).length;
  let out = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
  if (raw.length === 4 && /-$/.test(val)) out += "-";
  el.value = out;
  const pos = before > 4 ? Math.min(before + 1, out.length) : (before === 4 && out.length > 4 ? 5 : before);
  try { el.setSelectionRange(pos, pos); } catch (e) {}
  const warn = el.parentElement.querySelector(".code-warn");
  if (warn) warn.textContent = [...up].some(ch => /[A-Z0-9]/.test(ch) && !CODE_OK.test(ch)) ? "Huruf I, O dan angka 0, 1 tidak dipakai dalam kode, sehingga diabaikan. Periksa kembali kode Anda." : "";
}
document.addEventListener("input", e => { if (e.target.classList && e.target.classList.contains("code-in")) fmtCode(e.target); });
document.addEventListener("paste", e => { if (e.target.classList && e.target.classList.contains("code-in")) setTimeout(() => fmtCode(e.target), 0); });

function wrapLines(ctx, text, maxW){

  words.forEach(w => { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}

    if (CONFIG.ENDPOINT) {
      try { const r = await fetch(CONFIG.ENDPOINT + "?action=status&token=" + encodeURIComponent(CONFIG.TOKEN) + "&code=" + encodeURIComponent(code), {cache:"no-store"}); j = await r.json(); }
      catch (e) { j = {ok:false}; }
    } else { const cc = claimState() || {}; j = {ok:true, found:cc.code === code, hak:cc.hak, claimed:!!cc.claimed, status:cc.claimed ? "Belum dikirim" : "", drawn:false}; }  // mode uji
    b.disabled = false; b.textContent = "Cek status";
    if (!j.ok) { err.style.display = "block"; err.textContent = "Koneksi terputus. Periksa internet Anda, lalu coba lagi."; return; }
    const k = statusKey(j), m = STATUS_MSG[k], body = typeof m[1] === "function" ? m[1]() : m[1];
    let extra = "";
    if (k === "PULSA_sent" && j.tanggal) extra = `<p class="note">Tanggal kirim: ${esc(j.tanggal)}${j.telepon ? ` ke nomor ${esc(j.telepon)}` : ""}.</p>`;
    else if (j.telepon) extra = `<p class="note">Nomor tercatat: ${esc(j.telepon)}</p>`;
    $("#stOut").innerHTML = `<div class="box"><p class="hak hak-${m[2]}">${esc(m[0])}</p>${body ? `<p class="note">${esc(body)}</p>` : ""}${extra}<div id="stClaim"></div></div>`;
    if (/_unclaimed$/.test(k)) {
      setClaim({code, sent:true, hak:j.hak, claimed:false});
      $("#stClaim").innerHTML = claimBox(); bindClaim();
    }
  };
  $("#stBtn").onclick = go;
  if (c.code) go();
}
/* =========================================================
   HALAMAN PENGUMUMAN PEMENANG (#pemenang): hanya kode klaim tersamar, tanpa nomor telepon
   ========================================================= */
async function renderWinners(){
  $("#bar").classList.add("hide"); $("#nav").classList.add("hide");
  const mine = ((claimState() || {}).code) || "";
  $("#app").innerHTML = `<section class="welcome"><div class="org">Fakultas Kedokteran Universitas Udayana</div>
    <h1>Pengumuman pemenang undian</h1>
    <p class="lead">Undian ${esc(CONFIG.LOTTERY)} bagi responden survei penguatan layanan tripel eliminasi. Pemenang ditampilkan dengan kode klaim yang sebagian disamarkan; nomor telepon tidak ditampilkan.</p>
    <div id="wOut" aria-live="polite"><p class="note">Memuat pengumuman…</p></div>
    <p class="status-link"><a href="#status">Cek status Anda dengan kode klaim</a> · <a href="#">Kembali ke halaman survei</a></p></section>`;
  let j;
  if (CONFIG.ENDPOINT) {
    try { const r = await fetch(CONFIG.ENDPOINT + "?action=winners&token=" + encodeURIComponent(CONFIG.TOKEN), {cache:"no-store"}); j = await r.json(); }
    catch (e) { j = {ok:false}; }
  } else j = {ok:true, drawn:false};   // mode uji
  const out = $("#wOut");
  if (!j.ok) { out.innerHTML = `<div class="box"><p class="hak hak-t">Pengumuman belum dapat dimuat</p><p class="note">Periksa koneksi internet Anda, lalu muat ulang halaman ini.</p></div>`; return; }
  if (!j.drawn) { out.innerHTML = `<div class="box"><p class="hak hak-u">Undian belum dilaksanakan</p><p class="note">Pengundian dijadwalkan pada ${esc(CONFIG.DRAW_DATE)}. Pengumuman akan tampil di halaman ini setelah pengundian.</p></div>`; return; }
  const isMine = c => mine && c.replace(/•/g, "") && mine.slice(0, 4) === c.slice(0, 4) && mine.slice(-2) === c.slice(-2);
  const rows = j.winners.map((w, i) => `<tr${isMine(w.kode) ? ' class="mine"' : ""}><td>${i + 1}</td><td class="wcode">${esc(w.kode)}</td><td>${w.pengganti ? "Pengganti" : "Utama"}</td><td>${/terkirim/i.test(w.status) ? "Terkirim" : "Dalam proses"}</td></tr>`).join("");
  out.innerHTML = `<div class="box"><h3>Hasil pengundian</h3>
      <p class="note">Dilaksanakan ${esc(j.tanggal || CONFIG.DRAW_DATE)} dari ${j.peserta} peserta undian. Angka acak awal (seed): <b>${esc(j.seed || "-")}</b>. Hasil dapat diperiksa ulang karena pengundian dengan seed yang sama selalu menghasilkan urutan yang sama.</p></div>
    <div class="tbl-wrap"><table class="reg win"><thead><tr><th>No.</th><th>Kode klaim</th><th>Keterangan</th><th>Hadiah</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note" style="margin-top:10px">${mine ? (j.winners.some(w => isMine(w.kode)) ? "Baris yang disorot cocok dengan kode di perangkat ini. Pastikan dengan membuka halaman cek status." : "Kode di perangkat ini tidak termasuk daftar pemenang. Terima kasih atas partisipasi Anda.") : "Untuk memastikan hasil Anda, buka halaman cek status dan masukkan kode klaim lengkap."} Pemenang yang tidak dapat dihubungi dalam 7 hari digantikan oleh peserta cadangan sesuai urutan undian.</p>`;
}
function routeHash(){
  if (location.hash === "#status") renderStatus();
  else if (location.hash === "#pemenang") renderWinners();
  else { S = fresh(); render(); }
}
window.addEventListener("hashchange", routeHash);

S = fresh();
if (location.hash === "#status") renderStatus(); else if (location.hash === "#pemenang") renderWinners(); else render();
flush();
</script>
