<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kesiapan Keberlanjutan CBC · Dashboard Self-Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F1E8; --paper2:#ECE6D8; --paper3:#FBF9F4; --ink:#1C1F23; --ink2:#575B61; --ink3:#83878C; --rule:#D9D1C0; --onink:#F5F1E8;
  --hi:#A8691A; --hibg:#F5E7CF; --ok:#2C7A57; --okbg:#DFEFE5; --bad:#A9442A; --badbg:#F6E0D8;
  --t1:#A9442A; --t2:#D69A45; --t3:#5E9F94; --t4:#1F665C; --tt:#A7A49B; --mid:#CFC8B8;
  --all:#6B6F75; --sel:#1F665C;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Literata",Georgia,serif;
  --bar:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181B; --paper2:#202328; --paper3:#1B1E22; --ink:#ECE7DC; --ink2:#B4B0A6; --ink3:#868379; --rule:#34373D; --onink:#16181B;
  --hi:#E0A752; --hibg:#3A2E1B; --ok:#62BE8F; --okbg:#18322A; --bad:#E3826A; --badbg:#3A221C;
  --t1:#D9735A; --t2:#E2B062; --t3:#74BDB1; --t4:#3F978A; --tt:#7C7A73; --mid:#45484E; --all:#9C9FA5; --sel:#74BDB1;
}}
:root[data-theme="dark"]{
  --paper:#16181B; --paper2:#202328; --paper3:#1B1E22; --ink:#ECE7DC; --ink2:#B4B0A6; --ink3:#868379; --rule:#34373D; --onink:#16181B;
  --hi:#E0A752; --hibg:#3A2E1B; --ok:#62BE8F; --okbg:#18322A; --bad:#E3826A; --badbg:#3A221C;
  --t1:#D9735A; --t2:#E2B062; --t3:#74BDB1; --t4:#3F978A; --tt:#7C7A73; --mid:#45484E; --all:#9C9FA5; --sel:#74BDB1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

/* ---------- deck ---------- */
.deck{position:fixed;inset:0 0 var(--bar) 0}
.slide{position:absolute;inset:0;padding:34px clamp(18px,4vw,64px) 22px;display:none;flex-direction:column;overflow:auto}
.slide.on{display:flex;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chap{font-family:var(--sans);font-stretch:112%;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hi);display:flex;align-items:center;gap:10px}
.chap::before{content:"";width:26px;height:2px;background:var(--hi)}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(22px,2.5vw,34px);line-height:1.18;letter-spacing:-.01em;margin:.35em 0 .2em;max-width:30em;text-wrap:balance}
h2 .n{color:var(--hi)}
.dek{font-family:var(--serif);font-size:clamp(14.5px,1.15vw,17px);color:var(--ink2);max-width:62em;margin:0 0 14px;line-height:1.5}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(260px,.85fr);gap:clamp(18px,2.4vw,40px);min-height:0}
.body.one{grid-template-columns:1fr}
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.side{min-width:0;border-left:1px solid var(--rule);padding-left:clamp(16px,2vw,28px);font-size:14.5px;line-height:1.5;color:var(--ink2)}
.side h4{font-family:var(--sans);font-stretch:110%;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.side p{margin:0 0 10px}
.side b{color:var(--ink)}
.figcap{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tg{font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:3px;white-space:nowrap;color:#fff}
.tg.t1{background:var(--t1)}.tg.t2{background:var(--t2);color:#2a1d07}.tg.t3{background:var(--t3);color:#06231e}.tg.t4{background:var(--t4)}.tg.t0{background:var(--paper2);color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;font-size:13px}
.seg button{border:0;background:transparent;padding:5px 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.muted{color:var(--ink3)}

/* ---------- cover ---------- */
.cover{justify-content:center;justify-content:safe center}
.cover .kick{font-stretch:115%;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--hi)}
.cover h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,5.2vw,72px);line-height:1.02;letter-spacing:-.02em;margin:.25em 0 .25em;max-width:14em}
.cover h1 i{font-weight:400;color:var(--hi)}
.cover .sub{font-family:var(--serif);font-size:clamp(16px,1.4vw,20px);color:var(--ink2);max-width:46em;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:clamp(20px,3vh,40px);border-top:2px solid var(--ink)}
.kpi{padding:14px 16px 4px 0;border-right:1px solid var(--rule);margin-right:16px}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--serif);font-size:clamp(28px,3.4vw,50px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:.45em;color:var(--ink3);font-weight:500;margin-left:2px}
.kpi .l{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.35}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.cl{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 5px;font-size:12.5px;background:var(--paper3);cursor:pointer}
.cl:hover{border-color:var(--ink2)}
.cl i{font-style:normal;font-weight:800;font-size:11px;background:var(--ink);color:var(--onink);border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.cl.zero i{background:var(--paper2);color:var(--ink3)}
.byline{margin-top:24px;font-size:13px;color:var(--ink3)}

/* ---------- progress ---------- */
.prow{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,1.6fr) 120px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.prow .nm b{display:block;line-height:1.25}
.prow .nm small{color:var(--ink3);font-size:12px}
.ptrack{position:relative;height:22px;display:flex;gap:4px}
.pslot{flex:1;border-radius:4px;border:1.5px dashed var(--rule);display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.pslot.f{border:0;background:var(--ink)}
.pslot.f.extra{background:var(--ink2)}
.roles{display:flex;gap:5px;flex-wrap:wrap}
.role{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--paper2);color:var(--ink3)}
.role.on{background:var(--okbg);color:var(--ok)}
.st{font-size:12px;font-weight:700}
.st.ok{color:var(--ok)}.st.mid{color:var(--hi)}.st.no{color:var(--bad)}
.days{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px;border-bottom:1px solid var(--ink)}
.days div{flex:1;background:var(--ink);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.days div.fut{background:transparent;border:1px dashed var(--rule);border-bottom:0}
.days div.dl{background:var(--hi)}
.dlab{display:flex;gap:3px;font-size:10px;color:var(--ink3);margin-top:3px}
.dlab span{flex:1;text-align:center}
.big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;color:var(--ink)}

/* ---------- bars (html) ---------- */
.hb{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 130px;gap:12px;align-items:center;padding:5px 0;cursor:pointer;border-radius:6px}
.hb:hover .hb-t,.hb.sel .hb-t{background:var(--paper2)}
.hb.sel .hb-l{font-weight:700}
.hb-l{font-size:14px;line-height:1.25}
.hb-l b{display:inline-block;width:20px;color:var(--hi)}
.hb-t{position:relative;height:26px;border-radius:4px}
.hb-b{position:absolute;left:0;top:4px;bottom:4px;border-radius:0 4px 4px 0;transition:width .5s ease}
.hb-m{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.8}
.hb-v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.axis{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 130px;gap:12px;font-size:11px;color:var(--ink3)}
.axis .sc{position:relative;height:16px}
.axis .sc span{position:absolute;transform:translateX(-50%)}
.bands{position:absolute;inset:0;display:flex;pointer-events:none}
.bands i{border-right:1px dotted var(--rule)}
.thr{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px dashed var(--hi);pointer-events:none}
.tierhead{display:flex;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tierhead span{text-align:center;padding:3px 0;border-bottom:3px solid}

/* stacked item bars */
.ib{display:grid;grid-template-columns:44px minmax(140px,1.2fr) minmax(0,2fr) 52px;gap:10px;align-items:center;padding:3px 0;font-size:13px;border-bottom:1px solid color-mix(in srgb,var(--rule) 55%,transparent)}
.ib .c{font-weight:800;color:var(--hi);font-size:12px}
.ib .t{line-height:1.25;color:var(--ink)}
.stk{display:flex;height:16px;gap:2px}
.stk i{display:block;height:100%;border-radius:2px;position:relative}
.stk i span{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.ib .m{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow:auto;min-height:0;flex:1;padding-right:6px}

/* heatmap */
table.hm{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px;table-layout:fixed}
.hm th{font-weight:700;font-size:11.5px;color:var(--ink2);padding:4px 2px;text-align:center;line-height:1.15}
.hm th.l{text-align:left;width:30%}
.hm td{text-align:center;padding:9px 2px;border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;transition:transform .12s}
.hm td:hover{transform:scale(1.06)}
.hm td.l{text-align:left;font-weight:600;background:none;cursor:default;line-height:1.2;padding-left:0}
.hm td.l small{display:block;color:var(--ink3);font-weight:500;font-size:11.5px}
.hm td.na{background:repeating-linear-gradient(135deg,var(--paper2) 0 5px,transparent 5px 9px);color:var(--ink3);font-weight:500;font-size:11px}
.hm td.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.hm .sp{width:10px}
.hm th.k{border-bottom:2px solid var(--ink)}

/* scatter & radar */
svg text{font-family:var(--sans)}
.chartbox{flex:1;min-height:280px;position:relative}
.chartbox svg{width:100%;height:100%;display:block}

/* check matrix */
.ck{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:14px}
.ck.y{background:var(--okbg);color:var(--ok)}.ck.p{background:var(--hibg);color:var(--hi)}.ck.n{background:var(--badbg);color:var(--bad)}.ck.u{background:var(--paper2);color:var(--ink3)}
table.mx{border-collapse:collapse;width:100%;font-size:13.5px}
.mx th{font-size:11.5px;font-weight:700;text-align:center;padding:6px 4px;border-bottom:2px solid var(--ink);line-height:1.2;color:var(--ink2)}
.mx th.l,.mx td.l{text-align:left}
.mx td{padding:7px 4px;border-bottom:1px solid var(--rule);text-align:center}
.mx td.l small{display:block;color:var(--ink3);font-size:11.5px}
.mx td.sum{font-weight:800;font-variant-numeric:tabular-nums}

/* quotes */
.qgrid{columns:3 280px;column-gap:16px}
.q{break-inside:avoid;margin:0 0 14px;padding:14px 16px;border-left:3px solid var(--hi);background:var(--paper3);font-family:var(--serif);font-size:15px;line-height:1.5}
.q footer{font-family:var(--sans);font-size:11.5px;color:var(--ink3);margin-top:8px;letter-spacing:.03em}
.search{border:1px solid var(--rule);background:var(--paper3);border-radius:999px;padding:5px 12px;font-size:13px;min-width:200px}

/* clinic profile */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--rule);background:var(--paper3);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.pf{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;flex:1;min-height:0}
.tierbig{display:flex;gap:18px;margin:4px 0 14px;flex-wrap:wrap}
.tierbig div{border-top:3px solid var(--ink);padding-top:8px;min-width:130px}
.tierbig .v{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1}
.tierbig .l{font-size:12px;color:var(--ink2);margin:3px 0 4px}
ul.list{margin:0 0 12px;padding:0;list-style:none}
ul.list li{padding:5px 0;border-bottom:1px solid var(--rule);font-size:13.5px;display:grid;grid-template-columns:36px 1fr 40px;gap:8px}
ul.list li b{color:var(--hi)}
ul.list li span:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* method */
.cols{columns:2 340px;column-gap:40px;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink2)}
.cols p{margin:0 0 12px;break-inside:avoid}
.cols b{color:var(--ink);font-family:var(--sans)}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);border-top:1px solid var(--ink);background:var(--paper);display:flex;align-items:center;gap:14px;padding:0 clamp(12px,2vw,24px);font-size:13px;z-index:20}
.bar .ident{font-stretch:110%;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .ident span{font-weight:500;color:var(--ink3)}
.bar .grow{flex:1;min-width:0}
.bar select{border:1px solid var(--ink);border-radius:999px;padding:5px 10px;background:var(--paper);font-size:13px;max-width:220px;cursor:pointer}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);white-space:nowrap;background:none;border:0;padding:4px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live.demo i{background:var(--hi);animation:none}
.live.err i{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.nav{display:flex;align-items:center;gap:4px}
.nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.nav button:hover{background:var(--ink);color:var(--onink)}
.cnt{font-variant-numeric:tabular-nums;min-width:52px;text-align:center;font-weight:700}
.ibtn{border:0;background:none;padding:6px;border-radius:6px;color:var(--ink2);display:grid;place-items:center}
.ibtn:hover{background:var(--paper2);color:var(--ink)}
.progress{position:fixed;left:0;bottom:var(--bar);height:3px;background:var(--hi);transition:width .35s;z-index:21}
.demoTag{position:fixed;top:14px;right:18px;z-index:15;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--hi);border:1px solid var(--hi);background:var(--hibg);padding:3px 9px;border-radius:3px}

/* toc & settings */
.ovl{position:fixed;inset:0 0 var(--bar) 0;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(6px);z-index:30;display:none;overflow:auto;padding:40px clamp(18px,5vw,80px)}
.ovl.on{display:block}
.toc{columns:3 260px;column-gap:40px}
.toc h5{font-stretch:112%;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hi);margin:0 0 6px;break-after:avoid}
.toc .grp{break-inside:avoid;margin-bottom:22px}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 0;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:16px}
.toc button:hover{color:var(--hi)}
.toc button i{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--ink3);margin-right:8px;font-variant-numeric:tabular-nums}
.form{max-width:560px}
.form label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.form input{width:100%;border:1px solid var(--ink);background:var(--paper3);padding:9px 12px;border-radius:6px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--onink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13.5px;margin-top:16px;margin-right:8px}
.btn.o{background:transparent;color:var(--ink)}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--onink);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:5px;max-width:300px;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#tip b{color:var(--onink)}
.empty{border:1.5px dashed var(--rule);border-radius:8px;padding:30px;text-align:center;color:var(--ink3);font-family:var(--serif);font-size:16px}

@media (max-width: 900px){
  .body,.pf{grid-template-columns:1fr}
  .side{border-left:0;border-top:1px solid var(--rule);padding:14px 0 0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{margin-right:0;padding-right:10px;border-right:0;border-bottom:1px solid var(--rule)}
  .prow{grid-template-columns:1fr;gap:6px}
  .hb,.axis{grid-template-columns:96px minmax(0,1fr) 92px;gap:8px}
  .hb-v .tg{display:none}
  .ib{grid-template-columns:34px minmax(0,1fr) 44px;}
  .ib .stk{grid-column:1 / -1;grid-row:2}
  .bar .ident,.bar .lbl{display:none}
  .slide{padding:34px 14px 24px}
  .cover{justify-content:flex-start}
  .body,.pf{display:block}
  .main{display:block}
  .scroll{overflow:visible;flex:none;padding-right:0}
  .xs{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
  .xs table{min-width:600px}
  .chartbox{min-height:0;height:auto}
  .chartbox svg{height:auto}
  .demoTag{top:8px;right:10px;font-size:10px;padding:2px 7px}
  .hm{font-size:11.5px}
  .hm th{font-size:10px}
}
@media (max-width: 560px){
  .bar{gap:4px;padding:0 8px}
  .tierhead{visibility:hidden}
  #themeBtn{display:none}
  .nav button{width:30px;height:30px}
  .cnt{min-width:40px}
  .bar select{max-width:120px}
  .live span{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{body{overflow:visible}.deck{position:static}.slide{display:flex!important;position:relative;page-break-after:always;height:100vh}.bar,.progress{display:none}}

/* partners & language */
.partners{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.partners .pl{font-stretch:112%;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.partners .pn{font-family:var(--serif);font-weight:600;font-size:clamp(15px,1.3vw,19px);color:var(--ink)}
.partners .px{color:var(--hi);font-weight:700}
.cover .partners{max-width:46em}
.closing{margin-top:22px;padding-top:16px;border-top:2px solid var(--ink);max-width:62em}
.closing p{font-family:var(--serif);color:var(--ink2);font-size:15px;line-height:1.5;margin:12px 0 0}

function normalize(d){
  const short = Object.fromEntries(CLINICS0.map(c => [c.kode, c.short]));
  const clinics = (d.clinics && d.clinics.length ? d.clinics : CLINICS0).map(c => ({...c, short: c.short || short[c.kode] || String(c.nama).replace(/^Klinik (Utama|Pratama)\s*/,'').slice(0,26), target: +c.target || 3}));
  const rows = (d.rows || []).filter(r => r.KodeKlinik).map(r => {
    const o = {...r};
    [...ITEMS.map(i => i[0]), ...TRAIN_.map(t => t[0])].forEach(k => { o[k] = String(o[k] ?? '').trim().toUpperCase(); });
    return o;
  });
  return {clinics, rows};
}

/* ============================ Skoring ============================ */
const num = v => (v === '1' || v === '2' || v === '3' || v === '4') ? +v : null;
function respDom(r, d){
  const its = ITEMS.filter(i => i[0][0] === d).map(i => r[i[0]]);
  const tt = its.filter(v => v === 'TT').length;
  if (tt > its.length / 2) return null;
  return mean(its.map(num));
}
function clinicStats(kode){
  const rs = RAW.rows.filter(r => r.KodeKlinik === kode);
  const dom = {}; DKEYS.forEach(d => dom[d] = mean(rs.map(r => respDom(r, d))));
  const inst = mean(INST.map(d => dom[d]));
  return {kode, n: rs.length, rows: rs, dom, inst, fin: dom.C};
}
function stats(){
  const cl = RAW.clinics.map(c => ({...c, ...clinicStats(c.kode)}));
  const have = cl.filter(c => c.n);
  const dom = {}; DKEYS.forEach(d => dom[d] = mean(have.map(c => c.dom[d])));
  return {cl, have, dom, inst: mean(have.map(c => c.inst)), fin: mean(have.map(c => c.fin))};
}
function scope(){ return FIL === 'ALL' ? RAW.rows : RAW.rows.filter(r => r.KodeKlinik === FIL); }
function scopeName(){ if (FIL === 'ALL') return L('semua klinik','all clinics'); const c = RAW.clinics.find(x => x.kode === FIL); return c ? c.short : FIL; }
function itemDist(rows, it){
  const d = {'1':0,'2':0,'3':0,'4':0,'TT':0}; rows.forEach(r => { if (d[r[it]] !== undefined) d[r[it]]++; });
  const n = rows.filter(r => d[r[it]] !== undefined).length;
  const byC = {}; rows.forEach(r => { const v = num(r[it]); if (v !== null) (byC[r.KodeKlinik] = byC[r.KodeKlinik] || []).push(v); });
  const m = mean(Object.values(byC).map(mean));
  return {d, n, m};
}

const bandsHTML = () => `<div class="bands">${[1.75,2.5,3.25,4].map((b,i,a) => `<i style="width:${(b - (i ? a[i-1] : 1))/3*100}%"></i>`).join('')}</div>`;
const axisHTML = () => [1,1.75,2.5,3.25,4].map(v => `<span style="left:${pos(v)}%">${f2(v).replace(/[.,]00$/,'')}</span>`).join('');
let domSel = null;
INIT.domain = () => {
  const rows = scope();
  const vals = {}; DKEYS.forEach(d => vals[d] = FIL === 'ALL' ? ST.dom[d] : ST.cl.find(c => c.kode === FIL).dom[d]);
  const valid = DKEYS.filter(d => vals[d] !== null && d !== 'I');
  const lo = valid.slice().sort((a,b) => vals[a] - vals[b]), hi = lo.slice().reverse();
  $('#hDom').innerHTML = valid.length ? L(`Di ${esc(scopeName())}, <span class="n">${DOM[lo[0]].toLowerCase()}</span> paling tertinggal (${f2(vals[lo[0]])}), sementara ${DOM[hi[0]].toLowerCase()} paling kuat (${f2(vals[hi[0]])})`,
    `Across ${esc(scopeName())}, <span class="n">${DOM[lo[0]].toLowerCase()}</span> lags furthest behind (${f2(vals[lo[0]])}), while ${DOM[hi[0]].toLowerCase()} is strongest (${f2(vals[hi[0]])})`) : L('Belum ada skor domain pada filter ini','No domain scores in this filter yet');
  $('#tierHead').innerHTML = [[1,1.75,1],[1.75,2.5,2],[2.5,3.25,3],[3.25,4,4]].map(([a,b,k]) => `<span style="width:${(b-a)/3*100}%;border-color:var(--t${k});color:var(--t${k})">${TIERS[k]}</span>`).join('');
  $('#domAxis').innerHTML = axisHTML();
  $('#domLegend').innerHTML = tierLegend() + (FIL === 'ALL' ? '' : `<span><i class="sw" style="background:var(--ink);width:3px"></i>${L('Rerata semua klinik','All-clinic mean')}</span>`);
  $('#domBars').innerHTML = DKEYS.map(d => {
    const v = vals[d];
    return `<div class="hb ${domSel === d ? 'sel' : ''}" data-d="${d}" data-tip="<b>${d}. ${esc(DOMFULL[d])}</b><br>${L('Skor','Score')} ${f2(v)} · ${tierName(v)}${FIL !== 'ALL' ? '<br>' + L('Rerata semua klinik ','All-clinic mean ') + f2(ST.dom[d]) : ''}${d === 'I' ? '<br><i>' + L('Guardrail K5, di luar tipologi','K5 guardrail, outside the typology') + '</i>' : ''}">
      <div class="hb-l"><b>${d}</b>${DOM[d]}</div>
      <div class="hb-t">${bandsHTML()}
        ${v !== null ? `<div class="hb-b" style="width:${pos(v)}%;background:${tcol(v)}"></div>` : ''}
        <div class="thr" style="left:${pos(2.5)}%"></div>
        ${FIL !== 'ALL' && ST.dom[d] !== null ? `<div class="hb-m" style="left:${pos(ST.dom[d])}%"></div>` : ''}</div>
      <div class="hb-v">${f2(v)} ${tierTag(v)}</div></div>`;
  }).join('');
  document.querySelectorAll('#domBars .hb').forEach(el => el.onclick = () => { domSel = el.dataset.d; INIT.domain(); });
  const d = domSel || lo[0] || 'A';
  const its = ITEMS.filter(i => i[0][0] === d).map(i => ({code:i[0], label:ilab(i[0]), ...itemDist(rows, i[0])}));
  $('#domSide').innerHTML = `<h4>${d}. ${esc(DOMFULL[d])}</h4><p>${L('Skor','Score')} ${esc(scopeName())}: <b>${f2(vals[d])}</b> ${tierTag(vals[d])}</p>
    ${its.map(i => `<div style="padding:7px 0;border-bottom:1px solid var(--rule)"><div style="display:flex;justify-content:space-between;gap:8px"><span><b style="color:var(--hi)">${i.code}</b> ${esc(i.label)}</span><b>${f2(i.m)}</b></div>
      <div style="height:6px;background:var(--paper2);border-radius:3px;margin-top:5px"><div style="height:100%;width:${i.m ? pos(i.m) : 0}%;background:${tcol(i.m)};border-radius:3px"></div></div>${i.d.TT ? `<small class="muted">${i.d.TT} ${L('jawaban “tidak tahu”','“don’t know” answers')}</small>` : ''}</div>`).join('')}
    <p class="figcap">${domSel ? '' : L('Domain terlemah ditampilkan otomatis. ','The weakest domain is shown by default. ')}${L('Klik domain lain di grafik untuk berpindah.','Click another domain in the chart to switch.')}</p>`;
};

let heatSel = null;
INIT.heat = () => {
  const cols = [...DKEYS, 'sp', 'KEL', 'FIN'];
  const have = ST.have;
  const low = have.filter(c => c.inst !== null).sort((a,b) => a.inst - b.inst);
  const under = DKEYS.filter(d => d !== 'I').map(d => [d, have.filter(c => c.dom[d] !== null && c.dom[d] < 2.5).length]).sort((a,b) => b[1] - a[1])[0];
  $('#hHeat').innerHTML = low.length === 1 ? L(`Baru satu klinik terskor: ${esc(low[0].short)} dengan kesiapan kelembagaan <span class="n">${f2(low[0].inst)}</span> dan finansial ${f2(low[0].fin)}`, `Only one clinic scored so far: ${esc(low[0].short)}, with institutional readiness <span class="n">${f2(low[0].inst)}</span> and financial ${f2(low[0].fin)}`)
    : low.length ? L(`Kesiapan kelembagaan berkisar dari <span class="n">${f2(low[0].inst)}</span> (${esc(low[0].short)}) hingga ${f2(low[low.length-1].inst)} (${esc(low[low.length-1].short)}); domain ${DOM[under[0]].toLowerCase()} paling sering di bawah ambang (${under[1]} klinik)`,
      `Institutional readiness ranges from <span class="n">${f2(low[0].inst)}</span> (${esc(low[0].short)}) to ${f2(low[low.length-1].inst)} (${esc(low[low.length-1].short)}); ${DOM[under[0]].toLowerCase()} falls below the threshold most often (${under[1]} clinics)`) : L('Belum ada data klinik','No clinic data yet');
  const KL = {KEL:L('Kel.','Inst.'), FIN:'Fin.'};
  const lab = k => k === 'KEL' ? L('Kesiapan kelembagaan','Institutional readiness') : k === 'FIN' ? L('Kesiapan finansial','Financial readiness') : k + '. ' + DOMFULL[k];
  const cell = (c, k) => {
    if (k === 'sp') return '<td class="sp" style="cursor:default;background:none"></td>';
    const v = k === 'KEL' ? c.inst : k === 'FIN' ? c.fin : c.dom[k];
    if (v === null) return `<td class="na" data-c="${c.kode}" data-k="${k}" data-tip="<b>${esc(c.short)}</b><br>${esc(lab(k))}<br>${c.n ? L('Data tidak cukup','Insufficient data') : L('Belum ada respons','No responses yet')}">${c.n ? L('DTC','ID') : '·'}</td>`;
    const k4 = tierK(v);
    return `<td class="${heatSel && heatSel[0] === c.kode && heatSel[1] === k ? 'sel' : ''}" data-c="${c.kode}" data-k="${k}" style="background:var(--t${k4});color:${k4 === 2 || k4 === 3 ? '#1C1F23' : '#fff'}" data-tip="<b>${esc(c.short)}</b><br>${esc(lab(k))}: ${f2(v)} · ${tierName(v)}<br>${c.n} ${L('responden','respondents')}">${f2(v)}</td>`;
  };
  $('#heat').innerHTML = `<thead><tr><th class="l">${L('Klinik','Clinic')}</th>${cols.map(k => k === 'sp' ? '<th class="sp"></th>' : `<th class="${k.length > 1 ? 'k' : ''}">${k.length > 1 ? KL[k] : k + '<br><span style="font-weight:500;color:var(--ink3)">' + DABBR[k] + '</span>'}</th>`).join('')}</tr></thead>
    <tbody>${ST.cl.map(c => `<tr><td class="l">${esc(c.short)}<small>${c.kode} · n=${c.n}</small></td>${cols.map(k => cell(c, k)).join('')}</tr>`).join('')}
    <tr><td class="l" style="border-top:2px solid var(--ink);padding-top:10px"><b>${L('Rerata klinik','Clinic mean')}</b><small>${have.length} ${L('klinik','clinics')}</small></td>${cols.map(k => k === 'sp' ? '<td class="sp" style="background:none"></td>' : (() => { const v = k === 'KEL' ? ST.inst : k === 'FIN' ? ST.fin : ST.dom[k]; return `<td style="background:none;border:2px solid ${tcol(v)};color:var(--ink)" data-tip="${L('Rerata','Mean of')} ${have.length} ${L('klinik','clinics')}: ${f2(v)}">${f2(v)}</td>`; })()).join('')}</tr></tbody>`;
  document.querySelectorAll('#heat td[data-c]').forEach(td => td.onclick = () => { heatSel = [td.dataset.c, td.dataset.k]; INIT.heat(); });
  const [ck, kk] = heatSel || [low[0]?.kode, 'C'];
  const c = ST.cl.find(x => x.kode === ck);
  if (!c || !c.n){ $('#heatSide').innerHTML = `<h4>${L('Sebaran responden','Respondent spread')}</h4><p>${L('Klik sel berwarna untuk melihat skor tiap responden.','Click a coloured cell to see each respondent’s score.')}</p>`; return; }
  const doms = kk === 'KEL' ? INST : kk === 'FIN' ? ['C'] : [kk];
  const rv = c.rows.map((r, i) => ({i: i + 1, v: kk === 'KEL' ? mean(INST.map(d => respDom(r, d))) : respDom(r, doms[0])}));
  const its = ITEMS.filter(i => doms.includes(i[0][0]));
  $('#heatSide').innerHTML = `<h4>${esc(c.short)} · ${esc(kk === 'KEL' || kk === 'FIN' ? lab(kk) : kk + '. ' + DOM[kk])}</h4>
    <p>${L('Skor tiap responden (tanpa identitas):','Score per respondent (anonymised):')}</p>
    ${rv.map(x => `<div style="display:grid;grid-template-columns:30px 1fr 44px;gap:8px;align-items:center;padding:3px 0"><b>R${x.i}</b><span style="height:10px;background:var(--paper2);border-radius:3px;position:relative"><i style="position:absolute;left:0;top:0;bottom:0;width:${x.v ? pos(x.v) : 0}%;background:${tcol(x.v)};border-radius:3px"></i></span><b style="text-align:right">${f2(x.v)}</b></div>`).join('')}
    ${its.length <= 5 ? `<h4 style="margin-top:14px">${L('Jawaban per butir','Answers per item')}</h4><table class="mx" style="font-size:12.5px"><tr><th class="l">${L('Butir','Item')}</th>${c.rows.map((_, i) => `<th>R${i+1}</th>`).join('')}</tr>${its.map(i => { const vs = c.rows.map(r => r[i[0]]); const nn = vs.map(num).filter(x => x !== null); const gap = nn.length > 1 && Math.max(...nn) - Math.min(...nn) >= 1.5;
      return `<tr><td class="l" data-tip="${esc(ilab(i[0]))}"><b style="color:var(--hi)">${i[0]}</b>${gap ? ` <span class="tg t1" style="font-size:9.5px">${L('selisih','gap')}</span>` : ''}</td>${vs.map(v => `<td>${v ? kv(v) : '–'}</td>`).join('')}</tr>`; }).join('')}</table>` : `<p class="figcap">${L('Pilih satu domain (A–I) untuk melihat jawaban per butir.','Pick a single domain (A–I) to see answers per item.')}</p>`}`;
};

INIT.typo = () => {
  const pts = ST.have.filter(c => c.inst !== null && c.fin !== null);
  const q = c => c.inst >= 2.5 ? (c.fin >= 2.5 ? 'siap' : 'kel') : (c.fin >= 2.5 ? 'fin' : 'belum');
  const Q = {siap:[L('Siap transisi','Ready for transition'), L('Kelembagaan dan keuangan sama-sama di atas ambang.','Both institutions and finances are above the threshold.'),'var(--t4)'],
    kel:[L('Kuat kelembagaan, rentan finansial','Institutionally strong, financially vulnerable'), L('Organisasi tertata, tetapi pendanaan belum aman.','Well organised, but funding is not yet secure.'),'var(--t2)'],
    fin:[L('Finansial cukup, kelembagaan lemah','Financially adequate, institutionally weak'), L('Keuangan relatif aman, tata kelola dan sistem perlu dikuatkan.','Finances are relatively secure; governance and systems need strengthening.'),'var(--t3)'],
    belum:[L('Belum siap','Not yet ready'), L('Keduanya di bawah ambang; perlu pendampingan intensif.','Both are below the threshold; intensive support is needed.'),'var(--t1)']};
  const cnt = k => pts.filter(c => q(c) === k).length;
  $('#hTypo').innerHTML = pts.length ? L(`<span class="n">${cnt('siap')} dari ${pts.length}</span> klinik siap pada kedua dimensi; ${cnt('kel')} kuat secara kelembagaan tetapi rentan secara finansial`, `<span class="n">${cnt('siap')} of ${pts.length}</span> clinics are ready on both dimensions; ${cnt('kel')} are institutionally strong but financially vulnerable`) : L('Tipologi muncul setelah klinik memiliki skor kelembagaan dan finansial','The typology appears once clinics have institutional and financial scores');
  const W = 640, H = 460, m = {l:56, r:20, t:20, b:50}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = v => m.l + (v - 1) / 3 * iw, Y = v => m.t + ih - (v - 1) / 3 * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${L('Diagram sebar kesiapan kelembagaan dan finansial','Scatter of institutional and financial readiness')}">`;
  s += `<rect x="${X(2.5)}" y="${Y(4)}" width="${X(4)-X(2.5)}" height="${Y(2.5)-Y(4)}" fill="var(--t4)" opacity=".08"/><rect x="${X(1)}" y="${Y(2.5)}" width="${X(2.5)-X(1)}" height="${Y(1)-Y(2.5)}" fill="var(--t1)" opacity=".07"/>`;
  [1,1.5,2,2.5,3,3.5,4].forEach(v => { s += `<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--rule)" stroke-width="${v===2.5?0:1}"/><line x1="${m.l}" x2="${m.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="${v===2.5?0:1}"/><text x="${X(v)}" y="${m.t+ih+18}" text-anchor="middle" font-size="12" fill="var(--ink3)">${fn(v)}</text><text x="${m.l-10}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--ink3)">${fn(v)}</text>`; });
  s += `<line x1="${X(2.5)}" x2="${X(2.5)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--hi)" stroke-dasharray="5 4" stroke-width="1.5"/><line x1="${m.l}" x2="${m.l+iw}" y1="${Y(2.5)}" y2="${Y(2.5)}" stroke="var(--hi)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  s += `<text x="${X(4)-8}" y="${Y(4)+18}" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--t4)">${Q.siap[0].toUpperCase()}</text><text x="${X(4)-8}" y="${Y(1)-10}" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--hi)">${Q.kel[0].toUpperCase()}</text><text x="${X(1)+8}" y="${Y(2.5)+20}" font-size="12.5" font-weight="700" fill="var(--t1)">${Q.belum[0].toUpperCase()}</text><text x="${X(1)+8}" y="${Y(4)+18}" font-size="12.5" font-weight="700" fill="var(--ink3)">${Q.fin[0].toUpperCase()}</text>`;
  s += `<text x="${m.l+iw/2}" y="${H-8}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink2)">${L('Kesiapan kelembagaan-regulasi (A, B, D, E, F, G, H)','Institutional-regulatory readiness (A, B, D, E, F, G, H)')}</text><text transform="translate(16 ${m.t+ih/2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink2)">${L('Kesiapan finansial (C)','Financial readiness (C)')}</text>`;
  const placed = [];
  pts.sort((a,b) => b.fin - a.fin).forEach(c => {
    const x = X(c.inst), y = Y(c.fin); const hl = FIL !== 'ALL' && FIL === c.kode, dim = FIL !== 'ALL' && !hl;
    let ly = y - 13; while (placed.some(p => Math.abs(p.x - x) < 120 && Math.abs(p.y - ly) < 15)) ly += 15;
    placed.push({x, y: ly});
    const anchor = x > W - 150 ? 'end' : 'start', lx = anchor === 'end' ? x - 10 : x + 10;
    s += `<g opacity="${dim ? .3 : 1}" data-tip="<b>${esc(c.nama)}</b><br>${L('Kelembagaan','Institutional')} ${f2(c.inst)} · ${tierName(c.inst)}<br>${L('Finansial','Financial')} ${f2(c.fin)} · ${tierName(c.fin)}<br>${c.n} ${L('responden','respondents')}" style="cursor:pointer" data-clin="${c.kode}">
      <circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="${hl ? 9 : 7}" fill="${Q[q(c)][2]}" stroke="var(--paper)" stroke-width="2"/>
      <text x="${lx}" y="${ly + 4}" text-anchor="${anchor}" font-size="12.5" font-weight="700" fill="var(--ink)" paint-order="stroke" stroke="var(--paper)" stroke-width="3">${esc(c.short)}</text></g>`;
  });
  s += '</svg>';
  $('#typo').innerHTML = pts.length ? s : `<div class="empty">${L('Belum ada klinik dengan skor lengkap.','No clinic has complete scores yet.')}</div>`;
  $('#typoSide').innerHTML = Object.entries(Q).map(([k, [t, d, col]]) => { const Lc = pts.filter(c => q(c) === k);
    return `<div style="margin-bottom:14px"><h4 style="display:flex;align-items:center;gap:8px"><i class="sw" style="background:${col};border-radius:50%"></i>${t} · ${Lc.length}</h4><p style="margin:0 0 4px">${d}</p><p style="margin:0">${Lc.map(c => `<b>${esc(c.short)}</b>`).join(', ') || '<span class="muted">—</span>'}</p></div>`; }).join('') +
    `<p class="figcap">${L('Kesiapan finansial lengkap menurut panduan juga memuat indikator data request (ketergantungan donor, cadangan kas, status PKS BPJS); yang tampil di sini hanya komponen kuesioner.','Under the scoring guide, full financial readiness also includes data-request indicators (donor dependency, cash reserves, BPJS contract status); only the questionnaire component is shown here.')}</p>`;
};

let itemSort = 'low';
INIT.items = () => {
  const rows = scope();
  let Li = ITEMS.map(i => ({code:i[0], label:ilab(i[0]), comp:i[2], ...itemDist(rows, i[0])}));
  const valid = Li.filter(x => x.m !== null);
  const below = valid.filter(x => x.m < 2.5).length;
  const w = valid.slice().sort((a,b) => a.m - b.m);
  $('#hItems').innerHTML = valid.length ? L(`<span class="n">${below} dari 35</span> butir di ${esc(scopeName())} masih di bawah 2,5; terendah adalah ${esc(lc1(w[0].label))} (${f2(w[0].m)})`, `<span class="n">${below} of 35</span> items in ${esc(scopeName())} are still below 2.5; the lowest is ${esc(lc1(w[0].label))} (${f2(w[0].m)})`) : L('Belum ada jawaban pada filter ini','No answers in this filter yet');
  $('#itemLegend').innerHTML = ansLegend(false);
  if (itemSort === 'low') Li.sort((a,b) => (a.m ?? 9) - (b.m ?? 9));
  if (itemSort === 'tt') Li.sort((a,b) => b.d.TT - a.d.TT || (a.m ?? 9) - (b.m ?? 9));
  const keys = ['1','2','3','4','TT'], col = {'1':'var(--t1)','2':'var(--t2)','3':'var(--t3)','4':'var(--t4)','TT':'var(--tt)'};
  $('#itemRows').innerHTML = Li.map(x => `<div class="ib" data-tip="<b>${x.code}. ${esc(x.label)}</b><br>${L('Domain','Domain')} ${DOM[x.code[0]]} · ${x.comp}<br>${keys.map(k => kv(k) + ': ' + x.d[k]).join(' · ')}<br>${L('Rerata','Mean')} ${f2(x.m)}">
    <span class="c">${x.code}</span><span class="t">${esc(x.label)}</span>
    <div class="stk">${x.n ? keys.map(k => x.d[k] ? `<i style="width:${x.d[k] / x.n * 100}%;background:${col[k]}">${x.d[k] / x.n > .12 ? `<span style="color:${k === '2' || k === '3' ? '#1C1F23' : '#fff'}">${x.d[k]}</span>` : ''}</i>` : '').join('') : '<i style="width:100%;background:var(--paper2)"></i>'}</div>
    <span class="m" style="color:${x.m !== null && x.m < 2.5 ? 'var(--bad)' : 'var(--ink)'}">${f2(x.m)}</span></div>`).join('');
};
document.querySelectorAll('#itemSort button').forEach(b => b.onclick = () => { itemSort = b.dataset.v; document.querySelectorAll('#itemSort button').forEach(x => x.setAttribute('aria-pressed', x === b)); INIT.items(); });

INIT.comp = () => {
  const rows = scope();
  const v = {}; Object.keys(COMP_).forEach(k => { const its = ITEMS.filter(i => i[2].split(',').includes(k)).map(i => i[0]); v[k] = {its, m: mean(its.map(it => itemDist(rows, it).m))}; });
  const Lk = Object.keys(COMP_).filter(k => v[k].m !== null).sort((a,b) => v[a].m - v[b].m);
  $('#hComp').innerHTML = Lk.length ? L(`Komponen <span class="n">${Lk[0]} · ${COMP[Lk[0]].toLowerCase()}</span> paling lemah (${f2(v[Lk[0]].m)}), ${Lk[Lk.length-1]} paling kuat (${f2(v[Lk[Lk.length-1]].m)})`, `Component <span class="n">${Lk[0]} · ${COMP[Lk[0]].toLowerCase()}</span> is weakest (${f2(v[Lk[0]].m)}), ${Lk[Lk.length-1]} strongest (${f2(v[Lk[Lk.length-1]].m)})`) : L('Belum ada data','No data yet');
  $('#compBars').innerHTML = Object.keys(COMP_).map(k => `<div class="hb" data-tip="<b>${k} · ${COMP[k]}</b><br>${v[k].its.length} ${L('butir','items')}: ${v[k].its.join(', ')}<br>${L('Skor','Score')} ${f2(v[k].m)}">
    <div class="hb-l"><b style="width:28px">${k}</b>${COMP[k]}</div>
    <div class="hb-t">${bandsHTML()}${v[k].m !== null ? `<div class="hb-b" style="width:${pos(v[k].m)}%;background:${tcol(v[k].m)}"></div>` : ''}<div class="thr" style="left:${pos(2.5)}%"></div></div>
    <div class="hb-v">${f2(v[k].m)} ${tierTag(v[k].m)}</div></div>`).join('');
  $('#compAxis').innerHTML = axisHTML();
  $('#compSide').innerHTML = `<h4>${L('Butir per komponen','Items per component')}</h4>${Object.keys(COMP_).map(k => `<p><b>${k}</b> ${COMP[k]}<br><span class="muted">${v[k].its.join(' · ')}</span></p>`).join('')}<p class="figcap">${L('Nama komponen adalah label ringkas yang disimpulkan dari butir-butir yang dipetakan; sesuaikan dengan kerangka kajian bila berbeda.','Component names are short labels inferred from the mapped items; adjust them to the study framework if they differ.')}</p>`;
};

INIT.check = () => {
  const CH = CHECKS_.map(c => [c[0], L(c[1], c[2])]);
  const mark = v => v === null ? ['u','?'] : v >= 3 ? ['y','✓'] : v >= 2 ? ['p','–'] : ['n','✕'];

  s += `<g font-size="12" fill="var(--ink2)"><line x1="14" x2="34" y1="16" y2="16" stroke="var(--sel)" stroke-width="2.5"/><text x="40" y="20">${esc(c.short)}</text><line x1="14" x2="34" y1="34" y2="34" stroke="var(--all)" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="38">${L('Rerata semua klinik','All-clinic mean')}</text><line x1="14" x2="34" y1="52" y2="52" stroke="var(--hi)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="40" y="56">${L('Ambang 2,5','2.5 threshold')}</text></g></svg>`;

    <p><b>Skor domain.</b> Rata-rata butir dalam domain. Jawaban TT tidak dihitung tetapi dicatat. Domain dengan lebih dari separuh TT ditandai “data tidak cukup” (DTC).</p>
    <p><b>Skor klinik.</b> Rata-rata skor seluruh responden di klinik tersebut. Angka lintas klinik adalah rata-rata skor klinik, sehingga klinik dengan responden lebih banyak tidak mendapat bobot lebih besar.</p>
    <p><b>Konversi tingkat.</b> 1,00–1,75 emerging · 1,76–2,50 progressing · 2,51–3,25 established · 3,26–4,00 advanced.</p>
    <p><b>Kesiapan.</b> Kelembagaan-regulasi = rata-rata domain A, B, D, E, F, G, H. Finansial = domain C; dalam analisis akhir ditambah indikator data request (ketergantungan donor, cadangan kas, status PKS BPJS). Ambang indikatif “siap” 2,5, disesuaikan setelah data terkumpul.</p>
    <p><b>Guardrail.</b> Domain I menjadi masukan guardrail K5 dan tidak masuk skor tipologi.</p>
    <p><b>Konsistensi.</b> Selisih antarresponden ≥ 1,5 poin pada satu butir dicatat dan diklarifikasi dalam KII pengelola klinik (INS-02E, E9).</p>
    <p><b>Pelatihan.</b> Bagian V (L1–L5) tidak dihitung dalam skor kapasitas; dipakai untuk memprioritaskan materi Modul Pelatihan sesi 1–5 dan sebagai baseline.</p>
    <p><b>Kerahasiaan.</b> Skor individu tidak ditampilkan dengan identitas. Responden disebut R1–R3 menurut urutan masuk, dan jawaban terbuka hanya diberi label klinik.</p>
    <p><b>Status data.</b> ${MODE === 'live' ? 'Data langsung dari Google Sheet' : 'Data contoh untuk uji tampilan'}; diperbarui ${UPDATED ? UPDATED.toLocaleString(LOC()) : '–'}. Temuan bersifat sementara sampai pengisian ditutup.</p>`;
  $('#closing').innerHTML = `<div class="partners" style="margin:0">${PARTNER_HTML()}</div><p>${L('Kajian Kerangka Strategi Keberlanjutan CBC. Terima kasih kepada pimpinan, staf, dan perwakilan komunitas di tujuh klinik CBC yang telah meluangkan waktu untuk mengisi penilaian ini.','CBC Sustainability Strategy Framework Study. With thanks to the leaders, staff, and community representatives of the seven CBC clinics who took the time to complete this assessment.')}</p>`;
};

/* ============================ Teks statis & bahasa ============================ */
const slides = [...document.querySelectorAll('.slide')];
function applyStatic(){
  document.documentElement.lang = LANG;
  document.title = L('Kesiapan Keberlanjutan CBC · Kementerian Kesehatan & Yayasan Spiritia','CBC Sustainability Readiness · Ministry of Health & Yayasan Spiritia');
  document.querySelectorAll('[data-i]').forEach(el => { const t = I18N[el.dataset.i]; if (t) el.innerHTML = L(t[0], t[1]); });
  $('#demoTag').textContent = L('Data contoh','Sample data');
  $('#bar').setAttribute('aria-label', L('Navigasi paparan','Presentation navigation'));
  $('#fil').setAttribute('aria-label', L('Filter klinik','Clinic filter'));
  $('#tocBtn').setAttribute('aria-label', L('Daftar slide','Slide list')); $('#tocBtn').title = L('Daftar slide (T)','Slide list (T)');
  $('#themeBtn').setAttribute('aria-label', L('Tema terang/gelap','Light/dark theme')); $('#themeBtn').title = L('Tema','Theme');
  $('#live').title = L('Muat ulang data','Reload data');
  $('#prev').setAttribute('aria-label', L('Sebelumnya','Previous')); $('#next').setAttribute('aria-label', L('Berikutnya','Next'));
  $('#langSw').setAttribute('aria-label', L('Bahasa','Language'));
  document.querySelectorAll('#langSw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  const g = {}; slides.forEach((s, i) => { const c = L(...I18N[s.dataset.chap]); (g[c] = g[c] || []).push([i, L(...I18N[s.dataset.title])]); });
  $('#tocList').innerHTML = Object.entries(g).map(([c, Ls]) => `<div class="grp"><h5>${c}</h5>${Ls.map(([i, t]) => `<button data-i2="${i}"><i>${String(i + 1).padStart(2, '0')}</i>${t}</button>`).join('')}</div>`).join('');
  document.querySelectorAll('#tocList button').forEach(b => b.onclick = () => { $('#toc').classList.remove('on'); show(+b.dataset.i2); });
  liveLabel();
  if (RAW.clinics) fillFilter();
}
function setLang(l){
  LANG = l === 'en' ? 'en' : 'id'; ls.set('cbc-lang', LANG);
  applyStatic(); show(idx);
}
document.addEventListener('click', e => { const b = e.target.closest('#langSw button'); if (b) setLang(b.dataset.lang); });

/* ============================ Navigasi ============================ */
let idx = 0;
function show(i){
  idx = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, j) => s.classList.toggle('on', j === idx));
  const s = slides[idx];
  render(s);
  $('#cnt').textContent = `${idx + 1}/${slides.length}`;
  $('#chapLbl').textContent = '· ' + L(...I18N[s.dataset.chap]);
  $('#prog').style.width = ((idx + 1) / slides.length * 100) + '%';
  try { history.replaceState(null, '', location.pathname + location.search + '#' + (idx + 1)); } catch(e){}
  s.scrollTop = 0;
}
function render(s){ if (!ST) return; const f = INIT[s.dataset.init]; if (f) try { f(); } catch(e){ console.error(e); } }
$('#prev').onclick = () => show(idx - 1);
$('#next').onclick = () => show(idx + 1);
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); show(idx + 1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); show(idx - 1); }
  else if (e.key === 'Home') show(0); else if (e.key === 'End') show(slides.length - 1);
  else if (e.key.toLowerCase() === 't') toggle('#toc');
  else if (e.key === 'Escape'){ $('#toc').classList.remove('on'); }
});
let tx = null;
document.addEventListener('touchstart', e => { tx = [e.touches[0].clientX, e.touches[0].clientY]; }, {passive:true});
document.addEventListener('touchend', e => { if (!tx) return; const dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1]; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && !e.target.closest('.scroll,.chartbox,table,.xs')) show(idx + (dx < 0 ? 1 : -1)); tx = null; });
function toggle(sel){ const el = $(sel); const on = !el.classList.contains('on'); document.querySelectorAll('.ovl').forEach(o => o.classList.remove('on')); el.classList.toggle('on', on); }
$('#tocBtn').onclick = () => toggle('#toc');
document.addEventListener('click', e => { const c = e.target.closest('[data-clin]'); if (c){ clinSel = c.dataset.clin; show(slides.findIndex(s => s.dataset.init === 'clinic')); } });

function fillFilter(){
  const cur = FIL;
  $('#fil').innerHTML = `<option value="ALL">${L('Semua klinik','All clinics')}</option>` + RAW.clinics.map(c => `<option value="${c.kode}">${esc(c.short || c.nama)}</option>`).join('');
  $('#fil').value = RAW.clinics.some(c => c.kode === cur) ? cur : 'ALL'; FIL = $('#fil').value;
}
$('#fil').onchange = e => { FIL = e.target.value; render(slides[idx]); };

/* ============================ Muat data ============================ */
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = '__cbc' + Date.now(); const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('timeout')); }, 20000);
    const cleanup = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error('jsonp')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb; document.body.appendChild(s);
  });
}
function liveLabel(){
  const live = $('#live'), t = $('#liveTxt');
  if (LOADERR){ live.className = 'live err'; t.textContent = LOADERR === 'unauthorized' ? L('Kunci salah','Wrong key') : L('Gagal memuat','Load failed'); return; }
  if (MODE === 'live'){ live.className = 'live'; t.textContent = L('Langsung · ','Live · ') + (UPDATED ? UPDATED.toLocaleTimeString(LOC(), {hour:'2-digit', minute:'2-digit'}) : ''); }
  else if (MODE === 'loading'){ t.textContent = L('Memuat…','Loading…'); }
  else { live.className = 'live demo'; t.textContent = L('Data contoh','Sample data'); }
}
let loading = false;
async function load(){
  if (loading) return; loading = true; LOADERR = '';
  if (!CFG.url){
    RAW = normalize(demoData()); MODE = 'demo'; UPDATED = new Date();
  } else {
    const prev = MODE; MODE = 'loading'; liveLabel();
    const url = CFG.url + (CFG.url.includes('?') ? '&' : '?') + 'action=data' + (CFG.key ? '&key=' + encodeURIComponent(CFG.key) : '');
    try {
      let d;
      try { const r = await fetch(url, {cache:'no-store'}); d = await r.json(); }
      catch (e){ d = await jsonp(url); }
      if (!d.ok) throw new Error(d.error || 'gagal');
      RAW = normalize(d); MODE = 'live'; UPDATED = d.updated ? new Date(d.updated) : new Date();
    } catch (e){
      LOADERR = e.message || 'error'; MODE = prev === 'loading' ? 'demo' : prev;
      if (!RAW.rows.length){ RAW = normalize(demoData()); MODE = 'demo'; UPDATED = new Date(); }
    }
  }
  liveLabel();
  $('#demoTag').hidden = MODE !== 'demo';
  ST = stats(); fillFilter(); render(slides[idx]);
  loading = false;
}
$('#live').onclick = load;
let timer = null;
function schedule(){ clearInterval(timer); if (CFG.url) timer = setInterval(() => { if (!document.hidden) load(); }, Math.max(15, CFG.ref) * 1000); }


(function(){ const t = ls.get('cbc-theme'); if (t) document.documentElement.dataset.theme = t;
  $('#themeBtn').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; const n = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = n; ls.set('cbc-theme', n); }; })();

LANG = ((qs.get('lang') || ls.get('cbc-lang') || 'id').toLowerCase() === 'en') ? 'en' : 'id';
applyStatic();
show(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));
addEventListener('hashchange', () => { const n = (parseInt(location.hash.slice(1)) || 1) - 1; if (n !== idx) show(n); });
load(); schedule();
</script>
