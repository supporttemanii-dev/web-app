<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-learning Keberlanjutan CBC</title>
<meta name="description" content="E-learning Pelatihan Strategi Keberlanjutan Operasional dan Finansial bagi Pengelola Community-Based Clinic (CBC). Kementerian Kesehatan RI dan Yayasan Spiritia.">
<meta name="theme-color" content="#0A6E66">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --fs:16px; --lh:1.6;
  --primary:#0A6E66; --primary-2:#0899A9; --primary-3:#0FB8AA; --primary-soft:#E6F4F2;
  --pes:#55620A; --pes-2:#7A8A0E; --pes-soft:#F1F5DC;
  --fas:#0D47A1; --fas-2:#0277BD; --fas-soft:#E3EEFA;
  --accent:var(--pes); --accent-2:var(--pes-2); --accent-soft:var(--pes-soft);
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#F8FAF9; --ink:#1B2725; --ink-2:#44524F; --muted:#6E7B78; --line:#DCE3E1;
  --ok:#2E7D32; --ok-soft:#E5F3E6; --warn:#A35F00; --warn-soft:#FDF1DE; --bad:#BE2A3A; --bad-soft:#FBE9EB;
  --h-1:#F4CCCC; --h-2:#FCE5CD; --h-3:#D9EAD3; --h-4:#B6D7A8;
  --s-dasar:#00897B; --s-opt:#0277BD; --s-pes:#BE2A3A;
  /* warna materi */
  --c1:#00897B; --c1s:#E0F2EF; --c2:#7A8A0E; --c2s:#F1F5DC; --c3:#0277BD; --c3s:#E1EFF8; --c4:#D97706; --c4s:#FEF3E2; --c5:#D9534F; --c5s:#FCEBEA; --c6:#6D4FC2; --c6s:#EFEAFB;
  --radius:16px; --shadow:0 1px 2px rgba(16,40,36,.06),0 6px 20px rgba(16,40,36,.07);
  --focus:#F59E0B;
}
body.role-fas{--accent:var(--fas);--accent-2:var(--fas-2);--accent-soft:var(--fas-soft)}
html.dark{
  --bg:#0F1716; --surface:#16211F; --surface-2:#1B2826; --ink:#E7EFED; --ink-2:#BCCAC7; --muted:#8FA09C; --line:#2A3A37;
  --primary:#3FC1B3; --primary-2:#4FC3D6; --primary-soft:#173431; --pes:#B8CC3A; --pes-2:#C9DA5A; --pes-soft:#2A3115; --fas:#7FB2FF; --fas-2:#63B5F0; --fas-soft:#16283F;
  --ok:#6BCB77; --ok-soft:#173322; --warn:#F2B04C; --warn-soft:#3A2B12; --bad:#FF7B86; --bad-soft:#3A1A1E;
  --h-1:#5A2A2A; --h-2:#5A4123; --h-3:#2E4A2B; --h-4:#3C6A33;
  --c1s:#173431; --c2s:#2A3115; --c3s:#16283F; --c4s:#3A2B12; --c5s:#3A1A1E; --c6s:#29213F;
  --c1:#3FC1B3; --c2:#B8CC3A; --c3:#63B5F0; --c4:#F2B04C; --c5:#FF8A80; --c6:#B39DFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
html.contrast{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFFFFF; --ink:#000000; --ink-2:#000000; --muted:#1A1A1A; --line:#000000;
  --primary:#00433E; --primary-2:#00433E; --primary-soft:#FFFFFF; --accent:#000; --accent-2:#000; --accent-soft:#FFF59D;
  --c1s:#fff; --c2s:#fff; --c3s:#fff; --c4s:#fff; --c5s:#fff; --c6s:#fff; --shadow:none;
}
html.contrast .card,html.contrast .blk,html.contrast .unit,html.contrast .kpi{border:2px solid #000}
html.contrast.dark{--bg:#000;--surface:#000;--surface-2:#000;--ink:#FFF;--ink-2:#FFF;--muted:#EEE;--line:#FFF;--primary:#7FFFD4;--primary-2:#7FFFD4;--accent:#FFEB3B;--accent-2:#FFEB3B;--accent-soft:#333}
html.contrast.dark .card,html.contrast.dark .blk,html.contrast.dark .unit,html.contrast.dark .kpi{border-color:#fff}
html.readable body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;letter-spacing:.01em}
html.spacious{--lh:1.9} html.spacious p,html.spacious li{word-spacing:.08em}
html.links a{text-decoration:underline!important}
html.calm *,html.calm *::before,html.calm *::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===================== BASE ===================== */
*{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:var(--lh);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.55rem} h2{font-size:1.25rem} h3{font-size:1.06rem} h4{font-size:.95rem}
p{margin:0 0 .8em}
a{color:var(--primary-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* ===================== TOP BAR ===================== */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:58px}
.logos{display:flex;align-items:center;gap:10px}
.logos img{height:30px;width:auto;display:block}
.logos img.spr{height:26px}
html.dark .logos img{background:#fff;border-radius:6px;padding:2px 4px}
.brand{font-weight:800;font-size:.92rem;color:var(--primary);line-height:1.15}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.topbar .sp{flex:1}
.tbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:.95rem;color:var(--ink)}
.tbtn:hover{border-color:var(--primary-2)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.role-pill{font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.sync{font-size:.72rem;color:var(--muted);white-space:nowrap}
.sync.err{color:var(--bad)}
.demo-band{background:#FFF7E0;color:#7A5200;font-size:.78rem;text-align:center;padding:5px 12px;border-bottom:1px solid #F3E2B0}
html.dark .demo-band{background:#3A2E10;color:#F6D78B;border-color:#5a4718}
@media(max-width:620px){.sync,.role-pill,.brand small{display:none}.brand{font-size:.8rem}.logos img{height:24px}.logos img.spr{height:20px}.tbtn{width:38px;height:38px}}

/* ===================== LAYOUT & NAV ===================== */
main{max-width:1240px;margin:0 auto;padding:18px 16px 104px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:700;padding:5px 2px;border-radius:12px;min-height:48px}
.nav a .ic{display:block;font-size:1.2rem;line-height:1.35}
.nav a.on{color:var(--accent);background:var(--accent-soft)}
@media(min-width:960px){
  main{padding-left:232px;padding-bottom:40px}
  .nav{top:var(--navtop,58px);bottom:auto;left:max(0px,calc(50% - 620px));right:auto;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;border:none;background:transparent;padding:18px 12px}
  .nav a{display:flex;align-items:center;gap:12px;text-align:left;font-size:.88rem;padding:10px 12px;min-height:0}
  .nav a .ic{display:inline;font-size:1.05rem}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{color:var(--primary)}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);margin-bottom:4px}
.muted{color:var(--muted)} .small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0A6E66 0%,#0899A9 60%,#0FB8AA 100%);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{color:#fff;margin-bottom:4px}
.hero p{opacity:.92;margin:0}
.hero .bar{margin-top:14px;background:rgba(255,255,255,.25)}
.hero .bar i{background:#DCE775}

/* ===================== BUTTONS & FORMS ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;text-decoration:none;font-size:.92rem;min-height:44px}
html.dark .btn{color:#0F1716}
html.dark .btn.ghost{color:var(--primary)} html.dark .btn.danger{color:var(--bad)}
.btn:hover{filter:brightness(1.07)}
.btn.acc{background:var(--accent)}
.btn.ghost{background:var(--surface);color:var(--primary);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:10px;min-height:36px}
.btn.block{width:100%}
.btn.danger{background:var(--surface);color:var(--bad);border-color:#EBC5CA}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;color:var(--primary-2);font-weight:700;cursor:pointer;padding:4px;text-decoration:underline}
label.f{display:block;font-size:.82rem;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:.92rem;min-height:44px}
.in:focus{outline:3px solid var(--primary-3);outline-offset:0;border-color:transparent}
textarea.in{min-height:90px;resize:vertical}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.field{margin-bottom:14px}
.hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.fgrid{display:grid;gap:10px}
@media(min-width:620px){.fgrid.c2{grid-template-columns:1fr 1fr}.fgrid.c3{grid-template-columns:1fr 1fr 1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:8px 12px;cursor:pointer;font-size:.84rem;font-weight:700;color:var(--ink-2);min-width:42px;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;color:var(--muted);font-size:.8rem;font-weight:700;padding:6px}
.meter{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;transition:width .3s}

/* ===================== TABLES ===================== */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th{background:var(--primary);color:#fff;text-align:left;font-weight:700;padding:9px 8px;font-size:.78rem;white-space:nowrap}
html.dark table.t th{color:#0F1716}
table.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
table.t tr.tot td{font-weight:800;background:var(--primary-soft)}
table.t .in{padding:7px 9px;font-size:.86rem;min-width:76px;min-height:38px}
table.t.clickable tbody tr{cursor:pointer}
table.t.clickable tbody tr:hover td{background:var(--surface-2)}

/* ===================== UNITS ===================== */
.units{display:grid;gap:10px}
@media(min-width:760px){.units.two{grid-template-columns:1fr 1fr}}
.unit{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-decoration:none;color:inherit;min-height:68px}
.unit:hover{border-color:var(--accent-2)}
.unit .no{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:#fff}
.unit.done .no{background:var(--ok)!important}
.unit.lock{opacity:.6}
.unit .tt{flex:1;min-width:0}
.unit .tt b{display:block;font-size:.95rem}
.unit .tt span{font-size:.78rem;color:var(--muted)}
.ring{position:relative;width:40px;height:40px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.64rem}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 16px;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--ink-2);min-height:42px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button .lk{margin-left:6px}
.note{border-left:4px solid var(--accent-2);background:var(--accent-soft);padding:11px 15px;border-radius:0 12px 12px 0;font-size:.9rem;margin:10px 0}
.note.warn{border-color:var(--bad);background:var(--bad-soft)} .note.info{border-color:var(--primary-2);background:var(--primary-soft)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:.75rem;color:var(--muted);font-weight:700}
.kpi .v{font-size:1.28rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .s{font-size:.75rem;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}

/* ===================== LESSON BLOCKS ===================== */
.lesson-bar{position:sticky;top:var(--navtop,58px);z-index:20;background:var(--bg);padding:8px 0;display:flex;gap:10px;align-items:center}
.lesson-bar .bar{flex:1}
.blk{--c:var(--c1);--cs:var(--c1s);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s,box-shadow .3s}
.blk.in{opacity:1;transform:none}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.blk.reading{box-shadow:0 0 0 3px var(--c),var(--shadow)}
.blk .bh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.blk .bi{flex:none;width:40px;height:40px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-size:1.2rem;font-weight:800}
.blk .bt{flex:1}
.blk .bt .k{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.blk .bt h3{margin:2px 0 0;color:var(--ink);font-size:1.12rem}
.blk .lead{color:var(--ink-2)}
.blk .done-mark{position:absolute;top:14px;right:14px;font-size:.7rem;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:99px;opacity:0;transition:opacity .3s}
.blk.done .done-mark{opacity:1}
.blk.k1{--c:var(--c1);--cs:var(--c1s)} .blk.k2{--c:var(--c2);--cs:var(--c2s)} .blk.k3{--c:var(--c3);--cs:var(--c3s)} .blk.k4{--c:var(--c4);--cs:var(--c4s)} .blk.k5{--c:var(--c5);--cs:var(--c5s)} .blk.k6{--c:var(--c6);--cs:var(--c6s)}
mark.hl{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--c) 30%,transparent) 55%);color:inherit;font-weight:700;padding:0 2px}
/* hero stats */
.lhero{background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 70%,#000) 100%);color:#fff;border:none}
.lhero::before{display:none}
.lhero h2{color:#fff;font-size:1.35rem}.lhero .lead{color:rgba(255,255,255,.9)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:rgba(255,255,255,.14);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;opacity:.92}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{background:rgba(255,255,255,.18);border-radius:99px;padding:7px 14px;font-size:.84rem;font-weight:700;opacity:0;transform:scale(.8);transition:.4s}
.blk.in .pill{opacity:1;transform:none}
/* animated bars */
.abars .ab{margin-bottom:12px;cursor:pointer}
.abars .ab .lbl{display:flex;justify-content:space-between;font-size:.86rem;font-weight:700;margin-bottom:4px}
.abars .tr{position:relative;height:30px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:visible}
.abars .fill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.abars .tgt{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--bad);border-radius:2px}
.abars .ab.sel .tr{box-shadow:0 0 0 2px var(--c)}
.explain{background:var(--cs);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-top:10px;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* choices */
.choices{display:grid;gap:8px;margin-top:10px}
@media(min-width:620px){.choices.c2{grid-template-columns:1fr 1fr}}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer;font-weight:600;min-height:48px}
.choice:hover{border-color:var(--c)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)} .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
/* timeline */
.tl{position:relative;display:flex;gap:0;overflow-x:auto;padding:26px 4px 6px;scroll-snap-type:x mandatory}
.tl::before{content:"";position:absolute;left:20px;right:20px;top:42px;height:4px;background:var(--line);border-radius:2px}
.tl .prog{position:absolute;left:20px;top:42px;height:4px;background:var(--c);border-radius:2px;width:0;transition:width .5s}
.tl .node{position:relative;flex:1 0 120px;scroll-snap-align:center;text-align:center;cursor:pointer;background:none;border:none;padding:0 6px}
.tl .dot{width:24px;height:24px;border-radius:50%;margin:4px auto 8px;background:var(--surface);border:4px solid var(--line);transition:.3s}
.tl .node.on .dot,.tl .node.seen .dot{border-color:var(--c);background:var(--c)}
.tl .node.on .dot{transform:scale(1.3);box-shadow:0 0 0 6px var(--cs)}
.tl .node b{display:block;font-size:.86rem;color:var(--c)}
.tl .node span{display:block;font-size:.76rem;color:var(--muted);line-height:1.3}
/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.flip{perspective:900px;height:170px;cursor:pointer;background:none;border:none;padding:0;text-align:left}
.flip .in2{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in2{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:center}
.flip .fa{background:var(--fc,var(--c));color:#fff}
.flip .fa b{font-size:1.05rem;line-height:1.25}.flip .fa i{font-style:normal;font-size:1.6rem;margin-bottom:6px}
.flip .fa small{margin-top:auto;opacity:.85;font-size:.72rem}
.flip .fb{background:var(--surface);border:2px solid var(--fc,var(--c));transform:rotateY(180deg);font-size:.84rem;color:var(--ink);overflow:auto;justify-content:flex-start}
.flip .fb b{color:var(--fc,var(--c));display:block;margin-bottom:4px}
/* radial hotspot */
.radial{display:grid;gap:14px}
@media(min-width:760px){.radial{grid-template-columns:1.2fr 1fr;align-items:center}}
.radial svg{width:100%;height:auto}
.radial .hs{cursor:pointer;transition:transform .25s;transform-origin:center;transform-box:fill-box}
.radial .hs:hover,.radial .hs.on{transform:scale(1.08)}
.radial .hs circle{transition:fill .3s}
.radial .panel{background:var(--cs);border-radius:16px;padding:16px;min-height:120px}
.radial .panel b{color:var(--c);font-size:1.02rem}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
/* decision tree */
.tree .q{background:var(--cs);border-radius:16px;padding:16px;animation:pop .3s}
.tree .q b{display:block;font-size:1.02rem;margin-bottom:10px}
.tree .path{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tree .path span{font-size:.74rem;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.tree .res{border-radius:16px;padding:18px;color:#fff;animation:pop .4s}
.tree .res h3{color:#fff;font-size:1.3rem;margin:0 0 4px}
/* gauge */
.gauge{text-align:center}
.gauge svg{width:100%;max-width:340px;height:auto}
.gauge input[type=range]{width:100%;max-width:340px;accent-color:var(--c);height:36px}
.gauge .lv{font-size:1.4rem;font-weight:800}
/* range calc */
.calc{display:grid;gap:14px}
@media(min-width:760px){.calc{grid-template-columns:1fr 1fr}}
.rng label{display:flex;justify-content:space-between;font-size:.84rem;font-weight:700}
.rng label b{color:var(--c);font-variant-numeric:tabular-nums}
.rng input{width:100%;accent-color:var(--c);height:34px}
.out{background:var(--cs);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.out .big{font-size:2rem;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.15}
.out .sub{font-size:.82rem;color:var(--ink-2)}
.battery{width:150px;height:56px;border:4px solid var(--ink-2);border-radius:10px;margin:10px auto 4px;position:relative;padding:4px}
.battery::after{content:"";position:absolute;right:-12px;top:14px;width:8px;height:20px;background:var(--ink-2);border-radius:0 4px 4px 0}
.battery i{display:block;height:100%;border-radius:5px;transition:width .5s,background .5s}
/* stack house */
.stack{display:flex;flex-direction:column-reverse;gap:8px;align-items:center;min-height:250px;justify-content:flex-start}
.stack .layer{border-radius:14px;color:#fff;text-align:center;padding:12px;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.stack .layer b{display:block}.stack .layer span{font-size:.78rem;opacity:.92}
@keyframes rise{from{opacity:0;transform:translateY(-30px) scale(.95)}to{opacity:1;transform:none}}
/* steps chevrons */
.chev{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chev button{flex:1 0 90px;border:none;cursor:pointer;background:var(--surface-2);color:var(--ink-2);font-weight:800;font-size:.8rem;padding:12px 8px;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,12% 50%);min-height:54px;transition:.25s}
.chev button:first-child{clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%)}
.chev button.seen{background:var(--cs);color:var(--c)}
.chev button.on{background:var(--c);color:#fff}
.stepbox{background:var(--cs);border-radius:14px;padding:14px;animation:pop .3s}
.stepbox b{color:var(--c)}
/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin-bottom:12px}
.chip{background:var(--surface);border:2px solid var(--c);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.84rem;cursor:grab;user-select:none;touch-action:none;min-height:42px}
.chip.picked{background:var(--c);color:#fff;transform:scale(1.04)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)}
.chip.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bins{display:grid;gap:10px}
@media(min-width:620px){.bins{grid-template-columns:repeat(var(--n,3),1fr)}}
.bin{border-radius:14px;padding:10px;min-height:110px;background:var(--bc,var(--cs));border:2px solid transparent;transition:.2s}
.bin.over,.bin.target{border-color:var(--c);border-style:dashed}
.bin h4{margin:0 0 8px;font-size:.86rem;color:var(--bt,var(--c))}
.bin .chip{display:inline-block;margin:0 4px 6px 0;cursor:default}
/* benar/salah */
.tfc{border-radius:16px;padding:18px;background:var(--cs);text-align:center;animation:pop .3s}
.tfc .st{font-size:1.05rem;font-weight:700;margin-bottom:14px}
.tfc .btns{display:flex;gap:10px;justify-content:center}
.tfc .btns button{min-width:120px}
.tfn{display:flex;gap:6px;justify-content:center;margin-top:10px}
.tfn i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tfn i.ok{background:var(--ok)}.tfn i.no{background:var(--bad)}.tfn i.cur{box-shadow:0 0 0 3px var(--c)}
/* compare */
.cmp{display:grid;gap:10px}
@media(min-width:620px){.cmp{grid-template-columns:1fr 1fr}}
.cmp .col{border-radius:16px;padding:14px;background:var(--cs)}
.cmp .col h4{color:var(--c);margin-bottom:8px}
.cmp .rowc{background:var(--surface);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:.86rem}
.cmp .rowc small{display:block;color:var(--muted);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.ktab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ktab button{border:2px solid var(--c);background:var(--surface);color:var(--c);border-radius:99px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:.84rem;min-height:42px}
.ktab button.on{background:var(--c);color:#fff}
/* scatter & mini chart */
.svgwrap svg{width:100%;height:auto;display:block}
.svgwrap .pt{cursor:pointer;transition:r .2s}
.drawline{stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 1.6s ease}
.blk.in .drawline{stroke-dashoffset:0}
/* key takeaway */
.keyb{background:linear-gradient(135deg,var(--cs),var(--surface));border:2px solid var(--c)}
.keyb .big{font-size:1.15rem;font-weight:800;color:var(--ink)}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border:1px dashed var(--c);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.88rem}
/* check list block */
.chk2{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2);margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.chk2.on{border-color:var(--c);background:var(--cs)}
.chk2 .bx{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--c);display:grid;place-items:center;color:#fff;font-weight:800}
.chk2.on .bx{background:var(--c)}
/* hex guardrail */
.hexes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

/* ===================== READ ALOUD ===================== */
.tts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:14px}
.tts .wave{display:flex;gap:2px;align-items:flex-end;height:18px}
.tts .wave i{width:3px;background:var(--accent);border-radius:2px;height:4px}
.tts.playing .wave i{animation:wave 1s infinite ease-in-out}
.tts.playing .wave i:nth-child(2){animation-delay:.15s}.tts.playing .wave i:nth-child(3){animation-delay:.3s}.tts.playing .wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{height:4px}50%{height:18px}}
.tts select{max-width:180px;min-height:36px;padding:4px 8px;font-size:.8rem}
.saying{background:color-mix(in srgb,var(--focus) 30%,transparent);border-radius:4px}

/* ===================== QUIZ ===================== */
.q{margin-bottom:18px}
.q .qt{font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:7px;cursor:pointer;background:var(--surface);min-height:46px}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{font-size:.84rem;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 11px;margin-top:4px}

/* ===================== SA / TOOLS (dari v0.1) ===================== */
.sa-dom{margin-bottom:14px}
.sa-dom h4{color:var(--primary);background:var(--primary-soft);padding:8px 12px;border-radius:10px;margin-bottom:8px}
.sa-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.sa-item .tx{flex:1 1 300px;font-size:.9rem}
.sa-item .tx b{color:var(--primary);margin-right:6px}
.scale-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--ink-2)}
.dbar{display:grid;grid-template-columns:140px 1fr 50px;align-items:center;gap:8px;margin-bottom:7px;font-size:.86rem}
.dbar .tr{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;position:relative;overflow:hidden}
.dbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.dbar .tr .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);left:50%}
.dbar b{font-variant-numeric:tabular-nums;text-align:right}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:.9rem}
.ck input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
.ck small{display:block;color:var(--muted)}
.ckh{font-weight:800;color:var(--primary);margin:14px 0 4px;font-size:.9rem}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:7px 10px;font-size:.78rem;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px;font-size:.9rem;border:1px solid var(--line)}
.groups{display:grid;gap:10px}
@media(min-width:620px){.groups{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}

/* ===================== AUTH ===================== */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr}
@media(min-width:960px){.auth{grid-template-columns:1.1fr 1fr}}
.auth .side{display:none;position:relative;overflow:hidden;background:linear-gradient(150deg,#0A6E66,#0899A9 60%,#55620A);color:#fff;padding:48px}
@media(min-width:960px){.auth .side{display:flex;flex-direction:column;justify-content:space-between}}
.auth .side h2{color:#fff;font-size:2rem;line-height:1.2;max-width:460px}
.auth .side li{margin-bottom:10px}
.auth .side .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.auth .main{display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.auth .box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.auth .logos{justify-content:center;margin-bottom:16px}
.auth .logos img{height:46px}.auth .logos img.spr{height:40px}
.auth h1{text-align:center;color:var(--primary);font-size:1.3rem}
.auth .sub{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:16px}
.atabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:16px;border:1px solid var(--line)}
.atabs button{border:none;background:none;padding:9px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted);min-height:42px}
.atabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.rolebtns{display:grid;gap:10px}
.rolebtn{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);cursor:pointer;min-height:64px}
.rolebtn:hover{border-color:var(--primary-2)}
.rolebtn .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;flex:none}
.rolebtn.p .ic{background:var(--pes-soft);color:var(--pes)} .rolebtn.f .ic{background:var(--fas-soft);color:var(--fas)}
.rolebtn b{display:block;color:var(--ink)}.rolebtn>span>span{display:block;font-size:.8rem;color:var(--muted)}
.err{color:var(--bad);font-size:.86rem;margin-top:8px}.okmsg{color:var(--ok);font-size:.86rem;margin-top:8px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
/* onboarding wizard */
.wiz{max-width:560px;margin:0 auto}
.wiz .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.wiz .dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:.3s}
.wiz .dots i.on{width:26px;background:var(--accent)}
.wiz .ill{font-size:3rem;text-align:center;margin:6px 0}

/* ===================== OVERLAYS ===================== */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.88rem;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,24,22,.5);z-index:70;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@media(min-width:760px){.modal{align-items:center}}
.modal .mbox{background:var(--surface);width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;animation:up .25s}
@keyframes up{from{transform:translateY(30px)}}
@media(min-width:760px){.modal .mbox{border-radius:22px}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--surface);z-index:75;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding:18px;overflow:auto;animation:slide .25s}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer-bg{position:fixed;inset:0;z-index:74;background:rgba(10,24,22,.35)}
.notif{display:flex;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;background:var(--surface)}
.notif.unread{background:var(--accent-soft);border-color:transparent}
.notif .ni{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.1rem;background:var(--primary-soft)}
.notif b{display:block;font-size:.9rem}.notif p{font-size:.84rem;margin:2px 0}.notif small{color:var(--muted);font-size:.74rem}
.a11y-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.a11y-row b{display:block;font-size:.9rem}.a11y-row small{color:var(--muted);font-size:.78rem}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:3px solid var(--focus)}
/* tour */
.tour-hole{position:fixed;z-index:80;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,20,18,.62);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-card{position:fixed;z-index:81;width:min(340px,calc(100vw - 24px));background:var(--surface);border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:top .35s,left .35s;animation:pop .3s}
.tour-card h3{margin:0 0 6px;color:var(--primary)}
.tour-card p{font-size:.9rem;color:var(--ink-2)}
.tour-card .dots{display:flex;gap:5px;margin:8px 0 12px}
.tour-card .dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.tour-card .dots i.on{width:20px;background:var(--accent)}
.tour-card .ill{font-size:2.2rem}

/* ===================== VIEWER ===================== */
.viewer{position:fixed;inset:0;z-index:85;background:#1d2422;display:flex;flex-direction:column;animation:fade .2s}
.viewer .vbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#121816;color:#fff;flex-wrap:wrap}
.viewer .vbar b{flex:1;order:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.viewer .vbtn{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.82rem;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
.viewer .vbtn:hover{background:rgba(255,255,255,.2)}
.viewer .vbtn.on{background:#0FB8AA;color:#062b27}
@media(max-width:620px){.viewer .vbar b{flex:1 0 100%;order:-1}}
.viewer .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.viewer .stage.scroll{overflow:auto;display:block;padding:16px}
.viewer .stage.scroll canvas{display:block;margin:0 auto 12px;max-width:100%;box-shadow:0 6px 24px rgba(0,0,0,.4);background:#fff}
.viewer .book{margin:0 auto}
.viewer .page{background:#fff;overflow:hidden}
.viewer .page canvas{width:100%;height:100%;display:block}
.viewer .page .ph{display:grid;place-items:center;height:100%;color:#999;font-size:.9rem}
.viewer .vfoot{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;background:#121816;color:#cfd8d6;font-size:.84rem}
.viewer .vfoot input{color:#111;background:#fff;width:60px;text-align:center;border-radius:8px;border:none;padding:6px;min-height:34px}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}
.viewer .side{position:absolute;left:0;top:0;bottom:0;width:min(300px,85vw);background:#121816;color:#dfe7e5;overflow:auto;padding:12px;z-index:3;transform:translateX(-100%);transition:.25s}
.viewer .side.on{transform:none}
.viewer .side button{display:block;width:100%;text-align:left;background:none;border:none;color:inherit;padding:8px;border-radius:8px;cursor:pointer;font-size:.84rem}
.viewer .side button:hover{background:rgba(255,255,255,.08)}
.viewer .loading{color:#cfd8d6;text-align:center}
.viewer .navbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:48px;height:72px;border:none;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:1.6rem;cursor:pointer}
.viewer .navbtn.l{left:8px}.viewer .navbtn.r{right:8px}
.doc{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.doc .cover{flex:none;width:58px;height:76px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.72rem;box-shadow:0 4px 12px rgba(0,0,0,.15);position:relative;overflow:hidden}
.doc .cover::after{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.doc .tt{flex:1;min-width:0}.doc .tt b{display:block}.doc .tt span{font-size:.8rem;color:var(--muted)}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ===================== BOARD & CERT ===================== */

.btn .ico{width:1.1em;height:1.1em}

    const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });

const Store = {
  user: null, token: null, data: {}, progress: {}, tests: {}, cert: null,
  key() { return 'cbcel:' + (this.user ? this.user.email : 'anon'); },
  boot() {
    const s = ls.get('cbcel:session'); if (!s) return false;
    this.user = s.user; this.token = s.token;
    const d = ls.get(this.key()) || {}; this.data = d.data || {}; this.progress = d.progress || {}; this.tests = d.tests || {}; this.cert = d.cert || null;
    return true;
  },
  login(user, token) { this.user = user; this.token = token || null; ls.set('cbcel:session', { user, token }); this.boot(); },
  updateUser(patch) { Object.assign(this.user, patch); ls.set('cbcel:session', { user: this.user, token: this.token }); },
  logout() { if (!DEMO && this.token) Api.call('logout').catch(() => { }); ls.del('cbcel:session'); this.user = null; this.token = null; },
  persist() { ls.set(this.key(), { data: this.data, progress: this.progress, tests: this.tests, cert: this.cert }); },
  get(k, def) { if (this.data[k] == null && def !== undefined) this.data[k] = clone(def); return this.data[k]; },
  async pull() {
    if (DEMO) return;
    const j = await Api.call('getState');
    this.data = Object.assign({}, this.data, j.data || {}); this.progress = Object.assign({}, this.progress, j.progress || {}); this.tests = j.tests || this.tests; this.cert = j.cert || this.cert; this.persist();
  },
  queue: {},
  save(k) {
    this.persist();
    if (DEMO) { setSync('Tersimpan di perangkat ini'); return; }
    this.queue[k] = true; setSync('Menyimpan…'); this.flush();
  },
  flush: debounce(async function () {
    const ks = Object.keys(Store.queue); Store.queue = {};
    try { for (const k of ks) await Api.call('save', { key: k, value: Store.data[k] }); setSync('Tersimpan'); }
    catch (e) { ks.forEach(k => Store.queue[k] = true); setSync('Gagal sinkron, tersimpan di perangkat', true); }
  }, 900),
  async setProgress(unit, patch) {
    this.progress[unit] = Object.assign({}, this.progress[unit], patch); this.persist();
    if (!DEMO) { try { const p = this.progress[unit]; await Api.call('progress', { unit, done: !!p.done, quiz: p.quiz ?? null, read: p.read || 0 }); } catch (e) { setSync('Gagal sinkron progres', true); } }
  },
  pushProgress: debounce(function (unit) { Store.setProgress(unit, {}); }, 1500)
};

const DemoAuth = {
  all() { return ls.get('cbcel:accounts') || {}; }, put(a) { ls.set('cbcel:accounts', a); },
  async login(em, pw) { const a = this.all()[em]; if (!a || a.hash !== await sha256(em + pw)) throw new Error('Email atau kata sandi salah.'); if (a.status === 'menunggu') throw new Error('Akun fasilitator Anda menunggu persetujuan panitia. Pemberitahuan dikirim lewat email setelah disetujui.'); if (a.status === 'nonaktif') throw new Error('Akun tidak aktif. Hubungi panitia.'); return { user: { email: em, nama: a.nama, klinik: a.klinik, hp: a.hp, peran: a.peran, onboarded: a.onboarded } }; },
  async register(d) { const a = this.all(); if (a[d.email]) throw new Error('Email sudah terdaftar. Silakan masuk atau pakai "Lupa kata sandi".');
    if (d.peran === 'fasilitator') { a[d.email] = { nama: d.nama, klinik: d.klinik + (d.jabatan ? ' · ' + d.jabatan : ''), hp: d.hp, peran: 'fasilitator', status: 'menunggu', dibuat: new Date().toISOString(), hash: await sha256(d.email + d.sandi) }; this.put(a); return { pending: true, peran: 'fasilitator' }; }
    a[d.email] = { nama: d.nama, klinik: d.klinik, hp: d.hp, peran: 'peserta', hash: await sha256(d.email + d.sandi) }; this.put(a); return { user: { email: d.email, nama: d.nama, klinik: d.klinik, hp: d.hp, peran: 'peserta' } }; },
  async lupa(em) { const a = this.all(); if (!a[em]) return { demoCode: null }; const c = String(Math.floor(100000 + Math.random() * 900000)); a[em].reset = c; this.put(a); return { demoCode: c }; },
  async reset(em, kd, pw) { const a = this.all(); if (!a[em] || a[em].reset !== kd) throw new Error('Kode salah atau sudah tidak berlaku.'); a[em].hash = await sha256(em + pw); delete a[em].reset; this.put(a); },
  pending() { return Object.entries(this.all()).filter(([, x]) => x.status === 'menunggu').map(([email, x]) => ({ email, nama: x.nama, klinik: x.klinik, hp: x.hp, peran: x.peran, dibuat: x.dibuat })); },
  setujui(em, k) { const a = this.all(); if (a[em]) { a[em].status = k; this.put(a); } },
  setOnboarded(em) { const a = this.all(); if (a[em]) { a[em].onboarded = true; this.put(a); } }
};

      ${UNIT_META[u].tool ? `<a class="btn acc" href="#/unit/${u}/alat">Lanjut ke ${toolName(UNIT_META[u].tool)} ›</a>` : FORMATIF[u] ? `<a class="btn acc" href="#/unit/${u}/kuis">Lanjut ke kuis ›</a>` : ''}</div>`;
  },

    return `<section class="blk k${b.k || 1} ${b.type === 'key' ? 'keyb' : ''} ${done ? 'done' : ''}" data-bi="${i}" aria-label="${esc(b.title)}"><span class="done-mark">${ic('check')} dibaca</span>
      <div class="bh"><div class="bi" aria-hidden="true">${ic(b.icon || 'info')}</div><div class="bt"><div class="k">${esc(b.kicker || '')}</div><h3>${esc(b.title)}</h3></div></div>
      ${b.lead ? `<p class="lead">${b.lead}</p>` : ''}${inner}</section>`;
  },
  after() {
    if (this.obs) this.obs.disconnect();

      else clearTimeout(timers[i]);
    }), { threshold: .35 });
    $$('#lesson .blk').forEach(el => this.obs.observe(el));
    this.bindDrag();
  },

    const el = $(`#lesson [data-bi="${i}"]`); el && el.classList.add('done');

    const rb = $('#readBar'); if (rb) { rb.style.width = p.read + '%'; $('#readPct').textContent = p.read + '%'; }
    if (p.read === 100) toast('Materi unit ini selesai dibaca');
  },
  onShow(i, el) {
    const b = this.blocks[i];
    if (b.type === 'hero') $$('[data-count]', el).forEach(n => this.countUp(n));
    if (b.type === 'bars') setTimeout(() => $$('.fill', el).forEach(f => f.style.width = f.dataset.w + '%'), 150);
    if (b.type === 'timeline' && !this.st[i]) this.act(i, 'tl', 0, true);

0: [
  { type: 'hero', k: 1, kicker: 'Unit 0 · MPD 1', title: 'Mengapa keberlanjutan CBC mendesak sekarang?', lead: 'Empat angka yang menjelaskan situasinya.',
    stats: [{ v: 564000, l: 'perkiraan ODHIV di Indonesia, 2025' }, { v: 2030, fmt: 'year', l: 'target eliminasi HIV, AIDS, dan IMS' }, { v: 2032, fmt: 'year', l: 'setelahnya dukungan Global Fund untuk HIV berakhir' }, { v: 76, suf: '%', l: 'kasus terkonsentrasi di 11 provinsi' }],
    say: 'Mari kita mulai dengan empat angka. Indonesia diperkirakan memiliki sekitar lima ratus enam puluh empat ribu orang dengan HIV pada tahun dua ribu dua puluh lima. Pemerintah menargetkan eliminasi HIV, AIDS, dan infeksi menular seksual pada tahun dua ribu tiga puluh. Sementara itu, dukungan Global Fund untuk HIV dijadwalkan berakhir setelah tahun dua ribu tiga puluh dua. Dan tujuh puluh enam persen kasus terkonsentrasi di sebelas provinsi.' },
  { type: 'bars', k: 3, icon: 'barchart', kicker: 'Kaskade layanan', title: 'Masih jauh dari target 95-95-95', lead: 'Ketuk setiap batang untuk melihat artinya bagi klinik Anda.', max: 100, target: { v: 95, l: 'Target 95%' },
    items: [{ l: 'Mengetahui status', v: 63, note: 'Baru 63% ODHIV mengetahui statusnya. Penjangkauan dan tes di komunitas adalah kekuatan utama CBC.' }, { l: 'Mendapat ARV', v: 67, note: '67% dari yang mengetahui status sudah mendapat ARV. Pendampingan sebaya membantu orang memulai pengobatan.' }, { l: 'Virus tersupresi', v: 55, note: 'Capaian terendah. Menjaga orang tetap berobat dan dipantau adalah kerja jangka panjang yang butuh pembiayaan stabil.' }],
    ask: { q: 'Di titik mana CBC paling berperan?', opts: ['Menemukan kasus dan menjaga retensi pengobatan', 'Produksi obat ARV'], a: 0, ex: 'Kesenjangan terbesar ada di awal kaskade dan di retensi. Komunitas lebih mudah dijangkau oleh layanan yang mereka percaya.' },
    say: 'Lihat kaskade layanan. Baru enam puluh tiga persen orang dengan HIV yang mengetahui statusnya. Enam puluh tujuh persen yang mengetahui statusnya sudah mendapat ARV. Dan hanya lima puluh lima persen yang virusnya tersupresi. Semuanya masih jauh dari target sembilan puluh lima persen. Kesenjangan terbesar ada di awal kaskade, yaitu menemukan orang yang belum tahu statusnya, dan di retensi pengobatan. Di dua titik inilah klinik berbasis komunitas paling berperan.' },
  { type: 'timeline', k: 1, icon: 'calendar', kicker: 'Linimasa', title: 'Pendanaan berubah, transisi sudah dimulai', lead: 'Ketuk setiap titik waktu.',
    nodes: [{ y: '2025', t: 'Bantuan eksternal turun', d: 'Bantuan kesehatan eksternal turun tajam di banyak negara, termasuk untuk program HIV.' }, { y: 'Mar 2026', t: 'Kemenkes memimpin transisi', d: 'Kementerian Kesehatan memimpin transisi pembiayaan: peta jalan pengalihan, mekanisme pembelian layanan, dan model kontrak.' }, { y: '2026–2031', t: 'Strategi AIDS Global', d: 'Integrasi layanan HIV ke layanan primer dan jaminan kesehatan, kontrak sosial untuk layanan komunitas, formalisasi pendamping sebaya.' }, { y: '2029–2031', t: 'Alokasi final GC9', d: 'Hibah HIV Global Fund untuk Indonesia berada pada alokasi terakhir (Grant Cycle 9).' }, { y: '2030', t: 'Target eliminasi', d: 'Target nasional eliminasi HIV, AIDS, dan IMS (Permenkes 23/2022).' }, { y: '> 2032', t: 'Dukungan berakhir', d: 'Dukungan Global Fund untuk HIV dijadwalkan berakhir. Layanan harus sudah bertumpu pada dana domestik.' }],
    say: 'Sekarang linimasanya. Pada tahun dua ribu dua puluh lima, bantuan kesehatan eksternal turun tajam. Sejak Maret dua ribu dua puluh enam, Kementerian Kesehatan memimpin transisi pembiayaan. Strategi AIDS Global dua ribu dua puluh enam sampai dua ribu tiga puluh satu mendorong integrasi layanan HIV ke layanan primer dan jaminan kesehatan, serta kontrak sosial untuk layanan komunitas. Hibah HIV Global Fund untuk Indonesia berada pada alokasi terakhir, tahun dua ribu dua puluh sembilan sampai dua ribu tiga puluh satu, dan dukungannya dijadwalkan berakhir setelah tahun dua ribu tiga puluh dua.' },
  { type: 'flips', k: 3, icon: 'scale', kicker: 'Regulasi', title: 'Lima regulasi yang membuka jalan', lead: 'Tidak perlu menghafal nomor. Cukup tahu regulasi mana yang membuka langkah klinik Anda.',
    cards: [{ ic: 'hospital', t: 'Izin klinik', sub: 'PP 28/2025 · Permenkes 11/2025', b: 'Izin diurus lewat OSS berbasis risiko. Klinik wajib terakreditasi paling lambat dua tahun setelah izin terbit.' }, { ic: 'card', t: 'JKN', sub: 'Perpres 82/2018 jo. 59/2024 · Permenkes 3/2023', b: 'Klinik pratama dapat menjadi FKTP dan menerima kapitasi Rp9.000–16.000 per peserta per bulan.' }, { ic: 'file', t: 'Kontrak daerah', sub: 'Perpres 46/2025 · LKPP 3/2021', b: 'Pemerintah daerah dapat membeli layanan komunitas lewat swakelola tipe III dengan organisasi kemasyarakatan.' }, { ic: 'target', t: 'HIV dan SPM', sub: 'Permenkes 23/2022 · 6/2024', b: 'Peran masyarakat diakui. Layanan SPM bagi orang berisiko HIV boleh diberikan fasilitas swasta.' }, { ic: 'lock', t: 'Data', sub: 'UU 27/2022 · Permenkes 24/2022', b: 'Data kesehatan adalah data pribadi spesifik yang wajib dilindungi khusus. Rekam medis elektronik terhubung SATUSEHAT.' }],
    say: 'Ada lima kelompok regulasi yang perlu Anda kenal. Pertama, izin klinik, yang kini diurus lewat sistem OSS berbasis risiko, dan klinik wajib terakreditasi paling lambat dua tahun setelah izin terbit. Kedua, JKN. Klinik pratama dapat menjadi fasilitas kesehatan tingkat pertama dan menerima kapitasi. Ketiga, kontrak daerah. Pemerintah daerah dapat membeli layanan komunitas lewat swakelola tipe tiga. Keempat, HIV dan standar pelayanan minimal. Layanan bagi orang berisiko HIV boleh diberikan fasilitas swasta. Kelima, pelindungan data. Data kesehatan adalah data pribadi spesifik yang wajib dilindungi secara khusus.' },
  { type: 'tf', k: 4, icon: 'circleCheck', kicker: 'Cek cepat', title: 'Benar atau salah?',
    items: [{ s: 'Klinik swasta boleh memberikan layanan SPM bagi orang dengan risiko terinfeksi HIV.', a: true, ex: 'Permenkes 6/2024 menyebut layanan dapat diberikan di fasilitas pemerintah maupun swasta.' }, { s: 'Usulan APBD cukup diajukan sebulan sebelum tahun anggaran dimulai.', a: false, ex: 'Usulan masuk siklus perencanaan sekitar setahun sebelumnya, mulai dari musrenbang awal tahun.' }, { s: 'Data kesehatan pengguna termasuk data pribadi yang bersifat spesifik.', a: true, ex: 'UU 27/2022 tentang Pelindungan Data Pribadi.' }],
    say: 'Sekarang cek pemahaman Anda dengan tiga pernyataan benar atau salah. Pilih jawaban Anda di layar.' },
  { type: 'key', k: 1, icon: 'bulb', kicker: 'Intinya', title: 'Langkah pertama perlu diambil sekarang', big: 'Enam tahun terdengar panjang, tetapi usulan APBD disiapkan setahun sebelumnya dan kredensialing JKN butuh berbulan-bulan.',
    list: ['Pahami fungsi klinik mana yang masih dibiayai donor.', 'Kenali regulasi yang membuka jalur dana publik.', 'Mulai rencana transisi selagi masih ada waktu.'],
    say: 'Intinya, enam tahun terdengar panjang. Namun usulan APBD disiapkan setahun sebelumnya, dan kredensialing JKN butuh berbulan-bulan. Jadi langkah pertama perlu diambil sekarang: pahami fungsi mana yang masih dibiayai donor, kenali regulasi yang membuka jalur dana publik, dan mulai rencana transisi selagi masih ada waktu.' }
],
1: [
  { type: 'hero', k: 2, kicker: 'Unit 1 · MPD 2', title: 'Apa itu Community-Based Clinic?', lead: 'Klinik berizin yang terutama melayani ODHIV, populasi kunci, serta komunitas rentan dan terdampak.',
    pills: ['Berizin dan sesuai standar', 'Layanan klinis HIV', 'Layanan berbasis komunitas', 'Komunitas terlibat dalam tata kelola'],
    say: 'Apa itu Community-Based Clinic, atau CBC? CBC adalah klinik berizin yang terutama melayani orang dengan HIV, populasi kunci, serta komunitas rentan dan terdampak. Ada empat unsur: berizin dan sesuai standar, memberikan layanan klinis HIV, memadukannya dengan layanan berbasis komunitas, dan melibatkan komunitas dalam tata kelolanya. CBC tetap boleh melayani masyarakat umum, dan justru hal ini dapat memperkuat keberlanjutannya.' },
  { type: 'compare', k: 2, icon: 'home', kicker: 'Model kepemilikan', title: 'Tiga model CBC', lead: 'Ketuk setiap model.',
    tabs: [{ t: 'Milik komunitas', h: '<b>Model 1 · Milik komunitas</b><p style="margin:6px 0 0">Didirikan dan dikelola organisasi komunitas. <mark class="hl">Kepercayaan pengguna tinggi</mark>; perlu sistem keuangan, perizinan, dan SDM klinis yang kuat.</p>' }, { t: 'Swasta + komunitas', h: '<b>Model 2 · Swasta bermitra dengan komunitas</b><p style="margin:6px 0 0">Klinik swasta bekerja sama dengan organisasi komunitas. <mark class="hl">Modal dan manajemen kuat</mark>; misi dijaga lewat perjanjian tertulis.</p>' }, { t: 'Kemitraan pemerintah', h: '<b>Model 3 · Kemitraan dengan pemerintah</b><p style="margin:6px 0 0">Layanan komunitas yang terhubung dengan fasilitas pemerintah. <mark class="hl">Akses program lebih mudah</mark>; perlu kontrak yang jelas.</p>' }],
    say: 'Ada tiga model kepemilikan CBC. Model pertama, milik komunitas, dengan kepercayaan pengguna yang tinggi, tetapi perlu sistem keuangan dan perizinan yang kuat. Model kedua, swasta yang bermitra dengan komunitas, dengan modal dan manajemen kuat; misinya dijaga lewat perjanjian tertulis. Model ketiga, kemitraan dengan pemerintah, dengan akses program yang lebih mudah, tetapi perlu kontrak yang jelas.' },
  { type: 'radial', k: 2, icon: 'link', kicker: 'Posisi dalam sistem', title: 'Satu klinik, banyak peran', lead: 'Setiap peran membuka jalur pembiayaan yang berbeda.', center: { t: 'CBC', s: 'banyak peran' },
    nodes: [{ t: 'Fasyankes', s: 'pendapatan layanan', d: 'Sebagai fasilitas pelayanan kesehatan, klinik menerima pendapatan dari layanan umum dan layanan berbayar yang tidak membebani pengguna kurang mampu.' }, { t: 'FKTP mitra JKN', s: 'kapitasi dan non-kapitasi', d: 'Sebagai FKTP, klinik pratama menerima kapitasi per peserta terdaftar dan klaim non-kapitasi.' }, { t: 'Jejaring HIV', s: 'komoditas program', d: 'ARV, reagen, dan kondom dari program pemerintah diterima sebagai nilai in-kind.' }, { t: 'Pelaksana swakelola', s: 'APBD lewat kontrak', d: 'Pemda membeli layanan penjangkauan, tes komunitas, dan pendampingan melalui swakelola tipe III.' }, { t: 'Mitra donor', s: 'hibah masa transisi', d: 'Hibah donor dipakai untuk membiayai peralihan, bukan untuk layanan rutin jangka panjang.' }, { t: 'Mitra swasta', s: 'CSR dan filantropi', d: 'Sumber pelengkap untuk kegiatan tertentu, misalnya alat, renovasi, atau beasiswa.' }],
    say: 'Satu klinik dapat memainkan beberapa peran sekaligus, dan setiap peran membuka jalur pembiayaan yang berbeda. Sebagai fasilitas pelayanan kesehatan, klinik menerima pendapatan layanan. Sebagai FKTP mitra JKN, klinik menerima kapitasi dan klaim non-kapitasi. Sebagai bagian jejaring HIV, klinik menerima komoditas program. Sebagai pelaksana swakelola, klinik dibayar APBD lewat kontrak. Sebagai mitra donor, klinik menerima hibah masa transisi. Dan sebagai mitra swasta, klinik dapat menerima CSR dan filantropi. Ketuk setiap lingkaran untuk melihat penjelasannya.' },
  { type: 'sort', k: 5, icon: 'puzzle', kicker: 'Pilah', title: 'Fungsi mana yang paling berisiko hilang?', bins: [{ t: 'Paling bergantung donor', col: 'var(--c5)', bg: 'var(--c5s)' }, { t: 'Sudah punya jalur dana publik', col: 'var(--c1)', bg: 'var(--c1s)' }],
    items: [{ t: 'Penjangkauan populasi kunci', b: 0, ex: 'Penjangkauan umumnya dibiayai donor.' }, { t: 'Pendampingan sebaya', b: 0, ex: 'Pendamping sebaya sering dibayar honor donor.' }, { t: 'Pelaporan dan pengolahan data', b: 0, ex: 'Petugas data sering dibiayai proyek.' }, { t: 'Pemberian ARV', b: 1, ex: 'ARV disediakan program pemerintah.' }, { t: 'Pemeriksaan pasien umum', b: 1, ex: 'Dapat dibiayai JKN atau pendapatan layanan.' }],
    done: 'Justru fungsi yang membuat CBC berbeda adalah yang paling rentan.',
    say: 'Sekarang coba pilah. Fungsi mana yang paling bergantung pada donor, dan mana yang sudah punya jalur dana publik? Seret atau ketuk setiap kartu ke kotak yang tepat.' },
  { type: 'check', k: 2, icon: 'circleCheck', kicker: 'Cek diri', title: 'Empat standar minimal keterlibatan komunitas', lead: 'Centang yang sudah dipenuhi klinik Anda.',
    items: ['Wakil komunitas atau ODHIV duduk di forum pengambil keputusan', 'Pendamping sebaya menjadi bagian tetap tim layanan', 'Ada mekanisme umpan balik dan pengaduan yang ditindaklanjuti', 'Keputusan yang memengaruhi akses dibahas bersama komunitas lebih dulu'],
    result: n => n === 4 ? ic('star', 'ok') + ' Keempat standar terpenuhi. Pertahankan dan dokumentasikan buktinya.' : n >= 2 ? `${ic('circleCheck', 'ok')} ${n} dari 4 terpenuhi. Pilih satu standar yang paling realistis untuk diperbaiki bulan ini.` : `${ic('leaf', 'ok')} ${n} dari 4 terpenuhi. Mulailah dari mekanisme pengaduan yang sederhana.`,
    say: 'Ada empat standar minimal keterlibatan komunitas yang berlaku untuk semua model CBC. Pertama, wakil komunitas atau ODHIV duduk di forum pengambil keputusan. Kedua, pendamping sebaya menjadi bagian tetap tim layanan. Ketiga, ada mekanisme umpan balik dan pengaduan yang ditindaklanjuti. Keempat, keputusan yang memengaruhi akses dibahas bersama komunitas sebelum diberlakukan. Centang standar yang sudah dipenuhi klinik Anda.' },
  { type: 'key', k: 2, icon: 'bulb', kicker: 'Intinya', title: 'Tujuh prinsip untuk setiap keputusan', big: 'Tidak meninggalkan siapa pun, keterlibatan bermakna, hak asasi, kerahasiaan, akses di atas target pendapatan, mutu, dan akuntabilitas.',
    say: 'Intinya, ada tujuh prinsip yang berlaku untuk setiap keputusan: tidak meninggalkan siapa pun, keterlibatan bermakna komunitas, hak asasi dan nondiskriminasi, kerahasiaan, akses di atas target pendapatan, mutu sesuai standar, serta akuntabilitas dan transparansi.' }
],
2: [
  { type: 'hero', k: 3, kicker: 'Unit 2 · MPI 1', title: 'Seberapa siap klinik Anda?', lead: 'Kesiapan dinilai dari sembilan domain dengan skala 1 sampai 4.',
    pills: ['A Tata kelola', 'B Perencanaan', 'C Keuangan', 'D SDM', 'E Sistem informasi', 'F Logistik', 'G Kemitraan', 'H Perizinan', 'I Akses & komunitas'],
    say: 'Seberapa siap klinik Anda? Kesiapan dinilai dari sembilan domain dengan skala satu sampai empat: tata kelola, perencanaan, keuangan, sumber daya manusia, sistem informasi, logistik, kemitraan, perizinan, serta akses, mutu, dan keterlibatan komunitas. Kesiapan kelembagaan adalah rata-rata domain A, B, D, E, F, G, dan H. Kesiapan finansial adalah domain C. Domain I adalah syarat dan tidak masuk skor.' },
  { type: 'gauge', k: 3, icon: 'gauge', kicker: 'Coba geser', title: 'Dari skor ke tingkat kesiapan', lead: 'Geser penggaris untuk melihat tingkatnya.', v: 2.3,
    say: 'Rata-rata skor dibaca sebagai empat tingkat. Sampai satu koma tujuh lima disebut merintis. Sampai dua koma lima disebut berkembang. Sampai tiga koma dua lima disebut mapan. Di atasnya disebut maju. Klinik dianggap siap menghadapi transisi bila kesiapan kelembagaan dan finansial sama-sama di atas dua koma lima. Coba geser penggaris di layar.' },
  { type: 'tree', k: 3, icon: 'branch', kicker: 'Pohon keputusan', title: 'Tentukan tipe klinik dalam tiga pertanyaan', lead: 'Jawab sesuai kondisi klinik Anda.', start: 'q1',
    nodes: { q1: { q: 'Punya izin klinik sendiri yang masih berlaku?', yes: 'q2', no: 't4' }, q2: { q: 'Kesiapan finansial (domain C) di atas 2,50?', yes: 'q3', no: 't3' }, q3: { q: 'Sudah punya PKS BPJS atau kontrak pemda aktif?', yes: 't1', no: 't2' } },
    results: { t1: { t: 'Tipe 1 · Terhubung dana publik', col: '#00897B', d: 'Perluas sumber dana publik dan perkuat efisiensi. Lanjut ke Unit 3 dan 4.' }, t2: { t: 'Tipe 2 · Mapan, belum terhubung', col: '#0277BD', d: 'Prioritaskan kredensialing JKN atau swakelola. Lanjut ke Unit 4.' }, t3: { t: 'Tipe 3 · Rentan finansial', col: '#D97706', d: 'Hitung kebutuhan minimum dan tetapkan fungsi prioritas. Mulai dari Unit 3 dan Unit 7.' }, t4: { t: 'Tipe 4 · Belum berizin mandiri', col: '#D9534F', d: 'Pelajari jalur perizinan di Pedoman Bab 3 sebelum langkah pembiayaan lain.' } },
    say: 'Tipe klinik ditentukan dengan tiga pertanyaan berurutan. Pertama, apakah klinik punya izin sendiri yang masih berlaku? Jika tidak, klinik termasuk tipe empat. Kedua, apakah kesiapan finansial di atas dua koma lima? Jika tidak, tipe tiga. Ketiga, apakah klinik sudah punya perjanjian kerja sama dengan BPJS atau kontrak pemerintah daerah? Jika ya, tipe satu. Jika belum, tipe dua. Coba jawab sesuai kondisi klinik Anda.' },
  { type: 'scatter', k: 6, icon: 'scatter', kicker: 'Data lapangan', title: 'Posisi tujuh CBC (anonim), Oktober 2026', lead: 'Ketuk titik untuk melihat rinciannya. Area hijau berarti siap pada kedua dimensi.', xl: 'Kesiapan kelembagaan', yl: 'Kesiapan finansial',
    points: [{ l: 'CBC A', x: 3.21, y: 3.20, tipe: 1, d: 'Sudah terhubung dana publik.' }, { l: 'CBC B', x: 2.64, y: 2.60, tipe: 4, d: 'Layanan di bawah jejaring puskesmas, belum berizin mandiri.' }, { l: 'CBC C', x: 3.09, y: 2.60, tipe: 2, d: 'Klinik utama; perlu penyesuaian izin untuk kapitasi.' }, { l: 'CBC D', x: 2.33, y: 1.24, tipe: 3, d: 'Finansial paling rentan.' }, { l: 'CBC E', x: 2.85, y: 3.40, tipe: 2, d: 'Klinik utama dengan finansial kuat.' }, { l: 'CBC F', x: 3.28, y: 3.27, tipe: 2, d: 'Siap, tinggal membuka jalur JKN atau kontrak.' }, { l: 'CBC G', x: 2.71, y: 2.20, tipe: 3, d: 'Kelembagaan mapan, finansial berkembang.' }],
    say: 'Ini posisi tujuh CBC dari hasil self-assessment Oktober dua ribu dua puluh enam. Sumbu mendatar adalah kesiapan kelembagaan, sumbu tegak kesiapan finansial. Satu klinik tipe satu, tiga tipe dua, dua tipe tiga, dan satu tipe empat. Butir terlemah di hampir semua klinik adalah kerja sama dengan BPJS Kesehatan. Ketuk titik untuk melihat rinciannya.' },
  { type: 'flips', k: 3, icon: 'layers', kicker: 'Fondasi organisasi', title: 'Empat fondasi sebelum dana baru masuk',
    cards: [{ ic: 'landmark', t: 'Tata kelola', b: 'Struktur tertulis, badan pengawas aktif, keputusan tercatat, SOP, dan wakil komunitas.' }, { ic: 'users', t: 'SDM', b: 'Peta staf dan sumber honornya. Dalam self-assessment, <mark class="hl">11 dari 23 responden</mark> masih dibayar dari honor donor.' }, { ic: 'monitor', t: 'Sistem', b: 'Pelaporan SIHA tepat waktu dan rekam medis elektronik yang tersambung ke SATUSEHAT, tidak bergantung lisensi donor.' }, { ic: 'file', t: 'Jenis izin', b: 'Klinik pratama adalah FKTP dan dapat menerima kapitasi. Klinik utama adalah FKRTL dan perlu penyesuaian izin.' }],
    say: 'Pembiayaan baru hanya bisa masuk bila fondasinya kuat. Ada empat fondasi. Tata kelola, yaitu struktur tertulis, badan pengawas aktif, dan keputusan yang tercatat. Sumber daya manusia: dalam self-assessment, sebelas dari dua puluh tiga responden masih dibayar dari honor donor. Sistem: pelaporan tepat waktu dan rekam medis elektronik. Dan jenis izin: klinik pratama adalah FKTP dan dapat menerima kapitasi, sedangkan klinik utama adalah fasilitas rujukan.' },
  { type: 'key', k: 3, icon: 'bulb', kicker: 'Langkah berikutnya', title: 'Isi self-assessment klinik Anda', big: 'Isi 34 butir sesuai kondisi saat ini, bukan rencana. Skor, tingkat, dan tipe klinik akan dihitung otomatis.',
    say: 'Langkah berikutnya, isi self-assessment klinik Anda. Ada tiga puluh empat butir. Isilah sesuai kondisi saat ini, bukan rencana. Skor, tingkat, dan tipe klinik akan dihitung otomatis.' }
],
3: [
  { type: 'sort', k: 4, icon: 'inbox', kicker: 'Pilah biaya', title: 'Tetap, variabel, atau in-kind?', bins: [{ t: 'Biaya tetap', col: 'var(--c4)', bg: 'var(--c4s)' }, { t: 'Biaya variabel', col: 'var(--c3)', bg: 'var(--c3s)' }, { t: 'Nilai in-kind', col: 'var(--c6)', bg: 'var(--c6s)' }],
    items: [{ t: 'Honor perawat tetap', b: 0, ex: 'Tidak berubah walau kunjungan naik-turun.' }, { t: 'Sewa gedung', b: 0, ex: 'Dibayar sama setiap bulan.' }, { t: 'Listrik dan internet', b: 0, ex: 'Relatif tetap setiap bulan.' }, { t: 'BMHP per kunjungan', b: 1, ex: 'Bertambah setiap ada kunjungan.' }, { t: 'Reagen yang dibeli klinik', b: 1, ex: 'Bertambah sesuai jumlah tes.' }, { t: 'ARV dari program', b: 2, ex: 'Diterima tanpa membayar.' }, { t: 'Staf puskesmas yang diperbantukan', b: 2, ex: 'Dibayar pihak lain.' }],
    done: 'Biaya tunai ditambah nilai in-kind disebut biaya penuh.',
    say: 'Mulai dengan mengenali jenis biaya. Biaya tetap tidak berubah walau kunjungan naik atau turun, misalnya honor tetap dan sewa. Biaya variabel bertambah di setiap kunjungan, misalnya bahan habis pakai. Nilai in-kind adalah barang atau jasa yang diterima tanpa membayar, seperti ARV dari program. Coba pilah tujuh kartu ini ke kotak yang tepat.' },
  { type: 'steps', k: 4, icon: 'steps', kicker: 'Cara menghitung', title: 'Enam langkah menghitung biaya per layanan',
    items: [{ t: 'Biaya tetap', d: 'Jumlahkan semua biaya tetap per bulan, <mark class="hl">termasuk honor yang dibayar donor</mark>. Contoh: Rp50,5 juta.' }, { t: 'Volume', d: 'Catat jumlah layanan per bulan per jenis. Contoh: 300 tes HIV, 450 kunjungan ARV, 100 PrEP, 50 IMS.' }, { t: 'Bobot waktu', d: 'Layanan acuan, misalnya tes HIV 30 menit, berbobot 1,0. Layanan 24 menit berbobot 0,8.' }, { t: 'Unit tertimbang', d: 'Kalikan volume dengan bobot, lalu jumlahkan. Contoh: 300 + 360 + 100 + 60 = <b>820 unit</b>.' }, { t: 'Biaya per unit', d: 'Biaya tetap dibagi unit tertimbang: Rp50,5 juta ÷ 820 = <b>Rp61.585</b>.' }, { t: 'Biaya per layanan', d: 'Biaya per unit × bobot + biaya variabel. Tes HIV: Rp61.585 × 1,0 + Rp15.000 = <b>Rp76.585</b>.' }],
    say: 'Biaya per layanan dihitung dalam enam langkah. Satu, jumlahkan biaya tetap per bulan, termasuk honor yang dibayar donor. Dua, catat volume layanan. Tiga, tentukan bobot waktu; layanan acuan berbobot satu. Empat, hitung unit tertimbang, yaitu volume dikali bobot. Lima, bagi biaya tetap dengan unit tertimbang. Enam, kalikan dengan bobot layanan dan tambahkan biaya variabel. Pada contoh di Pedoman, satu tes HIV menghabiskan sekitar tujuh puluh enam ribu lima ratus rupiah.' },
  { type: 'calc', k: 4, icon: 'sliders', kicker: 'Coba sendiri', title: 'Kalkulator mini biaya per layanan', inputs: [{ id: 'f', l: 'Biaya tetap per bulan', min: 20e6, max: 100e6, step: 5e5, v: 50.5e6, fmt: 'jt' }, { id: 'u', l: 'Total unit tertimbang', min: 200, max: 2000, step: 10, v: 820 }, { id: 'w', l: 'Bobot layanan', min: .5, max: 2, step: .1, v: 1, fmt: 'dec' }, { id: 'c', l: 'Biaya variabel', min: 0, max: 50000, step: 1000, v: 15000, fmt: 'rp' }],
    out: v => { const per = v.f / v.u, c = per * v.w + v.c; return `<div class="sub">Biaya per layanan</div><div class="big">${rp(c)}</div><div class="sub">Biaya tetap per unit ${rp(per)}</div><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100, per * v.w / c * 100)}%;background:var(--c4)"></i></div><div class="sub" style="margin-top:4px">porsi biaya tetap ${Math.round(per * v.w / c * 100)}%</div>`; },
    say: 'Coba kalkulator mini ini. Geser biaya tetap, unit tertimbang, bobot, dan biaya variabel. Perhatikan: bila volume layanan naik, biaya per layanan turun karena biaya tetap dibagi ke lebih banyak unit.' },
  { type: 'calc', k: 5, icon: 'battery', kicker: 'Daya tahan kas', title: 'Berapa lama klinik bertahan tanpa donor?', inputs: [{ id: 't', l: 'Biaya tunai per bulan', min: 20e6, max: 150e6, step: 1e6, v: 64e6, fmt: 'jt' }, { id: 'n', l: 'Pendapatan yang tetap ada', min: 0, max: 100e6, step: 1e6, v: 8e6, fmt: 'jt' }, { id: 'k', l: 'Saldo kas saat ini', min: 0, max: 500e6, step: 5e6, v: 90e6, fmt: 'jt' }],
    out: v => { const g = v.t - v.n, dt = g > 0 ? v.k / g : 99; const pct = Math.min(100, dt / 6 * 100), col = dt < 3 ? '#D9534F' : dt < 6 ? '#E69138' : '#38761D';
      return `<div class="sub">Daya tahan kas</div><div class="battery"><i style="width:${pct}%;background:${col}"></i></div><div class="big" style="color:${col}">${g > 0 ? dt.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' bulan' : 'Aman'}</div><div class="sub">Kesenjangan ${jt(g)} per bulan · target cadangan ${jt(3 * v.t)}</div>`; },
    say: 'Sekarang daya tahan kas. Kesenjangan adalah biaya tunai dikurangi pendapatan yang tetap ada setelah donor berhenti. Daya tahan kas adalah saldo kas dibagi kesenjangan itu. Pada klinik contoh, kesenjangannya lima puluh enam juta rupiah per bulan, dan dengan saldo sembilan puluh juta, klinik hanya bertahan sekitar satu koma enam bulan. Target cadangan yang dianjurkan adalah tiga kali biaya tunai bulanan.' },
  { type: 'key', k: 4, icon: 'sigma', kicker: 'Rumus kunci', title: 'Simpan rumus ini', formulas: ['Biaya tetap per unit = total biaya tetap ÷ unit tertimbang', 'Biaya layanan = biaya tetap per unit × bobot + biaya variabel', 'Kesenjangan = biaya tunai − pendapatan non-donor', 'Daya tahan kas = saldo kas ÷ kesenjangan', 'Target cadangan = 3 × biaya tunai bulanan'],
    say: 'Simpan lima rumus kunci ini. Biaya tetap per unit sama dengan total biaya tetap dibagi unit tertimbang. Biaya layanan sama dengan biaya tetap per unit dikali bobot, ditambah biaya variabel. Kesenjangan sama dengan biaya tunai dikurangi pendapatan non-donor. Daya tahan kas sama dengan saldo kas dibagi kesenjangan. Dan target cadangan sama dengan tiga kali biaya tunai bulanan.' }
],

const TTS = {
  q: [], idx: 0, playing: false, paused: false, u: null, voices: [],
  ok: 'speechSynthesis' in window,
  rate() { return +(ls.get('cbcel:ttsrate') || 1); },
  pickVoices() {
    if (!this.ok) return [];
    const all = speechSynthesis.getVoices(); const id = all.filter(v => /^id|ind/i.test(v.lang) || /indonesia|bahasa/i.test(v.name));
    const score = v => (/natural|neural|online/i.test(v.name) ? 0 : 10) + (/gadis|ardi|damayanti|google/i.test(v.name) ? 0 : 5) + (v.localService ? 1 : 0);
    this.voices = id.sort((a, b) => score(a) - score(b)); return this.voices;
  },
  voice() { const n = ls.get('cbcel:ttsvoice'); return this.voices.find(v => v.name === n) || this.voices[0] || null; },
  bar(u) {
    const audio = Bahan.audio(u);
    if (audio) return `<div class="tts" id="tts">${ic('mic')}<b class="small">Narasi materi</b><audio controls preload="none" src="${esc(audio)}" style="flex:1;min-width:200px;height:38px" aria-label="Rekaman narasi materi"></audio></div>`;
    if (!this.ok) return '';
    return `<div class="tts" id="tts" role="group" aria-label="Bacakan materi"><button class="btn sm acc" data-tts="play" id="ttsPlay" aria-label="Bacakan materi">${ic('play')} Bacakan</button>
      <button class="btn sm ghost hidden" data-tts="stop" id="ttsStop" aria-label="Berhenti">${ic('stop')}</button>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="small muted tts-info" id="ttsInfo">Dengarkan seluruh narasi materi</span><div class="tts-sel">
      <label class="sr" for="ttsRate">Kecepatan</label><select class="in" id="ttsRate" data-tts-rate>${[[.85, 'Pelan'], [1, 'Normal'], [1.15, 'Cepat'], [1.3, 'Lebih cepat']].map(([v, l]) => `<option value="${v}" ${v === this.rate() ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label class="sr" for="ttsVoice">Suara</label><select class="in" id="ttsVoice" data-tts-voice><option>Memuat suara…</option></select></div></div>`;
  },
  after() {
    if (!this.ok || !$('#ttsVoice')) return;
    const fill = () => { const vs = this.pickVoices(), cur = this.voice(); const s = $('#ttsVoice'); if (!s) return;
      s.innerHTML = vs.length ? vs.map(v => `<option value="${esc(v.name)}" ${cur && v.name === cur.name ? 'selected' : ''}>${esc(v.name.replace(/Microsoft |Google |\(.*?\)| - .*$/g, '').trim() || v.name)}${/natural|neural|online/i.test(v.name) ? ' (alami)' : ''}</option>`).join('') : '<option value="">Suara bawaan</option>';
      if (!vs.length) $('#ttsInfo').textContent = 'Suara Bahasa Indonesia belum terpasang di perangkat ini; dipakai suara bawaan.'; };
    fill(); speechSynthesis.onvoiceschanged = fill;
  },
  build(u) {
    const q = []; (LESSONS[u] || []).forEach((b, i) => { const t = (b.say || '').trim(); if (!t) return;
      t.replace(/([.!?])\s+/g, '$1|').split('|').filter(Boolean).forEach((s, j, arr) => q.push({ i, s, last: j === arr.length - 1 })); });
    return q;
  },
  play() {
    if (this.paused) { speechSynthesis.resume(); this.paused = false; this.playing = true; this.ui(); return; }
    if (this.playing) { speechSynthesis.pause(); this.paused = true; this.playing = false; this.ui(); return; }
    this.u = Lesson.u; this.q = this.build(this.u);
    const firstVis = $$('#lesson .blk').find(el => el.getBoundingClientRect().bottom > 120); const start = firstVis ? +firstVis.dataset.bi : 0;
    this.idx = Math.max(0, this.q.findIndex(x => x.i >= start)); this.playing = true; this.paused = false; this.ui(); this.speak();
  },
  speak() {
    if (!this.playing || this.idx >= this.q.length) { if (this.idx >= this.q.length) { this.stop(); toast('Narasi selesai'); } return; }
    const it = this.q[this.idx]; const ut = new SpeechSynthesisUtterance(it.s);
    const v = this.voice(); if (v) ut.voice = v; ut.lang = v ? v.lang : 'id-ID'; ut.rate = this.rate() * 0.97; ut.pitch = 1;
    $$('#lesson .blk.reading').forEach(x => x.classList.remove('reading'));
    const el = $(`#lesson [data-bi="${it.i}"]`); if (el) { el.classList.add('reading', 'in'); if (this.lastI !== it.i) el.scrollIntoView({ block: 'center', behavior: document.documentElement.classList.contains('calm') ? 'auto' : 'smooth' }); this.lastI = it.i; }
    $('#ttsInfo') && ($('#ttsInfo').textContent = `Bagian ${it.i + 1} dari ${(LESSONS[this.u] || []).length}`);
    ut.onend = () => { if (it.last) Lesson.mark(it.i); this.idx++; setTimeout(() => this.speak(), it.last ? 450 : 160); };
    ut.onerror = e => { if (e.error === 'interrupted' || e.error === 'canceled') return; this.idx++; this.speak(); };
    speechSynthesis.speak(ut);
  },
  stop() { if (this.ok) speechSynthesis.cancel(); this.playing = false; this.paused = false; this.lastI = null; $$('#lesson .blk.reading').forEach(x => x.classList.remove('reading')); this.ui(); },
  ui() {
    const b = $('#ttsPlay'); if (!b) return; $('#tts').classList.toggle('playing', this.playing);
    const lbl = this.playing ? 'Jeda' : this.paused ? 'Lanjutkan' : 'Bacakan'; b.innerHTML = ic(this.playing ? 'pause' : 'play') + ' ' + lbl; b.setAttribute('aria-label', lbl);
    $('#ttsStop').classList.toggle('hidden', !this.playing && !this.paused);
    if (!this.playing && !this.paused) $('#ttsInfo').textContent = 'Dengarkan seluruh narasi materi';
  }
};

};

const Viewer = {

    this.frame(title, 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(abs), abs);
  },
  async pdf(title, file) {

      <button class="vbtn" data-vw="zout" aria-label="Perkecil">${ic('minus')}</button><button class="vbtn" data-vw="zin" aria-label="Perbesar">${ic('plus')}</button><button class="vbtn" data-vw="fs" aria-label="Layar penuh">${ic('maximize')}</button><a class="vbtn" href="${esc(file)}" download aria-label="Unduh PDF">${ic('download')}</a>`,
      `<div class="loading"><div class="mini-ic" style="margin:0 auto 8px">${ic('book')}</div><p>Membuka dokumen…</p></div>`);
    $('.viewer').insertAdjacentHTML('beforeend', `<div class="vfoot"><button class="vbtn" data-vw="prev" aria-label="Halaman sebelumnya">${ic('chevL')}</button><span>Halaman <input id="vPg" value="1" inputmode="numeric" aria-label="Nomor halaman"> dari <span id="vN">…</span></span><button class="vbtn" data-vw="next" aria-label="Halaman berikutnya">${ic('chevR')}</button></div>`);
    try {
      await loadScript(LIB.pdfjs); window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfworker;

    } catch (e) { $('#vStage').innerHTML = `<div class="loading" style="padding:20px"><p>Dokumen belum dapat dibuka. ${/404|Missing|Unexpected/i.test(e.message) ? 'File belum diunggah ke folder bahan.' : 'Periksa koneksi internet.'}</p><a class="btn" href="${esc(file)}" download>Coba unduh</a></div>`; return; }
    $('#vN').textContent = this.pdfDoc.numPages;
    const p1 = await this.pdfDoc.getPage(1); this.ar = p1.getViewport({ scale: 1 }).height / p1.getViewport({ scale: 1 }).width;
    this.outline();

  },
  async outline() {
    let o = null; try { o = await this.pdfDoc.getOutline(); } catch (e) { }
    if (!o || !o.length) { $('#vToc') && $('#vToc').classList.add('hidden'); return; }
    const items = []; const walk = (arr, lv) => arr.forEach(x => { items.push([x, lv]); if (x.items && lv < 1) walk(x.items, lv + 1); }); walk(o, 0);
    const side = document.createElement('div'); side.className = 'side'; side.id = 'vSide';
    side.innerHTML = `<b style="display:block;padding:6px 8px">Daftar isi</b>` + items.map(([x, lv], k) => `<button data-vw="dest:${k}" style="padding-left:${8 + lv * 14}px">${esc(x.title)}</button>`).join('');

  },
  async goDest(k) {
