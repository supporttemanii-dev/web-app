  size() { const st = $('#vStage'); if (!st) return { w: 400, h: 560, two: false }; const H = st.clientHeight - 24, Wd = st.clientWidth - 120; const two = Wd > 760; let h = H, w = h / this.ar; if ((two ? 2 * w : w) > Wd) { w = two ? Wd / 2 : Wd; h = w * this.ar; } return { w: Math.floor(w * this.zoom), h: Math.floor(h * this.zoom), two }; },
  async book() {
    const st = $('#vStage'); st.className = 'stage'; st.querySelectorAll('.book,.navbtn,canvas,.loading').forEach(x => x.remove());
    try { await loadScript(LIB.pageflip); } catch (e) { toast('Mode buku tidak tersedia; memakai mode gulir'); return this.scroll(); }
    const { w, h } = this.size(); const n = this.pdfDoc.numPages;
    const book = document.createElement('div'); book.className = 'book'; st.appendChild(book);
    st.insertAdjacentHTML('beforeend', `<button class="navbtn l" data-vw="prev" aria-label="Halaman sebelumnya">${ic('chevL')}</button><button class="navbtn r" data-vw="next" aria-label="Halaman berikutnya">${ic('chevR')}</button>`);
    const pages = []; for (let i = 1; i <= n; i++) { const pg = document.createElement('div'); pg.className = 'page'; pg.dataset.n = i; pg.dataset.density = (i === 1 || i === n) ? 'hard' : 'soft'; pg.innerHTML = '<div class="ph">Memuat…</div>'; book.appendChild(pg); pages.push(pg); }
    this.pages = pages;
    this.flip = new St.PageFlip(book, { width: w, height: h, size: 'fixed', showCover: true, usePortrait: true, maxShadowOpacity: .4, mobileScrollSupport: false, flippingTime: 700 });

  async renderInto(pg, n, w) {
    if (pg.dataset.r) return; pg.dataset.r = 1;
    try { const page = await this.pdfDoc.getPage(n); const vp0 = page.getViewport({ scale: 1 }); const sc = (w * Math.min(2, devicePixelRatio || 1)) / vp0.width; const vp = page.getViewport({ scale: sc });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.setAttribute('aria-label', 'Halaman ' + n);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; pg.innerHTML = ''; pg.appendChild(c); } catch (e) { delete pg.dataset.r; }
  },
  around(c) { if (!this.pages || !$('#vStage')) return; const { w } = this.size(); for (let k = c - 2; k <= c + 3; k++) if (k >= 1 && k <= this.pages.length) this.renderInto(this.pages[k - 1], k, w); },
  async scroll() {
    try { this.flip && this.flip.destroy(); } catch (e) { } this.flip = null; this.pages = null;
    const st = $('#vStage'); st.className = 'stage scroll'; const side = $('#vSide'); st.innerHTML = ''; if (side) st.appendChild(side);
    const n = this.pdfDoc.numPages; const w = Math.min(st.clientWidth - 32, 900) * this.zoom;
    const holders = []; for (let i = 1; i <= n; i++) { const d = document.createElement('div'); d.className = 'page'; d.dataset.n = i; d.style.cssText = `width:${w}px;height:${w * this.ar}px;margin:0 auto 12px;box-shadow:0 6px 24px rgba(0,0,0,.4)`; d.innerHTML = '<div class="ph">Halaman ' + i + '</div>'; st.appendChild(d); holders.push(d); }

  },
  sync() { const i = $('#vPg'); if (i && document.activeElement !== i) i.value = this.cur; },
  go(d) { if (this.flip) d > 0 ? this.flip.flipNext() : this.flip.flipPrev(); else this.goto(this.cur + d); },
  goto(n) { if (!this.pdfDoc) return; n = Math.max(1, Math.min(this.pdfDoc.numPages, n)); this.cur = n; if (this.flip) { this.flip.turnToPage(n - 1); this.around(n); } else if (this.pages) this.pages[n - 1].scrollIntoView({ behavior: 'smooth' }); this.sync(); },
  act(a) {

    else if (a === 'toc') { const s = $('#vSide'); s && s.classList.toggle('on'); }

const Notif = {

    if (DEMO && !items.length) items.push({ id: 'demo-welcome', tanggal: new Date().toISOString(), judul: 'Selamat datang di e-learning', isi: 'Ini contoh pengumuman. Pada versi online, pengumuman dikirim fasilitator atau ditulis panitia di bahan/pengumuman.json.', ic: 'smile' });

          ${fieldNum('Donor berakhir setelah bulan ke-', 'kas.donorAkhir', d.donorAkhir)}${fieldNum('Pendapatan layanan per bulan (Rp)', 'kas.layanan', d.layanan)}
          ${fieldNum('Filantropi, CSR, zakat per bulan (Rp)', 'kas.filantropi', d.filantropi)}</div></div>
        <div class="card"><h3>Dana publik</h3><div class="fgrid c2">
          ${fieldNum('Peserta JKN terdaftar awal', 'kas.pesAwal', d.pesAwal)}${fieldNum('Tambahan peserta per bulan', 'kas.pesTambah', d.pesTambah)}
          ${fieldNum('Tarif kapitasi (Rp/peserta)', 'kas.tarif', d.tarif)}${fieldNum('PKS BPJS mulai bulan ke-', 'kas.jknMulai', d.jknMulai)}
          ${fieldNum('Peserta yang berkunjung per bulan (%)', 'kas.kunjungan', d.kunjungan)}${fieldNum('Biaya variabel per kunjungan (Rp)', 'kas.varPer', d.varPer)}
          ${fieldNum('Non-kapitasi per bulan (Rp)', 'kas.nonkap', d.nonkap)}${fieldNum('Nilai kontrak swakelola per tahun (Rp)', 'kas.apbd', d.apbd)}
          ${fieldNum('Kontrak swakelola mulai bulan ke-', 'kas.apbdMulai', d.apbdMulai, 'Dibayar per triwulan setelah kontrak berjalan')}
          <div class="field"><label class="f">Mutu data sebagian besar angka</label>${seg('kas.mutu', d.mutu, [['A', 'A dokumen'], ['B', 'B estimasi'], ['C', 'C asumsi']])}</div></div></div></div>
        <div class="card" style="margin-top:12px" data-calc="kas"><div class="row"><h3 style="margin:0">Saldo kas 36 bulan</h3><div class="sp"></div><span class="small muted">Arahkan kursor atau sentuh grafik untuk detail</span></div>
          <div class="chart" id="kChart"></div>
          <div class="legend"><span><i style="background:var(--s-opt)"></i>Optimis</span><span><i style="background:var(--s-dasar)"></i>Dasar</span><span><i style="background:var(--s-pes)"></i>Pesimis</span></div>
          <div class="kpis" style="margin-top:12px" id="kK"></div>
          <details style="margin-top:12px"><summary class="small"><b>Asumsi skenario</b></summary><ul class="small muted"><li>Optimis: tambahan peserta JKN 1,3 kali, kontrak swakelola tepat waktu, pendapatan layanan +10%.</li><li>Dasar: semua angka seperti diisi.</li><li>Pesimis: tambahan peserta JKN separuhnya, PKS mundur 3 bulan, kontrak swakelola mundur 12 bulan, pendapatan layanan −20%.</li></ul></details>
          <details style="margin-top:6px"><summary class="small"><b>Lihat tabel per bulan (skenario dasar)</b></summary><div class="tw" id="kTab"></div></details></div>`; },
    run(d, sc) {
      const m = { opt: { g: 1.3, jd: 0, ad: 0, l: 1.1 }, dasar: { g: 1, jd: 0, ad: 0, l: 1 }, pes: { g: .5, jd: 3, ad: 12, l: .8 } }[sc];
      let saldo = num(d.saldo); const out = [];
      for (let t = 1; t <= 36; t++) {
        const biaya = num(d.biaya) * Math.pow(1 + num(d.naik) / 100, Math.floor((t - 1) / 12));
        const donor = t <= num(d.donorAkhir) ? num(d.donor) : 0;
        const jStart = num(d.jknMulai) + m.jd;
        const pes = t >= jStart ? num(d.pesAwal) + num(d.pesTambah) * m.g * (t - jStart + 1) : 0;
        const kap = pes * num(d.tarif), varc = pes * num(d.kunjungan) / 100 * num(d.varPer);
        const aStart = num(d.apbdMulai) + m.ad;
        const apbd = (t >= aStart && (t - aStart) % 3 === 2) ? num(d.apbd) / 4 : 0;
        const masuk = donor + num(d.layanan) * m.l + num(d.filantropi) + kap + (t >= jStart ? num(d.nonkap) : 0) + apbd;
        const keluar = biaya + varc;
        saldo += masuk - keluar;
        out.push({ t, saldo, masuk, keluar, donor, kap, apbd, pes });
      }
      return out;
    },
    calc() {
      const d = Store.get('kas', DEF.kas);

      this.chart(S);
      const rawan = s => { const x = S[s].find(r => r.saldo < 0); return x ? 'Bulan ' + x.t : 'Tidak ada'; };
      const minP = Math.min(...S.pes.map(r => r.saldo));
      const after = num(d.biaya) * Math.pow(1 + num(d.naik) / 100, 2) - num(d.layanan) - num(d.filantropi) - num(d.nonkap) - num(d.apbd) / 12;
      const perP = num(d.tarif) - num(d.kunjungan) / 100 * num(d.varPer);
      const bep = perP > 0 ? Math.max(0, Math.ceil(after / perP)) : null;
      const kdm = (Store.data.transisi && Store.data.transisi.fungsi) ? Store.data.transisi.fungsi.filter(f => f.arah === 'Pertahankan' || f.arah === 'Integrasikan').reduce((s, f) => s + num(f.b), 0) : 0;
      $('#kK').innerHTML = `<div class="kpi ${rawan('dasar') === 'Tidak ada' ? 'ok' : 'bad'}"><div class="l">Saldo pertama negatif (dasar)</div><div class="v" style="font-size:1.05rem">${rawan('dasar')}</div><div class="s">Pesimis: ${rawan('pes')}</div></div>
        <div class="kpi ${minP < 0 ? 'bad' : 'ok'}"><div class="l">Saldo terendah (pesimis)</div><div class="v">${jt(minP)}</div><div class="s">${minP < 0 ? 'cadangan atau dana darurat yang dibutuhkan' : 'tidak perlu dana darurat'}</div></div>
        <div class="kpi"><div class="l">Titik impas peserta JKN</div><div class="v">${bep == null ? '–' : bep.toLocaleString('id-ID')}</div><div class="s">tahun ke-3, setelah donor berakhir</div></div>
        <div class="kpi"><div class="l">Kebutuhan dana minimum</div><div class="v">${kdm ? jt(kdm) : '–'}</div><div class="s">${kdm ? 'per bulan, dari Unit 7' : 'isi klasifikasi fungsi di Unit 7'}</div></div>
        ${d.mutu === 'C' ? '<div class="note warn" style="grid-column:1/-1">Sebagian besar angka berlabel C (asumsi). Baca hasil dengan hati-hati dan perbarui setelah data tersedia.</div>' : ''}`;
      $('#kTab').innerHTML = `<table class="t"><thead><tr><th>Bulan</th><th class="n">Masuk</th><th class="n">Keluar</th><th class="n">Peserta JKN</th><th class="n">Saldo</th></tr></thead><tbody>${S.dasar.map(r => `<tr><td>${r.t}</td><td class="n">${jt(r.masuk)}</td><td class="n">${jt(r.keluar)}</td><td class="n">${Math.round(r.pes).toLocaleString('id-ID')}</td><td class="n" style="color:${r.saldo < 0 ? 'var(--bad)' : 'inherit'}">${jt(r.saldo)}</td></tr>`).join('')}</tbody></table>`;
      Store.data.kasHasil = { rawanDasar: rawan('dasar'), rawanPes: rawan('pes'), minPes: minP, bep };
    },
    chart(S) {
      const W = 640, H = 280, L = 58, R = 64, T = 14, B = 30;
      const all = [...S.opt, ...S.dasar, ...S.pes].map(r => r.saldo); let lo = Math.min(0, ...all), hi = Math.max(0, ...all); if (hi === lo) hi = lo + 1;
      const pad = (hi - lo) * .08; lo -= pad; hi += pad;
      const x = t => L + (t - 1) / 35 * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
      const step = (() => { const r = (hi - lo) / 5; const p = Math.pow(10, Math.floor(Math.log10(r))); return [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= r) || r; })();
      let grid = ''; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-6 ? '#4A5755' : '#E3E8E7'}" stroke-width="${Math.abs(v) < 1e-6 ? 1.2 : 1}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="#7A8684">${(v / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 0 })}</text>`;
      let xt = ''; [1, 6, 12, 18, 24, 30, 36].forEach(t => xt += `<text x="${x(t)}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="#7A8684">${t}</text>`);
      const C = { opt: 'var(--s-opt)', dasar: 'var(--s-dasar)', pes: 'var(--s-pes)' }, N = { opt: 'Optimis', dasar: 'Dasar', pes: 'Pesimis' };
      const ends = ['opt', 'dasar', 'pes'].map(k => ({ k, y: y(S[k][35].saldo) })).sort((a, b) => a.y - b.y);
      for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
      const lines = ['opt', 'dasar', 'pes'].map(k => `<path d="${S[k].map((r, i) => (i ? 'L' : 'M') + x(r.t).toFixed(1) + ' ' + y(r.saldo).toFixed(1)).join('')}" fill="none" stroke="${C[k]}" stroke-width="2" stroke-linejoin="round"/>`).join('');
      const labels = ends.map(e => `<text x="${W - R + 6}" y="${e.y + 4}" font-size="11" font-weight="700" fill="${C[e.k]}">${N[e.k]}</text>`).join('');
      const neg = lo < 0 ? `<rect x="${L}" y="${y(0)}" width="${W - L - R}" height="${y(lo) - y(0)}" fill="#BE2A3A" opacity=".06"/>` : '';
      $('#kChart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik saldo kas tiga skenario selama 36 bulan">${neg}${grid}${xt}
        <text x="12" y="${T + 6}" font-size="10.5" fill="#7A8684">juta Rp</text><text x="${(W - R + L) / 2}" y="${H}" font-size="10.5" text-anchor="middle" fill="#7A8684">bulan</text>
        ${lines}${labels}<line id="kX" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#4A5755" stroke-dasharray="3 3" style="display:none"/>
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="kHit"/></svg><div class="tip" id="kTip"></div>`;
      const svg = $('#kChart svg'), tip = $('#kTip'), cx = $('#kX');
      const move = ev => { const p = svg.getBoundingClientRect(); const cxp = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - p.left) / p.width * W;
        const t = Math.max(1, Math.min(36, Math.round((cxp - L) / (W - L - R) * 35 + 1))); cx.setAttribute('x1', x(t)); cx.setAttribute('x2', x(t)); cx.style.display = '';
        tip.style.display = 'block'; tip.style.left = (x(t) / W * p.width) + 'px'; tip.style.top = (T / H * p.height + 4) + 'px';
        tip.innerHTML = `<b>Bulan ${t}</b><br>${['opt', 'dasar', 'pes'].map(k => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${C[k]}"></span> ${N[k]}: ${jt(S[k][t - 1].saldo)}`).join('<br>')}`; };
      const hit = $('#kHit'); hit.addEventListener('mousemove', move); hit.addEventListener('touchmove', move, { passive: true }); hit.addEventListener('touchstart', move, { passive: true });
      hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; cx.style.display = 'none'; });
    }
  },

        return `<label class="opt ${cls}"><input type="radio" name="q${i}" value="${j}" ${sel ? 'checked' : ''} ${st.done ? 'disabled' : ''} data-quiz="${uid}" data-i="${i}"><span>${'abcd'[j]}. ${esc(o)}</span></label>`; }).join('')}

const Test = {
  cache: {},
  view(j) {
    j = j === 'post' ? 'post' : 'pre';
    const done = Store.tests[j];
    const lockPost = !Rules.postOpen();
    const head = `<h1>Pre-test dan post-test</h1><div class="tabs" role="tablist"><button class="${j === 'pre' ? 'on' : ''}" data-tab="#/tes/pre" role="tab">Pre-test ${Store.tests.pre ? ic('check') : ''}</button><button class="${j === 'post' ? 'on' : ''}" data-tab="#/tes/post" role="tab">Post-test ${Store.tests.post ? ic('check') : lockPost ? `<span class="lk" aria-label="terkunci">${ic('lock')}</span>` : ''}</button></div>`;
    if (done) return `${head}<div class="card"><h2>${j === 'pre' ? 'Pre-test' : 'Post-test'} selesai</h2>
      <div class="kpis"><div class="kpi"><div class="l">Skor</div><div class="v">${done.skor}</div><div class="s">${done.benar} dari ${done.total} benar</div></div>
      ${j === 'post' && Store.tests.pre ? `<div class="kpi ${done.skor >= Store.tests.pre.skor ? 'ok' : 'bad'}"><div class="l">Perubahan dari pre-test</div><div class="v">${done.skor - Store.tests.pre.skor >= 0 ? '+' : ''}${done.skor - Store.tests.pre.skor}</div></div>` : ''}</div>

    if (j === 'post' && lockPost) {
      const todo = [...(!Store.tests.pre ? [['Pre-test', '#/tes/pre', false]] : []), ...[0, 1, 2, 3, 4, 5, 6, 7].map(u => [`Unit ${u} · ${UNIT_META[u].t}`, '#/unit/' + u, Rules.done(u)])];
      return `${head}<div class="card"><div class="mini-ic">${ic('lock')}</div><h2>Post-test belum terbuka</h2><p class="muted">Post-test terbuka setelah pre-test dikerjakan dan Unit 0–7 ditandai selesai (materi dibaca minimal ${READ_MIN}%, alat diisi, dan kuis dikerjakan).</p>
        <ol class="steps">${todo.map(t => `<li class="${t[2] ? 'done' : ''}"><div class="sp">${esc(t[0])}</div>${t[2] ? '<span class="tag ok">Selesai</span>' : `<a class="btn sm ghost" href="${t[1]}">Kerjakan</a>`}</li>`).join('')}</ol></div>`;
    }
    const qs = this.cache[j];
    if (!qs) { this.load(j); return `${head}<div class="card">Memuat soal…</div>`; }
    return `${head}<div class="card"><h2>${j === 'pre' ? 'Pre-test' : 'Post-test'}</h2><p class="small muted">${qs.length} soal pilihan ganda. Jawaban dikirim sekali dan tidak dapat diubah.${DEMO ? ' Mode demo memakai 5 soal contoh.' : ''}</p>
      <div class="bar" style="margin-bottom:14px"><i id="tbar" style="width:0"></i></div>
      ${qs.map((q, i) => `<fieldset class="q" style="border:none;padding:0;margin:0 0 18px"><legend class="qt">${i + 1}. ${esc(q.q).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</legend>${q.o.map((o, k) => `<label class="opt"><input type="radio" name="t${i}" value="${k}" data-test="${i}"><span>${'abcd'[k]}. ${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}
      <div class="row"><span class="small muted" id="tcount">0 dari ${qs.length} terjawab</span><div class="sp"></div><button class="btn acc" data-act="testsubmit" data-j="${j}">Kirim jawaban</button></div></div>`;
  },
  async load(j) {
    try { if (DEMO) this.cache[j] = DEMO_TEST.map(q => ({ q: q.q, o: q.o })); else this.cache[j] = (await Api.call('getTest', { jenis: j })).soal; }
    catch (e) { setTimeout(() => { $('main').insertAdjacentHTML('beforeend', `<div class="note warn">Soal gagal dimuat: ${esc(e.message)}</div>`); }, 0); return; }
    setTimeout(() => Router.route(), 0);
  },
  async submit(j) {
    const qs = this.cache[j]; const ans = qs.map((_, i) => { const x = $(`input[name="t${i}"]:checked`); return x ? +x.value : null; });
    const b = $('[data-act="testsubmit"]');
    if (ans.includes(null) && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Kirim tetap'; toast('Masih ada soal yang belum dijawab. Tekan sekali lagi untuk mengirim.'); return; }
    b.disabled = true; let res;
    try { if (DEMO) { const benar = ans.filter((a, i) => a === DEMO_TEST[i].k).length; res = { benar, total: qs.length, skor: Math.round(benar / qs.length * 100) }; }
      else res = await Api.call('submitTest', { jenis: j, jawaban: ans }); }
    catch (e) { b.disabled = false; toast('Gagal mengirim: ' + e.message); return; }
    Store.tests[j] = { skor: res.skor, benar: res.benar, total: res.total, waktu: new Date().toISOString() }; Store.persist();
    toast('Jawaban terkirim'); Notif.refresh(); Router.route();
  }
};

const LEVEL_REG = [['Dasar', [0, 1]], ['Menengah', [2, 3, 4]], ['Lanjut', [5, 6, 7]], ['Tindak lanjut', [8]]];

const Jalur = {
  st: { phase: 'peran', dom: 0, host: 'page' },
  get() { return Store.data.jalur || null; },

  /* skor relevansi setiap unit */
  scores() {
    const j = this.get(); const s = Array(9).fill(0); if (!j || j.mode !== 'sa') return s;
    const r = this.saResult();
    (j.fokus || []).forEach((d, i) => (PAKET[d] ? PAKET[d].u : []).forEach((u, k) => { s[u] += 6 - i - k * 0.8; }));
    this.weak(r).filter(d => r.dom[d].v <= 2.5 && !(j.fokus || []).includes(d)).forEach(d => PAKET[d].u.forEach((u, k) => { s[u] += 2 - k * 0.4; }));
    const pf = PERAN_FOKUS[j.peran]; if (pf) pf.u.forEach((u, k) => { s[u] += 3 - k * 0.5; });
    return s;
  },
  order() {
    const j = this.get(); if (!j || j.mode !== 'sa') return [0, 1, 2, 3, 4, 5, 6, 7, 8];

  },
  tags(u) {
    const j = this.get(); const t = []; if (!j) return t;

      const pk = (j.fokus || []).filter(d => PAKET[d] && PAKET[d].u.includes(u)); if (pk.length) t.push(['acc', 'Prioritas']);
