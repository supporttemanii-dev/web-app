<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Survei Panas Ekstrem dan Keluarga</title>
<style>
:root{
  --bg:#f6f3ef; --card:#ffffff; --ink:#1f1b16; --ink2:#5c544b; --line:#e4ddd4;
  --accent:#b8430f; --accent-ink:#ffffff; --accent-soft:#fbe9df; --accent-line:#efb999;
  --err:#b42318; --err-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff4d6;
  --ok:#2f6f3e; --focus:#1f6feb; --shadow:0 1px 2px rgba(40,25,10,.06),0 2px 8px rgba(40,25,10,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16130f; --card:#211d18; --ink:#f1ece6; --ink2:#b7ada2; --line:#3a332b;
    --accent:#f08a4b; --accent-ink:#1b0f07; --accent-soft:#3a2416; --accent-line:#7a4421;
    --err:#ff8a80; --err-soft:#3b1a17; --warn:#ffd27a; --warn-soft:#3a2e12; --ok:#8fd19e;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-top:10px;padding-bottom:10px}
.brand{font-weight:650;font-size:15px;letter-spacing:.1px}
.sect{font-size:13px;color:var(--ink2);margin-top:2px;min-height:18px}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
main{padding:18px 0 120px}
h1{font-size:24px;line-height:1.25;margin:4px 0 12px}
h2{font-size:19px;line-height:1.3;margin:6px 0 10px}
.lead{color:var(--ink2);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card.info{background:transparent;border-style:dashed;box-shadow:none}
.card.err{border-color:var(--err);box-shadow:0 0 0 2px var(--err-soft)}
.card.soft{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
.qnum{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.3px;margin-bottom:4px}
.req{color:var(--err);font-weight:700;margin-left:4px}
.qtext{font-weight:600;margin:0 0 4px}
.hint{font-size:14px;color:var(--ink2);font-style:italic;margin:0 0 8px}
.msg{font-size:14px;margin-top:8px;color:var(--err);display:none}
.card.err .msg{display:block}
.card.soft .msg{display:block;color:var(--warn)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--accent-line)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .dot{flex:0 0 20px;height:20px;margin-top:2px;border:2px solid var(--ink2);border-radius:50%;display:grid;place-items:center}
.opt.cb .dot{border-radius:5px}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.sel .dot{border-color:var(--accent);background:var(--accent)}
.opt.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt.cb.sel .dot::after{width:10px;height:5px;border-radius:0;background:none;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.opt:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.opt.na{border-style:dashed;color:var(--ink2);font-size:15px}
.sep{height:1px;background:var(--line);margin:4px 0}
.spec{margin:6px 0 2px 30px}
input[type=text],input[type=number],input[type=email],input[type=tel],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
textarea{min-height:110px;resize:vertical}
.numrow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.numrow input{max-width:150px}
.numrow .unit{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 12px;border:1px dashed var(--line);border-radius:999px;cursor:pointer;font-size:14px;color:var(--ink2);background:var(--card)}
.chip.sel{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.grid-row{border-top:1px solid var(--line);padding:12px 0 4px}
.grid-row:first-of-type{border-top:0}
.grid-row .rlab{font-size:15px;margin-bottom:8px}
.grid-row.err .rlab{color:var(--err)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;flex:1 1 0;min-width:84px;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px;line-height:1.3;background:var(--card)}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pill:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.pill.na{flex:0 0 auto;border-style:dashed;color:var(--ink2);font-size:13px;min-width:0}
.pill.na.sel{color:var(--accent-ink)}
.pills.stack{flex-direction:column}
.pills.stack .pill{text-align:left;padding:10px 12px}
.pills.scale7 .pill{min-width:38px;flex:1 1 0;padding:9px 0}
.bipolar-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:6px;gap:12px}
.bipolar-ends span:last-child{text-align:right}
.slider-wrap{margin-top:12px}
.slider-wrap input[type=range]{width:100%;accent-color:var(--accent)}
.slider-val{font-size:28px;font-weight:700;color:var(--accent);min-height:36px}
.slider-val.unset{font-size:15px;font-weight:500;color:var(--ink2)}
.slider-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two label{font-size:14px;color:var(--ink2);display:block;margin-bottom:4px}
.reading{font-size:17px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:18px}
footer.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
footer.nav .wrap{display:flex;gap:10px;padding-top:10px;padding-bottom:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px 18px;font-weight:600;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.banner.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err)}
.banner.ok{background:var(--accent-soft);border:1px solid var(--accent-line)}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px;padding-left:20px}
.prose li{margin-bottom:6px}
.vtag{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;color:var(--ink2)}
.dbg{font-size:13px;display:flex;gap:8px;align-items:center;margin-top:6px}
.dbg select{padding:4px 6px;width:auto}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
table.cb{width:100%;border-collapse:collapse;font-size:13px}
table.cb th,table.cb td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
table.cb th{background:var(--card);position:sticky;top:0}
.hidden{display:none!important}
/* halaman sambutan */
.welcome{padding-top:8px}
.welcome .org{margin-bottom:22px}
.welcome .org img{height:56px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.welcome h1{font-size:30px;line-height:1.2;margin:0 0 12px;letter-spacing:-.3px}
.welcome .lead{font-size:17px;color:var(--ink2);margin:0 0 20px}
.who{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:10px 14px;margin:0 0 20px;font-size:15px}
.who b{color:var(--accent)}
.cta{display:flex;flex-direction:column;gap:10px;margin:22px 0 8px}
.cta .btn{width:100%;font-size:17px}
.cta-note{font-size:13px;color:var(--ink2);text-align:center;margin:4px 0 0}
.wfoot{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;font-size:13px;color:var(--ink2)}
.wfoot p{margin:0 0 8px}
.wfoot a{color:var(--accent)}
@media (min-width:640px){.welcome h1{font-size:36px}.cta{flex-direction:row}.cta .btn{width:auto;min-width:240px;flex:0 0 auto}.cta-note{text-align:left}}
/* lembar persetujuan */
.consent{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;box-shadow:var(--shadow);overflow:hidden}
.consent section{padding:14px 16px;border-top:1px solid var(--line)}
.consent section:first-child{border-top:0}
.consent h3{font-size:15px;margin:0 0 4px;color:var(--accent)}
.consent p{margin:0;font-size:15px;line-height:1.6}
.consent a{color:var(--accent)}
header.top .brandrow{display:flex;align-items:center;gap:10px}
.brand-logo{height:28px;width:auto;flex:0 0 auto}
.org{display:flex;align-items:center;gap:12px;margin:4px 0 14px;font-size:14px;font-weight:600;color:var(--ink2)}
.org img{height:48px;width:auto}
.facts{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px}
.facts li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.facts svg{flex:0 0 22px;width:22px;height:22px;color:var(--accent);margin-top:2px}
.facts b{display:block}
.facts span{font-size:14px;color:var(--ink2)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.box h3{margin:0 0 8px;font-size:17px}
.box label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.note{font-size:14px;color:var(--ink2);margin:6px 0}
.claim-code{font:700 28px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;text-align:center;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:14px;margin:10px 0}
.hak{font-weight:600;border-radius:10px;padding:10px 12px;margin:6px 0}
.hak-p{background:#e6f4ea;color:#1e5b2e}.hak-u{background:var(--accent-soft);color:var(--ink)}.hak-t{background:var(--line);color:var(--ink)}
@media (prefers-color-scheme: dark){.hak-p{background:#173322;color:#a8e2b8}}
.ferr{display:none;color:var(--err);font-size:14px;margin-top:8px}
.code-warn{font-size:13px;color:var(--warn);margin:4px 0 0}
.status-link{font-size:14px;margin:16px 0 0;color:var(--ink2)}
.status-link a,.prose a{color:var(--accent)}
.code-in{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase}
table.win{width:100%;border-collapse:collapse;font-size:14px}
table.win th,table.win td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
table.win tr.mine td{background:var(--accent-soft);font-weight:700}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:480px){
  h1{font-size:21px}
  .pill{min-width:calc(50% - 6px)}
  .pills.scale7 .pill{min-width:0}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brandrow"><img class="brand-logo" id="brandLogo" alt="" onerror="this.remove()"><div class="brand" id="brand"></div></div>
  <div class="sect" id="sect"></div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div class="dbg hidden" id="dbg"></div>
</div></header>
<main><div class="wrap" id="app" aria-live="polite"></div></main>
<div class="hp" aria-hidden="true"><label>Jangan diisi <input id="hpField" tabindex="-1" autocomplete="off"></label></div>
<footer class="nav" id="nav"><div class="wrap">

    <p>Kami tidak menanyakan nama, alamat lengkap, atau nomor identitas. Jawaban Anda disimpan dengan kode acak, dienkripsi, dan hanya dapat diakses oleh tim peneliti. Hasil hanya dilaporkan dalam bentuk gabungan sehingga tidak ada individu yang dapat dikenali. Data dikelola sesuai Undang-Undang Pelindungan Data Pribadi.</p></section>
   <section><h3>Sukarela</h3>
    <p>Keikutsertaan Anda sepenuhnya sukarela. Anda dapat berhenti kapan saja tanpa konsekuensi apa pun.</p></section>
   <section><h3>Risiko dan manfaat</h3>
    <p>Tidak ada risiko fisik. Beberapa pertanyaan mungkin terasa tidak nyaman; Anda boleh melewatinya. Tidak ada manfaat langsung, tetapi jawaban Anda akan membantu merancang layanan kesehatan dan kebijakan perlindungan dari panas ekstrem yang lebih baik.</p></section>
   <section><h3>Kompensasi</h3>
    <p>${INC_TEXT()}</p></section>
   <section><h3>Pelaksana, persetujuan etik, dan kontak</h3>
    <p>Survei ini dilaksanakan oleh tim peneliti ${CONFIG.ORG}. Penelitian ini telah memperoleh persetujuan etik dari ${CONFIG.ETHICS}. Pertanyaan dapat disampaikan kepada ${CONFIG.CONTACT}.</p></section>
  </div>`,

const QS = new URLSearchParams(location.search);
const DEBUG = QS.get('debug') === '1';
const NA = CONFIG.NA_CODE;
const numv = x => (typeof x === 'number' && isFinite(x) && x < 96) ? x : null; // abaikan kode khusus 96–99

// Siapkan item: nama variabel, tipe pilihan, NA bawaan
const ITEMS = [];
PAGES.forEach((p, pi) => p.items.forEach(it => {
  if (it.t === 'info') { it.v = '__info' + ITEMS.length; }
  else if (!it.v) it.v = it.id.replace(/\./g, '_');
  if (it.na === undefined) it.na = ['radio','check','grid','bipolar','select','num','multinum','monthyear','slider'].includes(it.t) && !(it.t === 'select' && it.req);
  it.page = pi; ITEMS.push(it);
}));
const ITEM = Object.fromEntries(ITEMS.map(i => [i.v, i]));

// Kunci jawaban (key di S.ans) -> kunci visibilitas
const OWNER = {};
ITEMS.forEach(it => {
  const add = k => OWNER[k] = it.v;
  if (it.t === 'grid' || it.t === 'bipolar') it.rows.forEach(r => OWNER[it.v + r[0]] = it.v + r[0]);
  else if (it.t === 'multinum') it.fields.forEach(f => add(it.v + '_' + f[0]));
  else if (it.t === 'monthyear') { add(it.v + '_bln'); add(it.v + '_thn'); }
  else if (it.t !== 'info') { add(it.v); add(it.v + '_oth'); }
});

// State
let S = null;
const freshState = () => ({
  id: makeId(), ans: {}, page: 0, start: isoLocal(new Date()), startMs: Date.now(),
  arm: null, armSource: null, stratum: null, lockIdx: -1, visited: {}, pageSec: {}, a0Sec: null,
  status: 'in_progress', soft: {}, begun: false
});
function makeId(){
  const a = new Uint8Array(8); (crypto.getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.random()*256|0));
  const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  return 'R' + Array.from(a, b => abc[b % abc.length]).join('');
}
function isoLocal(d){
  const z = -d.getTimezoneOffset(), s = z >= 0 ? '+' : '-', p = n => String(Math.floor(Math.abs(n))).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+s+p(z/60)+':'+p(z%60);
}
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const save = () => { const { _resumable, _enter, ...rest } = S; store.set(CONFIG.STORAGE_KEY, rest); };

// ---------- Visibilitas & variabel turunan ----------
let VIS = {};
function makeCtx(vis){
  const x = {
    raw: k => S.ans[k],
    v: k => (vis[OWNER[k]] ? S.ans[k] : undefined),
    get SEX(){ return x.v('C1_4'); },
    get HAMIL(){ return (x.v('C2_7') === 1 || x.v('C2_8') === 1) ? 1 : 0; },
    get BSL(){ // BULAN_SEJAK_LAHIR
      const m = x.v('C2_6_bln'), y = x.v('C2_6_thn');
      if (numv(m) === null || !y || y === NA) return null;
      const d = new Date(S.startMs); return (d.getFullYear()*12 + d.getMonth()+1) - (y*12 + m);
    },
    get BELIG(){ return (CONFIG.B_FILTER_ALL || isIn(x.v('C2_2'), [2,3])) ? 1 : 0; },
    get SEKS12(){ return isIn(x.v('B1_1'), [1,2,3]) ? 1 : 0; },
    get PASOKAN(){ return isIn(x.v('B1_3'), [3,4,5,6,7,8]) ? 1 : 0; },
    get BUTUH(){ return 'abcde'.split('').some(k => x.v('B4_1'+k) === 1) ? 1 : 0; }
  };
  return x;
}
function computeVis(){
  const vis = {}; const x = makeCtx(vis); const pageVis = [];
  PAGES.forEach((p, pi) => {
    const pv = !p.show || !!p.show(x);
    let any = p.special === 'A0' ? pv : false;
    p.items.forEach(it => {
      const sh = pv && (!it.show || !!it.show(x));
      vis[it.v] = sh;
      if (it.rows) it.rows.forEach(r => { vis[it.v + r[0]] = sh && (!(r[2] && r[2].show) || !!r[2].show(x)); });
      if (sh && it.t !== 'info') any = true;
    });
    pageVis[pi] = any;
  });
  VIS = vis; return { vis, x, pageVis };
}

// ---------- DOM helper ----------
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return; el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
const $ = id => document.getElementById(id);

// ---------- Mengubah jawaban ----------
function setAns(k, v){
  if (v === undefined || v === '' || (Array.isArray(v) && !v.length)) delete S.ans[k]; else S.ans[k] = v;
  const it = ITEM[k];
  if (it && it.children) it.children.forEach(c => { delete S.ans[c]; delete S.ans[c + '_nama']; });
  save(); refresh();
}

// ---------- Render halaman ----------
function render(keepScroll){
  if (!S.begun) return renderWelcome();
  document.querySelector('header.top').classList.remove('hidden');
  const sy = window.scrollY;
  const { x, pageVis } = computeVis();
  const p = PAGES[S.page];
  const app = $('app'); app.innerHTML = '';
  $('brand').textContent = CONFIG.TITLE;
  $('sect').textContent = p.section || '';
  updateProgress(pageVis);
  if (!S.visited[p.id]) S.visited[p.id] = true;
  S._enter = Date.now();

  if (p.intro) { const t = p.intro(x); if (t) app.append(h('div', {html:t})); }
  if (p.title) app.prepend(h('h2', null, p.title));

  if (DEBUG) renderDebug();
  if (p.special === 'A0') return renderA0(app);

  p.items.forEach(it => app.append(renderItem(it, x)));
  refresh();
  setNav();
  window.scrollTo(0, keepScroll ? sy : 0);
  if (DEBUG) renderDebug();
}

function qnum(it){ return it.sub ? null : h('span', {class:'qnum'}, it.id === 'ATTN1' || it.id === 'ATTN2' ? '' : it.id); }
function vtag(name){ return DEBUG ? h('span', {class:'vtag'}, name) : null; }
function qtext(it, x){
  const q = typeof it.q === 'function' ? it.q(x) : it.q;
  return h('p', {class:'qtext'}, q, it.req ? h('span', {class:'req', 'aria-hidden':'true'}, '*') : null, vtag(it.v));
}

function renderItem(it, x){
  if (it.t === 'info') return h('div', {class:'card info', 'data-key': it.v, html: it.html});
  const card = h('div', {class:'card', 'data-key': it.v, id:'card_' + it.v, role:'group', 'aria-labelledby':'q_' + it.v});
  const head = h('div', {id:'q_' + it.v}, qnum(it), qtext(it, x));
  card.append(head);
  if (it.hint) card.append(h('p', {class:'hint'}, it.hint));
  const body = RENDER[it.t](it, x);
  card.append(body, h('div', {class:'msg', role:'alert'}));
  return card;
}

function optRow(type, name, code, label, checked, onchange, extraCls){
  const inp = h('input', {type, name, value: code, onchange});
  inp.checked = !!checked;
  return h('label', {class:'opt' + (type==='checkbox' ? ' cb' : '') + (checked ? ' sel' : '') + (extraCls ? ' ' + extraCls : '')},
    inp, h('span', {class:'dot', 'aria-hidden':'true'}), h('span', null, label));
}

const RENDER = {
  radio(it){
    const wrap = h('div', {class: it.layout === 'pills' ? 'pills' : 'opts'});
    const all = it.opts.slice(); if (it.na) all.push([NA, 'Tidak ingin menjawab', {na:true}]);
    all.forEach(([code, label, o={}], idx) => {
      if (o.na && it.layout !== 'pills') wrap.append(h('div', {class:'sep'}));
      const pick = () => { setAns(it.v, code); if (!o.spec) delete S.ans[it.v + '_oth']; save(); };
      if (it.layout === 'pills') {
        const inp = h('input', {type:'radio', name:it.v, value:code, onchange:pick}); inp.checked = S.ans[it.v] === code;
        wrap.append(h('label', {class:'pill' + (o.na ? ' na' : '') + (inp.checked ? ' sel' : '')}, inp, label));
      } else {
        wrap.append(optRow('radio', it.v, code, label, S.ans[it.v] === code, pick, o.na ? 'na' : ''));
        if (o.spec) wrap.append(specInput(it, code, o));
      }
    });
    return wrap;
  },
  check(it){
    const wrap = h('div', {class:'opts'});
    const all = it.opts.slice(); if (it.na) all.push([NA, 'Tidak ingin menjawab', {na:true}]);
    const excl = (it.exclusive || []).concat([NA]);
    all.forEach(([code, label, o={}]) => {
      if (o.na) wrap.append(h('div', {class:'sep'}));
      const cur = S.ans[it.v] || [];
      wrap.append(optRow('checkbox', it.v, code, label, cur.includes(code), e => {
        let a = (S.ans[it.v] || []).slice();
        if (e.target.checked) { a = excl.includes(code) ? [code] : a.filter(c => !excl.includes(c)).concat(code); }
        else a = a.filter(c => c !== code);
        a.sort((p,q)=>p-q);
        if (o.spec && !e.target.checked) delete S.ans[it.v + '_oth'];
        setAns(it.v, a); syncChecks(it);
      }, o.na ? 'na' : ''));
      if (o.spec) wrap.append(specInput(it, code, o));
    });
    return wrap;
  },
  num(it){
    const inp = h('input', {type:'number', inputmode:'numeric', min:it.min, max:it.max, step:1, id:'in_' + it.v, 'aria-label': it.id,
      oninput: e => { const t = e.target.value.trim(); const n = t === '' ? undefined : Number(t);
        S.ans[it.v] = n; if (n === undefined) delete S.ans[it.v]; delete S.ans[it.v + '_oth']; save(); refresh(); }});
    const cur = S.ans[it.v]; if (numv(cur) !== null) inp.value = cur;
    const row = h('div', {class:'numrow'}, inp, it.unit ? h('span', {class:'unit'}, it.unit) : null);
    const alts = (it.alts || []).slice(); if (it.na) alts.push([NA, 'Tidak ingin menjawab']);
    const wrap = h('div', null, row);
    if (alts.length) {
      const chips = h('div', {class:'chips'});
      alts.forEach(([code, label, o={}]) => {
        chips.append(h('button', {type:'button', class:'chip' + (cur === code ? ' sel' : ''), 'data-code':code, 'aria-pressed': cur === code ? 'true' : 'false',
          onclick: () => { inp.value = ''; if (S.ans[it.v] === code) { delete S.ans[it.v]; } else S.ans[it.v] = code;
            if (!o.spec) delete S.ans[it.v + '_oth']; save(); refresh(); }}, label));
      });
      wrap.append(chips);
      alts.filter(a => a[2] && a[2].spec).forEach(a => wrap.append(specInput(it, a[0], a[2])));
    }
    return wrap;
  },
  multinum(it){
    const wrap = h('div', {class:'two'});
    it.fields.forEach(([f, label, unit]) => {
      const k = it.v + '_' + f; const cur = S.ans[k];
      const inp = h('input', {type:'number', inputmode:'numeric', min:it.min, max:it.max, step:1, id:'in_' + k,
        oninput: e => { const t = e.target.value.trim(); if (t === '') delete S.ans[k]; else S.ans[k] = Number(t);
          it.fields.forEach(([g]) => { if (S.ans[it.v+'_'+g] === NA) delete S.ans[it.v+'_'+g]; }); save(); refresh(); }});
      if (numv(cur) !== null) inp.value = cur;
      wrap.append(h('div', null, h('label', {for:'in_' + k}, label + (unit ? ' (' + unit + ')' : '')), inp));
    });
    const out = h('div', null, wrap);
    if (it.na) out.append(naChip(it, it.fields.map(f => it.v + '_' + f[0])));
    return out;
  },
  monthyear(it){
    const kb = it.v + '_bln', ky = it.v + '_thn';
    const sb = h('select', {id:'in_' + kb, onchange: e => { e.target.value ? S.ans[kb] = Number(e.target.value) : delete S.ans[kb]; if (S.ans[ky] === NA) delete S.ans[ky]; save(); refresh(); }},
      h('option', {value:''}, '— Bulan —'), BULAN.map((b,i) => h('option', {value:i+1}, b)));
    const sy = h('select', {id:'in_' + ky, onchange: e => { e.target.value ? S.ans[ky] = Number(e.target.value) : delete S.ans[ky]; if (S.ans[kb] === NA) delete S.ans[kb]; save(); refresh(); }},
      h('option', {value:''}, '— Tahun —'));
    for (let y = it.y1; y >= it.y0; y--) sy.append(h('option', {value:y}, String(y)));
    if (numv(S.ans[kb]) !== null) sb.value = S.ans[kb];
    if (S.ans[ky] && S.ans[ky] !== NA) sy.value = S.ans[ky];
    const out = h('div', null, h('div', {class:'two'}, h('div', null, h('label', {for:'in_'+kb}, 'Bulan'), sb), h('div', null, h('label', {for:'in_'+ky}, 'Tahun'), sy)));
    if (it.na) out.append(naChip(it, [kb, ky]));
    return out;
  },
  select(it){
    const sel = h('select', {id:'in_' + it.v, 'aria-label': it.id, onchange: e => {
      const val = e.target.value; const o = e.target.selectedOptions[0];
      if (!val) { delete S.ans[it.v + '_nama']; setAns(it.v, undefined); return; }
      const code = (it.staticOpts || val === String(NA)) ? Number(val) : val;
      S.ans[it.v + '_nama'] = code === NA ? '' : o.textContent;
      setAns(it.v, code);
    }});
    fillSelect(it, sel);
    return sel;
  },
  slider(it){
    const cur = S.ans[it.v];
    const val = h('div', {class:'slider-val' + (numv(cur) === null ? ' unset' : '')}, numv(cur) === null ? 'Geser untuk memilih nilai' : String(cur));
    const rng = h('input', {type:'range', min:it.min, max:it.max, step:1, 'aria-label': it.id,
      oninput: e => { S.ans[it.v] = Number(e.target.value); save(); refresh(); },
      onchange: e => { S.ans[it.v] = Number(e.target.value); save(); refresh(); },
      onpointerup: e => { if (numv(S.ans[it.v]) === null) { S.ans[it.v] = Number(e.target.value); save(); refresh(); } }});
    rng.value = numv(cur) !== null ? cur : Math.round((it.min + it.max)/2);
    const out = h('div', {class:'slider-wrap'}, val, rng, h('div', {class:'slider-ends'}, h('span', null, it.ends[0]), h('span', null, it.ends[1])));
    if (it.na) out.append(naChip(it, [it.v]));
    return out;
  },
  area(it){
    const ta = h('textarea', {id:'in_' + it.v, maxlength:2000, 'aria-label': it.id, oninput: e => { const t = e.target.value; t ? S.ans[it.v] = t : delete S.ans[it.v]; save(); }});
    ta.value = S.ans[it.v] || ''; return ta;
  },
  grid(it){
    const wrap = h('div', null);
    it.rows.forEach(([s, label, ro={}]) => {
      const k = it.v + s;
      const row = h('div', {class:'grid-row', 'data-row': k, role:'radiogroup', 'aria-label': label},
        h('div', {class:'rlab'}, label, vtag(k)));
      const pills = h('div', {class:'pills' + (it.stack ? ' stack' : '')});
      const cols = it.cols.map((c, i) => [ro.codes ? ro.codes[i] : c[0], c[1]]);
      if (it.na) cols.push([NA, 'Tidak ingin menjawab', true]);
      cols.forEach(([code, lab, isNa]) => {
        const inp = h('input', {type:'radio', name:k, value:code, onchange: () => setAns(k, code)});
        inp.checked = S.ans[k] === code;
        pills.append(h('label', {class:'pill' + (isNa ? ' na' : '') + (inp.checked ? ' sel' : '')}, inp, lab));
      });
      row.append(pills); wrap.append(row);
    });
    return wrap;
  },
  bipolar(it){
    const wrap = h('div', null);
    it.rows.forEach(([s, left, right]) => {
      const k = it.v + s;
      const row = h('div', {class:'grid-row', 'data-row': k, role:'radiogroup', 'aria-label': left + ' – ' + right},
        h('div', {class:'bipolar-ends'}, h('span', null, '← ' + left), h('span', null, right + ' →')), vtag(k));
      const pills = h('div', {class:'pills scale7'});
      for (let c = 1; c <= it.scale; c++) {
        const inp = h('input', {type:'radio', name:k, value:c, onchange: () => setAns(k, c)}); inp.checked = S.ans[k] === c;
        pills.append(h('label', {class:'pill' + (inp.checked ? ' sel' : '')}, inp, String(c)));
      }
      if (it.na) { const inp = h('input', {type:'radio', name:k, value:NA, onchange: () => setAns(k, NA)}); inp.checked = S.ans[k] === NA;
        row.append(pills, h('div', {class:'pills', style:'margin-top:6px'}, h('label', {class:'pill na' + (inp.checked ? ' sel' : '')}, inp, 'Tidak ingin menjawab'))); }
      else row.append(pills);
      wrap.append(row);
    });
    return wrap;
  }
};

function naChip(it, keys){
  const on = keys.every(k => S.ans[k] === NA);
  return h('div', {class:'chips'}, h('button', {type:'button', class:'chip' + (on ? ' sel' : ''), 'aria-pressed': on ? 'true':'false', onclick: () => {
    const now = keys.every(k => S.ans[k] === NA);
    keys.forEach(k => now ? delete S.ans[k] : (S.ans[k] = NA));
    save(); render(true);
  }}, 'Tidak ingin menjawab'));
}

function specInput(it, code, o){
  const k = it.v + '_oth';
  const inp = h('input', {type: o.inputType || 'text', placeholder: o.ph || 'Sebutkan…', maxlength:200, 'aria-label':'Sebutkan', 'data-for': code,
    oninput: e => { const t = e.target.value; t ? S.ans[k] = t : delete S.ans[k]; save(); }});
  const selected = Array.isArray(S.ans[it.v]) ? S.ans[it.v].includes(code) : S.ans[it.v] === code;
  if (selected && S.ans[k]) inp.value = S.ans[k];
  return h('div', {class:'spec' + (selected ? '' : ' hidden'), 'data-spec': code}, inp);
}

function fillSelect(it, sel){
  let list;
  if (it.staticOpts) list = it.staticOpts.map(o => [String(o[0]), o[1]]);
  else if (it.src === 'prov') list = W.prov();
  else if (it.src === 'kab') list = W.kab(S.ans[it.parent]);
  else list = W.kec(S.ans[it.parent]);
  const parentVal = it.parent ? S.ans[it.parent] : '_';
  sel.dataset.parent = String(parentVal);
  sel.innerHTML = '';
  const disabled = it.parent && (!parentVal || parentVal === NA);
  sel.append(h('option', {value:''}, disabled ? '— Pilih ' + (it.src === 'kec' ? 'kabupaten/kota' : 'provinsi') + ' terlebih dahulu —' : '— Pilih —'));
  list.forEach(([c, n]) => sel.append(h('option', {value:c}, n)));
  if (it.na && !disabled) sel.append(h('option', {value:String(NA)}, 'Tidak ingin menjawab'));
  sel.disabled = !!disabled;
  const cur = S.ans[it.v]; if (cur !== undefined) sel.value = String(cur);
}

function syncChecks(it){
  const card = $('card_' + it.v); if (!card) return; const cur = S.ans[it.v] || [];
  card.querySelectorAll('input[type=checkbox]').forEach(inp => { const on = cur.includes(Number(inp.value)); inp.checked = on; inp.closest('.opt').classList.toggle('sel', on); });
}

// Perbarui tampilan tanpa merender ulang (agar fokus input tidak hilang)
function refresh(){
  const { x } = computeVis();
  const p = PAGES[S.page];
  p.items.forEach(it => {
    const card = document.querySelector('[data-key="' + it.v + '"]'); if (!card) return;
    card.classList.toggle('hidden', !VIS[it.v]);
    if (it.t === 'info') return;
    if (typeof it.q === 'function') { const qt = card.querySelector('.qtext'); if (qt) qt.firstChild.textContent = it.q(x); }
    if (it.rows) it.rows.forEach(r => { const row = card.querySelector('[data-row="' + it.v + r[0] + '"]'); if (row) row.classList.toggle('hidden', !VIS[it.v + r[0]]); });
    // status terpilih
    card.querySelectorAll('input[type=radio]').forEach(inp => {
      const on = S.ans[inp.name] === Number(inp.value); inp.checked = on;
      (inp.closest('.opt') || inp.closest('.pill')).classList.toggle('sel', on);
    });
    card.querySelectorAll('.chip[data-code]').forEach(b => { const on = S.ans[it.v] === Number(b.dataset.code); b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
    card.querySelectorAll('[data-spec]').forEach(d => { const c = Number(d.dataset.spec); const sel = Array.isArray(S.ans[it.v]) ? S.ans[it.v].includes(c) : S.ans[it.v] === c; d.classList.toggle('hidden', !sel); });
    if (it.t === 'select') { const sel = card.querySelector('select'); const pv = it.parent ? String(S.ans[it.parent]) : '_'; if (sel.dataset.parent !== pv) fillSelect(it, sel); }
    if (it.t === 'slider') { const v = card.querySelector('.slider-val'); const c = S.ans[it.v];
      v.textContent = numv(c) === null ? (c === NA ? 'Tidak ingin menjawab' : 'Geser untuk memilih nilai') : String(c); v.classList.toggle('unset', numv(c) === null); }
    if (card.classList.contains('err') || card.classList.contains('soft')) { if (isAnswered(it)) clearMsg(card); }
  });
}

// ---------- Validasi ----------
function isAnswered(it){
  const a = S.ans;
  switch (it.t) {
    case 'check': return (a[it.v] || []).length > 0;
    case 'grid': case 'bipolar': return it.rows.every(r => !VIS[it.v + r[0]] || a[it.v + r[0]] !== undefined);
    case 'multinum': return it.fields.every(f => a[it.v + '_' + f[0]] !== undefined);
    case 'monthyear': return a[it.v + '_bln'] !== undefined && a[it.v + '_thn'] !== undefined;
    default: return a[it.v] !== undefined && a[it.v] !== '';
  }
}
function setMsg(card, cls, text){ card.classList.remove('err','soft'); card.classList.add(cls); card.querySelector('.msg').textContent = text; }
function clearMsg(card){ card.classList.remove('err','soft'); const m = card.querySelector('.msg'); if (m) m.textContent = ''; }

function validatePage(){
  const { x } = computeVis();
  const p = PAGES[S.page];
  let hard = [], soft = [];
  p.items.forEach(it => {
    if (it.t === 'info' || !VIS[it.v]) return;
    const card = $('card_' + it.v); if (card) clearMsg(card);
    card && card.querySelectorAll('.grid-row.err').forEach(r => r.classList.remove('err'));
    const val = S.ans[it.v];
    let err = null;
    if (it.req && !isAnswered(it)) err = 'Pertanyaan ini wajib dijawab.';
    if (!err && (it.t === 'num') && numv(val) !== null && (val < it.min || val > it.max || !Number.isInteger(val))) err = `Masukkan bilangan bulat antara ${it.min} dan ${it.max}.`;
    if (!err && it.t === 'multinum') it.fields.forEach(f => { const v = S.ans[it.v+'_'+f[0]]; if (numv(v) !== null && (v < it.min || v > it.max || !Number.isInteger(v))) err = `Masukkan bilangan bulat antara ${it.min} dan ${it.max}.`; });
    if (!err && it.t === 'num' && val !== undefined && val !== NA && numv(val) === null && !(it.alts||[]).some(a => a[0] === val)) err = 'Masukkan angka yang valid.';
    if (!err && it.validate) err = it.validate(val, x);
    if (!err && it.v === 'Z2' && val !== undefined && val !== NA) {
      const c = (S.ans.Z2_oth || '').trim();
      if (c && val === 2 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) err = 'Format alamat email tampaknya tidak valid.';
      if (c && (val === 1 || val === 3) && !/^\+?[0-9 \-]{8,16}$/.test(c)) err = 'Format nomor telepon tampaknya tidak valid.';
    }
    if (err) { hard.push(it); if (card) setMsg(card, 'err', err); return; }
    if (!isAnswered(it) && it.soft !== false && !it.req) {
      soft.push(it);
      if (card && (it.t === 'grid' || it.t === 'bipolar')) it.rows.forEach(r => { const k = it.v + r[0]; if (VIS[k] && S.ans[k] === undefined) { const row = card.querySelector('[data-row="'+k+'"]'); row && row.classList.add('err'); } });
    }
  });
  return { hard, soft, x };
}

// ---------- Navigasi ----------
function visiblePageAfter(i, pageVis){ for (let j = i + 1; j < PAGES.length; j++) if (pageVis[j]) return j; return -1; }
function visiblePageBefore(i, pageVis){ for (let j = i - 1; j >= 0; j--) if (pageVis[j]) return j; return -1; }

function trackTime(){
  const p = PAGES[S.page]; if (!S._enter) return;
  const sec = Math.round((Date.now() - S._enter) / 1000);
  S.pageSec[p.id] = (S.pageSec[p.id] || 0) + sec;
  if (p.special === 'A0') S.a0Sec = (S.a0Sec || 0) + sec;
  S._enter = Date.now();
}

async function next(){
  const p = PAGES[S.page];
  if (p.special !== 'A0') {
    const { hard, soft, x } = validatePage();
    if (hard.length) { focusCard(hard[0]); return; }
    if (soft.length && !S.soft[p.id]) {
      S.soft[p.id] = true; save();
      soft.forEach(it => { const c = $('card_' + it.v); c && setMsg(c, 'soft', 'Belum dijawab. Anda boleh melewatinya, atau memilih "Tidak ingin menjawab".'); });
      showTopBanner('warn', `Ada ${soft.length} pertanyaan yang belum dijawab di halaman ini. Tekan "Lanjut" sekali lagi jika Anda ingin melewatinya.`);
      focusCard(soft[0]); return;
    }
    // kriteria berhenti (skrining)
    for (const it of p.items) {
      if (!it.end || !VIS[it.v]) continue;
      const r = it.end(S.ans[it.v], x);
      if (r) { trackTime(); return finish('screenout', r); }
    }
  }
  trackTime();
  if (p.special === 'A0') S.lockIdx = S.page;
  const { pageVis } = computeVis();
  const j = visiblePageAfter(S.page, pageVis);
  if (j < 0) return finish('complete');
  S.page = j; save(); render();
}
function back(){
  trackTime();
  const { pageVis } = computeVis();
  const j = visiblePageBefore(S.page, pageVis);
  if (j < 0 || j <= S.lockIdx) return;
  S.page = j; save(); render();
}
function setNav(){
  const { pageVis } = computeVis();
  const p = PAGES[S.page];
  const j = visiblePageBefore(S.page, pageVis);
  $('btnBack').classList.toggle('hidden', j < 0 || j <= S.lockIdx || p.noBack || p.special === 'A0');
  const last = visiblePageAfter(S.page, pageVis) < 0;
  $('btnNext').textContent = last ? 'Kirim jawaban' : 'Lanjut';
  $('btnNext').disabled = false;
  $('nav').classList.remove('hidden');
}
function focusCard(it){ const c = $('card_' + it.v); if (c) { c.scrollIntoView({behavior:'smooth', block:'center'}); const f = c.querySelector('input,select,textarea'); f && setTimeout(() => f.focus({preventScroll:true}), 300); } }
function showTopBanner(cls, text){
  const old = document.querySelector('#app > .banner.dyn'); old && old.remove();
  $('app').prepend(h('div', {class:'banner dyn ' + cls, role:'status'}, text));
}
function updateProgress(pageVis){
  const idx = []; pageVis.forEach((v,i) => v && idx.push(i));
  const pos = Math.max(0, idx.indexOf(S.page));
  $('prog').style.width = Math.round(100 * pos / Math.max(1, idx.length - 1)) + '%';
}

// ---------- A0: randomisasi & bacaan ----------
async function assignArm(x){
  if (S.arm) return;
  const sex = x.SEX || 0;
  const c25 = numv(x.v('C2_5'));
  const par = c25 === null ? 'x' : (c25 >= 1 ? 1 : 0);
  S.stratum = 'SEX' + sex + '_PAR' + par;
  try {
    if (!scriptReady()) throw new Error('no url');
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), CONFIG.ARM_TIMEOUT_MS);
    const url = CONFIG.SCRIPT_URL + '?action=arm&id=' + encodeURIComponent(S.id) + '&stratum=' + encodeURIComponent(S.stratum) + '&token=' + encodeURIComponent(CONFIG.TOKEN) + (DEBUG ? '&test=1' : '');
    const r = await fetch(url, {signal: ctl.signal}); clearTimeout(t);
    const j = await r.json();
    if (j && (j.arm === 1 || j.arm === 2)) { S.arm = j.arm; S.armSource = 'server'; }
    else throw new Error('bad');
  } catch (e) {
    S.arm = Math.random() < 0.5 ? 1 : 2; S.armSource = 'client';
  }
  save();
}
async function renderA0(app){
  $('nav').classList.remove('hidden');
  $('btnBack').classList.add('hidden');
  const btn = $('btnNext'); btn.disabled = true; btn.textContent = 'Lanjut';
  const box = h('div', null, h('p', null, h('span', {class:'spinner'}), 'Menyiapkan bagian berikutnya…'));
  app.append(box);
  const { x } = computeVis();
  await assignArm(x);
  box.innerHTML = '';
  box.append(h('p', {class:'lead'}, h('i', null, 'Silakan baca teks singkat berikut dengan saksama sebelum melanjutkan.')),
             h('div', {class:'reading'}, A0_TEXT[S.arm]));
  if (DEBUG) box.append(h('p', {class:'hint'}, `[DEBUG] ARM=${S.arm} (${S.armSource}), strata=${S.stratum}`));
  S._enter = Date.now();
  let left = CONFIG.MIN_READ_SECONDS;
  const tick = () => {
    if (PAGES[S.page].special !== 'A0') return;
    if (left <= 0) { btn.disabled = false; btn.textContent = 'Lanjut'; return; }
    btn.textContent = `Lanjut (${left})`; left--; setTimeout(tick, 1000);
  };
  tick();
  window.scrollTo(0, 0);
}

// ---------- Ekspor data ----------
const META_COLS = ['RESP_ID','STATUS','SCREEN_REASON','FORM_VERSION','TEST','START_TS','END_TS','DURASI_DETIK','DEVICE','SCREEN','UA',
  'ARM','ARM_SOURCE','STRATUM','A0_DETIK','SEX','HAMIL','PARITAS_GRUP','BULAN_SEJAK_LAHIR','B_ELIG','SEKS12','PASOKAN','BUTUH','ATTN1_OK','ATTN2_OK','PAGE_DETIK','HP'];

function itemCols(it){
  if (it.t === 'info' || it.contact) return [];
  switch (it.t) {
    case 'check': return it.opts.map(o => it.v + '_' + o[0]).concat(it.na ? [it.v + '_' + NA] : [], it.opts.some(o => o[2] && o[2].spec) ? [it.v + '_oth'] : []);
    case 'grid': case 'bipolar': return it.rows.map(r => it.v + r[0]);
    case 'multinum': return it.fields.map(f => it.v + '_' + f[0]);
    case 'monthyear': return [it.v + '_bln', it.v + '_thn'];
    case 'select': return [it.v, it.v + '_nama'].concat(it.src === 'prov' ? [it.v + '_bps'] : []);
    default: {
      const spec = (it.opts || []).concat(it.alts || []).some(o => o[2] && o[2].spec);
      return [it.v].concat(spec ? [it.v + '_oth'] : []);
    }
  }
}
const ALL_COLS = () => META_COLS.concat(ITEMS.flatMap(itemCols));

function buildPayload(status, reason){
  const { x } = computeVis();
  const SK = CONFIG.SKIPPED_CODE;
  const d = {};
  ITEMS.forEach(it => {
    if (it.t === 'info' || it.contact) return;
    const reached = !!S.visited[PAGES[it.page].id];
    const shown = reached && VIS[it.v];
    const put = (k, v) => d[k] = v;
    const cols = itemCols(it);
    if (!shown) { cols.forEach(c => put(c, '')); return; }
    const a = S.ans;
    switch (it.t) {
      case 'check': {
        const sel = a[it.v] || [];
        it.opts.concat(it.na ? [[NA]] : []).forEach(o => put(it.v + '_' + o[0], sel.length ? (sel.includes(o[0]) ? 1 : 0) : SK));
        if (cols.includes(it.v + '_oth')) put(it.v + '_oth', a[it.v + '_oth'] || '');
        break; }
      case 'grid': case 'bipolar':
        it.rows.forEach(r => { const k = it.v + r[0]; put(k, VIS[k] ? (a[k] !== undefined ? a[k] : SK) : ''); }); break;
      case 'multinum': it.fields.forEach(f => { const k = it.v + '_' + f[0]; put(k, a[k] !== undefined ? a[k] : SK); }); break;
      case 'monthyear': [it.v + '_bln', it.v + '_thn'].forEach(k => put(k, a[k] !== undefined ? a[k] : SK)); break;
      case 'select':
        put(it.v, a[it.v] !== undefined ? a[it.v] : SK); put(it.v + '_nama', a[it.v + '_nama'] || '');
        if (it.src === 'prov') put(it.v + '_bps', a[it.v] && a[it.v] !== NA ? (PROV_BPS[a[it.v]] || a[it.v]) : '');
        break;
      case 'area': put(it.v, a[it.v] || ''); break;
      default:
        put(it.v, a[it.v] !== undefined ? a[it.v] : SK);
        if (cols.includes(it.v + '_oth')) put(it.v + '_oth', a[it.v + '_oth'] || '');
    }
  });
  const end = new Date();
  const ua = navigator.userAgent || '';
  const isTablet = /iPad|Tablet/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const device = isTablet ? 'tablet' : (/Mobi|Android|iPhone/i.test(ua) ? 'mobile' : 'desktop');
  const c25 = numv(x.v('C2_5'));
  const attn = (k, ok) => S.visited[PAGES[ITEM[k].page].id] && VIS[k] ? (S.ans[k] === ok ? 1 : 0) : '';
  Object.assign(d, {
    RESP_ID: S.id, STATUS: status, SCREEN_REASON: reason ? reason.reason : '', FORM_VERSION: CONFIG.FORM_VERSION, TEST: DEBUG ? 1 : 0,
    START_TS: S.start, END_TS: isoLocal(end), DURASI_DETIK: Math.round((end.getTime() - S.startMs) / 1000),
    DEVICE: device, SCREEN: (screen.width||'') + 'x' + (screen.height||''), UA: ua.slice(0, 300),
    ARM: S.arm || '', ARM_SOURCE: S.armSource || '', STRATUM: S.stratum || '', A0_DETIK: S.a0Sec === null ? '' : S.a0Sec,
    SEX: x.SEX || '', HAMIL: x.SEX ? x.HAMIL : '', PARITAS_GRUP: c25 === null ? '' : (c25 >= 1 ? 1 : 0),
    BULAN_SEJAK_LAHIR: x.BSL === null ? '' : x.BSL, B_ELIG: x.SEX ? x.BELIG : '',
    SEKS12: VIS.B1_1 ? x.SEKS12 : '', PASOKAN: VIS.B1_3 ? x.PASOKAN : (VIS.B1_1 ? 0 : ''), BUTUH: VIS.B4_1a ? x.BUTUH : '',
    ATTN1_OK: attn('ATTN1', 3), ATTN2_OK: attn('ATTN2', 3), PAGE_DETIK: JSON.stringify(S.pageSec),
    HP: (($('hpField') || {}).value || '').slice(0, 100)
  });
  let contact = null;
  if (VIS.Z2 && S.ans.Z2 !== undefined && S.ans.Z2 !== NA && S.visited.P_END) {
    contact = { RESP_ID: S.id, METODE: {1:'WhatsApp',2:'Email',3:'SMS'}[S.ans.Z2], KONTAK: (S.ans.Z2_oth || '').trim(), TEST: DEBUG ? 1 : 0 };
  }
  return { action:'submit', data:d, order: ALL_COLS(), contact };
}

const PENDING_KEY = CONFIG.STORAGE_KEY + '_pending';
const scriptReady = () => /^https:\/\/script\.google(usercontent)?\.com\//.test(CONFIG.SCRIPT_URL);
async function postPayload(pl){
  const r = await fetch(CONFIG.SCRIPT_URL, { method:'POST', body: JSON.stringify(Object.assign({token: CONFIG.TOKEN}, pl)) }); // text/plain: tanpa preflight CORS
  const j = await r.json();
  if (!j || !j.ok) throw new Error(j && j.error || 'Gagal');
  return j;
}
async function flushPending(){
  const q = store.get(PENDING_KEY) || []; if (!q.length || !scriptReady()) return q.length;
  const rest = [];
  for (const pl of q) {
    try { const j = await postPayload(pl); if (pl.claim && (claimState() || {}).code === pl.claim) setClaim({sent:true, hak: j.hak || null}); }
    catch (e) { rest.push(pl); }
  }
  rest.length ? store.set(PENDING_KEY, rest) : store.del(PENDING_KEY);
  return rest.length;
}
async function finish(status, reason){
  const pl = buildPayload(status, reason);
  S.status = status;
  if (status === 'complete') {
    const code = (claimState() || {}).code || newCode();
    store.set(CLAIM_KEY, {code, sent:false, claimed:false, hak:null});
    pl.claim = code;   // dikirim di luar objek data: tidak tersimpan di sheet Responses
    store.set(DONE_KEY, new Date().toISOString());
  }
  const q = store.get(PENDING_KEY) || []; q.push(pl); store.set(PENDING_KEY, q);
  store.del(CONFIG.STORAGE_KEY); // hapus isian dari perangkat (privasi)
  const app = $('app'); app.innerHTML = '';
  $('nav').classList.add('hidden'); $('prog').style.width = '100%'; $('sect').textContent = '';
  const st = h('div', {class:'banner ok', role:'status'}, h('span', {class:'spinner'}), 'Mengirim jawaban…');
  app.append(st);
  if (status === 'complete') app.append(h('div', {html: THANKS_HTML()}));
  else app.append(h('h1', null, reason.msg));
  let left = 1;
  try { left = await flushPending(); } catch (e) {}
  st.className = 'banner ' + (left ? 'warn' : 'ok'); st.innerHTML = '';
  st.textContent = left
    ? (scriptReady() ? 'Jawaban belum terkirim karena koneksi bermasalah. Jawaban tersimpan di perangkat ini dan akan dikirim otomatis saat halaman survei dibuka kembali dengan koneksi internet.' : 'Mode uji: SCRIPT_URL belum diisi, jadi jawaban hanya tersimpan di perangkat ini.')
    : (status === 'complete' ? 'Jawaban Anda telah terkirim. Anda dapat menutup halaman ini.' : 'Survei selesai. Anda dapat menutup halaman ini.');
  if (left && scriptReady()) {
    const retry = h('button', {class:'btn', type:'button', style:'margin-top:10px', onclick: async () => { retry.disabled = true; const l = await flushPending(); if (!l) { st.className='banner ok'; st.textContent = 'Jawaban Anda telah terkirim. Terima kasih!'; retry.remove(); } else retry.disabled = false; }}, 'Coba kirim lagi');
    st.after(retry);
  }
  if (status === 'complete') renderIncentive();
  window.scrollTo(0, 0);
}

  const box = $('incentive'); if (!box) return;
  box.innerHTML = claimBox() + certBox() + `<p class="status-link">Simpan tautan ini untuk mengecek status pulsa atau hasil undian kapan saja: <a href="#status">halaman cek status</a>.</p>`;

  UNDIAN: () => `<p class="hak hak-u">Jatah pulsa untuk kelompok Anda sudah terpenuhi. Anda otomatis menjadi peserta undian ${CONFIG.LOTTERY} pada ${CONFIG.DRAW_DATE}.</p>`,
  TIDAK: () => `<p class="hak hak-t">Waktu pengisian tercatat kurang dari ${CONFIG.MIN_MINUTES} menit, sehingga tidak memenuhi syarat insentif. Jawaban Anda tetap kami terima, dan Anda tetap dapat mengunduh e-sertifikat.</p>`,
  null: () => `<p class="hak hak-t">Setelah jawaban Anda diterima server, kami akan menampilkan apakah Anda mendapat pulsa pasti atau menjadi peserta undian.</p>`
};
const OPS = '<option value="">Pilih…</option><option>Telkomsel</option><option>Indosat Ooredoo Hutchison</option><option>XL Axiata</option><option>Smartfren</option><option>Lainnya</option>';

function claimBox(){
  const c = claimState();
  if (!c || !c.code) return '';
  const head = '<h3>Pulsa dan undian</h3>';
  if (c.claimed) return `<div class="box" id="claimBox">${head}${(HAK_TXT[c.hak] || HAK_TXT.null)()}<p class="note">Nomor telepon Anda sudah tercatat. ${c.hak === 'UNDIAN' ? `Pemenang undian akan dihubungi melalui nomor tersebut setelah ${esc(CONFIG.DRAW_DATE)}.` : `Pulsa akan dikirim tim peneliti dalam ${CONFIG.PAYOUT_DAYS} hari kerja.`}</p><p class="note">Kode klaim Anda: <b>${esc(c.code)}</b></p></div>`;
  if (!c.sent) return `<div class="box" id="claimBox">${head}<p class="note">Klaim dapat dilakukan setelah jawaban Anda terkirim. Buka kembali halaman ini saat ada koneksi internet; jawaban akan terkirim otomatis dan formulir klaim akan muncul. Urutan jatah pulsa dihitung saat jawaban diterima server.</p><p class="claim-code">${esc(c.code)}</p><p class="note">Simpan kode di atas (misalnya tangkapan layar). Kode ini hanya untuk klaim dan tidak terhubung dengan jawaban Anda.</p></div>`;
  if (c.hak === 'TIDAK') return `<div class="box" id="claimBox">${head}${HAK_TXT.TIDAK()}</div>`;
  return `<div class="box" id="claimBox">${head}${(HAK_TXT[c.hak] || HAK_TXT.null)()}
    <p class="claim-code">${esc(c.code)}</p>
    <p class="note">Simpan kode ini (misalnya tangkapan layar) untuk mengecek status. Kode klaim berlaku satu kali. Kode dan nomor telepon disimpan terpisah dan tidak dapat dihubungkan dengan jawaban survei Anda.</p>
    <label for="ccode">Kode klaim</label>
    <input type="text" class="code-in" id="ccode" value="${esc(c.code)}" maxlength="9" placeholder="K7Q2-M9XD" autocomplete="off" autocapitalize="characters" spellcheck="false"><p class="code-warn" aria-live="polite"></p>
    <label for="phone">Nomor telepon seluler</label>
    <input type="tel" id="phone" inputmode="tel" placeholder="08xxxxxxxxxx" autocomplete="tel">
    <label for="opr">Operator</label>
    <select id="opr">${OPS}</select>
    <div class="ferr" id="phErr" role="alert"></div>
    <button class="btn primary" id="claim" type="button" style="margin-top:14px;width:100%">${c.hak === 'UNDIAN' ? 'Daftar undian' : 'Klaim pulsa'}</button></div>`;
}
function bindClaim(){
  const btn = $('claim'); if (!btn) return;
  btn.onclick = async () => {
    const code = normCode($('ccode').value), ph = $('phone').value.replace(/[^0-9+]/g, ''), op = $('opr').value, err = $('phErr');
    const show = m => { err.style.display = 'block'; err.textContent = m; };
    if (!CODE_RE.test(code)) return show('Kode klaim terdiri dari 8 huruf dan angka, misalnya K7Q2-M9XD.');
    if (!/^(\+62|62|0)8\d{7,12}$/.test(ph)) return show('Masukkan nomor seluler yang valid, misalnya 081234567890.');
    if (!op) return show('Pilih operator nomor Anda.');
    const label = btn.textContent; btn.disabled = true; btn.textContent = 'Mengirim…'; err.style.display = 'none';
    let j = {ok:true, hak:(claimState() || {}).hak};
    if (scriptReady()) { try { j = await postPayload({action:'incentive', code, phone:ph, operator:op}); } catch (e) { j = {ok:false, error: /network|fetch/i.test(String(e)) ? 'network' : String(e.message || e)}; } }
    if (j.ok) { setClaim({claimed:true, hak:j.hak || (claimState() || {}).hak}); $('claimBox').outerHTML = claimBox(); return; }
    btn.disabled = false; btn.textContent = label;
    show({code_invalid:'Kode klaim tidak dikenali. Periksa kembali penulisan kode. Bila jawaban Anda baru saja dikirim, tunggu satu menit lalu coba lagi.',
          code_used:'Kode klaim ini sudah dipakai. Setiap kode hanya berlaku satu kali.',
          phone_used:'Nomor telepon ini sudah pernah dipakai untuk klaim. Setiap nomor hanya dapat mengklaim satu kali.',
          not_eligible:`Kode ini tidak memenuhi syarat insentif karena waktu pengisian kurang dari ${CONFIG.MIN_MINUTES} menit.`,
          phone:'Nomor telepon tidak valid.',
          network:'Koneksi terputus. Periksa internet Anda, lalu coba lagi.'}[j.error] || 'Klaim belum berhasil. Coba lagi beberapa saat lagi.');
  };
}

/* e-sertifikat: dibuat di perangkat, nama tidak dikirim ke server */
function certBox(){
  return `<div class="box" id="certBox"><h3>E-sertifikat partisipasi</h3>
    <p class="note">Ketik nama Anda sebagaimana ingin tercetak. Nama hanya dipakai untuk membuat sertifikat di perangkat ini dan tidak dikirim ke tim peneliti.</p>
    <label for="certName">Nama lengkap dan gelar</label>
    <input type="text" id="certName" autocomplete="name" placeholder="Contoh: Ni Made Sari, S.Pd.">
    <div class="ferr" id="certErr" role="alert"></div>
    <button class="btn" id="certBtn" type="button" style="margin-top:14px;width:100%">Unduh e-sertifikat</button></div>`;
}
function wrapLines(ctx, text, maxW){
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}
let CERT_LOGO = null;
(function(){ const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => { CERT_LOGO = im; }; im.src = CONFIG.LOGO; })();
function bindCert(){
  const b = $('certBtn'); if (!b) return;
  b.onclick = () => {
    const name = $('certName').value.trim().replace(/\s+/g, ' ');
    if (name.length < 3) { const e = $('certErr'); e.style.display = 'block'; e.textContent = 'Ketik nama Anda terlebih dahulu.'; return; }
    const W = 2000, H = 1414, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');
    const F = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#7A2C09'; x.fillRect(0, 0, 36, H);
    x.fillStyle = '#E07A2E'; x.fillRect(36, 0, 10, H);
    x.strokeStyle = '#EFB999'; x.lineWidth = 3; x.strokeRect(110, 90, W - 200, H - 180);
    x.textAlign = 'left'; const Lm = 190;
    if (CERT_LOGO) { try { const lh = 150, lw = Math.min(420, lh * CERT_LOGO.naturalWidth / CERT_LOGO.naturalHeight); x.drawImage(CERT_LOGO, W - 190 - lw, 130, lw, lw * CERT_LOGO.naturalHeight / CERT_LOGO.naturalWidth); } catch (e) {} }
    x.fillStyle = '#7A2C09'; x.font = `600 34px ${F}`; wrapLines(x, CONFIG.CERT_ORG, W - 2 * Lm - 460).slice(0, 2).forEach((l, i) => x.fillText(l, Lm, 190 + i * 44));
    x.fillStyle = '#1F1B16'; x.font = `800 104px ${F}`; x.fillText('Sertifikat Partisipasi', Lm, 360);
    x.fillStyle = '#5C544B'; x.font = `500 38px ${F}`; x.fillText('Diberikan kepada', Lm, 470);
    x.fillStyle = '#B8430F'; x.font = `800 76px ${F}`;
    wrapLines(x, name, W - 2 * Lm).slice(0, 2).forEach((l, i) => x.fillText(l, Lm, 570 + i * 88));
    x.fillStyle = '#1F1B16'; x.font = `500 40px ${F}`;
    wrapLines(x, 'atas partisipasi sebagai responden dalam Survei Panas Ekstrem dan Kehidupan Keluarga: pengaruh cuaca panas ekstrem terhadap kesehatan, rencana berkeluarga, dan kesehatan reproduksi masyarakat Indonesia.', W - 2 * Lm).forEach((l, i) => x.fillText(l, Lm, 770 + i * 58));
    const d = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
    x.fillStyle = '#5C544B'; x.font = `500 34px ${F}`; x.fillText(CONFIG.CERT_CITY + ', ' + d, Lm, 1040);
    x.strokeStyle = '#1F1B16'; x.lineWidth = 2; x.beginPath(); x.moveTo(Lm, 1200); x.lineTo(Lm + 560, 1200); x.stroke();
    x.fillStyle = '#1F1B16'; x.font = `700 36px ${F}`; x.fillText(CONFIG.CERT_SIGNER, Lm, 1250);
    x.fillStyle = '#5C544B'; x.font = `500 30px ${F}`; x.fillText(CONFIG.CERT_ROLE, Lm, 1292);
    let url; try { url = cv.toDataURL('image/png'); } catch (e) { CERT_LOGO = null; return b.onclick(); }  // logo tanpa CORS → ulang tanpa logo
    const a = document.createElement('a'); a.download = 'Sertifikat_Partisipasi_Survei_Panas_Ekstrem.png'; a.href = url; document.body.appendChild(a); a.click(); a.remove();
  };
}

/* halaman bila perangkat ini sudah mengirim jawaban */
function pageShell(sect){
  $('nav').classList.add('hidden'); $('brand').textContent = CONFIG.TITLE; $('sect').textContent = sect; $('prog').style.width = '0';
  return $('app');
}
function renderDone(){
  const app = pageShell('');
  app.innerHTML = `${orgHead()}<h1>Anda sudah mengirim jawaban dari perangkat ini</h1>
    <p class="lead">Terima kasih. Setiap orang cukup mengisi satu kali.</p>
    <div id="incentive"></div>
    ${DEBUG ? '<button class="btn" type="button" id="debugReset">Isi ulang (mode debug)</button>' : ''}`;
  renderIncentive();
  const r = $('debugReset'); if (r) r.onclick = () => { [DONE_KEY, CLAIM_KEY, CONFIG.STORAGE_KEY].forEach(k => store.del(k)); location.reload(); };
}

/* #status: responden mengecek sendiri hak, pengiriman pulsa, dan hasil undian */
const STATUS_MSG = {
  not_found: ['Kode tidak dikenali', 'Periksa kembali penulisan kode. Bila jawaban Anda baru saja dikirim atau sempat tersimpan karena sinyal putus, buka halaman survei di perangkat yang sama agar jawaban terkirim, lalu coba lagi.', 't'],
  TIDAK: ['Tidak memenuhi syarat insentif', () => `Waktu pengisian tercatat kurang dari ${CONFIG.MIN_MINUTES} menit. Jawaban Anda tetap kami terima. Terima kasih atas partisipasi Anda.`, 't'],
  PULSA_unclaimed: ['Anda berhak atas pulsa, tetapi belum mengirim nomor telepon', () => `Isi nomor telepon di bawah untuk mengklaim pulsa ${CONFIG.PULSA_VALUE}.`, 'p'],
  UNDIAN_unclaimed: ['Anda berhak ikut undian, tetapi belum mendaftarkan nomor telepon', () => `Isi nomor telepon di bawah agar dapat diundi pada ${CONFIG.DRAW_DATE}.`, 'u'],
  PULSA_queue: ['Pulsa dalam antrean pengiriman', () => `Nomor Anda sudah tercatat. Pulsa dikirim paling lambat ${CONFIG.PAYOUT_DAYS} hari kerja setelah klaim.`, 'p'],
  PULSA_sent: ['Pulsa sudah dikirim', '', 'p'],
  PULSA_failed: ['Pengiriman pulsa gagal', 'Nomor yang tercatat tidak dapat menerima pulsa. Hubungi tim peneliti dengan menyebutkan kode klaim Anda.', 't'],
  UNDIAN_wait: ['Terdaftar sebagai peserta undian', () => `Pengundian dilaksanakan pada ${CONFIG.DRAW_DATE}. Cek kembali halaman ini setelah tanggal tersebut.`, 'u'],
  UNDIAN_win: ['Selamat, Anda memenangkan undian', () => `${CONFIG.LOTTERY_PRIZE} akan dikirim ke nomor yang tercatat.`, 'p'],
  UNDIAN_reserve: ['Anda terpilih sebagai cadangan undian', 'Cadangan akan menerima hadiah bila pemenang tidak dapat dihubungi dalam 7 hari. Status ini akan diperbarui.', 'u'],
  UNDIAN_dropped: ['Hadiah undian dialihkan', 'Anda terpilih sebagai pemenang, tetapi tidak dapat dihubungi dalam 7 hari sehingga hadiah dialihkan ke peserta cadangan sesuai aturan undian.', 't'],
  UNDIAN_lose: ['Belum beruntung dalam undian', 'Terima kasih telah berpartisipasi. E-sertifikat tetap dapat Anda unduh dari halaman survei.', 't']
};
function statusKey(j){
  if (!j.found) return 'not_found';
  if (j.hak === 'TIDAK') return 'TIDAK';
  if (!j.claimed) return j.hak + '_unclaimed';
  if (j.hak === 'PULSA') return /terkirim/i.test(j.status) ? 'PULSA_sent' : /gagal/i.test(j.status) ? 'PULSA_failed' : 'PULSA_queue';
  if (!j.drawn) return 'UNDIAN_wait';
  const u = j.undian || '';
  if (/gugur/i.test(u)) return 'UNDIAN_dropped';
  if (/^Pemenang/.test(u)) return /terkirim/i.test(j.status) ? 'PULSA_sent' : 'UNDIAN_win';
  if (/^Cadangan/.test(u)) return 'UNDIAN_reserve';
  return 'UNDIAN_lose';
}
function renderStatus(){
  const app = pageShell('Cek status pulsa dan undian'), c = claimState() || {};
  app.innerHTML = `${orgHead()}<h1>Cek status pulsa dan undian</h1>
    <p class="lead">Masukkan kode klaim yang Anda terima setelah mengisi survei. Bila Anda mengisi dari perangkat ini, kode sudah terisi otomatis.</p>
    <div class="box"><label for="stCode" style="margin-top:0">Kode klaim</label>
    <input type="text" class="code-in" id="stCode" value="${esc(c.code || '')}" maxlength="9" placeholder="K7Q2-M9XD" autocomplete="off" autocapitalize="characters" spellcheck="false"><p class="code-warn" aria-live="polite"></p>
    <div class="ferr" id="stErr" role="alert"></div>
    <button class="btn primary" id="stBtn" type="button" style="margin-top:12px;width:100%">Cek status</button></div>
    <div id="stOut" aria-live="polite"></div>
    <div class="box"><h3>Pertanyaan yang sering diajukan</h3>
      <p class="note"><b>Kapan pulsa dikirim?</b> Paling lambat ${CONFIG.PAYOUT_DAYS} hari kerja setelah Anda mengirim nomor telepon. Status berubah menjadi "Pulsa sudah dikirim" setelah tim mengirimkannya.</p>
      <p class="note"><b>Bagaimana jatah pulsa ditentukan?</b> Jatah ${CONFIG.PULSA_SLOTS} pulsa (${esc(CONFIG.PULSA_SPLIT)}) diberikan menurut urutan waktu jawaban lengkap diterima server. Setelah jatah kelompok Anda habis, Anda otomatis menjadi peserta undian ${esc(CONFIG.LOTTERY)}.</p>
      <p class="note"><b>Kapan undian dan bagaimana caranya?</b> ${esc(CONFIG.DRAW_DATE)}, secara acak dengan angka acak awal (seed) yang dicatat dalam berita acara dan disaksikan tim peneliti. Siapa pun dapat mengulang pengundian dengan seed yang sama dan mendapat hasil yang sama.</p>
      <p class="note"><b>Kode saya hilang.</b> Kode tersimpan otomatis di perangkat yang dipakai mengisi survei; buka halaman ini dari perangkat tersebut. Bila tetap tidak ditemukan, hubungi ${CONFIG.CONTACT} dengan menyebutkan nomor telepon yang Anda daftarkan.</p>
      <p class="note"><b>Apakah tim dapat melihat jawaban saya dari kode ini?</b> Tidak. Kode dan nomor telepon disimpan terpisah dari jawaban survei.</p></div>
    <p class="status-link"><a href="#pemenang">Lihat pengumuman pemenang undian</a> · <a href="#">Kembali ke halaman survei</a></p>`;
  const go = async () => {
    const code = normCode($('stCode').value), err = $('stErr');
    if (!CODE_RE.test(code)) { err.style.display = 'block'; err.textContent = 'Kode klaim terdiri dari 8 huruf dan angka, misalnya K7Q2-M9XD.'; return; }
    err.style.display = 'none'; const b = $('stBtn'); b.disabled = true; b.textContent = 'Mengecek…';
    let j;
    if (scriptReady()) { try { j = await apiGet('action=status&code=' + encodeURIComponent(code)); } catch (e) { j = {ok:false}; } }
    else { const cc = claimState() || {}; j = {ok:true, found: cc.code === code, hak: cc.hak || 'PULSA', claimed: !!cc.claimed, status:'', drawn:false}; }   // mode uji
    b.disabled = false; b.textContent = 'Cek status';
    if (!j.ok) { err.style.display = 'block'; err.textContent = 'Koneksi terputus. Periksa internet Anda, lalu coba lagi.'; return; }
    const k = statusKey(j), m = STATUS_MSG[k], body = typeof m[1] === 'function' ? m[1]() : m[1];
    let extra = '';
    if (k === 'PULSA_sent' && j.tanggal) extra = `<p class="note">Tanggal kirim: ${esc(j.tanggal)}${j.telepon ? ` ke nomor ${esc(j.telepon)}` : ''}.</p>`;
    else if (j.telepon) extra = `<p class="note">Nomor tercatat: ${esc(j.telepon)}</p>`;
    $('stOut').innerHTML = `<div class="box"><p class="hak hak-${m[2]}">${esc(m[0])}</p>${body ? `<p class="note">${esc(body)}</p>` : ''}${extra}<div id="stClaim"></div></div>`;
    if (/_unclaimed$/.test(k)) { setClaim({code, sent:true, hak:j.hak, claimed:false}); $('stClaim').innerHTML = claimBox(); bindClaim(); }
  };
  $('stBtn').onclick = go;
  if (c.code) go();
}

/* #pemenang: hanya kode klaim tersamar, tanpa nomor telepon */
async function renderWinners(){
  const app = pageShell('Pengumuman pemenang undian'), mine = (claimState() || {}).code || '';
  app.innerHTML = `${orgHead()}<h1>Pengumuman pemenang undian</h1>
    <p class="lead">Undian ${esc(CONFIG.LOTTERY)} bagi responden Survei Panas Ekstrem dan Kehidupan Keluarga. Pemenang ditampilkan dengan kode klaim yang sebagian disamarkan; nomor telepon tidak ditampilkan.</p>
    <div id="wOut" aria-live="polite"><p class="note">Memuat pengumuman…</p></div>
    <p class="status-link"><a href="#status">Cek status Anda dengan kode klaim</a> · <a href="#">Kembali ke halaman survei</a></p>`;
  let j;
  if (scriptReady()) { try { j = await apiGet('action=winners'); } catch (e) { j = {ok:false}; } } else j = {ok:true, drawn:false};
  const out = $('wOut');
  if (!j.ok) { out.innerHTML = '<div class="box"><p class="hak hak-t">Pengumuman belum dapat dimuat</p><p class="note">Periksa koneksi internet Anda, lalu muat ulang halaman ini.</p></div>'; return; }
  if (!j.drawn) { out.innerHTML = `<div class="box"><p class="hak hak-u">Undian belum dilaksanakan</p><p class="note">Pengundian dijadwalkan pada ${esc(CONFIG.DRAW_DATE)}. Pengumuman akan tampil di halaman ini setelah pengundian.</p></div>`; return; }
  const isMine = k => mine && mine.slice(0, 4) === k.slice(0, 4) && mine.slice(-2) === k.slice(-2);
  const rows = j.winners.map((w, i) => `<tr${isMine(w.kode) ? ' class="mine"' : ''}><td>${i + 1}</td><td style="font-family:ui-monospace,monospace">${esc(w.kode)}</td><td>${w.pengganti ? 'Pengganti' : 'Utama'}</td><td>${/terkirim/i.test(w.status) ? 'Terkirim' : 'Dalam proses'}</td></tr>`).join('');
  out.innerHTML = `<div class="box"><h3>Hasil pengundian</h3>
      <p class="note">Dilaksanakan ${esc(j.tanggal || CONFIG.DRAW_DATE)} dari ${esc(j.peserta)} peserta undian. Angka acak awal (seed): <b>${esc(j.seed || '-')}</b>. Hasil dapat diperiksa ulang karena pengundian dengan seed yang sama selalu menghasilkan urutan yang sama.</p></div>
    <div class="box" style="overflow-x:auto"><table class="win"><thead><tr><th>No.</th><th>Kode klaim</th><th>Keterangan</th><th>Hadiah</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">${mine ? (j.winners.some(w => isMine(w.kode)) ? 'Baris yang disorot cocok dengan kode di perangkat ini. Pastikan dengan membuka halaman cek status.' : 'Kode di perangkat ini tidak termasuk daftar pemenang. Terima kasih atas partisipasi Anda.') : 'Untuk memastikan hasil Anda, buka halaman cek status dan masukkan kode klaim lengkap.'} Pemenang yang tidak dapat dihubungi dalam 7 hari digantikan oleh peserta cadangan sesuai urutan undian.</p>`;
}

// ---------- Mulai ----------
document.getElementById('btnNext').addEventListener('click', () => next());
document.getElementById('btnBack').addEventListener('click', () => back());
(function init(){
  $('brandLogo').src = CONFIG.LOGO;
  if (QS.get('codebook') === '1') return renderCodebook();
  window.addEventListener('hashchange', () => location.reload());
  if (location.hash === '#status') { flushPending(); return renderStatus(); }
  if (location.hash === '#pemenang') return renderWinners();
  if (store.get(DONE_KEY) && !(store.get(CONFIG.STORAGE_KEY) || {}).ans) { flushPending().then(() => { if ($('incentive')) renderIncentive(); }); return renderDone(); }
  const saved = store.get(CONFIG.STORAGE_KEY);
  S = freshState();
  if (saved && saved.status === 'in_progress' && saved.ans && Object.keys(saved.ans).length) {
    if (DEBUG) { S = saved; S.begun = true; } else S._resumable = saved;
  }
  render();
  flushPending();
})();
</script>
