  /* --------------------------- 4) tooltip panduan --------------------------- */
  var SE = function () { try { return JSON.parse(localStorage.getItem('c3.settings') || '{}') || {}; } catch (e) { return {}; } };
  var RULES = [
    [/kode unit/i, 'Kode unit dari daftar induk sampel (C2b), misalnya BLL-RS-A007. Pilih dari saran bila muncul; jangan mengetik ulang dari ingatan.'],
    [/kode (fasyankes|fasilitas)|fasyankes \(kode|fasilitas \(kode\)/i, 'Kode fasilitas dibuat otomatis dari kabupaten/kota dan jenis fasilitas (misalnya BLL-RS). Pilih dari saran.'],
    [/kode pasien/i, 'Kode penghubung buatan fasilitas (misalnya P0001), bukan nama atau nomor rekam medis.'],
    [/kode bukti|bukti penentu|bukti \(kode\)|bukti konfirmasi/i, 'Kode bukti dari Daftar bukti (C4), misalnya BLL-RS-D01. Daftarkan buktinya dulu, lalu pilih kodenya dari saran.'],
    [/kode sumber|^sumber$/i, 'Kode dokumen sumber yang dicatat di daftar sumber (misalnya S1, S2), atau sebutkan dokumennya.'],
    [/kode calon|kode kasus/i, 'Dibuat otomatis secara berurutan. Tidak perlu diubah.'],
    [/kode berkas/i, 'Kode berkas kronologi tanpa pengenal yang disiapkan penelaah pertama.'],
    [/\(kode\)|kode petugas|kode\/jabatan/i, 'Tulis kode petugas, bukan nama. Kode Anda: {pen}.'],
    [/jabatan|penanggung jawab|pemegang program|petugas penghubung|peserta daerah|informan/i, 'Tulis jabatan atau peran (misalnya Pengelola program tuberkulosis Dinas Kesehatan), bukan nama orang.'],
    [/tanggal|^mulai|tgl/i, 'Pilih tanggal dari kalender. Bila hanya bulan atau tahun yang diketahui, pakai pilihan tanggal tidak lengkap. Jangan memakai tanggal entri sistem sebagai tanggal kejadian.'],
    [/menit|durasi/i, 'Isi lama kerja dalam menit, angka saja (misalnya 45).'],
    [/jumlah|umur|volume|pembilang|penyebut|perkiraan|skor|^n\b|: n$|: N$/i, 'Isi angka saja tanpa titik atau koma ribuan.'],
    [/status bukti|^st\b/i, 'Pilih status sesuai bukti yang Anda lihat sendiri.'],
    [/status konfirmasi/i, 'Dikonfirmasi: angka sama dengan data daerah. Dikoreksi: daerah memiliki angka lain (isi angka koreksinya). Belum dapat dipastikan: sumber belum tersedia.'],
    [/keyakinan/i, 'Tinggi: bukti kuat dan konsisten dari beberapa sumber. Sedang: bukti ada tetapi terbatas. Rendah: dugaan dengan bukti lemah.'],
    [/kecukupan/i, 'Nilai apakah dokumen atau bukti cukup untuk menilai. Bila terbatas, sebutkan bagian yang tidak dapat dinilai.'],
    [/faktor sistem/i, 'Pilih kode faktor sistem: F1 penyelenggaraan pelayanan, F2 tenaga kesehatan, F3 sistem informasi, F4 diagnostik, F5 obat dan teknologi lain, F6 pembiayaan, F7 kepemimpinan dan tata kelola.'],
    [/titik penilaian|^cp\b|cp terkait/i, 'Titik penilaian 1 sampai 14 (dan R6) pada kaskade pelayanan tuberkulosis-HIV. Pilih yang paling terkait; boleh lebih dari satu dipisah koma.'],
    [/dugaan/i, 'Tulis dugaan sebagai pernyataan yang bisa diuji, beserta bukti yang perlu dicari untuk mendukung atau membantahnya.'],
    [/alasan|penjelasan|uraian|catatan|keterangan|ringkasan|masalah|temuan|hambatan|respons|kesimpulan|pertanyaan|usulan|tindak lanjut/i, 'Tulis singkat dan faktual (satu sampai tiga kalimat). Sebutkan sumber atau kode bukti bila ada. Jangan menulis identitas pasien.'],
    [/kabupaten\/kota|kab\/kota|provinsi/i, 'Terisi otomatis dari Pengaturan. Ubah hanya bila Anda mengisi untuk wilayah lain.'],
    [/jenis kelamin/i, 'Pilih sesuai catatan rekam medis.'],
    [/periode/i, 'Pilih periode data yang dipakai sebagai dasar angka.'],
    [/sumber/i, 'Sebutkan dokumen atau sistem asal informasi (rekam medis, register, Sistem Informasi Tuberkulosis, Sistem Informasi HIV-AIDS, dan seterusnya).'],
    [/status/i, 'Pilih status sesuai keadaan saat ini dan perbarui bila ada perkembangan.']
  ];
  function ctlKind(box) {
    if (box.querySelector('.seg')) return 'st';
    if (box.querySelector('[data-wbm]')) return 'multi';
    if (box.querySelector('.chip.box,input[type=checkbox]')) return 'multi';
    if (box.querySelector('.ob,input[type=radio]')) return 'radio';
    if (box.querySelector('select')) return 'select';

    if (!i) return box.querySelector('.autoval,.wf') ? 'auto' : '';
    if (i.disabled || i.readOnly) return 'auto';
    if (i.tagName === 'TEXTAREA') return 'area';
    if (i.type === 'date') return 'date';
    if (i.type === 'number' || i.inputMode === 'decimal' || i.inputMode === 'numeric') return 'num';
    if (i.getAttribute('list')) return 'list';
    return 'text';
  }
  var KIND_TXT = {
    radio: 'Klik satu pilihan. Klik sekali lagi untuk membatalkan.',
    multi: 'Boleh memilih lebih dari satu.',
    select: 'Pilih dari daftar.',
    date: 'Pilih tanggal dari kalender.',
    num: 'Isi angka saja.',
    area: 'Tulis singkat dan jelas.',
    list: 'Ketik atau pilih dari saran yang muncul.',
    text: 'Ketik jawaban singkat.',
    auto: 'Terisi otomatis oleh sistem; tidak perlu diisi.',
    st: 'Status bukti: Ada bukti, Tidak dilakukan, Tidak ditemukan, Tidak berlaku, atau Belum bisa dinilai. Kolom sumber diisi kode dokumen tempat bukti ditemukan.'
  };
  function tipText(label, kind, hint) {
    label = sv(label).replace(/\s+/g, ' ').replace(/\s*\*$/, '');
    var specific = '';
    for (var i = 0; i < RULES.length; i++) if (RULES[i][0].test(label)) { specific = RULES[i][1]; break; }
    specific = specific.replace('{pen}', sv(SE().penelaah) || 'lihat Pengaturan');
    if (kind === 'auto') specific = '';
    var how = KIND_TXT[kind] || '';

    if (hint && hint.length < 400) parts.push(hint);
    if (specific) parts.push(specific);
    if (how && specific.indexOf(how) < 0) parts.push(how);
    if (!parts.length) parts.push('Isi sesuai dokumen sumber yang Anda periksa.');

  }
  function addTip(anchor, label, kind, hint) {

    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tipbtn'; b.textContent = 'i'; b.setAttribute('aria-label', 'Panduan pengisian');

  }
  function labelText(el) { var c = el.cloneNode(true); c.querySelectorAll('.tipbtn,.needchip,.prefilled,small,.hint,.req').forEach(function (x) { x.remove(); }); return sv(c.textContent); }
  function addTips(root) {
    // butir formulir C3 dan isian lembar kerja
    root.querySelectorAll('.item').forEach(function (it) {
      var lab = it.querySelector(':scope > .ih label, :scope > .ih .lab, :scope > summary b'); if (!lab) return;
      if (it.querySelector(':scope > .c2grid, :scope > div > .c2grid') && !it.querySelector(':scope > .ctl')) return; // kelompok: tip per isian
      var hint = it.querySelector(':scope > .hint, :scope > .ih + .hint');
      addTip(lab, labelText(lab), ctlKind(it.querySelector(':scope > .ctl') || it), hint ? sv(hint.textContent) : '');
      var ev = it.querySelector('.evid .lb'); if (ev && !ev.querySelector('.tipbtn')) addTip(ev, 'Status bukti', 'st', '');
    });
    root.querySelectorAll('.c2f').forEach(function (f) {
      var sp = f.querySelector(':scope > span'); if (!sp) return;
      var sm = f.querySelector(':scope > small, :scope > span > small.hint');
      addTip(sp, labelText(sp), ctlKind(f), sm ? sv(sm.textContent) : '');
    });
    root.querySelectorAll('.cgrid > label').forEach(function (l) {
      if (l.querySelector(':scope > .tipbtn')) return;
      var t = l.firstChild && l.firstChild.nodeType === 3 ? sv(l.firstChild.nodeValue) : labelText(l); if (!t) return;
      var s = document.createElement('span'); s.style.display = 'inline-flex'; s.style.alignItems = 'center'; s.setAttribute('data-tiphost', '1');
      if (l.firstChild && l.firstChild.nodeType === 3) { l.firstChild.nodeValue = ''; s.textContent = t; l.insertBefore(s, l.firstChild); } else return;
      addTip(s, t, ctlKind(l), '');
    });
    root.querySelectorAll('.ih').forEach(function (ih) {
      if (ih.parentElement && ih.parentElement.classList.contains('item')) return;
      var lab = ih.querySelector('.lab, label'); if (!lab) return; var p = ih.parentElement, hint = p.querySelector(':scope > .hint');
      addTip(lab, labelText(lab), ctlKind(p.querySelector(':scope > .ctl') || p), hint ? sv(hint.textContent) : '');
    });
    root.querySelectorAll('.chips').forEach(function (ch) {
      if (ch.closest('.item, .c2f, .field, .cgrid > label') || ch.parentElement.querySelector('.tipbtn')) return;
      var hd = ch.previousElementSibling; if (!hd || !/^(H3|H4|LABEL|SPAN|DIV)$/.test(hd.tagName) || !sv(hd.textContent)) return;
      addTip(hd, labelText(hd), ctlKind(ch), '');
    });
    root.querySelectorAll('table.wbsheet tr').forEach(function (tr) {
      if (!tr.querySelector('input, select, textarea') || tr.querySelector('.tipbtn')) return;
      var lb = tr.querySelector('td.lbl') || Array.prototype.filter.call(tr.cells, function (c) { return sv(c.textContent) && !c.querySelector('input,select,textarea'); })[0]; if (!lb) return;
      var ctl = tr.querySelector('input, select, textarea').closest('td');
      addTip(lb, labelText(lb), ctlKind(ctl), '');
    });
    root.querySelectorAll('.field > span:first-child').forEach(function (sp) { var f = sp.parentElement; var sm = f.querySelector('small'); addTip(sp, labelText(sp), ctlKind(f), sm ? sv(sm.textContent) : ''); });
    root.querySelectorAll('table.c2t').forEach(function (t) {
      if (!t.querySelector('tbody input, tbody select, tbody textarea')) return;
      var ths = t.querySelectorAll('thead th');
      ths.forEach(function (th, i) {
        if (th.querySelector('.tipbtn') || !sv(th.textContent) || /^#$/.test(sv(th.textContent))) return;
        var cell = t.querySelector('tbody tr td:nth-child(' + (i + 1) + ')');
        addTip(th, labelText(th), cell ? ctlKind(cell) : 'text', th.getAttribute('title') || '');
      });
    });
  }
  var box = null, cur = null;
  function showTip(b) {
    box = box || document.getElementById('tipBox'); if (!box) return;
    var host = b.closest('dialog[open]') || document.body; if (box.parentNode !== host) host.appendChild(box);
    box.innerHTML = b.getAttribute('data-tip'); box.classList.add('on'); cur = b; b.setAttribute('aria-expanded', 'true');
    var r = b.getBoundingClientRect(), bw = Math.min(340, window.innerWidth - 24); box.style.maxWidth = bw + 'px';
    var bh = box.offsetHeight, w = box.offsetWidth;
    var left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + r.width / 2 - w / 2));
    var top = r.bottom + 8; if (top + bh > window.innerHeight - 8) top = Math.max(8, r.top - bh - 8);
    box.style.left = left + 'px'; box.style.top = top + 'px';
  }
  function hideTip() { if (box) box.classList.remove('on'); if (cur) cur.setAttribute('aria-expanded', 'false'); cur = null; }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.tipbtn');
    if (b) { e.preventDefault(); e.stopPropagation(); if (cur === b) hideTip(); else showTip(b); return; }
    if (cur && !(e.target.closest && e.target.closest('#tipBox'))) hideTip();
  }, true);
  document.addEventListener('mouseover', function (e) { var b = e.target.closest && e.target.closest('.tipbtn'); if (b && matchMedia('(hover: hover)').matches) showTip(b); });
  document.addEventListener('mouseout', function (e) { var b = e.target.closest && e.target.closest('.tipbtn'); if (b && cur === b && matchMedia('(hover: hover)').matches) hideTip(); });
  document.addEventListener('focusin', function (e) { var t = e.target; if (t.classList && t.classList.contains('tipbtn')) { try { if (!t.matches(':focus-visible')) return; } catch (x) { } showTip(t); } });
  document.addEventListener('focusout', function (e) { if (e.target.classList && e.target.classList.contains('tipbtn') && cur === e.target && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('#tipBox'))) setTimeout(function () { if (document.activeElement !== cur) hideTip(); }, 150); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(); });
  window.addEventListener('scroll', hideTip, true);

  /* ------------------------------ penjadwal ------------------------------ */
  var pending = false, roots = [];
  function run() {
    pending = false;
    var rs = roots.splice(0); if (!rs.length) return;
    obs.disconnect();
    try {
      rs.forEach(function (r) { if (!r.isConnected) return; fullOptions(r); expandIn(r); addTips(r); decorateStatus(r); });
      markNeed(document);
    } catch (e) { if (window.console) console.warn(e); }
    observe();
  }
  function queueRoot(n) { if (n && n.nodeType === 1 && roots.indexOf(n) < 0) roots.push(n); if (!pending) { pending = true; requestAnimationFrame(run); } }
  var obs = new MutationObserver(function (ms) { ms.forEach(function (m) { if (m.type === 'childList') { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) queueRoot(n); else if (n.nodeType === 3 && n.parentElement) queueRoot(n.parentElement); }); } else if (m.type === 'characterData' && m.target.parentElement) queueRoot(m.target.parentElement); }); });
  function observe() { obs.observe(document.body, { childList: true, subtree: true, characterData: true }); }
  var needT; function needSoon() { clearTimeout(needT); needT = setTimeout(function () { obs.disconnect(); markNeed(document); observe(); }, 120); }
  document.addEventListener('input', needSoon); document.addEventListener('change', needSoon); document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.ob,.chip,.seg')) needSoon(); });
  function start() { queueRoot(document.body); observe(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  window.UXDOM = { optLabel: optLabel, fullOptions: fullOptions, expandText: expandText, classify: classify, tipText: tipText };
})();

<script>/* ==========================================================================
 * KASKADE DAN ALASAN PENYEBAB
 * Kaskade episode tuberkulosis (CP3 → Lembar A) dan episode HIV (Lembar B)
 * dari telaah C3 (acak dan purposif dipisah) serta daftar C2a (ekspor SITB/SIHA),
 * waktu antartahap, dan alasan penyebab yang tersaring otomatis saat bagian
 * kaskade atau titik pasien diklik: alasan tercatat C3, semua isian C3 unit
 * terpilih, temuan C4 fasilitas terkait, dan kasus kematian C6 terkait.
 * Data: aksi `analisis` (sama dengan laman analisis isian).
 * ========================================================================== */
(function () {
  'use strict';
  var $ = function (q, el) { return (el || document).querySelector(q); };
  function sv(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pct(n, N) { return N ? Math.round(1000 * n / N) / 10 : null; }
  function fmtPct(p) { return p == null ? '–' : (Math.round(p * 10) / 10).toLocaleString('id-ID') + '%'; }

    h += '<div class="kgrid2"><div class="qc"><div class="qc-h"><b>Klasifikasi akhir</b></div>' + optBars(rows.map(function (r) { return r.g(C4COL.kls) || 'Belum diklasifikasi'; }), null) + '</div><div class="qc"><div class="qc-h"><b>Faktor sistem</b></div>' + optBars([].concat.apply([], rows.map(function (r) { return r.g(C4COL.faktor).split(/\s*[;,]\s*/).filter(Boolean); })), null) + '</div></div>';
    h += '<div class="tbl-wrap" style="margin-top:12px"><table class="qt"><thead><tr><th>Fasilitas</th><th>Titik penilaian</th><th>Klasifikasi akhir</th><th>Masalah utama</th><th>Dugaan penyebab</th><th>Faktor sistem</th><th>Praktik yang berjalan baik</th><th>Kode bukti</th></tr></thead><tbody>' + rows.map(function (r) { return '<tr><td>' + esc(UX.fasName(r.fas)) + ' <span class="code small">' + esc(r.fas) + '</span></td><td><b>' + esc(r.cp) + '</b><div class="muted small">' + esc(r.fokus) + '</div></td><td>' + esc(r.g(C4COL.kls) || '–') + '</td><td>' + esc(r.g(C4COL.mas)) + '</td><td>' + esc(r.g(C4COL.duga)) + '</td><td>' + esc(r.g(C4COL.faktor)) + '</td><td>' + esc(r.g(C4COL.baik)) + '</td><td class="code small">' + esc(r.g(C4COL.bukti)) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    return h;
  }
  /* ---- kematian C6 ---- */
  function renderC6() {
    var reg6 = ((RAW.WB || {}).C6R || []).filter(function (x) { return x.key === 'NASIONAL'; })[0];
    if (!reg6) return '<div class="empty">Register kematian C6 belum tersimpan.</div>';
    var dc = (reg6.rec || {}).Daftar_Calon || {}, fk = (reg6.rec || {}).Faktor || {}, s = selUnits(), codes = {}, pas = {};
    ['A', 'B'].forEach(function (sh) { scopeUnits(sh).forEach(function (x) { codes[x.code] = x; if (val(x, 'U02')) pas[x.g.fas + '-' + val(x, 'U02').toUpperCase()] = x; }); });
    var rows = [];
    for (var r = 5; r <= 304; r++) { var unit = sv(dc[r + ',18']).toUpperCase(), kp = sv(dc[r + ',4']).toUpperCase(); if (!unit && !kp) continue; var x = codes[unit] || pas[kp]; var g = { kab: sv(dc[r + ',1']).toUpperCase(), fas: sv(dc[r + ',2']).toUpperCase() }; if (s ? !x : !pass(geoFas(g.fas) && geoFas(g.fas).kab ? geoFas(g.fas) : { kab: g.kab })) continue; rows.push({ r: r, x: x, kasus: sv(dc[r + ',17']).toUpperCase(), kp: kp, unit: unit, tgl: sv(dc[r + ',11']), pilih: sv(dc[r + ',15']), status: sv(dc[r + ',19']), fas: g.fas }); }
    if (!rows.length) return '<div class="empty">' + (s ? 'Tidak ada kasus kematian C6 yang terkait dengan unit terpilih.' : 'Belum ada calon kasus kematian untuk filter ini.') + '</div>';
    var c6f = {}; ((RAW.WB || {}).C6F || []).forEach(function (x) { c6f[sv(x.key).toUpperCase()] = x; });
    var h = '<div class="tbl-wrap"><table class="qt"><thead><tr><th>Kode kasus</th><th>Pasien / unit C3</th><th>Fasilitas</th><th>Tanggal kematian</th><th>Dipilih</th><th>Status telaah</th><th>Dugaan hubungan dengan tuberkulosis</th><th>Peluang perbaikan</th><th>Faktor penyumbang (register)</th></tr></thead><tbody>';
    rows.forEach(function (o) {
      var f = c6f[o.kasus], b5 = f && f.rec ? (f.rec.B5_Kesimpulan || {}) : {}, fac = [];
      for (var r2 = 5; r2 <= 304; r2++) if (o.kasus && sv(fk[r2 + ',1']).toUpperCase() === o.kasus) fac.push([sv(fk[r2 + ',3']), sv(fk[r2 + ',5']), sv(fk[r2 + ',6'])].filter(Boolean).join(' · '));
      h += '<tr><td class="code">' + esc(o.kasus || '–') + '</td><td class="code small">' + esc(o.kp) + (o.unit ? '<br>' + esc(o.unit) : '') + '</td><td>' + esc(UX.fasName(o.fas)) + '</td><td>' + esc(fmtDate(o.tgl)) + '</td><td>' + esc(o.pilih || '–') + '</td><td>' + esc(o.status || '–') + '</td><td>' + esc(sv(b5['5,2']) || '–') + '</td><td>' + esc(sv(b5['6,2']) || '–') + '</td><td>' + (fac.length ? fac.map(esc).join('<br>') : '–') + '</td></tr>';
    });
    return h + '</tbody></table></div><p class="an-note">Terkait bila kode unit C3 tercatat di register (kolom "Kode unit C3 bila sama") atau kode pasien sama. Isi formulir C6 ditampilkan dari bagian B5 Kesimpulan.</p>';
  }

  /* ------------------------------ halaman ------------------------------ */
  var SECS = [['secTb', 'Kaskade episode tuberkulosis'], ['secHiv', 'Kaskade episode HIV'], ['secAlasan', 'Alasan penyebab'], ['secIsian', 'Semua isian C3'], ['secC4', 'Temuan C4 fasilitas'], ['secC6', 'Kasus kematian C6']];
  function selBar() {
    var b = $('#selBar');
    if (!SEL) { b.innerHTML = ''; return; }
    var s = selUnits(), n = Object.keys(s).length, f = selFas();
    b.innerHTML = '<div class="selb"><span class="lbl">Disaring:</span><b>' + esc(SEL.title) + '</b><span class="muted">' + n + ' unit C3' + ((SEL.c2 || []).length ? ', ' + SEL.c2.length + ' baris daftar C2a' : '') + (f ? ' · ' + Object.keys(f).length + ' fasilitas' : '') + '</span><span style="flex:1"></span><button type="button" class="btn small" id="selClear">Hapus pilihan ✕</button></div>';
    $('#selClear').onclick = function () { setSel(null); };
  }
  function render() {
    REG = {}; regN = 0;
    selBar();
    var nA = units('A').length, nB = units('B').length, nC = units('CP3').length;
    var h = '<div class="an-head" id="top"><div><h1>Kaskade dan alasan penyebab</h1><p>' + esc(geoText()) + ' Klik tahap, cabang keluar, atau titik pasien untuk menyaring otomatis semua bagian di bawahnya. <button type="button" class="linkbtn mobf" data-openf="1">Ubah filter</button></p></div></div>';
    h += '<div class="an-tiles"><div class="an-tile"><div class="v">' + nC + '</div><div class="l">Episode tuberkulosis (Lembar CP3)</div></div><div class="an-tile"><div class="v">' + nA + '</div><div class="l">Episode tuberkulosis-HIV (Lembar A)</div></div><div class="an-tile"><div class="v">' + nB + '</div><div class="l">ODHIV mulai ARV (Lembar B)</div></div><div class="an-tile"><div class="v">' + (c2rows('CP3').length + c2rows('A').length + c2rows('B').length) + '</div><div class="l">Baris daftar C2a (ekspor SITB/SIHA)</div></div></div>';
    h += '<div class="kleg"><span><i class="kdot k1"></i>Telaah C3 acak/sensus</span><span><i class="kdot k2"></i>Telaah C3 purposif</span><span><i class="kdot k3"></i>Daftar C2a (ekspor sistem, belum diverifikasi)</span><span><i class="kchip gap" style="pointer-events:none">↓ keluar dari kaskade</i></span><span><i class="kchip end" style="pointer-events:none">akhir alur</i></span></div>';
    h += '<section class="ksec" id="secTb"><div class="an-sec"><h2>Kaskade episode tuberkulosis</h2><span>Pasien tuberkulosis → tes HIV → positif HIV → OAT → ARV → luaran</span></div><p class="an-note">Tes HIV dinilai pada Lembar CP3 (semua pasien tuberkulosis terpilih), sedangkan ARV dinilai pada Lembar A (pasien tuberkulosis yang sudah positif HIV). Keduanya kelompok pasien berbeda, sehingga kaskade disajikan dua bagian dan tidak dihitung sebagai satu alur pasien yang sama. Persen = dibanding tahap sebelumnya. Sampel acak dan purposif tidak digabung dan tidak dipakai untuk menaksir besarnya masalah.</p>' + casRow('tbTes') + casRow('tbArv');
    h += '<div class="an-sec"><h2>Waktu antartahap · episode tuberkulosis</h2><span>titik = satu unit C3 (klik untuk menyaring); garis tegak = median; kotak C2a = kuartil 1–3</span></div><div class="kgrid2">' + TIME.tb.map(timeCard).join('') + '</div></section>';
    h += '<section class="ksec" id="secHiv"><div class="an-sec"><h2>Kaskade episode HIV</h2><span>ODHIV → skrining tuberkulosis → diagnosis → OAT; kelayakan → penawaran → mulai → selesai TPT</span></div>' + casRow('hivTb') + casRow('hivTpt');
    h += '<div class="an-sec"><h2>Waktu antartahap · episode HIV</h2><span>titik = satu unit C3; garis tegak = median</span></div><div class="kgrid2">' + TIME.hiv.map(timeCard).join('') + '</div></section>';
    h += '<section class="ksec" id="secAlasan"><div class="an-sec"><h2>Alasan penyebab</h2><span>' + (SEL ? 'untuk pilihan: ' + esc(SEL.title) : 'semua unit sesuai filter; klik bagian kaskade untuk menyaring') + '</span></div>' + renderAlasan() + '</section>';
    h += '<section class="ksec" id="secIsian"><div class="an-sec"><h2>Semua isian C3</h2><span>' + (SEL ? 'unit terpilih' : 'semua unit sesuai filter (buka untuk melihat)') + '</span></div>' + renderIsian() + '</section>';
    h += '<section class="ksec" id="secC4"><div class="an-sec"><h2>Temuan C4 fasilitas terkait</h2><span>Matriks titik penilaian</span></div>' + renderC4() + '</section>';
    h += '<section class="ksec" id="secC6"><div class="an-sec"><h2>Kasus kematian C6 terkait</h2></div>' + renderC6() + '</section>';
    $('#view').innerHTML = h;
    nav();
  }
  function geoText() { var t = []; if (F.kab) t.push(UX.kabName(F.kab)); if (F.jenis) t.push({ RS: 'Rumah sakit', PKM: 'Puskesmas', KLN: 'Klinik' }[F.jenis]); if (F.strata) t.push(STRATA[F.strata] + ' saja'); return t.length ? 'Filter: ' + t.join(', ') + '.' : 'Semua kabupaten/kota dan jenis layanan.'; }
  function nav() { $('#anNav').innerHTML = '<div class="sn-sec">Bagian</div>' + SECS.map(function (s) { return '<a class="sn-item" href="#' + s[0] + '" data-go="' + s[0] + '"><span class="lb">' + esc(s[1]) + '</span></a>'; }).join(''); }
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-sel]');
    if (t) { var o = REG[t.getAttribute('data-sel')]; if (o) { if (SEL && SEL.key === o.key && SEL.tag === o.tag && SEL.stage === o.stage && SEL.loss === o.loss && sameIds(SEL.ids, o.ids)) setSel(null); else setSel(o); } return; }
    var g = e.target.closest && e.target.closest('[data-go]'); if (g) { e.preventDefault(); var el = document.getElementById(g.getAttribute('data-go')); if (el) el.scrollIntoView({ behavior: 'smooth' }); document.body.classList.remove('navopen'); return; }
    if (e.target.closest && e.target.closest('[data-openf]')) document.body.classList.add('navopen');
  });
  function sameIds(a, b) { return (a || []).join() === (b || []).join(); }
  function fillKab() {
    var s = $('#fKab'), have = {}; ['A', 'B', 'CP3'].forEach(function (k) { U[k].forEach(function (x) { if (x.g.kab) have[x.g.kab] = 1; }); C2R[k].forEach(function (x) { if (x.g.kab) have[x.g.kab] = 1; }); });
    s.innerHTML = '<option value="">Semua kabupaten/kota</option>' + Object.keys(UX.PROV_KAB).map(function (p) { return '<optgroup label="Provinsi ' + esc(UX.provName(p)) + '">' + UX.PROV_KAB[p].map(function (k) { return '<option value="' + k + '">' + esc(UX.kabName(k)) + (have[k] ? '' : ' (belum ada data)') + '</option>'; }).join('') + '</optgroup>'; }).join('');
    s.value = F.kab; $('#fJenis').value = F.jenis; $('#fStrata').value = F.strata;
    [s, $('#fJenis'), $('#fStrata')].forEach(function (el) { el.classList.toggle('on', !!el.value); });
  }
  function saveF() { try { localStorage.setItem('kas.filter', JSON.stringify(F)); } catch (e) { } }
  try { var o0 = JSON.parse(localStorage.getItem('kas.filter') || '{}'); F.kab = o0.kab || ''; F.jenis = o0.jenis || ''; F.strata = o0.strata || ''; } catch (e) { }
  ['fKab', 'fJenis', 'fStrata'].forEach(function (id) { $('#' + id).onchange = function () { F[{ fKab: 'kab', fJenis: 'jenis', fStrata: 'strata' }[id]] = this.value; SEL = null; saveF(); fillKab(); render(); }; });
  $('#fReset').onclick = function () { F = { kab: '', jenis: '', strata: '' }; SEL = null; saveF(); fillKab(); render(); };
  $('#btnNav').onclick = function () { document.body.classList.toggle('navopen'); };
  $('#navScrim').onclick = function () { document.body.classList.remove('navopen'); };
  var tip = $('#anTip');
  document.addEventListener('mouseover', function (e) { var t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.classList.remove('on'); return; } tip.textContent = t.getAttribute('data-tip'); tip.classList.add('on'); });
  document.addEventListener('mousemove', function (e) { if (!tip.classList.contains('on')) return; var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16; if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 12; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });
  /* CSV: daftar unit pada pilihan aktif */
  $('#bCsv').onclick = function () {
    var rows = [['Lembar', 'Kode unit', 'Fasilitas', 'Kabupaten/kota', 'Strata', 'Tanggal diagnosis TB', 'Tanggal tes HIV', 'Mulai OAT', 'Mulai ARV', 'Skrining TB', 'Kelayakan TPT', 'Penawaran TPT', 'Mulai TPT', 'Luaran']];
    ['CP3', 'A', 'B'].forEach(function (sh) { scopeUnits(sh).forEach(function (x) { var r = x.r; rows.push(sh === 'CP3' ? ['CP3', x.code, x.g.fas, x.g.kab, STRATA[x.st], r['Tanggal diagnosis TB'], r['Tanggal tes atau dokumentasi diagnosis terdahulu'], '', '', '', '', '', '', r['Hasil tes HIV menurut sumber']] : sh === 'A' ? ['A', x.code, x.g.fas, x.g.kab, STRATA[x.st], r.A01, r.A07, r.A08, r.A10 === 'Sedang ARV' ? 'Sedang ARV' : r.A11, '', '', '', '', r.A13] : ['B', x.code, x.g.fas, x.g.kab, STRATA[x.st], r.B07 ? r.B06 : '', '', r.B07, r.B01, r.B04, r.B08, r.B11, r.B13, r.B16]); }); });
    var csv = '﻿' + rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'kaskade_unit' + (SEL ? '_pilihan' : '') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  function load() {
    $('#view').innerHTML = '<div class="empty"><span class="spin"></span> Memuat data…</div>';
    if (C3API.isMock() && !C3API.hasMockData()) { $('#srcPill').textContent = 'Mode uji tanpa data'; $('#view').innerHTML = '<div class="empty">Mode uji: belum ada data di perangkat ini. Isi <code>CONFIG.GAS_URL</code> untuk membaca data dari spreadsheet.</div>'; return; }
    C3API.get({ action: 'analisis', _raw: 1 }).then(function (d) {
      RAW = d; prep(); fillKab(); $('#msg').innerHTML = '';
      $('#srcPill').textContent = (C3API.isMock() ? 'Mode uji · data perangkat ini' : 'Google Sheets') + (d.generated ? ' · ' + new Date(d.generated).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
      render();
    }).catch(function (err) { $('#view').innerHTML = ''; $('#msg').innerHTML = '<div class="banner err" style="margin-top:16px"><b>Gagal memuat data.</b> ' + esc(err.message) + (/aksi tidak dikenal/i.test(err.message) ? ' Tempel Code.gs terbaru dan buat Versi baru deployment.' : '') + ' <button class="btn" id="bRetry" style="margin-left:8px">Coba lagi</button></div>'; $('#bRetry').onclick = load; });
  }
  $('#bRefresh').onclick = load;
  load();
  window.KAS = { cascade: function (k, s) { return cascade(units(SHEET_OF[k], s), CAS[k].steps); }, sel: function () { return SEL; }, select: setSel };
})();
