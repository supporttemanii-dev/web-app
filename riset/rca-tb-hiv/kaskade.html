<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>Kaskade dan Alasan Penyebab</title>
<meta name="description" content="Kaskade episode tuberkulosis dan episode HIV dari telaah C3 dan daftar C2a, beserta alasan penyebab yang tersaring otomatis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8fafc; --line:#e3e7ef; --line-strong:#cbd3e1;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b;
  --accent:#4f46e5; --accent-hover:#4338ca; --accent-ink:#ffffff; --accent-soft:#eef2ff; --accent-line:#c7d2fe;
  --send:#059669; --send-hover:#047857; --send-ink:#ffffff;
  --ok:#047857; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
  --ready:#0369a1; --ready-bg:#e0f2fe; --ready-line:#bae6fd;
  --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fcd34d;
  --queue:#c2410c; --queue-bg:#fff7ed; --queue-line:#fdba74;
  --err:#be123c; --err-bg:#fff1f2; --err-line:#fda4af;
  --info:#6d28d9; --info-bg:#f5f3ff; --info-line:#ddd6fe;
  --neutral:#475569; --neutral-bg:#f1f5f9; --neutral-line:#e2e8f0;
  --nav-bg:#0f172a; --nav-bg-2:#111c33; --nav-ink:#cbd5e1; --nav-ink-2:#8b9bb4; --nav-hover:#1b2740; --nav-active:#272f6b; --nav-bar:#818cf8; --nav-line:#1f2a40;
  --nav-w:272px; --top-h:60px;
  --dim:.55; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);
  --shadow-lg:0 20px 50px rgba(15,23,42,.18);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#121829; --surface-2:#171e31; --line:#243049; --line-strong:#33415f;
    --ink:#e7ebf3; --ink-2:#b4bfd3; --ink-3:#8f9bb2;
    --accent:#818cf8; --accent-hover:#a5b4fc; --accent-ink:#0b1020; --accent-soft:#1e1b4b; --accent-line:#3730a3;
    --send:#10b981; --send-hover:#34d399; --send-ink:#04130d;
    --ok:#34d399; --ok-bg:#062e22; --ok-line:#065f46;
    --ready:#38bdf8; --ready-bg:#082f49; --ready-line:#075985;
    --warn:#fbbf24; --warn-bg:#2b1d05; --warn-line:#92400e;
    --queue:#fb923c; --queue-bg:#2c1405; --queue-line:#9a3412;
    --err:#fb7185; --err-bg:#330a14; --err-line:#9f1239;
    --info:#c4b5fd; --info-bg:#1f1340; --info-line:#4c1d95;
    --neutral:#cbd5e1; --neutral-bg:#1e293b; --neutral-line:#334155;
    --nav-bg:#070b16; --nav-bg-2:#0b1222; --nav-hover:#131c31; --nav-active:#1e1b4b; --nav-line:#151e33;
    --shadow:none; --shadow-lg:0 20px 50px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#121829; --surface-2:#171e31; --line:#243049; --line-strong:#33415f;
  --ink:#e7ebf3; --ink-2:#b4bfd3; --ink-3:#8f9bb2;
  --accent:#818cf8; --accent-hover:#a5b4fc; --accent-ink:#0b1020; --accent-soft:#1e1b4b; --accent-line:#3730a3;
  --send:#10b981; --send-hover:#34d399; --send-ink:#04130d;
  --ok:#34d399; --ok-bg:#062e22; --ok-line:#065f46;
  --ready:#38bdf8; --ready-bg:#082f49; --ready-line:#075985;
  --warn:#fbbf24; --warn-bg:#2b1d05; --warn-line:#92400e;
  --queue:#fb923c; --queue-bg:#2c1405; --queue-line:#9a3412;
  --err:#fb7185; --err-bg:#330a14; --err-line:#9f1239;
  --info:#c4b5fd; --info-bg:#1f1340; --info-line:#4c1d95;
  --neutral:#cbd5e1; --neutral-bg:#1e293b; --neutral-line:#334155;
  --nav-bg:#070b16; --nav-bg-2:#0b1222; --nav-hover:#131c31; --nav-active:#1e1b4b; --nav-line:#151e33;
  --shadow:none; --shadow-lg:0 20px 50px rgba(0,0,0,.5); color-scheme: dark;
}
:root{--page:var(--bg);--card:var(--surface);--muted:var(--ink-3);--grid:var(--line);--axis:var(--line-strong);--border:var(--line);--s1:#4f46e5;--s2:#f59e0b;--track:var(--neutral-bg);--good:#10b981;--good-ink:var(--ok);--warn:#f59e0b;--serious:#f97316;--crit:#e11d48}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.2}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2);white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:16px 0 4px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.filters select{min-width:170px;padding:7px 10px;border:1px solid var(--axis);border-radius:9px;background:var(--card);font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.banner{border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:14px;background:#fff5dc;border:1px solid #f0d28a;color:#0b0b0b}
.banner.err{background:#fdecea;border-color:#f1b4ae}
section{margin:22px 0}
h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.tile .v{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.tile .l{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.tile .x{color:var(--muted);font-size:12.5px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card h3{font-size:15px;margin:0}
.card .ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.card .ch .t{flex:1}
.card .ch .sub{margin:2px 0 0}
.toggle{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:2px 0;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* horizontal bars */
.hb{display:flex;flex-direction:column;gap:7px}
.hb .r{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:10px;align-items:center}
.hb .lab{font-size:13.5px;color:var(--ink-2);line-height:1.25;text-align:right}
.hb .bars{display:flex;flex-direction:column;gap:2px}
.hb .bar{display:flex;align-items:center;gap:6px;min-height:18px;cursor:default;border-radius:4px;outline:none}
.hb .bar i{display:block;height:16px;border-radius:0 4px 4px 0;min-width:2px;transition:filter .1s}
.hb .bar:hover i,.hb .bar:focus i{filter:brightness(1.12)}
.hb .bar:focus{box-shadow:0 0 0 2px var(--accent-soft)}
.hb .bar b{font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hb.two .bar i{height:12px}
.hb .zero b{color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:top}
th{position:sticky;top:0;background:var(--surface);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700}
.prop{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:120px}
.prop .trk{width:60px;height:6px;border-radius:3px;background:var(--track);overflow:hidden;flex:none}
.prop .trk i{display:block;height:100%;background:var(--s1)}
.prop.p .trk i{background:var(--s2)}
.cpnote{color:var(--muted);font-size:12.5px;min-width:200px;max-width:460px}
.cpnote summary{cursor:pointer;color:var(--accent);font-weight:600}
.cpnote[open]{min-width:380px}
#tRekap table{min-width:1100px}
#tRekap td:nth-child(2){min-width:150px}
#tUnits table{min-width:1100px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st.good::before{background:var(--good)} .st.warn::before{background:var(--warn)} .st.crit::before{background:var(--crit)}
.chip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--surface);border:1px solid var(--border);margin:1px 3px 1px 0;color:var(--ink-2)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--axis);border-radius:9px;background:var(--card)}
.tools label{font-size:14px;display:flex;gap:6px;align-items:center}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.15);opacity:0;transition:opacity .08s;max-width:280px}
#tip .tv{font-weight:700;font-size:15px}
#tip .tl{color:var(--ink-2)}
#tip .key{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle}
.loading{opacity:.5;transition:opacity .2s}
dialog{border:0;border-radius:14px;padding:0;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:20px}
dialog input{width:100%;padding:10px 12px;border:1px solid var(--axis);border-radius:9px;margin:8px 0 12px;background:var(--card)}
.foot{color:var(--muted);font-size:12.5px;margin:30px 0 40px}
@media (max-width:620px){ header.top{position:static} .grid2{grid-template-columns:minmax(0,1fr)} .hb .r{grid-template-columns:minmax(90px,42%) 1fr} .tile .v{font-size:26px} }
@media print{ header.top,.filters,.tools,.toggle{display:none!important} .card,.tile{break-inside:avoid} }
/* target dan capaian */
.tg{display:inline-flex;align-items:baseline;gap:1px;padding:2px 8px;border-radius:999px;font-weight:700;font-size:13px;border:1px solid transparent;white-space:nowrap}
.tg small{font-weight:500;opacity:.75}
.tg-ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.tg-warn{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.tg-none{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.tg-over{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.tg-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.tg-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0 18px}
.tg-bar{border:1px solid var(--line,#e2e8f0);border-radius:10px;padding:10px 12px;background:var(--surface,#fff)}
.tg-bl{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.tg-bl b{font-weight:600}
.tg-track{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.tg-track i{display:block;height:100%;background:#22c55e;border-radius:99px}
.tg-track i.over{background:#ef4444}
.tg-prov{margin:16px 0 22px}
.tg-ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:8px;font-size:13.5px}
.tg-ph h3{margin:0 8px 0 0;font-size:17px}
.tg-t td{vertical-align:top}
tr.tg-miss td{background:#fafafa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tg-ok{background:#052e16;color:#bbf7d0;border-color:#166534}:root:not([data-theme=light]) .tg-warn{background:#451a03;color:#fde68a;border-color:#92400e}:root:not([data-theme=light]) .tg-none{background:#1e293b;color:#94a3b8;border-color:#334155}:root:not([data-theme=light]) .tg-over{background:#450a0a;color:#fecaca;border-color:#991b1b}:root:not([data-theme=light]) .tg-track{background:#334155}:root:not([data-theme=light]) tr.tg-miss td{background:transparent}}
[data-theme=dark] .tg-ok{background:#052e16;color:#bbf7d0;border-color:#166534}[data-theme=dark] .tg-warn{background:#451a03;color:#fde68a;border-color:#92400e}[data-theme=dark] .tg-none{background:#1e293b;color:#94a3b8;border-color:#334155}[data-theme=dark] .tg-over{background:#450a0a;color:#fecaca;border-color:#991b1b}[data-theme=dark] .tg-track{background:#334155}[data-theme=dark] tr.tg-miss td{background:transparent}

/* =================== SISTEM TAMPILAN BARU (menimpa aturan lama) =================== */
body{font-family:var(--sans);font-size:15.5px;letter-spacing:-.003em;background:var(--bg)}
h1,h2,h3{letter-spacing:-.015em}

/* ---------- kerangka: menu kiri + isi kanan ---------- */
.shell{min-height:100vh}
.sidenav{position:fixed;inset:0 auto 0 0;width:var(--nav-w);background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;z-index:50;border-right:1px solid var(--nav-line)}
.sidenav .sn-brand{display:flex;align-items:center;gap:11px;padding:16px 18px 14px;text-decoration:none;color:#fff;border-bottom:1px solid var(--nav-line)}
.sidenav .sn-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.sidenav .sn-logo svg{width:20px;height:20px}
.sidenav .sn-brand b{display:block;font-size:14.5px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.sidenav .sn-brand small{display:block;font-size:11.5px;color:var(--nav-ink-2);font-weight:500;margin-top:2px}
.sn-user{margin:12px 12px 4px;padding:10px 12px;border-radius:12px;background:var(--nav-bg-2);border:1px solid var(--nav-line);display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;color:inherit;font:inherit;width:calc(100% - 24px)}
.sn-user:hover{background:var(--nav-hover)}
.sn-user .av{width:32px;height:32px;border-radius:50%;background:#312e81;color:#c7d2fe;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sn-user .tx{flex:1;min-width:0}
.sn-user b{display:block;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-user span{display:block;font-size:11.5px;color:var(--nav-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-scroll{flex:1;overflow-y:auto;padding:6px 10px 14px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
.sn-sec{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--nav-ink-2);padding:16px 10px 6px}
.sn-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--nav-ink);text-decoration:none;font-size:13.5px;line-height:1.3;position:relative;margin:1px 0}
.sn-item:hover{background:var(--nav-hover);color:#fff}
.sn-item.on{background:var(--nav-active);color:#fff;font-weight:600}
.sn-item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--nav-bar)}
.sn-item .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:rgba(148,163,184,.10);color:#a5b4fc}
.sn-item.on .ic{background:rgba(129,140,248,.25);color:#e0e7ff}
.sn-item .ic svg{width:16px;height:16px}
.sn-item .lb{flex:1;min-width:0}
.sn-item .lb small{display:block;font-size:11px;color:var(--nav-ink-2);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-item.on .lb small{color:#c7d2fe}
.sn-item .code{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#a5b4fc;background:rgba(129,140,248,.14);padding:1px 6px;border-radius:5px;letter-spacing:.02em;flex:none}
.sn-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.sn-badge.unsent{background:#f59e0b;color:#1f1300}
.sn-badge.attn{background:#f43f5e;color:#fff}
.sn-badge.ok{background:rgba(16,185,129,.18);color:#6ee7b7}
.sn-foot{padding:10px 12px 14px;border-top:1px solid var(--nav-line);display:flex;gap:8px}
.sn-foot button,.sn-foot a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;border:1px solid var(--nav-line);background:var(--nav-bg-2);color:var(--nav-ink);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none}
.sn-foot button:hover,.sn-foot a:hover{background:var(--nav-hover);color:#fff}
.sn-foot svg{width:15px;height:15px}
.maincol{margin-left:var(--nav-w);min-width:0}
.scrim{display:none}

/* ---------- bilah atas ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{max-width:none;display:flex;align-items:center;gap:10px;min-height:var(--top-h);flex-wrap:nowrap;padding:8px 24px}
.hamb{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);place-items:center;cursor:pointer;color:var(--ink);flex:none}
.hamb svg{width:20px;height:20px}
.pagettl{min-width:0;display:flex;flex-direction:column}
.pagettl b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pagettl #topSub{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top .btn.small{min-height:36px}
.iconbtn{display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:16px;height:16px}

/* ---------- tombol ---------- */
.btn{border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;min-height:40px;padding:8px 15px;box-shadow:0 1px 0 rgba(15,23,42,.04);transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--accent-line);outline-offset:1px}

.tag.st-ready,.pill.st-ready{background:var(--ready-bg);color:var(--ready);border-color:var(--ready-line)}
.tag.st-unsent,.pill.st-unsent{background:var(--ready-bg);color:var(--ready);border-color:var(--ready-line)}
.tag.warn,.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.tag.st-queue,.pill.st-queue{background:var(--queue-bg);color:var(--queue);border-color:var(--queue-line)}
.tag.st-attn,.pill.st-attn,.pill.err{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}
.tag.st-cat,.tag.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.tag.st-draft{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.tag.st-sent::before,.tag.st-ready::before,.tag.st-unsent::before,.tag.st-queue::before,.tag.st-attn::before,.tag.st-draft::before,
.pill.st-sent::before,.pill.st-unsent::before,.pill.st-queue::before,.pill.st-attn::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.tag.st-sent::before,.pill.st-sent::before{content:"";width:auto;height:auto;background:none;border-radius:0;content:"✓";font-size:11px}
.tag.blink,.pill.blink{animation:tagBlink 1.6s ease-in-out infinite}
.tag.blink::before,.pill.blink::before{animation:dotPulse 1.6s ease-out infinite}
@keyframes tagBlink{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}

@keyframes needBlink{0%,100%{box-shadow:inset 4px 0 0 var(--warn-line)}50%{box-shadow:inset 4px 0 0 var(--warn)}}

@media (prefers-reduced-motion: reduce){.tag.blink,.pill.blink,.tag.blink::before,.pill.blink::before,.btn.send.dirty,.item.need,.c2f.need > .inp,.needchip::before,.sn-badge.unsent{animation:none!important}}

kes (Puskesmas Sentani Kota)","Apa penyebab rendahnya keberhasilan pengobatan pasien TB-HIV?"],["Penanggung jawab program TB dan PDP di fasyankes (Puskesmas Harapan)","Apa yang mendukung tingginya TPT dan keberhasilan pengobatan?"],["Petugas farmasi dan logistik","Bagaimana ketersediaan reagen HIV, ARV, dan obat TPT pada 2025 dan Januari–Juni 2026? Apakah ada perubahan, dan catatan apa yang mendukungnya?"]]}},"umum":{"keterbatasan":["Seluruh angka adalah rekap agregat sistem asal, bukan kohort individu yang telah dipadankan. Selisih antara SITB dan SIHA belum dapat dibedakan antara pelayanan yang tidak diberikan dan pelayanan yang tidak tercatat atau tidak terhubung (pertanyaan evaluasi Q2).","Cakupan ARV tercatat pada triwulan terakhir perlu dikonfirmasi. Di seluruh 12 lokasi, cakupan ARV triwulan IV 2025 dan triwulan III 2026 jauh lebih rendah daripada triwulan sebelumnya. Perbedaan ini dapat berkaitan dengan waktu pemutakhiran, kelengkapan periode, atau perubahan pelayanan. Perbandingan 2026 dengan 2025 dalam dokumen ini memakai Januari–Juni agar setara.","Keberhasilan pengobatan memakai kohort mulai pengobatan Januari–Agustus 2025 (sesuai dasar pemilihan lokasi); kohort September–Desember 2025 belum final. Berkas TB.03 hanya memuat sembuh dan pengobatan lengkap; kategori meninggal, putus berobat, gagal, tidak dievaluasi, dan pindah tidak tersedia.","Indikator skrining TB pada ODHIV baru ART (3.1a) bernilai 100% di seluruh lokasi, sehingga tidak membedakan capaian dan perlu diverifikasi cara pengisiannya.","Indikator fasyankes SIHA dihubungkan ke fasyankes SITB melalui pencocokan nama (kode SITB tidak tersedia dalam berkas). Fasyankes yang disebut 'tidak ditemukan dalam daftar SIHA' perlu dikonfirmasi; bisa jadi bukan layanan PDP, atau namanya berbeda.","Skor fasyankes pada butir 7 setiap lembar adalah skor usulan awal dengan pembobotan yang sama dengan skor kab/kota (Lampiran 1). Skor ini membantu diskusi, bukan keputusan. Nilai netral untuk indikator yang datanya tidak memadai tidak menunjukkan capaian sedang yang teramati; keterbatasannya dicatat saat membahas kandidat.","Persentase dengan penyebut kecil (kurang dari 20) tidak stabil, terutama di Buleleng dan Badung."],"dokumenUmum":["Data induk fasyankes: nama, kode SITB, kode SIHA/MSI, kepemilikan, kelas RS, layanan PDP/ARV, TCM, rawat inap, dan perubahan nama atau kode sejak 2025.","Jumlah pasien TB-HIV per fasyankes kandidat Januari 2025–Juni 2026 dari register atau rekap SITB yang tersedia di daerah, serta TB.03 kohort 2025 dengan seluruh kategori luaran bila dapat diakses. Pisahkan jumlah kasus dalam periode tersebut dari jumlah catatan yang tersedia untuk telaah; catat sumber, periode, dan tanggal penarikannya.","Rekap SIHA per fasyankes kandidat Januari 2025–Juni 2026 (skrining TB, pemeriksaan, diagnosis, pengobatan TB, TPT ODHIV baru dan ODHIV dalam ART) bila tersedia di daerah.","Laporan logistik (LPLPO) reagen HIV, ARV, OAT, cartridge TCM, INH dan 3HP 2025–2026.","SK atau dokumen jejaring layanan TB-HIV, DPPM, dan alur rujukan; SOP TB-HIV dan TPT yang berlaku.","Notulen rapat koordinasi atau validasi data TB-HIV 2025–2026 dan dokumen audit kematian bila ada.","Daftar PIC Dinkes (program TB, program HIV, pengelola data SITB/SIHA, farmasi) dan kontak fasyankes kandidat.","Daftar organisasi komunitas TB dan HIV yang aktif di wilayah."],"informanUmum":[["Pengelola program TB dan HIV Dinkes kab/kota","Angka mana yang dapat dikonfirmasi, dikoreksi, atau belum dapat dipastikan? Apa sumber, periode, dan penjelasan perbedaannya?"],["Pengelola program TB dan HIV Dinkes kab/kota","Bagaimana jejaring rujukan TB-HIV (RS swasta, Puskesmas, layanan PDP, klinik komunitas, Lapas/Rutan) diatur dan dipantau?"],["Pengelola program TB dan HIV Dinkes kab/kota","Apakah ada forum koordinasi dan validasi data TB-HIV bersama pengelola program TB dan HIV?"],["Kepala Puskesmas atau manajemen RS","Bagaimana layanan TB dan PDP diatur (ruang, jadwal, petugas), dan apa dukungan manajemen terhadap layanan TB-HIV?"],["Kepala Puskesmas atau manajemen RS","Apakah ada mekanisme telaah atau audit kematian pasien TB-HIV?"],["Penanggung jawab program TB dan PDP di fasyankes","Bagaimana alur diagnosis dan pengobatan pasien TB-HIV, serta alur skrining TB dan TPT bagi ODHIV yang memenuhi syarat? Di bagian mana pelayanan berjalan baik atau terhambat?"],["Dokter senior/DPJP layanan TB dan PDP","Kondisi klinis apa yang membuat ARV atau TPT ditunda? Acuan apa yang dipakai?"],["Petugas pencatatan SITB/SIHA","Bagaimana status ARV, TPT, dan luaran dicatat di SITB/SIHA (siapa, kapan, dari sumber apa), dan apakah ada perubahan pada 2025–2026?"],["Petugas farmasi dan logistik","Apakah pernah terjadi kekosongan reagen HIV, ARV, OAT, cartridge TCM, atau obat TPT pada 2025–2026? Kapan dan berapa lama?"],["Kepala klinik Lapas/Rutan","Bagaimana skrining TB, tes HIV, ARV, dan TPT dilaksanakan bagi warga binaan, dan bagaimana kesinambungannya saat pemindahan atau pembebasan?"],["Pendamping atau organisasi komunitas","Hambatan apa yang dialami pasien sebelum datang ke layanan dan setelah terputus dari pengobatan? Bagaimana pendampingan dilakukan?"]],"sentnote":"Sentinel ditetapkan setelah fasyankes final; kandidat di atas hanya berlaku bila fasyankes tersebut terpilih sebagai fasyankes sampel. Protokol mengutamakan fasyankes di kab/kota dengan capaian rendah bila penanda masalah datanya lebih kuat. Capaian rendah belum membuktikan kesalahan data. Catat dugaan ketidaksesuaian, sumber pembanding, dan keterlacakan catatan; bila penanda belum jelas, gunakan volume memadai dan sumber yang dapat ditelusuri sesuai Bagian 8A protokol.","skor":["Populasi: fasyankes dengan ≥10 kasus TB-HIV (SITB 2025) di kab/kota yang sama.","Indikator dan bobot mengikuti skor kab/kota: ARV pada TB-HIV 25%; TPT ODHIV baru 20%; keberhasilan pengobatan (kohort Januari–Agustus 2025) 15%; pemeriksaan TB pada skrining positif 10%; memulai pengobatan TB 10%; TPT ODHIV dalam ART 10%; status HIV 5%; skrining TB 5%.","Setiap indikator diubah menjadi peringkat persentil di antara fasyankes yang memenuhi ambang. Indikator dengan penyebut kurang dari 10 atau tanpa data SIHA diberi nilai netral (persentil 50). Nilai ini merupakan pengisian sementara untuk perhitungan, bukan capaian yang diamati. Saat membahas kandidat, catat indikator yang mendapat nilai netral dan alasan penggunaannya; periksa pengaruh keterbatasan data sebelum menetapkan fasilitas.","Indikator SIHA dihubungkan melalui pencocokan nama fasyankes; kecocokan perlu dikonfirmasi dengan kode fasyankes dari daerah.","Skor bersifat relatif di dalam kab/kota dan tidak dapat dibandingkan antar-kab/kota. Pada kab/kota dengan satu fasyankes yang memenuhi ambang, skor tidak bermakna."]}};

nuhi; TBL = tidak berlaku untuk fasilitas ini). Bukti minimum berupa rekap C3 dianggap terpenuhi bila sekurang-kurangnya 3 unit acak/sensus kerangka terkait telah ditelaah bagian intinya, agar prioritas 1 V13 tidak menunggu seluruh target 18 unit."],[null,"Kecukupan bukti: memadai, terbatas, atau bertentangan."],["Aturan klasifikasi CP tingkat fasilitas (Panduan Acuan Klinis Bagian 5)",null],[null,"Klasifikasi ditetapkan dari bukti proses (dokumen, observasi, klarifikasi) dan unit C3 acak/sensus. Unit purposif hanya menjelaskan mekanisme dan tidak menentukan klasifikasi, karena dipilih justru karena ada kesenjangan."],[null,"Terlaksana dan terverifikasi: alur berfungsi dan tidak ada kesenjangan pada unit acak, atau kesenjangan mempunyai alasan klinis yang dapat diterima.  Terlaksana sebagian atau terlambat: sekurang-kurangnya satu unit acak dengan kesenjangan tanpa alasan yang dapat diterima, atau praktik yang teramati tidak konsisten.  Dipastikan tidak terlaksana: proses tidak ada (tanpa alur, petugas, atau obat) dan bukti kasus konsisten.  Belum dapat dipastikan: bukti minimum belum terpenuhi atau bukti bertentangan.  Tidak berlaku: di luar fungsi fasilitas; kewajiban rujukan tetap diperiksa pada CP8."],[null,"Kolom 'Saran klasifikasi' hanya bantuan. Bila klasifikasi akhir berbeda, tulis alasannya. Saran 'terverifikasi' hanya muncul bila N acak/sensus ≥3 (asumsi kerja tim); bila N 1–2 tanpa kesenjangan, klasifikasi ditentukan dari bukti proses dan alasannya ditulis. Satu kesenjangan pada unit acak cukup untuk saran 'sebagian'."],[null,"Catat waktu kerja tim per bagian di lembar Identitas untuk pengukuran beban kerja kunjungan Bali."],["Kode jenis bukti dan tingkat keyakinan",null],[null,"D dokumen (SOP, SK, alur tertulis, notulen); R register, catatan program, kartu stok, laporan; K unit C3 (kode unit); O observasi; S simulasi alur; W wawancara singkat petugas; X sumber luar fasilitas (Dinkes, komunitas, C7, jejaring). Setiap bukti didaftarkan di Daftar_Bukti dengan lokasi berkas atau foto agar dapat ditelaah jarak jauh."],[null,"Keyakinan atas dugaan penyebab: Tinggi bila dua jenis sumber atau lebih saling mendukung dan sekurang-kurangnya satu berupa dokumen, catatan, unit C3, atau observasi; Sedang bila satu sumber terverifikasi, atau beberapa keterangan konsisten tanpa bukti tertulis; Rendah bila hanya keterangan satu petugas atau sumber saling bertentangan. Keyakinan Sedang yang hanya bersandar pada keterangan tidak cukup untuk menyatakan pelayanan terverifikasi."],["Faktor sistem (Protokol V13 Bagian 9)",null],[null,"F1 Penyelenggaraan pelayanan; F2 Tenaga kesehatan; F3 Sistem informasi; F4 Diagnostik; F5 Obat dan teknologi lain; F6 Pembiayaan; F7 Kepemimpinan dan tata kelola. Akses dan keadilan (stigma, gender, populasi kunci, warga binaan, kerahasiaan, hak pasien, pemantauan komunitas) ditelaah pada setiap faktor; tema yang beririsan tidak dihitung sebagai penyebab terpisah."],["Wawancara singkat",null],[null,"2–3 petugas per fasyankes, berfokus pada proses kerja; berbeda dari wawancara mendalam C7. Kesediaan lisan mengikuti C8 (tanpa tanda tangan). Penjelasan petugas dicatat sebagai hipotesis dan diuji dengan catatan, observasi, dan pengalaman pasien, termasuk bukti yang membantahnya."],["Proteksi lembar","Lembar yang berisi rumus dikunci tanpa kata sandi agar rumus dan label tidak terhapus. Sel isian (kosong, angka, tanggal, dan sel berdaftar pilihan) tetap dapat diisi; filter tetap dapat dipakai. Lembar Parameter dikunci penuh. Bila rumus atau label perlu diubah: Review (Tinjau) > Unprotect Sheet (Buka Proteksi Lembar), tanpa kata sandi; lindungi kembali setelah selesai. Perubahan hanya oleh koordinator dan dicatat di C9 lembar Masalah."],["Navigasi","Navigasi: lembar Navigasi berisi urutan kerja, sumber, tujuan, dan status per lembar. Daftar_Bukti kolom I mencatat asal sumber (aturan asal sumber, Panduan 5.4)."]]}]},{"name":"Navigasi","title":"Navigasi C4: urutan kerja, sumber, tujuan, dan status","blocks":[{"t":" ":{"k":"c","v":"R2"},"9,3":{"k":"c","v":"R3"},"10,3":{"k":"c","v":"R4"},"11,3":{"k":"c","v":"R3"},"12,3":{"k":"c","v":"R4"},"13,3":{"k":"c","v":"R4 (usulan)"},"14,3":{"k":"c","v":"R5"},"15,3":{"k":"c","v":"R3"},"16,3":{"k":"c","v":"R4"},"17,3":{"k":"c","v":"R5"},"18,3":{"k":"c","v":"R4"},"19,3":{"k":"c","v":"R6"},"5,4":{"k":"c","v":"Mengapa individu yang dirujuk atau membutuhkan pelayanan belum datang ke fasilitas?"},"6,4":{"k":"c","v":"Kunjungan mana yang seharusnya mencakup skrining TB, apakah dilaksanakan, dan mengapa terlewat?"},"7,4":{"k":"c","v":"Mengapa status HIV pasien TB belum diketahui: penawaran, penerimaan, pelaksanaan tes, penyampaian hasil, atau pencatatan?"},"8,4":{"k":"c","v":"Di mana pemeriksaan TB pada ODHIV tertunda: permintaan, spesimen, pengiriman, hasil, atau keputusan klinis?"},"9,4":{"k":"c","v":"Apakah kelayakan TPT dinilai dan didokumentasikan, termasuk penyingkiran TB aktif dan alasan penundaan?"},"10,4":{"k":"c","v":"Apakah ARV dimulai tepat waktu pada pasien yang belum ARV dan dilanjutkan pada pasien yang sudah ARV? Bila tidak, di mana alurnya terhenti?"},"11,4":{"k":"c","v":"Apakah hambatan inisiasi TPT terletak pada kelayakan, penawaran, persetujuan pasien, akses, atau ketersediaan obat?"},"12,4":{"k":"c","v":"Apakah rujukan dari fasilitas asal sampai, diterima, dan dilayani di tujuan, termasuk ke fasilitas di luar sampel?"},"13,4":{"k":"c","v":"Apakah kebutuhan dukungan pengobatan dikenali dan dukungan diterima pasien?"},"14,4":{"k":"c","v":"Apakah catatan tindak lanjut klinis dan luaran pengobatan konsisten antarlayanan, dan di mana perbedaannya muncul?"},"15,4":{"k":"c","v":"Apakah rangkaian TPT diselesaikan sesuai paduan; bila tidak, karena toksisitas, penghentian, pindah, atau informasi luaran tidak lengkap?"},"16,4":{"k":"c","v":"Bagaimana pasien yang terputus dikenali, ditelusuri, dan dipastikan kembali, termasuk di fasilitas lain?"},"17,4":{"k":"c","v":"Apakah fasilitas mengenali dan mencatat kematian pasien TB-HIV, menelaahnya, dan menindaklanjuti hasilnya?"},"18,4":{"k":"c","v":"Apakah perawatan HIV berlanjut setelah pengobatan TB selesai; bila tidak, mengapa?"},"19,4":{"k":"c","v":"Di mana pelayanan yang terjadi tidak tercatat, tercatat berbeda, atau tidak terhubung antara SITB dan SIHA, dan mengapa?"},"5,5":{"k":"c","v":"• Catatan rujukan dari komunitas/penjangkau dan konfirmasi kedatangan\n• Jejaring dengan klinik populasi kunci, Lapas/Rutan, dan pendamping\n• Hambatan akses yang disebut komunitas (C7) atau petugas\n• Biaya, jarak, jam layanan, stigma"},"6,5":{"k":"c","v":"• Formulir skrining di layanan HIV dan cara pengisiannya\n• Observasi sesi HIV: skrining ditanyakan atau tidak\n• Rekap C3 CP2 (B03–B04; P13–P15)\n• Kemungkinan isian otomatis atau 100% tanpa proses (C1)"},"7,5":{"k":"c","v":"• Siapa menawarkan tes dan di titik mana\n• Ketersediaan reagen (D2) dan petugas tes\n• Alur hasil ke poli TB dan ke SITB\n• CP3_Register C3: mekanisme pelayanan vs pencatatan"},"8,5":{"k":"c","v":"• Akses TCM, LF-LAM, rontgen (D3)\n• Waktu dari skrining positif ke keputusan (C3 B04–B06, P04–P09)\n• Pencatatan hasil negatif maupun positif di SIHA\n• Alur rujukan spesimen dan umpan balik hasil"},"9,5":{"k":"c","v":"• Algoritme yang dipakai dan versinya\n• Siapa menilai dan di mana dicatat\n• Rekap C3 CP5 (B08–B09): alasan ditunda/tidak layak\n• Penilaian pada ODHIV lama, bukan hanya ODHIV baru"},"10,5":{"k":"c","v":"• Pembagian tugas poli TB dan PDP; serah terima pasien\n• Mekanisme menindaklanjuti pasien TB-HIV yang belum memperoleh ARV\n• Rekap C3 CP6 (A10–A12): selisih hari, alasan penundaan, tempat ARV; kesinambungan ARV pada pasien yang sudah ARV (A10b)\n• Cara status ARV diperbarui di SITB (D4)"},"11,5":{"k":"c","v":"• Penawaran dan pemberian pada kunjungan yang sama\n• Stok INH/3HP (D2) dan tanggal kekosongan\n• Rekap C3 CP7 (B11–B15): selisih hari, penolakan, alasan\n• Kebijakan TPT di RS rujukan dibandingkan Puskesmas (C1)"},"12,5":{"k":"c","v":"• Buku/register rujukan dan umpan balik\n• Konfirmasi kedatangan dalam 30 hari (C3 lembar Rujukan)\n• Jejaring RS swasta, Puskesmas, PDP, Lapas/Rutan\n• Pelayanan terverifikasi tetapi belum tercatat atau terhubung di SITB/SIHA (WP3)"},"13,5":{"k":"c","v":"• Catatan PMO, pendamping, konseling kepatuhan, kunjungan rumah\n• Kunjungan terlewat dan respons petugas (C3 T02, P18)\n• Peran komunitas (koordinasi dengan C7)\n• Dukungan bagi penerima TPT dianalisis terpisah dari pasien TB-HIV"},"14,5":{"k":"c","v":"• Pemeriksaan dahak follow-up dan akhir pengobatan\n• Pencatatan luaran TB.03, termasuk pindah dan meninggal\n• Rekap C3 CP10 (A13–A14) dan kesesuaian SITB (A17)\n• Dasar kategori 'pengobatan lengkap' dibandingkan 'sembuh' (C1)"},"15,5":{"k":"c","v":"• Pemantauan selama TPT dan pencatatan dosis\n• Penanganan efek samping\n• Rekap C3 CP11 (B16–B17)\n• Rangkaian dengan pengamatan belum cukup diberi BD"},"16,5":{"k":"c","v":"• Daftar mangkir dan frekuensi pemeriksaannya\n• Upaya pelacakan tercatat dan oleh siapa\n• Kembali dalam 90 hari (C3 lembar Interupsi)\n• Verifikasi pelayanan di fasilitas lain"},"17,5":{"k":"c","v":"• Prosedur pencatatan kematian dan sumbernya (register kematian RS)\n• Dokumen telaah/audit kematian 2024–2026 dan pesertanya\n• Bukti tindakan perbaikan setelah telaah\n• Dugaan kematian TB-HIV yang belum dinotifikasi (RS)"},"18,5":{"k":"c","v":"• Kunjungan HIV 90 dan 180 hari (±30) setelah OAT (C3 A18–A19)\n• Perpindahan pasien setelah TB selesai\n• Hambatan stigma atau akses (C7)\n• Penjadwalan kunjungan lanjutan oleh PDP"},"19,5":{"k":"c","v":"• Siapa mengentri SITB/SIHA, dari sumber apa, frekuensi (D4)\n• Validasi data bersama TB dan HIV\n• Rekap C3 R6 (kesesuaian SITB/SIHA; CP3_Register 'Pencatatan')\n• Hasil penghitungan ulang C5 bila sentinel"},"5,6":{"k":"c","v":"M1: Catatan rujukan komunitas/penjangkau ke fasyankes, atau konfirmasi tertulis tidak ada (R/X)\nM2: Klarifikasi petugas penghubung komunitas atau Dinkes (W/X)"},"6,6":{"k":"c","v":"M1: Formulir/alat skrining di layanan HIV diperiksa (D/R)\nM2: Observasi atau simulasi sesi HIV (O/S)\nM3: Rekap C3 CP2 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti"},"7,6":{"k":"c","v":"M1: Alur tes HIV pasien TB dipetakan (D/W)\nM2: CP3_Register 6 episode (K); di sentinel tetap dikerjakan kecuali penghitungan ulang TB/HIV-5 C5 selesai dua arah (R)\nM3: Satu klarifikasi singkat petugas (W); wajib menurut V13 Bagian 10"},"8,6":{"k":"c","v":"M1: Akses TCM/LF-LAM/rontgen dan waktu tunggu hasil (R/W)\nM2: Rekap C3 CP4 (K): terpenuhi bila semua unit acak/sensus dengan skrining positif telah ditelaah; TBL bila tidak ada\nM3: Klarifikasi alur spesimen dan umpan balik hasil (W)"},"9,6":{"k":"c","v":"M1: Algoritme kelayakan TPT yang dipakai beserta versinya (D)\nM2: Rekap C3 CP5 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti\nM3: Klarifikasi petugas penilai (W)"},"10,6":{"k":"c","v":"M1: Pembagian tugas poli TB dan PDP serta serah terima (D/W/O)\nM2: Rekap C3 CP6 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti\nM3: Cara status ARV diperbarui di SITB (R/W)"},"11,6":{"k":"c","v":"M1: Kartu stok INH/3HP 3 bulan terakhir dan kekosongan 2024–Jun 2026 (R)\nM2: Rekap C3 CP7 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti\nM3: Klarifikasi penawaran dan pemberian (W)"},"12,6":{"k":"c","v":"M1: Register/buku rujukan dan umpan balik (R)\nM2: Rekap C3 CP8 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti\nM3: Jejaring rujukan dipetakan (D/W)"},"13,6":{"k":"c","v":"M1: Catatan dukungan pengobatan/PMO/pendamping (R)\nM2: Klarifikasi peran pendamping atau komunitas (W/X)"},"14,6":{"k":"c","v":"M1: Pencatatan luaran TB.03/SITB diperiksa (R)\nM2: Rekap C3 CP10 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti"},"15,6":{"k":"c","v":"M1: Pencatatan dosis/pemantauan TPT (R)\nM2: Rekap C3 CP11 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti"},"16,6":{"k":"c","v":"M1: Daftar mangkir dan bukti pelacakan (R)\nM2: Rekap C3 CP12 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti\nM3: Klarifikasi petugas pelacak (W)"},"17,6":{"k":"c","v":"M1: Prosedur dan sumber pencatatan kematian (D/R)\nM2: Dokumen telaah/audit kematian 2024–2026, atau konfirmasi tertulis tidak ada (D); rujuk kode kasus C6 di fasyankes ini\nM3: Bukti tindak lanjut hasil telaah (D/W)"},"18,6":{"k":"c","v":"M1: Rekap C3 CP14 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti\nM2: Klarifikasi alur kelanjutan layanan HIV setelah TB (W)"},"19,6":{"k":"c","v":"M1: Alur entri SITB/SIHA dan validasi bersama (D/W)\nM2: Rekap C3 R6 (K): terpenuhi bila ≥3 unit acak/sensus kerangka terkait telah ditelaah inti\nM3: Hasil C5 bila sentinel; TBL bila bukan sentinel"},"5,7":{"k":"c","v":"Proporsi berhasil mengakses hanya dihitung bila ada daftar kohort rujukan yang jelas; bukti utama sering dari C7 dan Dinkes."},"6,7":{"k":"c","v":"Cakupan per kunjungan dibedakan dari cakupan pada peserta baru ARV."},"7,7":{"k":"c","v":"Status HIV yang sudah diketahui ditetapkan berdasarkan dokumentasi diagnosis; tes ulang tidak dipersyaratkan."},"8,7":{"k":"c","v":"Penyelesaian pada hari yang sama dilaporkan deskriptif, bukan satu-satunya ukuran keberhasilan."},"9,7":{"k":"c","v":"CD4 atau riwayat kontak tidak diberlakukan sebagai syarat untuk semua pasien."},"10,7":{"k":"c","v":"Pasien yang melanjutkan ARV dibedakan dari yang baru memulai; ketepatan waktu dinilai menurut acuan saat pelayanan (Panduan Bagian 3)."},"11,7":{"k":"c","v":"Penawaran dan pemberian awal dicatat sebagai dua tahap."},"12,7":{"k":"c","v":"Penyelesaian dan waktunya disajikan menurut tujuan rujukan."},"13,7":{"k":"c","v":"Agenda dan daftar partisipasi WP4–WP6 dipakai bersama untuk mengurangi permintaan data berulang."},"14,7":{"k":"c","v":"Pasien yang pindah atau belum diketahui statusnya tetap dicatat."},"15,7":{"k":"c","v":"Penilaian mengikuti paduan dan batas waktu penyelesaian pada Panduan Bagian 4.6."},"16,7":{"k":"c","v":"Definisi terputus mengikuti Panduan Bagian 4.8."},"17,7":{"k":"c","v":"Unit penilaian adalah fasilitas. Telaah klinis kasus dilakukan dengan C6 (WP5)."},"18,7":{"k":"c","v":"Pasien yang belum mencapai durasi pengamatan tidak dimasukkan ke penyebut kegagalan retensi."},"19,7":{"k":"c","v":"Temuan R6 diteruskan ke WP3 dan tidak dipakai untuk mengoreksi data nasional."}},"ref":true}],"sub":"Referensi; tidak diisi."}],"version":"Draf 2 | 13 Oktober 2026, rev. 18 Oktober (C8) | Diselaraskan dengan Protokol V13 draf 11 Okt, C2b Draf 1, C3 Draf 3, Panduan Acuan Klinis Draf 1 | Satu buku kerja per fasyankes"},"C5":{"id":"C5","title":"C5 Verifikasi Data Sentinel","desc":"Satu buku kerja per fasyankes sentinel. Pencocokan dua arah TB/HIV-5, TB/HIV-6, TB/HIV-4.1a, penghitungan ulang, faktor verifikasi.","scope":{"type":"fasyankes","label":"Kode fasyankes sentinel","cell":"Identitas!B4"},"file":"C5.xlsx","sheets":[{"name":"Petunjuk","title":"C5 Formulir Verifikasi Data Sentinel, RCA TB-HIV 2026","blocks":[{"t":"info","items":[["Fungsi dan batas",null],[null,"C5 memeriksa kebenaran angka yang dilaporkan fasyankes sentinel untuk satu triwulan 2025, agar masalah pencatatan tidak langsung dianggap kegagalan pelayanan (Protokol V13 Bagian 8A). Indikator: TB/HIV-5, TB/HIV-6, TB/HIV-4.1a."],[null,"Penghitungan ulang mencakup SELURUH baris triwulan terpilih pada kedua arah, bukan sampel pasien tambahan. Unit C3 pada triwulan yang sama memakai kode yang sama. Temuan C5 diteruskan ke WP3, WP2, dan WP7, dan TIDAK dipakai untuk mengoreksi atau mengestimasi kesalahan pelaporan nasional."],[null,"Pernyataan fasyankes tanpa bukti sumber tidak menggantikan verifikasi. Bila daftar sistem atau register belum dapat diakses, bagian itu dinyatakan belum selesai; telaah sumber saja tidak dilaporkan sebagai verifikasi dua arah."],["Triwulan dan prioritas",null],[null,"Pilihan awal triwulan III 2025 (1 Juli–30 September 2025). Triwulan lain dipilih bila profil awal menunjukkan dugaan masalah data pada periode itu; alasannya dicatat di Identitas dan tanggalnya diubah di Parameter."],[null,"Bila jumlah baris melebihi waktu, dahulukan TB/HIV-6 dan TB/HIV-4.1a, lalu TB/HIV-5. Pembatasan dicatat di Identitas."],["Langkah",null],[null,"1. Sebelum kunjungan, petugas berwenang mengekspor daftar SITB (TB/HIV-5, TB/HIV-6) dan SIHA (TB/HIV-4.1a) triwulan terpilih, membuat daftar kerja beridentitas yang disimpan sendiri, dan memberi kode baris C5 (contoh BLL-RS-5-001). Kode pasien diambil dari berkas penghubung fasyankes (C2a-P); pasien baru diberi kode lanjutan, agar pasien unik lintas C3, C5, dan C6 dapat dihitung."],[null,"2. Isi Identitas, Parameter, dan nilai yang dilaporkan (Rekap). Nilai dilaporkan diambil dari rekap resmi triwulan tersebut; nilai sistem saat ini dihitung otomatis dari daftar ekspor."],[null,"3. Arah 1, sistem ke sumber: untuk setiap baris daftar sistem, cari buktinya di sumber dan isi kolom sistem dan sumber."],[null,"4. Arah 2, sumber ke sistem: telusuri register triwulan yang sama; setiap episode/individu yang memenuhi kriteria tetapi tidak ada di daftar sistem ditambahkan sebagai baris baru dengan asal 'Telusur register'."],[null,"5. Baca kolom 'Status pencocokan', tetapkan jenis ketidaksesuaian, minta penjelasan dan konfirmasi petugas, dan catat bukti. Pertanyaan yang belum terjawab masuk lembar Tindak_Lanjut (sampai 30 November 2026)."],[null,"6. Lengkapi Alur_Pencatatan dan Sistem_Data, lalu periksa Rekap. Rangkuman diteruskan ke baris R6 dan CP3 pada C4 Matriks_CP."],["Kategori ketidaksesuaian (Protokol V13 Bagian 8A)",null],[null,"Pelayanan belum tercatat dalam sistem; entri tanpa bukti sumber; perbedaan definisi atau periode; duplikasi; perpindahan fasilitas; keterlambatan entri; perbedaan yang belum terselesaikan. Status otomatis hanya saran; kategori akhir ditetapkan penelaah setelah klarifikasi."],["Faktor verifikasi",null],[null,"Faktor verifikasi = hasil penghitungan ulang dari sumber ÷ nilai yang dilaporkan, dihitung terpisah untuk pembilang dan penyebut. Nilai di atas batas atas berarti laporan lebih rendah daripada sumber (pelaporan kurang); di bawah batas bawah berarti laporan lebih tinggi daripada sumber (pelaporan lebih). Batas 0,90–1,10 adalah konvensi kerja yang lazim pada penilaian mutu data rutin dan dapat diubah di Parameter."],[null,"Penghitungan ulang hanya sah bila seluruh sumber triwulan dapat diperiksa (Identitas: register lengkap = Ya). Bila tidak, Rekap menandai hasil sebagai terbatas pada baris yang dapat ditelusuri."],["Kerahasiaan",null],[null,"Buku kerja ini hanya memuat kode. Daftar kerja beridentitas dan ekspor asli disimpan petugas berwenang di lingkungan berakses terbatas sesuai Protokol V13 Bagian 17."],["Proteksi lembar","Lembar yang berisi rumus dikunci tanpa kata sandi agar rumus dan label tidak terhapus. Sel isian (kosong, angka, tanggal, dan sel berdaftar pilihan) tetap dapat diisi; filter tetap dapat dipakai. Lembar Parameter dikunci penuh. Bila rumus atau label perlu diubah: Review (Tinjau) > Unprotect Sheet (Buka Proteksi Lembar), tanpa kata sandi; lindungi kembali setelah selesai. Perubahan hanya oleh koordinator dan dicatat di C9 lembar Masalah."]]}]},{"name":"Identitas","title":"Identitas sentinel, akses, dan cakupan verifikasi","blocks":[{"t":"fields","rows":[{"k":"in","r":4,"c":2,"label":"Kode fasyankes RCA"},{"k":"in","r":5,"c":2,"label":"Provinsi / kab/kota"},{"k":"in","r":6,"c":2,"label":"Jenis fasyankes"},{"k":"in","r":7,"c":2,"label":"Alasan penetapan sebagai sentinel (V13 Bagian 8A)"},{"k":"in","r":8,"c":2,"label":"Alasan bila triwulan bukan triwulan III 2025"},{"o":["Fasyankes","Dinas kesehatan","Belum tersedia"],"k":"in","r":9,"c":2,"label":"Akses SITB"},{"o":["Fasyankes","Dinas kesehatan","Belum tersedia"],"k":"in","r":10,"c":2,"label":"Akses SIHA"},{"k":"in","r":11,"c":2,"label":"Petugas berwenang pemegang akses (jabatan/kode)"},{"k":"in","r":12,"c":2,"label": es sentinel (6 sentinel, satu per provinsi)"},"C6R":{"id":"C6R","title":"C6 Register Telaah Kematian","desc":"Satu register nasional, dipegang koordinator WP5 (akses terbatas). Penjaringan calon, kasus terpilih, skor penilaian pertama dan kedua, kesepakatan, panel, faktor penyumbang.","scope":{"type":"nasional","label":"Register nasional","fixed":"NASIONAL"},"file":"C6R.xlsx","sheets":[{"name":"Petunjuk","title":"C6 Register Telaah Kematian TB-HIV, RCA TB-HIV 2026","blocks":[{"t":"info","items":[["Fungsi",null],[null,"Register ini mencatat penjaringan dan pemilihan calon kasus, skor penilaian pertama dan kedua, kesepakatan antarpenelaah, hasil panel daring, serta faktor penyumbang untuk sintesis WP7. Formulir per kasus ada di C6 versi cetak (Bagian A kronologi, Bagian B penilaian pertama) dan C6-C (lembar penilaian kedua)."],[null,"Telaah kematian adalah telaah berbasis catatan untuk pembelajaran program, dengan prinsip kerahasiaan dan tanpa menyalahkan. Telaah tidak menetapkan sebab kematian resmi, tidak mengestimasi proporsi kematian yang dapat dicegah, dan sampel purposif tidak dipakai untuk menghitung angka mortalitas atau kekurangan pelaporan (Protokol V13 Bagian 11)."],["Alur",null],[null,"1. Dinkes kab/kota bersama fasyankes menghimpun calon kasus (lembar Daftar_Calon); register kematian RS terpilih diperiksa untuk dugaan kematian TB-HIV yang belum dinotifikasi."],[null,"2. Petugas berwenang dan penelaah klinis memverifikasi duplikasi (calon duplikat tetap dicatat dengan kolom 'Duplikat dari' terisi sehingga tidak dihitung memenuhi syarat), dokumentasi TB dan HIV, status dan tanggal kematian, periode, serta kecukupan dokumen. Pemilihan akhir purposif: hingga 5 per kab/kota, 10 per provinsi, 60 keseluruhan, dengan variasi kematian dini dan lanjut, status ARV, jenis fasyankes, alur rujukan, dan kelengkapan dokumen."],[null,"3. Pengambil data terlatih menyusun Bagian A (kronologi); penelaah klinis memeriksa kecukupannya. Penelaah 1 (yang berkunjung) mengisi Bagian B di lokasi."],[null,"4. Kronologi tanpa pengenal langsung dikirim ke penelaah 2 (yang tidak menilai kasus itu) beserta C6-C. Penelaah 2 tidak melihat Bagian B. Koordinator memasukkan skor ke lembar Kasus setelah C6-C diterima."],[null,"5. Penilaian kedua wajib untuk semua kasus dengan peluang perbaikan menurut penelaah 1, ditambah sampel acak sekurang-kurangnya 30% dari kasus lain yang dokumennya memadai (kolom otomatis memakai angka acak tetap)."],[null,"6. Panel daring tiga penelaah setelah setiap provinsi dan sesi akhir 23–27 November 2026 membahas kasus dengan perbedaan penilaian, kematian dini, atau implikasi program luas. Bila tidak sepakat, kedua penilaian dipertahankan."],["Skala penilaian per fase (metode telaah terstruktur, Hutchinson dkk. 2013)",null],[null,"1 = sangat buruk; 2 = buruk; 3 = memadai; 4 = baik; 5 = sangat baik; BD = tidak dapat dinilai karena dokumen tidak memadai. Setiap skor wajib disertai alasan tertulis di formulir. Tahap: T1 akses dan diagnosis; T2 awal terapi; T3 pemantauan; T4 rujukan; T5 penanganan saat kondisi memburuk. Kode F1–F7 dipakai untuk faktor sistem, sama dengan C4."],[null,"Untuk kappa, skor didikotomikan: mutu kurang (1–2) dan memadai atau lebih (3–5). Pilihan dikotomi ini adalah keputusan analisis tim dan dapat diubah sebelum analisis."],["Klasifikasi faktor penyumbang (V13 Bagian 11)",null],[null,"Terverifikasi; mungkin berperan; belum cukup bukti; didukung bukti yang saling bertentangan. Kerangka tiga keterlambatan (Thaddeus dan Maine 1994) dipakai untuk kronologi akses dan tata laksana; tujuh faktor sistem (F1–F7, sama dengan C4) untuk menelusuri penyebab hambatan."],["Kerahasiaan",null],[null,"Register hanya memuat kode. Kode pasien diambil dari berkas penghubung fasyankes (C2a-P) dan ditulis dengan awalan kode fasyankes (contoh BLL-RS-P008), karena kode penghubung hanya unik di dalam satu fasyankes. Pasien yang berpindah fasyankes ditautkan oleh petugas berwenang Dinkes melalui kedua berkas penghubung; tim hanya menerima pasangan kodenya. Kronologi untuk penilaian kedua dihilangkan pengenal langsungnya. Data beridentitas dan riwayat klinis tidak diunggah ke layanan kecerdasan buatan serbaguna (V13 Bagian 17)."],["Proteksi lembar","Lembar yang berisi rumus dikunci tanpa kata sandi agar rumus dan label tidak terhapus. Sel isian (kosong, angka, tanggal, dan sel berdaftar pilihan) tetap dapat diisi; filter tetap dapat dipakai. Lembar Parameter dikunci penuh. Bila rumus atau label perlu diubah: Review (Tinjau) > Unprotect Sheet (Buka Proteksi Lembar), tanpa kata sandi; lindungi kembali setelah selesai. Perubahan hanya oleh koordinator dan dicatat di C9 lembar Masalah."]]}]},{"name":"Parameter","title":"Parameter","blocks":[{"t":"grid","h":4,"r1":5,"r2":10,"cols":[{"c":2,"h":"Parameter","role":"label"},{"c":3,"h":"Nilai","role":"in","t":"date"},{"c":4,"h":"Sumber","role":"label"}],"cells":{"5,2":{"k":"c","v":"Awal periode kematian"},"6,2":{"k":"c","v":"Akhir periode kematian"},"7,2":{"k":"c","v":"Awal perluasan (bila calon < 5 per kab/kota)"},"8,2":{"k":"c","v":"Proporsi sampel acak penilaian kedua"},"9,2":{"k":"c","v":"Target kasus per kab/kota"},"10,2":{"k":"c","v":"Selisih skor yang memicu panel"},"8,3":{"t":null,"fmt":"0%","k":"in","v":0.3},"9,3":{"t":null,"k":"in","v":5},"10,3":{"t":null,"k":"in","v":2},"5,3":{"k":"in","v":"2025-01-01"},"6,3":{"k":"in","v":"2026-06-30"},"7,3":{"k":"in","v":"2024-01-01"},"5,4":{"k":"c","v":"V13 Bagian 8A"},"6,4":{"k":"c","v":"V13 Bagian 3 dan 8A"},"7,4":{"k":"c","v":"V13 Bagian 8A"},"8,4":{"k":"c","v":"V13 Bagian 11"},"9,4":{"k":"c","v":"V13 Bagian 11"},"10,4":{"k":"c","v":"Asumsi kerja tim"}},"param":true}]},{"name":"Daftar_Calon","title":"Penjaringan dan pemilihan calon kasus kematian","blocks":[{"t":"table","h":4,"r1":5,"r2":304,"cols":[{"c":1,"h":"Kab/kota","role":"in","o":["DLS","MDN","JTI","JPS","IDM","BGR","SDA","SBY","BLL","BDG","KJP","KBJ"]},{"c":2,"h":"Fasyankes (kode RCA)","role":"in"},{"c":3,"h":"Kode calon","role":"in"},{"c":4, rsion":"Draf 1 | 13 Oktober 2026 | Protokol V13 Bagian 11","desc":"Satu formulir per kasus kematian: Bagian A (kronologi), Bagian B (penilaian pertama), lembar panel. Penilaian kedua memakai C6-C.","scope":{"type":"kasus","label":"Kode kasus C6","cell":"A1_Kelayakan!B4"},"sheets":[{"name":"Prinsip","title":"C6 Formulir Telaah Kematian TB-HIV","sub":"RCA TB-HIV 2026 | Draf 1 | 13 Oktober 2026 | Protokol V13 Bagian 11 | Bagian A (kronologi), B (penilaian pertama), lembar panel. Penilaian kedua memakai C6-C.","blocks":[{"t":"info","items":[["Prinsip","Telaah berbasis catatan untuk pembelajaran program, dengan kerahasiaan dan tanpa menyalahkan. Tidak menetapkan sebab kematian resmi dan tidak mengestimasi proporsi kematian yang dapat dicegah."],[null,"Sampel purposif hingga 60 kasus tidak dipakai untuk menghitung angka mortalitas atau kekurangan pelaporan."],[null,"Fakta dari rekam medis dibedakan dari keterangan petugas; ingatan petugas tidak menggantikan rekam medis. Tidak dilakukan autopsi verbal keluarga."],[null,"Klarifikasi singkat dengan dokter yang merawat merupakan bagian akses rekam medis yang diizinkan fasyankes, tidak direkam, dan dicatat dengan sumber W. Bila berkembang menjadi wawancara tentang pengalaman atau pendapat, bacakan naskah C8 dan catat kesediaan lisan."],[null,"Diagnosis yang tercatat di rekam medis dibedakan dari interpretasi penelaah. Tanpa bukti memadai, sebab spesifik dinyatakan belum dapat ditentukan."],["Pembagian kerja","A Kronologi: pengambil data terlatih dan berwenang, dapat dimulai sebelum kunjungan; penelaah klinis memeriksa kecukupan (A6). Satu salinan tanpa pengenal langsung disiapkan untuk penilaian kedua."],[null,"B Penilaian pertama: penelaah klinis yang berkunjung, di lokasi; klarifikasi singkat dengan dokter yang merawat boleh dilakukan untuk melengkapi kronologi."],[null,"C6-C Penilaian kedua: penelaah klinis yang tidak menilai kasus ini, jarak jauh, tanpa melihat Bagian B. Wajib untuk kasus dengan peluang perbaikan dan sampel acak ≥30% kasus lain (Register C6)."],[null,"Lembar panel: panel daring tiga penelaah klinis setelah setiap provinsi dan sesi akhir 23–27 November 2026."],["Kode status bukti","Status bukti sama dengan C3: Y tercatat; TL ada bukti tidak dilakukan, ditolak, atau ditunda; TC tidak ditemukan pada sumber yang sudah diperiksa; TBL tidak berlaku; BD belum dapat dinilai. Keterangan petugas dicatat dengan kode sumber W (bukan rekam medis), bukan sebagai status. Tanggal ditulis HH/BB/TTTT; tanggal parsial --/BB/TTTT; tidak diketahui TT. Tahap pelayanan diberi kode T1–T5; faktor sistem F1–F7 seperti C4."],["Acuan","Protokol V13 Bagian 6 dan 11; Panduan Acuan Klinis dan Aturan Pengisian (acuan yang berlaku pada periode pelayanan); metode telaah terstruktur (Hutchinson dkk., BMJ Qual Saf 2013); kerangka tiga keterlambatan (Thaddeus dan Maine 1994)."]]}]},{"name":"A1_Kelayakan","title":"Bagian A. Pengambilan data dan penyusunan kronologi","blocks":[{"t":"fields","rows":[{"r":4,"c":2,"label":"Kode kasus C6","k":"in","key":true},{"r":5,"c":2,"label":"Kode unit C3 bila sama","k":"in"},{"r":6,"c":2,"label":"Kab/kota","k":"in","o":["DLS","MDN","JTI","JPS","IDM","BGR","SDA","SBY","BLL","BDG","KJP","KBJ"]},{"r":7,"c":2,"label":"Fasyankes (kode)","k":"in"}]},{"t":"fields","rows":[{"r":20,"c":2,"label":"Sumber daftar calon","k":"in","o":["Laporan program","Register TB/HIV","Register kematian RS","Rawat inap/ringkasan pulang","Rujukan","SITB/SIHA"],"multi":true},{"r":21,"c":2,"label":"Ditemukan dari register kematian RS dan belum dinotifikasi","k":"in","o":["Ya","Tidak"]},{"r":22,"c":2,"label":"Duplikasi diperiksa","k":"in","g":"Duplikasi diperiksa; duplikat dari (kode calon)","o":["Ya","Tidak"]},{"r":23,"c":2,"label":"Duplikat dari","k":"in","g":"Duplikasi diperiksa; duplikat dari (kode calon)"},{"r":24,"c":2,"label":"TB","k":"in","g":"Dokumentasi TB / HIV","o":["Ya","Tidak"]},{"r":25,"c":2,"label":"HIV","k":"in","g":"Dokumentasi TB / HIV","o":["Ya","Tidak"]},{"r":26,"c":2,"label":"Sum m TB dan HIV, tindak lanjut hasil, kepatuhan, interupsi"},"8,1":{"k":"c","v":"T4 Rujukan"},"8,2":{"k":"c","v":"Keputusan rujukan, penyelesaian, umpan balik"},"9,1":{"k":"c","v":"T5 Penanganan saat kondisi memburuk"},"9,2":{"k":"c","v":"Pengenalan tanda bahaya, eskalasi, tata laksana menjelang kematian"}}}]},{"name":"C2_Keterlambatan","title":"C2 Tiga keterlambatan","blocks":[{"t":"grid","h":4,"r1":5,"r2":7,"cols":[{"c":1,"h":"Keterlambatan","role":"label"},{"c":2,"h":"Penilaian","role":"in","o":["Ada","Tidak","BD"]},{"c":3,"h":"Bukti","role":"in"}],"cells":{"5,1":{"k":"c","v":"1 Mencari pelayanan"},"6,1":{"k":"c","v":"2 Mencapai layanan yang tepat"},"7,1":{"k":"c","v":"3 Tata laksana memadai di fasyankes"}}}]},{"name":"C3_Kesimpulan","title":"C3 Kesimpulan","blocks":[{"t":"fields","rows":[{"r":4,"c":2,"label":"Peluang perbaikan pelayanan","k":"in","o":["Ya","Tidak","BD"]},{"r":5,"c":2,"label":"1.","k":"in","g":"Tiga faktor penyumbang utama (tahap T1–T5, faktor sistem F1–F7, bukti)"},{"r":6,"c":2,"label":"2.","k":"in","g":"Tiga faktor penyumbang utama (tahap T1–T5, faktor sistem F1–F7, bukti)"},{"r":7,"c":2,"label":"3.","k":"in","g":"Tiga faktor penyumbang utama (tahap T1–T5, faktor sistem F1–F7, bukti)"},{"r":8,"c":2,"label":"Keyakinan keseluruhan","k":"in","o":["Tinggi","Sedang","Rendah"]},{"r":9,"c":2,"label":"Hal yang perlu dibahas di panel","k":"in"}],"title":"C3 Kesimpulan"}]}],"word":true}};
WBS.C1 = {"id": "C1", "title": "C1 Profil Awal dan Lembar Pendalaman", "desc": "Satu profil per kabupaten/kota. Terisi awal dari dokumen Profil Lokasi RCA TB-HIV; koordinator lapangan bersama pemegang program tuberkulosis dan HIV daerah mengonfirmasi atau mengoreksinya saat pendalaman. Hasilnya dipakai otomatis oleh daftar sampel (C2), penilaian fasilitas (C4), verifikasi data sentinel (C5), telaah kematian (C6), dan wawancara (C7).", "scope": {"type": "kabupaten", "label": "Kabupaten/kota", "cell": "Profil!B4"}, "file": "C1.xlsx", "version": "", "sheets": [{"name": "Petunjuk", "title": "Petunjuk C1", "blocks": [{"t": "info", "items": [["Fungsi", null], [null, "Menentukan apa yang perlu diperiksa di setiap kabupaten/kota dan menyiapkan kunjungan yang sesuai dengan masalah setempat."], ["Pengisi", null], [null, "Koordinator lapangan bersama pemegang program tuberkulosis dan HIV kabupaten/kota. Tim kuantitatif memeriksa definisi indikator dan menambahkan hasil analisis nasional yang tersedia."], ["Isian awal", null], [null, "Indikator, masalah, dugaan, informasi yang belum diketahui, kandidat fasilitas, sentinel, fokus titik penilaian, pertanyaan untuk informan, dan dokumen yang diminta sudah terisi dari dokumen Profil Lokasi RCA TB-HIV. Tugas Anda: konfirmasi atau koreksi, lalu catat kesepakatan dan tindak lanjut."], ["Batas fungsi", null], [null, "Profil membedakan rekap sistem asal, hasil pemadanan, dan verifikasi sumber. Dugaan awal mengarahkan penelusuran purposif; sampel acak tetap mengikuti protokol. Capaian rendah belum membuktikan kesalahan data."], ["Keterhubungan", null], [null, "Indikator dan dugaan awal muncul otomatis di C4 (Dugaan dari C1 dan volume layanan). Kandidat fasilitas muncul di C2 dan C4. Kandidat sentinel muncul di C5. Sumber daftar kasus kematian muncul di register C6. Pertanyaan informan muncul di C7."], ["Keterbatasan data profil awal", null], [null, "Seluruh angka adalah rekap agregat sistem asal, bukan kohort individu yang telah dipadankan. Selisih antara SITB dan SIHA belum dapat dibedakan antara pelayanan yang tidak diberikan dan pelayanan yang tidak tercatat atau tidak terhubung (pertanyaan evaluasi Q2)."], [null, "Cakupan ARV tercatat pada triwulan terakhir perlu dikonfirmasi. Di seluruh 12 lokasi, cakupan ARV triwulan IV 2025 dan triwulan III 2026 jauh lebih rendah daripada triwulan sebelumnya. Perbedaan ini dapat berkaitan dengan waktu pemutakhiran, kelengkapan periode, atau perubahan pelayanan. Perbandingan 2026 dengan 2025 dalam dokumen ini memakai Januari–Juni agar setara."], [null, "Keberhasilan pengobatan memakai kohort mulai pengobatan Januari–Agustus 2025 (sesuai dasar pemilihan lokasi); kohort September–Desember 2025 belum final. Berkas TB.03 hanya memuat sembuh dan pengobatan lengkap; kategori meninggal, putus berobat, gagal, tidak dievaluasi, dan pindah tidak tersedia."], [null, "Indikator skrining TB pada ODHIV baru ART (3.1a) bernilai 100% di seluruh lokasi, sehingga tidak membedakan capaian dan perlu diverifikasi cara pengisiannya."], [null, "Indikator fasyankes SIHA dihubungkan ke fasyankes SITB melalui pencocokan nama (kode SITB tidak tersedia dalam berkas). Fasyankes yang disebut 'tidak ditemukan dalam daftar SIHA' perlu dikonfirmasi; bisa jadi bukan layanan PDP, atau namanya berbeda."], [null, "Skor fasyankes pada butir 7 setiap lembar adalah skor usulan awal dengan pembobotan yang sama dengan skor kab/kota (Lampiran 1). Skor ini membantu diskusi, bukan keputusan. Nilai netral untuk indikator yang datanya tidak memadai tidak menunjukkan capaian sedang yang teramati; keterbatasannya dicatat saat membahas kandidat."], [null, "Persentase dengan penyebut kecil (kurang dari 20) tidak stabil, terutama di Buleleng dan Badung."], ["Skor fasilitas usulan", null], [null, "Populasi: fasyankes dengan ≥10 kasus TB-HIV (SITB 2025) di kab/kota yang sama."], [null, "Indikator dan bobot mengikuti skor kab/kota: ARV pada TB-HIV 25%; TPT ODHIV baru 20%; keberhasilan pengobatan (kohort Januari–Agustus 2025) 15%; pemeriksaan TB pada skrining positif 10%; memulai pengobatan TB 10%; TPT ODHIV dalam ART 10%; status HIV 5%; skrining TB 5%."], [null, "Setiap indikator diubah menjadi peringkat persentil di antara fasyankes yang memenuhi ambang. Indikator dengan penyebut kurang dari 10 atau tanpa data SIHA diberi nilai netral (persentil 50). Nilai ini merupakan pengisian sementara untuk perhitungan, bukan capaian yang diamati. Saat membahas kandidat, catat indikator yang mendapat nilai netral dan alasan penggunaannya; periksa pengaruh keterbatasan data sebelum menetapkan fasilitas."], [null, "Indikator SIHA dihubungkan melalui pencocokan nama fasyankes; kecocokan perlu dikonfirmasi dengan kode fasyankes dari daerah."], [null, "Skor bersifat relatif di dalam kab/kota dan tidak dapat dibandingkan antar-kab/kota. Pada kab/kota dengan satu fasyankes yang memenuhi ambang, skor tidak bermakna."], ["Sentinel", null], [null, "Sentinel ditetapkan setelah fasyankes final; kandidat di atas hanya berlaku bila fasyankes tersebut terpilih sebagai fasyankes sampel. Protokol mengutamakan fasyankes di kab/kota dengan capaian rendah bila penanda masalah datanya lebih kuat. Capaian rendah belum membuktikan kesalahan data. Catat dugaan ketidaksesuaian, sumber pembanding, dan keterlacakan catatan; bila penanda belum jelas, gunakan volume memadai dan sumber yang dapat ditelusuri sesuai Bagian 8A protokol."]]}]}, {"name": "Profil", "title": "Identitas profil kabupaten/kota", "blocks": [{"t": "fields", "rows": [{"r": 4, "c": 2, "k": "in", "label": "Kode kabupaten/kota", "key": true}, {"r": 5, "c": 2, "k": "in", "label": "Provinsi", "o": ["Sumatera Utara", "Daerah Khusus Ibukota Jakarta", "Jawa Barat", "Jawa Timur", "Bali", "Papua"]}, {"r": 6, "c": 2, "k": "in", "label": "Nama kabupaten/kota", "o": ["Kabupaten Deli Serdang", "Kota Medan", "Kota Administrasi Jakarta Timur", "Kota Administrasi Jakarta Pusat", "Kabupaten Indramayu", "Kabupaten Bogor", "Kabupaten Sidoarjo", "Kota Surabaya", " <script>
/* ==========================================================================
 * C3 LOGIC — terjemahan rumus otomatis versi Excel (Unit_A, Unit_B,
 * CP3_Register, Rujukan, Interupsi, Rekap_CP, Ringkasan) ke JavaScript.
 * Dipakai identik di form (pratinjau langsung), Code.gs (kolom otomatis di
 * spreadsheet), dan dashboard (rekap). Bergantung pada C3S (schema.js).
 * Tanggal disimpan 'yyyy-mm-dd'; tanggal parsial (--/BB/TTTT, TT) adalah teks
 * dan, seperti ISNUMBER() di Excel, tidak dihitung sebagai tanggal.
 * ========================================================================== */
var C3L = (function () {
  var PR = C3S.PARAM;

  function s(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function isDate(v) { return /^\d{4}-\d{2}-\d{2}$/.test(s(v)); }
  function day(v) { if (!isDate(v)) return null; var p = s(v).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function diff(a, b) { var x = day(a), y = day(b); return (x === null || y === null) ? '' : x - y; }
  function isNum(v) { return typeof v === 'number' && !isNaN(v); }
  var BATAS = day(PR.batasData);
  function lewat(v) { var d = day(v); return d !== null && d > BATAS; }
  function has(str, sub) { return s(str).toLowerCase().indexOf(sub.toLowerCase()) >= 0; }
  function starts(str, pre) { return s(str).toLowerCase().indexOf(pre.toLowerCase()) === 0; }
  function inList(v, arr) { return arr.indexOf(s(v)) >= 0; }

  function kelompok(r) {
    if (!s(r.U01)) return '';
    if (has(r.U03, 'purposif')) return 'Purposif';
    if (has(r.U03, 'berurutan')) return 'Berurutan';
    return 'Acak/sensus';
  }
  function stChecks(r, codes) {
    var out = '';
    codes.forEach(function (c) {
      if (s(r[c]) !== '' && s(r['St ' + c]) === '') out += 'St ' + c + ' kosong; ';
      if (s(r['St ' + c]) === 'Y' && s(r['Sumber ' + c]) === '') out += 'Sumber ' + c + ' kosong; ';
    });
    return out;
  }
  function batasChecks(r, codes) {
    var out = '';
    codes.forEach(function (c) { if (lewat(r[c])) out += c + ' melewati batas data; '; });
    return out;
  }
  var LENGKAP = 'Lengkap untuk aspek yang dinilai';
  var BEDA = ['Ya, berbeda', 'Tidak tercatat'];
  var STATUS_PEMICU = ['Terputus/hilang kontak', 'Pindah, belum terkonfirmasi', 'Belum diketahui'];
  var BELUM_ARV = ['Belum pernah ARV', 'Pernah ARV, terputus'];

  /* ---------------- Unit A ---------------- */
  function computeA(r) {
    var o = {};
    var BY = diff(r.A08, r.A01), BZ = diff(r.A11, r.A08), CB = diff(r.A07, r.A01);
    var CA = BZ === '' ? '' : (s(r.A03) === 'Meningitis/SSP' ? 'Nilai klinis' : (BZ > (s(r.A04) === 'TB RO' ? PR.arvRO : PR.arvSO) ? 'Ya' : 'Tidak'));
    o['Hari diagnosis TB → mulai OAT'] = BY;
    o['Hari mulai OAT → mulai ARV'] = BZ;
    o['ARV melewati batas juknis'] = CA;
    o['Hari diagnosis TB → tes HIV'] = CB;
    o['Kelompok sampel (otomatis)'] = kelompok(r);

    var cek = '';
    if (s(r.U01)) {
      cek += batasChecks(r, ['U13', 'U14', 'A01', 'A07', 'A08', 'A11', 'A14', 'T04', 'T06', 'P02', 'P05', 'P06', 'P07', 'P08', 'P09', 'P11']);
      if (isDate(r.A08) && isDate(r.A01) && day(r.A08) < day(r.A01)) cek += 'OAT sebelum diagnosis TB; ';
      if (isDate(r.A14) && isDate(r.A08) && day(r.A14) < day(r.A08)) cek += 'Luaran sebelum mulai OAT; ';
      cek += stChecks(r, ['U13', 'U14', 'A01', 'A07', 'A08', 'A10', 'A10b', 'A11', 'A13', 'A18', 'A19', 'T03', 'T06']);
    }
    o['Cek isian (otomatis)'] = cek;

    var p = '';
    if (s(r.U01)) {
      if (has(r.U03, 'purposif')) p += 'Unit purposif; ';
      if (isDate(r.A01) && s(r.A08) === '') p += 'OAT tidak tercatat; ';
      if (CA === 'Ya') p += 'ARV melewati batas; ';
      if (s(r.A10b) === 'Terinterupsi') p += 'ARV terinterupsi selama OAT; ';
      if (inList(r.A10, BELUM_ARV) && s(r.A11) === '') p += 'ARV belum dimulai; ';
      if (inList(r.A13, ['Meninggal', 'Putus berobat', 'Gagal', 'Tidak dievaluasi', 'Belum diketahui'])) p += 'Luaran ' + s(r.A13) + '; ';
      if (s(r.T01) === 'Ya') p += 'Rujukan; ';
      if (s(r.T02) === 'Ya') p += 'Interupsi; ';
      if (inList(r.T03, STATUS_PEMICU)) p += 'Status HIV ' + s(r.T03) + '; ';
      if (inList(r.A10, BELUM_ARV) && isDate(r.A11) && isDate(r.A08)) {
        var g = day(r.A11) - day(r.A08);
        if (g > 14) p += 'ARV >14 hari setelah OAT: isi CD4 (DP–DS); ';
      }
      if (inList(r.A15, BEDA) || inList(r.A16, BEDA) || inList(r.A17, BEDA) || inList(r.T05, BEDA)) p += 'Beda sistem (teruskan ke C5/WP3); ';
    }
    o['Pemicu pendalaman (otomatis)'] = p;

    var cp6 = '';
    if (s(r.U01) && inList(r.A10, BELUM_ARV)) {
      var st = s(r['St A11']);
      if (st === '') cp6 = 'St kosong';
      else if (st === 'BD') cp6 = 'BD';
      else if (st === 'TBL') cp6 = 'Tidak berlaku';
      else if (st === 'Y') {
        if (!isDate(r.A11) || !isDate(r.A08)) cp6 = 'Terjadi, waktu belum dapat dinilai';
        else if (CA === 'Ya') cp6 = 'Kesenjangan: terlambat';
        else if (CA === 'Nilai klinis') cp6 = 'Terjadi, waktu dinilai klinis';
        else cp6 = 'Terjadi dalam batas';
      } else if (st === 'TC' && s(r.Z05) !== LENGKAP) cp6 = 'TC belum ditelusuri';
      else if (!isDate(r.A08) || day(r.A08) + (s(r.A04) === 'TB RO' ? PR.arvRO : PR.arvSO) > BATAS) cp6 = 'Jendela pengamatan belum cukup';
      else cp6 = 'Kesenjangan: tidak dimulai';
    }
    o['CP6 penilaian (otomatis)'] = cp6;
    o['Hari terduga TB → diagnosis TB (otomatis)'] = diff(r.A01, r.A00);
    var dt = '', cd4 = r.A12b;
    if (cp6 !== '' && isNum(BZ)) {
      if (s(r.A03) === 'Meningitis/SSP') dt = 'Nilai klinis';
      else if (s(r.A04) === 'TB RO') dt = BZ > PR.arvRO ? 'Terlambat menurut PNPK' : 'Dalam batas PNPK';
      else if (BZ > PR.pnpk) dt = 'Terlambat menurut PNPK';
      else if (BZ <= 14) dt = 'Dalam batas PNPK';
      else if (isNum(cd4) && cd4 < PR.cd4Rendah) dt = 'Terlambat menurut PNPK (CD4 <50)';
      else if (isNum(cd4)) dt = 'Dalam batas PNPK';
      else dt = '15–56 hari, CD4 tidak diketahui';
    }
    o['CP6 menurut PNPK 2019 (sensitivitas, otomatis)'] = dt;
    return o;
  }

  /* ---------------- Unit B ---------------- */
  function computeB(r) {
    var o = {};
    var BQ = diff(r.B03, r.B01), BR = diff(r.B06, r.B03), BS = diff(r.B13, r.B01), BT = diff(r.B13, r.B09);
    o['Hari mulai ARV → skrining TB'] = BQ;
    o['Hari skrining → keputusan diagnostik'] = BR;
    o['Hari mulai ARV → mulai TPT'] = BS;
    o['Hari kelayakan → mulai TPT'] = BT;
    o['Kelompok sampel (otomatis)'] = kelompok(r);

    var cek = '';
    if (s(r.U01)) {
      cek += batasChecks(r, ['U13', 'U14', 'B01', 'B03', 'B06', 'B07', 'B09', 'B12', 'B13', 'B17', 'T04', 'T06', 'P05', 'P06', 'P07', 'P08', 'P09']);
      if (isDate(r.B03) && isDate(r.B01) && day(r.B03) < day(r.B01)) cek += 'Skrining sebelum mulai ARV (periksa); ';
      if (isDate(r.B13) && isDate(r.B01) && day(r.B13) < day(r.B01)) cek += 'TPT sebelum mulai ARV (periksa); ';
      if (isDate(r.B17) && isDate(r.B13) && day(r.B17) < day(r.B13)) cek += 'Luaran TPT sebelum mulai TPT; ';
      cek += stChecks(r, ['U13', 'U14', 'B01', 'B03', 'B08', 'B13', 'B16', 'T03', 'T06']);
    }
    o['Cek isian (otomatis)'] = cek;

    var p = '';
    if (s(r.U01)) {
      if (has(r.U03, 'purposif')) p += 'Unit purposif; ';
      if (isDate(r.B01) && s(r.B03) === '') p += 'Skrining TB tidak tercatat; ';
      if (s(r.B04) === 'Positif/indikasi pemeriksaan') p += 'Skrining positif; ';
      if (s(r.B05) === 'Belum selesai') p += 'Diagnostik belum selesai; ';
      if (BR !== '' && BR > PR.diagnostik) p += 'Diagnostik lewat batas hari; ';
      if (inList(r.B08, ['Ditunda', 'Tidak tercatat'])) p += 'Kelayakan TPT ' + s(r.B08) + '; ';
      if (s(r.B13) === '' && (s(r.B08) === 'Layak' || s(r.B11) === 'Ditawarkan, diterima')) p += 'Layak/diterima tetapi TPT belum mulai; ';
      if (inList(r.B16, ['Putus', 'Dihentikan: efek samping', 'Dihentikan: TB aktif', 'Belum diketahui'])) p += 'Luaran TPT ' + s(r.B16) + '; ';

    L: 'Laki-laki', P: 'Perempuan', RS: 'Rumah sakit', SO: 'Sensitif obat', RO: 'Resistan obat', 'TB SO': 'Tuberkulosis sensitif obat', 'TB RO': 'Tuberkulosis resistan obat',
    'Meningitis/SSP': 'Meningitis/sistem saraf pusat', IRIS: 'Sindrom inflamasi pemulihan imun', 'ESO/toksisitas': 'Efek samping obat/toksisitas', 'Putus (LFU)': 'Putus (hilang dari pemantauan)',
    RM: 'Rekam medis', LAB: 'Laboratorium', FAR: 'Farmasi', RUJ: 'Rujukan', KOM: 'Komunitas', LAIN: 'Lainnya', SITB: 'Sistem Informasi Tuberkulosis', SIHA: 'Sistem Informasi HIV-AIDS',
    Pos: 'Positif', Neg: 'Negatif', TD: 'Tidak diketahui'
  };
  var SRCFULL = { TB: 'Kartu/register tuberkulosis', HIV: 'Ikhtisar/register HIV', TPT: 'Kartu/register terapi pencegahan tuberkulosis' };
  function optLabel(v, ctx) {
    v = sv(v); if (!v) return v;
    if (ctx && (ctx.indexOf('RUJ') >= 0 || ctx.indexOf('FAR') >= 0) && SRCFULL[v]) return SRCFULL[v];
    if (OPTFULL.hasOwnProperty(v)) return OPTFULL[v];
    var m = /^(Y|TL|TC|TBL|BD|TT) (\(.+\))$/.exec(v); if (m) return OPTFULL[m[1]] + ' ' + m[2];
    if (window.UX && UX.KAB && UX.KAB[v]) return UX.KAB[v];
    return v;
  }
  function fullOptions(root) {
    if (!root || !root.querySelectorAll) return;
    var sels = root.tagName === 'SELECT' ? [root] : Array.prototype.slice.call(root.querySelectorAll('select'));
    if (root.tagName === 'OPTION' && root.parentElement) sels.push(root.parentElement);
    sels.forEach(function (se) {
      if (se.closest(SKIP_SEL) || se.hasAttribute('data-raw')) return;
      var ctx = Array.prototype.map.call(se.options, function (o) { return o.value; });
      Array.prototype.forEach.call(se.options, function (o) { var v = o.value; if (!v || sv(o.textContent) !== v) return; var t = optLabel(v, ctx); if (t !== v) { o.textContent = t; o.title = v; } });
    });
    root.querySelectorAll('label.chip, .chips label').forEach(function (l) {
      var i = l.querySelector('input[value]'), sp = l.querySelector('span'); if (!i || !sp || sv(sp.textContent) !== i.value) return;
      var grp = l.parentElement ? Array.prototype.map.call(l.parentElement.querySelectorAll('input[value]'), function (x) { return x.value; }) : null, t = optLabel(i.value, grp);
      if (t !== i.value) sp.textContent = t;
    });
    root.querySelectorAll('.ob[data-v]').forEach(function (b) {
      var v = b.getAttribute('data-v'); if (sv(b.textContent) !== v) return;
      var grp = b.parentElement ? Array.prototype.map.call(b.parentElement.querySelectorAll('[data-v]'), function (x) { return x.getAttribute('data-v'); }) : null, t = optLabel(v, grp);
      if (t !== v) { b.textContent = t; b.title = v; }
    });
  }

  /* --------------------- 1) & 2) status dan tombol kirim --------------------- */
  function classify(t) {
    t = sv(t).toLowerCase();
    if (!t) return '';
    if (/antrean|menunggu dikirim|mengirim/.test(t)) return 'queue';
    if (/cek|perlu|wajib, belum|batal|di luar daftar|dibuka|gagal|tidak berhasil|klarifikasi|^beda|hanya di (sistem|sumber)|konflik/.test(t)) return 'attn';
    if (/belum dikirim|belum disimpan|perubahan belum|tidak pernah dikirim|belum ada di database/.test(t)) return 'unsent';
    if (/belum lengkap|^draf|draf di perangkat|ada di perangkat|^belum$|^belum |tidak diisi/.test(t)) return 'draft';
    if (/lengkap|siap dikirim/.test(t)) return 'ready';
    if (/terkirim|tersimpan|sama dengan database|sudah ada di database|sudah sesuai|^selesai|^sesuai|terlaksana|^dipilih|terpilih|^dinilai|^disepakati|✓/.test(t)) return 'sent';
    return '';
  }
  function decorateStatus(root) {
    root.querySelectorAll('.tag:not([data-st]),.pill:not([data-st])').forEach(function (el) {
      if (el.id === 'netPill') return;

      el.setAttribute('data-st', k || '0');
      if (!k) { if (!el.classList.contains('ok') && !el.classList.contains('warn') && !el.classList.contains('err')) el.classList.add('st-cat'); return; }

      el.classList.add('st-' + k);
      if (k === 'unsent' || k === 'queue' || k === 'attn' || k === 'draft') el.classList.add('blink');
    });
    root.querySelectorAll('.btn.primary:not([data-sendchk])').forEach(function (b) {
      b.setAttribute('data-sendchk', '1');
      if (/kirim|simpan ke database|simpan untuk/i.test(sv(b.textContent))) b.classList.add('send');
    });

    document.querySelectorAll('.btn.send').forEach(function (b) { if (!b.hasAttribute('data-wbact')) b.classList.toggle('dirty', unsent); });
  }

  /* ------------------------ 5) isian wajib yang kosong ------------------------ */
  function emptyCtl(box) {
    var ins = box.querySelectorAll('input:not([type=hidden]):not([type=checkbox]):not([type=radio]),select,textarea');
    var radios = box.querySelectorAll('input[type=radio]');
    if (radios.length) { for (var i = 0; i < radios.length; i++) if (radios[i].checked) return false; if (!ins.length) return true; }
    if (box.querySelector('.ob')) return !box.querySelector('.ob.on');
    if (!ins.length) return false;
    for (var j = 0; j < ins.length; j++) if (sv(ins[j].value) !== '') return false;
    return true;
  }
  function markNeed(root) {
    (root || document).querySelectorAll('.item').forEach(function (it) {
      var req = it.querySelector('.ih .req');
      var need = !!req && !it.classList.contains('dim') && emptyCtl(it.querySelector(':scope > .ctl') || it);

      if (lab) { var ch = lab.querySelector('.needchip'); if (need && !ch) lab.insertAdjacentHTML('beforeend', '<span class="needchip" data-raw="1">belum diisi</span>'); else if (!need && ch) ch.remove(); }
    });
