<script>
  // terapkan preferensi tampilan sebelum render agar tidak berkedip
  try { var p = JSON.parse(localStorage.getItem('rca.prefs') || '{}'); var d = document.documentElement;
    if (p.theme && p.theme !== 'auto') d.setAttribute('data-theme', p.theme);
    if (p.contrast === 'high') d.setAttribute('data-contrast', 'high');
    if (p.font) d.style.setProperty('--fs', p.font);

    if (p.motion === 'reduce') d.setAttribute('data-motion', 'reduce'); } catch (e) {}
</script>
